name: TTendencias listener watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar listener y arrancar si no hay ninguno activo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          headers={
              "Accept":"application/vnd.github+json",
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"ttendencias-listener-watchdog",
          }
          base=f"https://api.github.com/repos/{repo}/actions/workflows/ttendencias-listener.yml"
          req=urllib.request.Request(base+"/runs?per_page=20", headers=headers)
          with urllib.request.urlopen(req, timeout=30) as r:
              data=json.loads(r.read().decode())
          runs=data.get("workflow_runs",[])
          active=[x for x in runs if x.get("status") in {"queued","in_progress","pending","waiting"}]
          if active:
              print("Listener TTendencias activo/encolado:", [(x.get("id"),x.get("status")) for x in active[:3]])
              raise SystemExit(0)

          body=json.dumps({"ref":"main"}).encode()
          req=urllib.request.Request(
              base+"/dispatches",
              method="POST",
              data=body,
              headers={**headers,"Content-Type":"application/json"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              if r.status != 204:
                  raise SystemExit(f"No se pudo arrancar listener: HTTP {r.status}")
          print("Listener TTendencias relanzado por watchdog")
          PY
