<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="robots" content="noindex,nofollow">
<title>Prompt completo · GAG IA TT</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1426;color:#f2f5fc;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:750px;margin:auto;padding:calc(env(safe-area-inset-top) + 18px) 15px 75px}h1{font-size:27px;line-height:1.2;margin:12px 0}p{color:#b4c2d7}
a{color:#a7c9ff}a.back{display:inline-block;margin-bottom:10px}
.card{background:#1b2941;border:1px solid #3c4c64;padding:16px;border-radius:17px;margin:15px 0}
h2{font-size:17px;line-height:1.3;margin:10px 0}small{color:#7fefce;letter-spacing:1.1px;font-weight:800}
#editorial{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px;color:#dee8fa}
#remate{color:#ffcf91;font-weight:750;white-space:pre-wrap}
textarea{width:100%;height:360px;background:#101929;color:#e9f2ff;border:1px solid #3e526e;border-radius:12px;padding:13px;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}
button,.button{display:block;width:100%;cursor:pointer;border:1px solid #5dbaa9;border-radius:12px;background:#245e64;color:white;text-align:center;padding:13px 15px;margin:10px 0;text-decoration:none;font:700 16px system-ui}
.button{background:#284774;border-color:#6a91c1}button:disabled{opacity:.5}
.note{color:#aebbd0;font-size:12px}.error{color:#ffc183}
</style></head>
<body><main><a class="back" href="./index.html">← Volver a TT Actualidad</a>
<h1>Imagen GAG IA · prompt completo</h1>
<p>El texto, la explicación y el remate se mantienen íntegros. La imagen se solicita manualmente en ChatGPT Images.</p>
<section class="card"><small id="type">Cargando…</small><h2 id="title"></h2><div id="editorial">Recuperando el texto editorial…</div><p id="remate"></p><div class="note" id="status" role="status"></div></section>
<section class="card"><label for="prompt"><small>Prompt íntegro, listo para pegar</small></label>
<textarea id="prompt" readonly></textarea><button id="copy" type="button" disabled>📋 Copiar prompt GAG completo</button>
<a class="button" href="https://chatgpt.com/images" target="_blank" rel="noopener">🎨 Abrir ChatGPT Images</a></section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const app=params.get('app')||'',news=app==='ttittulares',trend=app==='ttendencias',id=(params.get('id')||'').trim(),name=(params.get('name')||'').trim(),revision=Number(params.get('rev')||0),mode=params.get('mode')||'gag';
let prompt='',editorial='';
const root='./data/',raw='https://raw.githubusercontent.com/fabricelop/europapress-rss/main/';
const safe=v=>String(v||'').trim();
const norm=v=>safe(v).toLocaleLowerCase('es-ES').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const rows=o=>Array.isArray(o?.items)?o.items:Array.isArray(o?.requests)?o.requests:[];
const closerFrom=v=>safe(v).split(/\r?\n/).map(x=>x.trim()).filter(x=>x.startsWith('🌶')).at(-1)||'';
async function get(path){for(const url of [raw+path+'?v='+Math.floor(Date.now()/120000),root+path]){
 try{const r=await fetch(url,{cache:'no-cache'});if(r.ok){const j=await r.json();if(j&&typeof j==='object')return j}}catch(_){}
}return {}}
function matches(x){return x&&((id&&[x.id,x.event_id,x.target_id].some(y=>safe(y)===id))||(name&&[x.name,x.title,x.display_name,x.term_normalized].some(y=>norm(y)===norm(name))))}
function sortByPrecision(a,b){
 const val=x=>(safe(x.id||x.event_id||x.target_id)===id?1000:0)+(revision&&Number(x.revision||0)===revision?150:0)+
  (safe(x.tweet?.text)?90:0)+(safe(x.explanation)?80:0)+(safe(x.closer_text||x.tweet?.remate)?30:0)+
  (safe(x.factual_summary)?20:0)+(safe(x.explained_at||x.prepared_at)?15:0);
 return val(b)-val(a)
}
function best(...docs){return docs.flatMap(rows).filter(matches).sort(sortByPrecision)[0]||{}}
function display(title,body,punch,factual,rank,explanation=''){
 title=safe(title);body=safe(body);punch=safe(punch||closerFrom(body));factual=safe(factual);explanation=safe(explanation);
 if(punch&&!body.includes(punch))body=(body+'\n\n'+punch).trim();
 if(!body){$('editorial').textContent='No se ha encontrado un texto editorial completo para este elemento.';$('status').textContent='No se ha creado el prompt para evitar una imagen basada solo en el titular.';$('status').className='note error';return}
 const decorated=(trend&&rank>0&&!/^TT#\d+/i.test(title)?'TT#'+rank+' ':'')+title;
 const parts=[
  'Genera AHORA UNA SOLA imagen GAG IA original para '+(news?'TTiTTulares':'TTendencias')+'. Usa la herramienta de imágenes de ChatGPT.',
  'TÍTULO / '+(news?'NOTICIA':'TENDENCIA')+':\n'+decorated,
  'TEXTO EXACTO YA CERRADO (NO LO REESCRIBAS):\n'+body,
  'REMATE EXACTO (INSPIRA EL GAG, NO LO REESCRIBAS):\n'+(punch||'No consta un remate separado; no inventes ninguno.'),
  'EXPLICACIÓN EDITORIAL COMPLETA (NO OMITIR NI REESCRIBIR):\n'+(explanation||body),
  'CONTEXTO FACTUAL COMPLEMENTARIO (NO INVESTIGUES DE NUEVO):\n'+(factual||'Utiliza solamente los hechos de la explicación completa.'),
  'DIRECCIÓN VISUAL:\nUna sola viñeta satírica original y exagerada, con metáfora visual ingeniosa basada en los hechos y en el remate. Nada de ilustración literal; sin texto en la imagen y sin inventar datos.'
 ];
 prompt=mode==='x'?body:parts.join('\n\n');editorial=body;
 $('title').textContent=decorated;$('editorial').textContent=body;$('remate').textContent=punch||'';
 $('prompt').value=prompt;$('copy').disabled=false;
 $('status').textContent='Texto íntegro ('+body.length+' caracteres) · Sin generación automática · Copiar y pegar en ChatGPT Images';
}
async function start(){
 if(!news&&!trend){$('status').textContent='Falta especificar app=ttittulares o app=ttendencias';return}
 $('type').textContent=news?'TTiTTulares · noticia':'TTendencias · tendencia';
 const docs=await Promise.all(news?[
  get('ttittulares/prepared.json'),get('telegram/editorial-processing.json')
 ]:[
  get('trends/telegram-manual-explained.json'),get('trends/explained.json'),get('trends/requests.json')
 ]);
 const x=best(...docs);
 if(news){
  const text=safe(x.tweet?.text||x.x_text||x.factual_summary||'');
  display(x.title||name||id,text,x.tweet?.remate||x.closer_text,x.factual_summary,x.rank,x.explanation);
 }else{
  const request=docs[2],manual=docs[0],explained=docs[1];
  const sameRequest=rows(request).filter(matches).sort(sortByPrecision)[0]||{};
  const related=[...rows(manual),...rows(explained)].filter(z=>matches(z)||safe(z.id)&&safe(z.id)===safe(sameRequest.id)).sort(sortByPrecision);
  // Do not use a stale explanation from an older revision.
  const current=related.filter(z=>revision===0||Number(z.revision||0)===revision);
  const completed=current.find(z=>safe(z.explanation))||{};
  const requestCurrent=revision===0||Number(sameRequest.revision||0)===revision?sameRequest:{};
  const selected=safe(completed.explanation)?completed:requestCurrent;
  const text=safe(selected.explanation||selected.x_text);
  const punch=safe(selected.closer_text||requestCurrent.closer_text||closerFrom(text));
  const title=selected.display_name||sameRequest.name||selected.name||name||id;
  const rank=Number(sameRequest.rank||selected.rank||0);
  display(title,text,punch,selected.factual_summary||requestCurrent.factual_summary,rank,selected.explanation||requestCurrent.explanation);
 }
}
$('copy').onclick=async()=>{
 if(!prompt)return;
 try{await navigator.clipboard.writeText(prompt)}
 catch(_){const el=$('prompt');el.focus();el.select();if(!document.execCommand('copy')){$('status').textContent='Selecciona el texto y elige Copiar.';return}}
 $('status').textContent='Prompt GAG completo copiado. Pégalo en ChatGPT Images.';
};
start().catch(e=>{$('status').textContent='Error al recuperar texto: '+String(e?.message||e);});
})();
</script></main></body></html>
