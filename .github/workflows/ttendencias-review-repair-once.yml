name: TTendencias - reparar revision Carvajal una vez
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttendencias-review-repair-once.yml'

permissions:
  contents: write

concurrency:
  group: ttendencias-review-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Reaplicar exactamente la revision cerrada con resultado obsoleto
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ttendencias-editorial[bot]"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import copy, json
          from datetime import datetime, timezone
          from pathlib import Path
          from pilot import listas_grouping as grouping
          from pilot import trend_maintenance as maintenance

          JOB_ID = "red-review-5bf9d77fea8cb881470f"
          state = grouping.load_state()
          job = next((x for x in state[grouping.REQUESTS]["requests"]
                      if x.get("id") == JOB_ID and int(x.get("revision") or 0) == 0), None)
          if not job:
              raise SystemExit("Falta el job exacto de Carvajal")
          command = json.loads((grouping.ROOT / "trends/maintenance-outbox" / (JOB_ID + ".json")).read_text(encoding="utf-8"))
          if command.get("job_id") != JOB_ID or command.get("outcome") != "updated":
              raise SystemExit("El outbox corregido no es updated para el job exacto")

          already = next((x for x in state[grouping.MANUAL]["items"]
                          if x.get("red_review_job_id") == JOB_ID
                          and x.get("status") in {"explained", "published"}), None)
          if already:
              print("REPAIR_ALREADY_APPLIED", already.get("id"))
              raise SystemExit(0)

          if job.get("status") == "review_completed" and job.get("review_outcome") == "unchanged":
              job["status"] = "preparing"
              for key in ("review_outcome", "completed_at", "review_reason", "review_created_id", "review_error"):
                  job.pop(key, None)
              queue = state[grouping.QUEUE]
              queue["items"] = [x for x in queue.get("items", []) if x.get("id") != JOB_ID]
              queue["items"].append(copy.deepcopy(job))
              queue["count"] = len(queue["items"])
              queue["updated_at"] = datetime.now(timezone.utc).isoformat()
          elif job.get("status") not in {"preparing", "update"}:
              raise SystemExit("Estado inesperado del job: " + str(job.get("status")))

          now = datetime.now(timezone.utc)
          state, changed = maintenance.apply_review(state, command, now, grouping.grouping_api())
          if not changed:
              raise SystemExit("La reaplicacion no produjo cambios")
          final_job = next(x for x in state[grouping.REQUESTS]["requests"] if x.get("id") == JOB_ID)
          if final_job.get("status") != "review_completed":
              raise SystemExit("El job no quedo review_completed")
          if final_job.get("review_outcome") not in {"updated", "stale"}:
              raise SystemExit("Resultado final inesperado: " + str(final_job.get("review_outcome")))

          for relative in (grouping.REQUESTS, grouping.MANUAL, grouping.QUEUE):
              (grouping.ROOT / relative).write_text(
                  json.dumps(state[relative], ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8")
          print("REPAIR_APPLIED", final_job.get("review_outcome"), final_job.get("review_created_id"))
          PY
            git add -- trends/requests.json trends/telegram-manual-explained.json trends/editorial-queue.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "TTendencias: reparar aplicacion revision Carvajal"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          exit 1
