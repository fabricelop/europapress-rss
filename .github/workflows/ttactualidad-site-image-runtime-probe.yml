name: TTActualidad Site image runtime inspection (read-only)
on:
  push:
    branches: [diag/ttactualidad-sites-image-runtime-20261104]
    paths:
      - '.github/workflows/ttactualidad-site-image-runtime-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Next.js image rendering bundle (no auth, no writes)
        shell: bash
        run: |
          set -euo pipefail
          root=https://ttactualidad.rainyraven22.chatgpt.site
          curl -sS -L --max-time 20 -o /tmp/tt-site.html "$root/"
          asset=$(python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('/tmp/tt-site.html').read_text(errors='replace')
          found=re.findall(r'<script[^>]*src="([^"]+index-[^"]+\.js)"',html)
          print(found[-1] if found else '')
          PY
          )
          if [ -z "$asset" ]; then
            echo 'NO_PUBLIC_NEXT_INDEX_SCRIPT'; exit 0
          fi
          echo 'PUBLIC_BUNDLE_PATH='"$asset"
          curl -sS -L --max-time 50 -o /tmp/tt-next-bundle.js "$root$asset"
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/tt-next-bundle.js').read_text(errors='replace')
          print('PUBLIC_BUNDLE_BYTES',len(s))
          html=Path('/tmp/tt-site.html').read_text(errors='replace')
          links=list(dict.fromkeys(re.findall(r'/_next/static/chunks/[A-Za-z0-9_.-]+\.js',html)))
          print('PUBLIC_NEXT_JS_CHUNK_COUNT',len(links))
          for p in links[:55]:print('PUBLIC_NEXT_JS_CHUNK',p)
          for term in ('raw.githubusercontent.com','catalog_recorded','image_url',
             'site-top30-current','sha256','next/image','/_next/image',
             'images/ttendencias','explained_at','Imagen IA','onError',
             'onLoad','img src','loading=','valverde','Bellingham',
             'Imagen asociada','img-src'):
              hits=list(re.finditer(re.escape(term),s,re.I))
              print('PUBLIC_IMAGE_TOKEN',repr(term),'count=',len(hits))
              for m in hits[:2]:
                excerpt=s[max(m.start()-100,0):m.end()+125].replace('\n',' ')
                # No session/cookies/secrets in public JS. Still redact credentials.
                excerpt=re.sub(r'(?i)(authorization|bearer|token|secret)([:=])[^\s,;}]{4,}',
                  r'\1\2[REDACTED]',excerpt)
                print('PUBLIC_IMAGE_CONTEXT',repr(term),repr(excerpt[:245]))
          PY

      - name: Inspect exact public tendencias page and its application chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess, urllib.request
          from urllib.parse import urljoin
          root='https://ttactualidad.rainyraven22.chatgpt.site'
          for path in ['/tendencias','/']:
            try:
              with urllib.request.urlopen(root+path,timeout=20) as resp:
                html=resp.read(2_000_000).decode('utf8','replace')
              links=list(dict.fromkeys(re.findall(r'/_next/static/[^"\'<>\\s]+?\\.js',html)))
              print('PUBLIC_PAGE',path,'HTML_BYTES',len(html),'CHUNKS',len(links))
              print('PUBLIC_PAGE_IMG_TAGS',len(re.findall(r'<img\\b',html,re.I)))
              print('PUBLIC_PAGE_MANUAL_URL',html.count('e470cdee843b-r0-manual-'))
              for script in links[:40]:
                try:
                  url=urljoin(root,script)
                  with urllib.request.urlopen(url,timeout=15) as resp:
                    code=resp.read(2_000_000).decode('utf8','replace')
                  matches={term:code.lower().count(term.lower()) for term in [
                    'top30','catalog_recorded','image_url','remotePatterns',
                    'raw.githubusercontent.com','next/image','_next/image','imagen','tendencias']}
                  if any(matches.values()):
                    print('PUBLIC_APP_CHUNK',script,'BYTES',len(code),'TOKENS',matches)
                    for term in ['catalog_recorded','raw.githubusercontent.com','image_url','_next/image','top30']:
                      pos=code.lower().find(term.lower())
                      if pos>=0:print('PUBLIC_APP_CONTEXT',script,term,repr(code[max(0,pos-90):pos+160]))
                except Exception as e:
                  print('PUBLIC_CHUNK_PROBE_FAILED',script,type(e).__name__)
            except Exception as e:
              print('PUBLIC_PAGE_PROBE_FAILED',path,type(e).__name__)
          PY
