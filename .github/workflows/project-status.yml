name: Estado de proyectos

on:
  workflow_dispatch:
  schedule:
    - cron: '8,38 * * * *'
  push:
    branches: [main]
    paths:
      - "monitoring/build_status.py"
      - ".github/workflows/project-status.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: project-status-monitor
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generar estado real de módulos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 monitoring/build_status.py

      - name: Publicar estado
        run: |
          set -e
          git config user.name "project-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add monitoring/status.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar estado de proyectos"
          for intento in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 2))
          done
          echo "ERROR: no se pudo publicar monitoring/status.json"
          exit 1
