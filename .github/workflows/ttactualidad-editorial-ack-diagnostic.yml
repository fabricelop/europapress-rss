name: TTActualidad - diagnóstico de ACK editorial PC
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ttactualidad-editorial-ack-diagnostic.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Contrastar endpoints reales sin enviar nuevas ordenes
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          origins=[
            'https://tt-control.fabricelop.workers.dev',
            'https://ttittulares-no-vercel-test.fabricelop.workers.dev',
            'https://ttendencias-no-vercel-test.fabricelop.workers.dev'
          ]
          endpoints=['/api/ttittulares-run-status?view=listener-snapshot',
                     '/api/ttendencias-run-status?view=listener-snapshot']
          for origin in origins:
            for path in endpoints:
              url=origin+path
              request=urllib.request.Request(url,headers={
                'user-agent':'TTActualidad-Editorial-ACK-Diagnostic/1.0',
                'cache-control':'no-cache'})
              try:
                with urllib.request.urlopen(request,timeout=12) as response:
                  body=response.read(512)
                  content_type=response.headers.get('content-type','')
                  keys=[]
                  try:
                    doc=json.loads(body)
                    keys=list(doc)[:12] if isinstance(doc,dict) else ['array']
                  except Exception: pass
                  print('PROBE',origin,path,'HTTP',response.status,
                        'TYPE',content_type,'KEYS',keys)
              except urllib.error.HTTPError as e:
                print('PROBE',origin,path,'HTTP',e.code)
              except Exception as e:
                print('PROBE',origin,path,'ERROR',type(e).__name__,str(e)[:160])
          PY
