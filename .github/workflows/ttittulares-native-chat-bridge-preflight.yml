name: TTiTTulares native Telegram conversational bridge preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ttittulares-native-chat-bridge-preflight.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Probar relay de chat autenticado sin enviar una pregunta
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.error,urllib.request
          token=os.environ['TELEGRAM_BOT_TOKEN'].strip()
          assert token,'Missing bot credential'
          endpoint='https://tt-control.fabricelop.workers.dev/api/telegram-native-question'
          def test(auth):
              req=urllib.request.Request(endpoint,method='POST',data=b'{}',
                headers={'content-type':'application/json',
                'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                'accept':'application/json',
                **({'authorization':'Bearer '+token} if auth else {})})
              try:
                  with urllib.request.urlopen(req,timeout=25) as resp:
                      return resp.status,resp.read(2000)
              except urllib.error.HTTPError as e:
                  return e.code,e.read(2000)
          noauth,_=test(False)
          auth,body=test(True)
          print('TTI_CHAT_BRIDGE_UNAUTHORIZED_HTTP',noauth)
          print('TTI_CHAT_BRIDGE_AUTHENTICATED_EMPTY_HTTP',auth)
          print('TTI_CHAT_BRIDGE_UNAUTHORIZED_RESPONSE',repr(_[:140]))
          print('TTI_CHAT_BRIDGE_AUTHORIZED_RESPONSE',repr(body[:140]))
          # Authorized empty JSON is not a question; only 422 proves the
          # authentication and the route worked without calling Workers AI.
          assert noauth==403,(noauth,'missing security gate')
          assert auth==422,(auth,'authenticated private relay unreachable')
          d=json.loads(body)
          assert d.get('error')=='question_not_handled',d
          print('TTI_TELEGRAM_NATIVE_QA_RELAY_REACHABLE_AND_SECURE')
          PY
