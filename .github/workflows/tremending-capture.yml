name: Capturar tuit Tremending elegido

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ttittulares/tremending/items.json"]

permissions:
  contents: write
  actions: write

concurrency:
  group: tremending-capture-write
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node ttittulares/tremending/capture_tweet.mjs
      - name: Persistir captura y propagarla sin bloquear la noticia
        id: persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ttittulares/tremending/items.json ttittulares/tremending-images/ telegram/editorial-processing.json ttittulares/prepared.json
          if git diff --cached --quiet; then
            echo "Sin captura nueva."
            exit 0
          fi
          git commit -m "Guardar captura Tremending elegida"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Propagar captura elegida también a TTendencias
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push with GITHUB_TOKEN cannot trigger another push workflow.
          # workflow_dispatch explicitly wakes the nonblocking photo enricher.
          gh workflow run ttendencias-image-enrich.yml --ref main || echo "Aviso: reintento de foto pendiente; la explicación no se bloquea."
