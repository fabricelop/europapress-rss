name: Capturar tuit Tremending elegido

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ttittulares/tremending/items.json"]

permissions:
  contents: write

concurrency:
  group: tremending-capture-write
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node ttittulares/tremending/capture_tweet.mjs
      - name: Persistir captura y propagarla sin bloquear la noticia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ttittulares/tremending/items.json ttittulares/tremending-images/ telegram/editorial-processing.json ttittulares/prepared.json
          git diff --cached --quiet || (git commit -m "Guardar captura Tremending elegida" && git push)
