name: TTendencias persistencia editorial directa

on:
  push:
    branches: [main]
    paths:
      - "trends/direct-reconcile-command.json"
      - ".github/workflows/ttendencias-direct-persist-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar cierre transaccional
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ttendencias-editorial"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [ ! -f trends/direct-reconcile-command.json ]; then
              echo "TTENDENCIAS_DIRECT_PERSIST_ALREADY_APPLIED"
              exit 0
            fi
            python3 trends/apply_direct_reconcile.py
            git add trends/requests.json trends/telegram-manual-explained.json trends/editorial-queue.json trends/direct-reconcile-command.json
            if git diff --cached --quiet; then
              echo "TTENDENCIAS_DIRECT_PERSIST_NO_CHANGE"
              exit 0
            fi
            git commit -m "Aplicar pasada editorial TTendencias desde chat"
            if git push origin HEAD:main; then
              echo "TTENDENCIAS_DIRECT_PERSIST_DONE"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Entregar explicación por Telegram
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run send-ttendencias-explained-telegram.yml --repo "$REPO" --ref main
