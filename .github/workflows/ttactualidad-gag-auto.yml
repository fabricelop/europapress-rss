name: TTActualidad iPhone GAG - entrega automatica TTImages
on:
  repository_dispatch:
    types: [ttactualidad_gag_auto_v1]
permissions:
  contents: write
  actions: write
concurrency:
  group: ttactualidad-gag-${{ github.event.client_payload.target_id }}
  cancel-in-progress: false
jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Validar identidad editorial y registrar fallback
        env:
          TT_ACTUALIDAD_GAG_JSON: ${{ toJSON(github.event.client_payload) }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ttactualidad-gag[bot]"
          git config user.email "ttactualidad-gag[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            python3 pilot/ttactualidad_gag_auto.py | tee /tmp/gag-fallback-result.txt
            git add trends/telegram-manual-explained.json pilot/ttactualidad-gag-receipts.json
            if git diff --cached --quiet; then
              echo "GAG_FALLBACK_IDEMPOTENT"
              exit 0
            fi
            git commit -m "TTActualidad: registrar peticion de imagen GAG automatica"
            if git push origin HEAD:main; then
              if grep -q "TT_ACTUALIDAD_GAG_FALLBACK queued " /tmp/gag-fallback-result.txt; then
                gh workflow run repair-ttendencias-explicadas.yml --repo "$GITHUB_REPOSITORY" --ref main
                echo "GAG_TTIMAGES_WORKFLOW_REQUESTED"
              else
                echo "GAG_FALLBACK_NO_GENERATION: existing image or stale identity"
              fi
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not persist GAG fallback" >&2
          exit 1
