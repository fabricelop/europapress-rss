name: Despliegue manual único Vercel

on:
  push:
    branches: [main]
    paths:
      - ".github/vercel-manual-trigger"

permissions:
  contents: read

concurrency:
  group: vercel-manual-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_H8xHbBIbIKnsaLeITszidyOK
      VERCEL_PROJECT_ID: prj_X1UxNqQasd8Ouf7jUpxNccbQdASf
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar credencial Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Falta el secret VERCEL_TOKEN"
            exit 2
          fi
      - name: Desplegar producción una sola vez
        working-directory: vercel-webhook
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_H8xHbBIbIKnsaLeITszidyOK","projectId":"prj_X1UxNqQasd8Ouf7jUpxNccbQdASf"}' > .vercel/project.json
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
