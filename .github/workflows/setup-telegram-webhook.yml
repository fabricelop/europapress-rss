name: Configurar webhook Telegram TTiTTulares
# trigger 2026-09-21 11:59

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-telegram-webhook.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registrar webhook TTiTTulares
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          python3 <<'PY'
          import json, os, urllib.request, datetime
          token=os.environ["TELEGRAM_BOT_TOKEN"]
          base=f"https://api.telegram.org/bot{token}"
          webhook="https://europapress-rss.vercel.app/api/telegram-webhook"
          data=json.dumps({
            "url": webhook,
            "allowed_updates": ["callback_query","message"],
            "drop_pending_updates": False
          }).encode()
          req=urllib.request.Request(base+"/setWebhook",data=data,headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as r:
              out=json.loads(r.read().decode())
          with urllib.request.urlopen(base+"/getWebhookInfo",timeout=30) as r:
              info=json.loads(r.read().decode())
          got=((info.get("result") or {}).get("url") or "")
          status={
            "checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "set_ok":bool(out.get("ok")),
            "url":got,
            "pending_update_count":(info.get("result") or {}).get("pending_update_count",0),
            "last_error_message":(info.get("result") or {}).get("last_error_message")
          }
          open("telegram/webhook-status.json","w",encoding="utf-8").write(json.dumps(status,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(status,ensure_ascii=False))
          if not out.get("ok"): raise SystemExit(1)
          if got!=webhook: raise SystemExit("Webhook no quedó configurado")
          PY
      - name: Guardar prueba del webhook activo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram/webhook-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Verificar webhook Telegram activo"
          git push origin HEAD:main
