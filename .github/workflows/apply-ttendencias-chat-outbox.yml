name: Aplicar outbox editorial TTendencias desde chat

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: write

concurrency:
  group: ttendencias-chat-outbox
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.pull_request && github.event.issue.number == 7 && startsWith(github.event.comment.body, 'TTENDENCIAS_CHAT_OUTBOX_V1')
    runs-on: ubuntu-latest
    steps:
      - name: Preparar checkout mínimo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          mkdir -p .git/info
          cat > .git/info/sparse-checkout <<'EOF'
          /trends/requests.json
          /trends/telegram-manual-explained.json
          /trends/editorial-queue.json
          EOF
          git fetch --depth=1 --filter=blob:none origin main
          git checkout -B main FETCH_HEAD

      - name: Aplicar y guardar lote sobre main fresco
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            python3 - <<'PY'
          import json, os
          from pathlib import Path

          body=os.environ['COMMENT_BODY']
          payload=json.loads(body.split('\n',1)[1])
          explained_at=payload['explained_at']
          items=payload.get('items',[])
          bykey={(str(x['id']),int(x.get('revision',0))):x for x in items}

          rp=Path('trends/requests.json')
          req=json.loads(rp.read_text(encoding='utf-8'))
          applied=set()
          explained_applied={}

          group_fields=(
              'group_id','explanation_group_id','group_title','group_leader_id',
              'grouped_member_revisions','grouped_into','grouped_at',
              'automatic_grouping','grouping_candidates','grouping_state'
          )

          for r in req.get('requests',[]):
              k=(str(r.get('id')),int(r.get('revision',0)))
              if k not in bykey:
                  continue
              x=bykey[k]
              if int(r.get('revision',0)) != int(x.get('revision',0)):
                  continue
              if str(r.get('status') or '') not in {'preparing','update'}:
                  continue

              outcome=str(x.get('outcome') or 'explained')
              if outcome == 'review_completed':
                  reason=str(x.get('review_reason') or 'no_distinct_event')
                  r.update(
                      status='review_completed',
                      review_completed_at=explained_at,
                      review_reason=reason,
                      last_attempt_at=explained_at,
                      reexplain=False,
                      with_image=False,
                      disable_ai_image=True,
                      image_pending=False,
                      image_status='none',
                      ai_image_status='none',
                      fallback_image_status='none',
                      telegram_package_status='none',
                  )
                  for field in (
                      'explained_at','explanation','closer_text','rank_at_explanation',
                      'verification_sources','news_note',*group_fields
                  ):
                      r.pop(field,None)
                  applied.add(k)
                  continue

              explanation=str(x.get('explanation') or '').strip()
              if not explanation:
                  raise RuntimeError(f"explicación vacía para {x.get('id')}")
              closer=str(x.get('closer_text') or '').strip()
              r.update(
                  status='explained',
                  explained_at=explained_at,
                  last_attempt_at=explained_at,
                  explanation=explanation,
                  closer_text=closer,
                  rank_at_explanation=int(x['rank']),
                  category=x.get('category','Otros'),
                  source='editorial_chat_direct',
                  verification_sources=x.get('verification_sources',[]),
                  news_disposition='ignored',
                  news_note=x.get('news_note',''),
                  reexplain=False,
                  with_image=True,
                  disable_ai_image=False,
                  grouping_disabled=True,
                  image_strategy='ai_plus_fallback',
                  ai_image_status='pending',
                  fallback_image_status='pending',
                  image_choice='none',
                  image_status='pending',
                  image_pending=True,
                  telegram_package_status='pending',
              )
              for field in group_fields:
                  r.pop(field,None)
              applied.add(k)
              explained_applied[k]=x

          req['updated_at']=explained_at
          req['count']=len(req.get('requests',[]))
          rp.write_text(json.dumps(req,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          ep=Path('trends/telegram-manual-explained.json')
          exp=json.loads(ep.read_text(encoding='utf-8'))
          arr=exp.setdefault('items',[])

          for k,x in explained_applied.items():
              arr[:]=[e for e in arr if not (
                  str(e.get('id'))==str(x['id'])
                  and int(e.get('revision',0))==int(x.get('revision',0))
              )]
              item={
                  'id':x['id'],
                  'name':x['name'],
                  'revision':int(x.get('revision',0)),
                  'status':'explained',
                  'explained_at':explained_at,
                  'updated_at':explained_at,
                  'explanation':str(x['explanation']).strip(),
                  'closer_text':str(x.get('closer_text') or '').strip(),
                  'rank':int(x['rank']),
                  'rank_at_explanation':int(x['rank']),
                  'category':x.get('category','Otros'),
                  'source':'editorial_chat_direct',
                  'verification_sources':x.get('verification_sources',[]),
                  'with_image':True,
                  'grouping_disabled':True,
                  'image_strategy':'ai_plus_fallback',
                  'ai_image_status':'pending',
                  'fallback_image_status':'pending',
                  'image_status':'pending',
                  'image_choice':'none',
                  'image_pending':True,
                  'telegram_package_status':'pending',
              }
              arr.append(item)

          exp['updated_at']=explained_at
          exp['count']=len(arr)
          ep.write_text(json.dumps(exp,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          qp=Path('trends/editorial-queue.json')
          q=json.loads(qp.read_text(encoding='utf-8'))
          q['items']=[e for e in q.get('items',[]) if (
              str(e.get('id')),int(e.get('revision',0))
          ) not in applied]
          q['count']=len(q['items'])
          q['updated_at']=explained_at
          qp.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print("TTENDENCIAS_CHAT_APPLIED", sorted(applied))

          PY

            git add trends/requests.json trends/telegram-manual-explained.json trends/editorial-queue.json
            if git diff --cached --quiet; then
              echo "Sin cambios: lote ya aplicado o revisión obsoleta."
              exit 0
            fi

            git commit -m "Aplicar pasada editorial TTendencias desde chat"
            if git push origin HEAD:main; then
              echo "TTENDENCIAS_CHAT_PERSISTED attempt=$attempt"
              exit 0
            fi

            echo "Main avanzó; reaplicando lote sobre estado fresco (intento $attempt/5)."
            sleep $((attempt * 2))
          done

          echo "No se pudo persistir el lote TTendencias tras 5 intentos" >&2
          exit 1

      - name: Lanzar reparación visual TTendencias
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run repair-ttendencias-explicadas.yml --repo "$REPO" --ref main
          # La entrega informativa se dispara en cuanto se guarda la
          # explicación; no esperar al cron o al enriquecimiento visual.
          gh workflow run send-ttendencias-explained-telegram.yml --repo "$REPO" --ref main
