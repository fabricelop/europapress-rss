name: Aplicar outbox editorial TTendencias desde chat

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: write

concurrency:
  group: ttendencias-chat-outbox
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.pull_request && github.event.issue.number == 7 && startsWith(github.event.comment.body, 'TTENDENCIAS_CHAT_OUTBOX_V1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar lote editorial
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          body=os.environ['COMMENT_BODY']
          payload=json.loads(body.split('\n',1)[1])
          explained_at=payload['explained_at']
          items=payload.get('items',[])
          bykey={(x['id'],int(x.get('revision',0))):x for x in items}

          rp=Path('trends/requests.json'); req=json.loads(rp.read_text(encoding='utf-8'))
          for r in req.get('requests',[]):
              k=(str(r.get('id')),int(r.get('revision',0)))
              if k not in bykey: continue
              x=bykey[k]
              r.update(status='explained',explained_at=explained_at,last_attempt_at=explained_at,
                       explanation=x['explanation'],closer_text=x.get('closer_text',''),rank_at_explanation=x['rank'],
                       category=x.get('category','Otros'),
                       source='editorial_chat_direct',verification_sources=x.get('verification_sources',[]),
                       news_disposition='ignored',news_note=x.get('news_note',''),
                       group_id='grp-'+x['id'],explanation_group_id='grp-'+x['id'],group_title=x['name'],
                       group_leader_id=x['id'],trend_names=[x['name']],
                       grouped_member_revisions=[{'id':x['id'],'name':x['name'],'revision':x['revision']}],
                       disable_ai_image=False,image_strategy='ai_plus_fallback',ai_image_status='not_requested',
                       fallback_image_status='none',image_choice=None,image_status='none',image_pending=False)
          req['updated_at']=explained_at; req['count']=len(req.get('requests',[]))
          rp.write_text(json.dumps(req,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          ep=Path('trends/telegram-manual-explained.json'); exp=json.loads(ep.read_text(encoding='utf-8'))
          arr=exp.setdefault('items',[])
          for x in items:
              arr[:]=[e for e in arr if not (str(e.get('id'))==x['id'] and int(e.get('revision',0))==x['revision'])]
              arr.append({'id':x['id'],'name':x['name'],'revision':x['revision'],'status':'explained',
                          'explained_at':explained_at,'explanation':x['explanation'],'closer_text':x.get('closer_text',''),
                          'rank':x['rank'],'category':x.get('category','Otros'),
                          'source':'editorial_chat_direct','verification_sources':x.get('verification_sources',[]),
                          'group_id':'grp-'+x['id'],'explanation_group_id':'grp-'+x['id'],'trend_names':[x['name']]})
          exp['updated_at']=explained_at
          exp['count']=len(arr)
          ep.write_text(json.dumps(exp,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          qp=Path('trends/editorial-queue.json'); q=json.loads(qp.read_text(encoding='utf-8'))
          q['items']=[e for e in q.get('items',[]) if (str(e.get('id')),int(e.get('revision',0))) not in bykey]
          q['count']=len(q['items']); q['updated_at']=explained_at
          qp.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trends/requests.json trends/telegram-manual-explained.json trends/editorial-queue.json
          git diff --cached --quiet && exit 0
          git commit -m "Aplicar pasada editorial TTendencias desde chat"
          git pull --rebase origin main
          git push origin HEAD:main


      - name: Lanzar reparación visual TTendencias
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run repair-ttendencias-explicadas.yml --repo "$REPO" --ref main
