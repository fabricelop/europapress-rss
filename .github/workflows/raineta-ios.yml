name: RainETA iPhone IPA

on:
  push:
    paths:
      - 'ios/raineta/**'
      - '.github/workflows/raineta-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raineta-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen librsvg
      - name: Render RainETA app icon
        working-directory: ios/raineta
        run: |
          rsvg-convert --width 1024 --height 1024 --format png --output RainETA/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png art/AppIcon.svg
          file RainETA/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
      - name: Generate Xcode project
        working-directory: ios/raineta
        run: xcodegen generate
      - name: Build iPhone application and Live Activity
        working-directory: ios/raineta
        run: |
          set -o pipefail
          xcodebuild -project RainETA.xcodeproj \
            -scheme RainETA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/raineta-build.log
      - name: Create unsigned IPA for Impactor
        working-directory: ios/raineta
        run: |
          set -euo pipefail
          APP=".build/Build/Products/Release-iphoneos/RainETA.app"
          test -d "$APP"
          test -d "$APP/PlugIns/RainETALive.appex"
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$APP/Info.plist"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qr RainETA-0.3.0-unsigned.ipa Payload
          unzip -l RainETA-0.3.0-unsigned.ipa | grep 'RainETALive.appex'
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RainETA-0.3.0-IPA
          path: ios/raineta/dist/RainETA-0.3.0-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
