name: RainETA iPhone IPA

on:
  push:
    paths:
      - 'ios/raineta/**'
      - '.github/workflows/raineta-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raineta-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen librsvg
      - name: Render RainETA app icon
        working-directory: ios/raineta
        run: |
          rsvg-convert --width 1024 --height 1024 --format png --output RainETA/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png art/AppIcon.svg
          file RainETA/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
      - name: Generate Xcode project
        working-directory: ios/raineta
        run: xcodegen generate
      - name: Verify multi-location forecast provider
        working-directory: ios/raineta
        run: python3 tests/provider_smoke.py
      - name: Verify genuine ICON-EU model maps and zoom
        working-directory: ios/raineta
        run: python3 tests/dwd_wms_visual_probe.py
      - name: Probe local Madrid radar tile coordinates (diagnostic)
        continue-on-error: true
        working-directory: ios/raineta
        run: python3 tests/radar_local_tile_probe.py
      - name: Upload provider visual proofs
        uses: actions/upload-artifact@v4
        with:
          name: RainETA-ICON-EU-model-previews
          path: ios/raineta/official-maps/*.png
          retention-days: 7
      - name: Build iPhone application and Live Activity
        working-directory: ios/raineta
        run: |
          set -o pipefail
          xcodebuild -project RainETA.xcodeproj \
            -scheme RainETA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/raineta-build.log
      - name: Test model field, future continuity and zoom (iPhone simulator)
        working-directory: ios/raineta
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x.get("isAvailable") and "iPhone" in x.get("name","")), ""))')
          if [ -z "$SIM_ID" ]; then
            echo "No iPhone simulator available: cannot validate forecast rendering"
            exit 1
          fi
          echo "Simulator selected: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcodebuild -project RainETA.xcodeproj -scheme RainETA \
            -configuration Debug \
            -sdk iphonesimulator \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath .sim-build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:RainETATests test | tee /tmp/raineta-tests.log
      - name: Create unsigned IPA for Impactor
        working-directory: ios/raineta
        run: |
          set -euo pipefail
          APP=".build/Build/Products/Release-iphoneos/RainETA.app"
          test -d "$APP"
          test -d "$APP/PlugIns/RainETALive.appex"
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$APP/Info.plist"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qr RainETA-0.11.0-unsigned.ipa Payload
          unzip -l RainETA-0.11.0-unsigned.ipa | grep 'RainETALive.appex'
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RainETA-0.11.0-IPA
          path: ios/raineta/dist/RainETA-0.11.0-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
