name: TTiTTulares V2 - Radar and ingestion pure CI
on:
  push:
    branches: [feature/ttactualidad-v2-clean]
    paths:
      # Runtime radar, queue, news, image and action receipts are written often.
      # Pure CI only needs to run when code/contracts change, not per state commit.
      - 'v2/ttittulares/*.py'
      - 'v2/ttittulares/schemas/**'
      - 'v2/ttittulares/examples/**'
      - '.github/workflows/ttittulares-v2-radar-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttittulares-v2-radar-ci
  cancel-in-progress: false

jobs:
  pure-radar-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JSON Schema validator
        run: python -m pip install jsonschema==4.23.0
      - name: Compile isolated news V2 modules
        run: >-
          python -m py_compile
          v2/ttittulares/source_catalog_v2.py
          v2/ttittulares/content_filters_v2.py
          v2/ttittulares/source_publication_v2.py
          v2/ttittulares/identity_v2.py
          v2/ttittulares/source_health_v2.py
          v2/ttittulares/radar_ingest_v2.py
          v2/ttittulares/radar_archive_v2.py
          v2/ttittulares/radar_live_v2.py
          v2/ttittulares/source_fetch_v2.py
          v2/ttittulares/radar_snapshot_v2.py
          v2/ttittulares/radar_store_v2.py
          v2/ttittulares/test_radar_store_v2.py
          v2/ttittulares/test_radar_snapshot_v2.py
          v2/ttittulares/test_radar_ingest_v2.py
          v2/ttittulares/test_source_fetch_v2.py
      - name: Validate catalog and pure radar regressions
        run: |
          python -m v2.ttittulares.source_catalog_v2
          python -m unittest -v v2.ttittulares.test_contract_examples v2.ttittulares.test_radar_ingest_v2 v2.ttittulares.test_source_fetch_v2 v2.ttittulares.test_radar_snapshot_v2 v2.ttittulares.test_radar_store_v2 v2.ttittulares.test_radar_live_master_v2 v2.ttittulares.test_radar_archive_v2
      - name: Assert no external execution hooks in radar core
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("v2/ttittulares")
          source="\n".join((root/name).read_text(encoding="utf-8") for name in (
              "source_catalog_v2.py","content_filters_v2.py","source_publication_v2.py",
              "identity_v2.py","source_health_v2.py","radar_ingest_v2.py"))
          forbidden=("GITHUB_TOKEN","subprocess.","urllib.request","requests.get","chatgpt.com/c/","ChromeProfile")
          hits=[value for value in forbidden if value in source]
          assert not hits, f"external effects/imports unexpectedly present: {hits}"
          print("TTN2_RADAR_PURE_CORE=PASS")
          PY

