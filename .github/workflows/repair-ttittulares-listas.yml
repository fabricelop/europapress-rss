name: Reparar TTiTTulares Listas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ttittulares/prepared.json"
      - ".github/workflows/repair-ttittulares-listas.yml"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: ttittulares-listas-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar cliente HTTP
        run: python3 -m pip install --quiet requests

      - name: Reparar imagen de archivo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, urllib.parse, time, hashlib
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          import requests

          P=pathlib.Path("ttittulares/prepared.json")
          doc=json.loads(P.read_text(encoding="utf-8"))
          now=datetime.now(timezone.utc).isoformat().replace("+00:00","Z")
          changed=False

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.candidates=[]
              def handle_starttag(self,tag,attrs):
                  a={str(k).lower():str(v or "") for k,v in attrs}
                  if tag.lower()=="meta":
                      key=(a.get("property") or a.get("name") or "").lower()
                      if key in {"og:image","og:image:url","twitter:image","twitter:image:src"} and a.get("content"):
                          self.candidates.append(a["content"])
                  elif tag.lower()=="link" and "image_src" in a.get("rel","").lower() and a.get("href"):
                      self.candidates.append(a["href"])

          def valid_archive(a):
              return isinstance(a,dict) and bool(str(a.get("url") or "").strip()) and not bool(a.get("generated"))

          def try_source(page_url):
              if not page_url or not str(page_url).startswith(("http://","https://")):
                  return None
              try:
                  rr=requests.get(page_url,timeout=20,headers={"User-Agent":"Mozilla/5.0 TTiTTulares/1"},allow_redirects=True)
                  rr.raise_for_status()
                  parser=MetaParser(); parser.feed(rr.text[:1500000])
                  for candidate in parser.candidates[:8]:
                      url=urllib.parse.urljoin(rr.url,candidate.strip())
                      if not url.startswith(("http://","https://")):
                          continue
                      try:
                          ir=requests.get(url,timeout=20,headers={"User-Agent":"Mozilla/5.0 TTiTTulares/1","Referer":rr.url},stream=True,allow_redirects=True)
                          ct=str(ir.headers.get("content-type") or "").lower()
                          if ir.ok and ct.startswith("image/"):
                              ir.close()
                              return {
                                  "url":url,
                                  "source":urllib.parse.urlparse(rr.url).hostname or "archivo",
                                  "source_url":rr.url,
                                  "rights_status":"unverified",
                                  "generated":False,
                                  "alt":""
                              }
                          ir.close()
                      except Exception:
                          pass
              except Exception:
                  pass
              return None

          for item in doc.get("items",[]):
              tweet=item.get("tweet") or {}
              # Solo Listas reales: texto + remate.
              if not str(tweet.get("text") or "").strip() or not str(tweet.get("remate") or "").strip():
                  continue

              # La generación IA está retirada. No reactivar sus estrategias.
              if item.get("image_mode")!="archive_only":
                  item["image_mode"]="archive_only"; changed=True
              if item.get("image_strategy")!="archive_only":
                  item["image_strategy"]="archive_only"; changed=True

              archive=item.get("archive_image")
              fallback=item.get("fallback_image")
              if not valid_archive(archive) and valid_archive(fallback):
                  item["archive_image"]=dict(fallback)
                  item["archive_image_status"]="ready"
                  changed=True
                  archive=item["archive_image"]

              if valid_archive(archive):
                  if item.get("archive_image_status")!="ready":
                      item["archive_image_status"]="ready"; changed=True
                  continue

              # Evita golpear la misma fuente varias veces dentro de 30 min.
              last=str(item.get("archive_image_search_attempted_at") or "")
              if last:
                  try:
                      dt=datetime.fromisoformat(last.replace("Z","+00:00"))
                      if (datetime.now(timezone.utc)-dt).total_seconds()<1800:
                          continue
                  except Exception:
                      pass

              urls=[]
              for u in [item.get("url")]+[x.get("url") for x in (item.get("citations") or []) if isinstance(x,dict)]:
                  u=str(u or "").strip()
                  if u and u not in urls: urls.append(u)
              found=None
              for u in urls[:4]:
                  found=try_source(u)
                  if found: break

              item["archive_image_search_attempted_at"]=now
              item["fallback_image_search_attempted_at"]=now
              if found:
                  found["alt"]=str(item.get("title") or "")
                  item["archive_image"]=found
                  item["fallback_image"]=dict(found)
                  item["archive_image_status"]="ready"
                  item["fallback_image_status"]="ready"
                  if str(item.get("image_choice") or "") in {"","none"}:
                      item["image_choice"]="fallback"
                  changed=True
                  print("TTITTULARES_ARCHIVE_READY",item.get("event_id"),found["url"])
              else:
                  if item.get("archive_image_status") not in {"none","ready"}:
                      item["archive_image_status"]="none"; changed=True
                  print("TTITTULARES_ARCHIVE_NONE",item.get("event_id"))

          if changed:
              doc["updated_at"]=now
              P.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("TTITTULARES_ARCHIVE_CHANGED="+str(int(changed)))
          PY

      - name: Guardar reparación de archivo
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ttittulares/prepared.json; then
            echo "Sin cambios de archivo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ttittulares/prepared.json
          git commit -m "Reparar imagen de archivo en Listas"
          for n in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep $((n*2)); continue; }
            if git push origin HEAD:main; then break; fi
            sleep $((n*2))
          done
          git fetch origin main
          git reset --hard origin/main

      - name: Encolar IA ausente o inválida
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          CONTROL="control/ttittulares-run-trigger-v2"
          git fetch origin "$CONTROL:$CONTROL" || git fetch origin "$CONTROL"
          rm -rf /tmp/tt-control-branch
          git worktree add -B "$CONTROL" /tmp/tt-control-branch "origin/$CONTROL"
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, time
          from datetime import datetime, timezone

          MAIN=pathlib.Path(".")
          CTRL=pathlib.Path("/tmp/tt-control-branch")
          prepared=json.loads((MAIN/"ttittulares/prepared.json").read_text(encoding="utf-8"))
          index_path=CTRL/"ttittulares/image-runs/index.json"
          index=json.loads(index_path.read_text(encoding="utf-8")) if index_path.exists() else {"version":1,"jobs":[]}
          now=datetime.now(timezone.utc)
          nowz=now.isoformat().replace("+00:00","Z")
          changed=False

          STYLE_BASE=("PRINCIPIO FIJO: más gag, menos barroquismo. Una sola idea visual fuerte, lectura inmediata en 1-2 segundos, composición limpia, "
                      "uno a tres elementos protagonistas y fondo solo si ayuda al chiste. Acabado cuidado y rico en dibujo, pero sin acumulación decorativa. "
                      "El gag debe nacer del hecho/remate y no limitarse a ilustrar literalmente el titular. Casi sin texto; solo el imprescindible para el gag. ")
          STYLE_BANK=[
              ("tinta_acuarela","Caricatura editorial contemporánea de alta calidad, línea de tinta expresiva y acuarela controlada, gestos muy trabajados y fondo ligero."),
              ("comic_europeo","Cómic europeo contemporáneo, entintado preciso, volumen sólido, expresiones fuertes y composición cinematográfica pero despejada."),
              ("poster_grafico","Póster gráfico editorial sofisticado, formas contundentes, geometría limpia, textura de impresión y jerarquía visual muy clara; no aspecto infantil."),
              ("absurdo_semirrealista","Escena absurda semi-realista, materiales y texturas cuidados, iluminación natural y situación imposible tratada con precisión visual."),
              ("stop_motion","Diorama editorial tipo stop-motion/clay, personajes y objetos con volumen artesanal, iluminación de estudio y detalle selectivo."),
              ("retro_60s","Ilustración publicitaria retro de los años 60 reinterpretada con acabado moderno, dibujo elegante, ironía visual y composición limpia."),
              ("grabado_moderno","Grabado/linograbado moderno de alta calidad con textura rica, contraste controlado y un único foco narrativo."),
              ("pop_art","Pop art editorial refinado, serigrafía y tramas controladas, energía gráfica sin llenar la escena de elementos."),
              ("cartoon_3d","Cartoon 3D editorial estilizado, modelado cuidado, expresiones claras, materiales pulidos y escena sencilla pero no simplona."),
              ("novela_grafica","Novela gráfica satírica, dibujo detallado, sombras contenidas, gesto expresivo y puesta en escena sobria.")
          ]
          
          def pick_style(key):
              digest=hashlib.sha256(key.encode("utf-8")).digest()
              idx=int.from_bytes(digest[:4],"big") % len(STYLE_BANK)
              name,detail=STYLE_BANK[idx]
              return idx,name,STYLE_BASE+"ESTILO ASIGNADO PARA ESTA IMAGEN: "+detail

          def ai_valid(item):
              ai=item.get("ai_image") or {}
              return (
                  str(item.get("ai_image_status") or "").lower()=="ready"
                  and str(ai.get("provider") or "")=="chat-imagegen"
                  and str(ai.get("origin") or "")=="executing_chat"
                  and int(ai.get("width") or 0)>=1024
                  and int(ai.get("height") or 0)>=576
                  and bool(str(ai.get("url") or "").strip())
                  and bool(str(ai.get("sha256") or "").strip())
              )

          def load_old(path):
              try: return json.loads(path.read_text(encoding="utf-8"))
              except Exception: return {}

          active={"REQUESTED","RUNNING","PERSISTING"}
          queued=[]
          wanted_ids=set()

          for item in prepared.get("items",[]):
              eid=str(item.get("event_id") or "").strip()
              rev=int(item.get("revision") or 1)
              tweet=item.get("tweet") or {}
              text=str(tweet.get("text") or "").strip()
              remate=str(tweet.get("remate") or "").strip()
              if not eid or not text or not remate:
                  continue
              # Los bloqueos editoriales heredados (disable/fallback_only/etc.) ya no
              # impiden generar IA. Tremending sigue fuera por su flujo tweet_capture.
              if item.get("tremending_origin") or str(item.get("image_mode") or item.get("image_strategy") or "").lower()=="tweet_capture_only":
                  continue
              if ai_valid(item):
                  continue
              # El índice operativo solo debe contener noticias ACTUALES de Listas
              # que todavía necesitan IA. El historial antiguo multiplica lecturas
              # de estado y puede retrasar el siguiente Gag IA.
              wanted_ids.add(eid)

              job_path=CTRL/f"ttittulares/image-runs/jobs/{eid}.json"
              old=load_old(job_path)
              manual_retry_version=int(item.get("ai_image_regenerate_request_version") or 0)
              consumed_retry_version=int(old.get("manual_retry_version") or 0)
              force_retry=manual_retry_version>consumed_retry_version
              attempt=int(old.get("auto_repair_attempt") or 0)
              old_status=str(old.get("status") or "").upper()
              finished=str(old.get("finished_at") or old.get("updated_at") or old.get("requested_at") or "")
              age=999999
              if finished:
                  try:
                      dt=datetime.fromisoformat(finished.replace("Z","+00:00"))
                      age=(now-dt).total_seconds()
                  except Exception: pass

              # Un job REQUESTED/RUNNING puede quedar muerto si el bridge o Chat
              # no devuelve raster. No debe bloquear la reparación para siempre.
              if (not force_retry) and int(old.get("revision") or rev)==rev and old_status in active:
                  active_ttl=45*60 if old_status=="REQUESTED" else 12*60
                  if age<active_ttl:
                      continue

              # Los fallos de transporte/CDP no deben dejar Listas sin IA durante
              # una hora después de que el bridge ya haya sido corregido. Conservamos
              # el backoff largo para fallos genéricos repetidos, pero los errores de
              # lanzamiento del navegador se vuelven a intentar pronto.
              last_message=str(old.get("message") or "").lower()
              transient_bridge_failure=any(token in last_message for token in (
                  "cdp timeout page.navigate",
                  "timeout cdp",
                  "no se encontró ninguna conversación",
                  "no se encontro ninguna conversacion",
                  "pestaña dedicada no mostró compositor",
                  "pestana dedicada no mostro compositor",
                  "upload 500",
                  "does not match",
                  "shared/image-raster-registry.json",
                  "ttittulares/prepared.json",
                  "github control put",
                  "no hubo evidencia suficiente de envío del prompt imagegen",
                  "no hubo evidencia suficiente de envio del prompt imagegen",
                  "fallback no pudo escribir el prompt completo",
                  "no apareció un raster imagegen capturable",
                  "no aparecio un raster imagegen capturable",
                  "imagegen no produjo raster",
              ))
              cooldown=60 if transient_bridge_failure else (300 if attempt<3 else 3600)
              if (not force_retry) and old and old_status not in active and age<cooldown:
                  continue

              attempt+=1
              command=f"tt-img-auto-{eid}-r{rev}-a{attempt}-{int(time.time()*1000)}"
              style_index,style_name,style=pick_style(f"ttittulares|{eid}|r{rev}|a{attempt}|{command}")
              factual=str(item.get("factual_summary") or "")
              title=str(item.get("title") or eid)
              prompt=(style+"\n\nTEXTO EXACTO DE LA NOTICIA YA LISTA:\n"+text+
                      "\n\nREMATE EXACTO:\n"+remate+
                      "\n\nCONTEXTO FACTUAL COMPLEMENTARIO:\n"+factual+
                      "\n\nConstruye una sola escena coherente. No hagas infografía, interfaz, diagrama, collage ni captura de pantalla. "
                      "Genera exactamente UNA imagen.")

              job={
                  "version":1,
                  "command_id":command,
                  "requested_at":nowz,
                  "updated_at":nowz,
                  "status":"REQUESTED",
                  "phase":"queued",
                  "mode":"automatic_ready_repair",
                  "executor":"pc_chat_ttittulares_dedicated",
                  "project":"ttittulares",
                  "task":"image",
                  "target_id":eid,
                  "event_id":eid,
                  "target_name":title,
                  "revision":rev,
                  "regenerate":bool(old),
                  "auto_repair":True,
                  "auto_repair_attempt":attempt,
                  "manual_retry_version":manual_retry_version,
                  "chat_command_version":7,
                  "instruction_profile":"ttittulares_gag_v9_varied_style_single_gag",
                  "context_snapshot":{
                      "title":title,
                      "revision":rev,
                      "factual_summary":factual,
                      "tweet_text":text,
                      "remate":remate,
                      "image_style":style,
                      "image_style_name":style_name,
                      "image_style_index":style_index,
                      "image_prompt":prompt,
                      "url":str(item.get("url") or ""),
                      "citations":item.get("citations") or []
                  },
                  "instructions":{
                      "scope":"Una sola noticia y una sola imagen.",
                      "exact_input":"Usa literalmente tweet_text y remate.",
                      "visual":"Una sola idea visual fuerte; más gag y menos barroquismo. Respeta image_style del context_snapshot.",
                      "prohibitions":"No infografía, no interfaz, no diagrama, no collage, no screenshot.",
                      "lifecycle":"Pestaña física fija; conversación nueva; raster limpio; Listas; Telegram."
                  },
                  "message":"Reintento manual de imagen IA desde Telegram." if force_retry else "Reparación automática de imagen IA para noticia en Listas."
              }
              job_path.parent.mkdir(parents=True,exist_ok=True)
              job_path.write_text(json.dumps(job,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              index["jobs"]=[x for x in index.get("jobs",[]) if str(x.get("target_id") or "")!=eid]
              index["jobs"].append({
                  "command_id":command,"target_id":eid,"event_id":eid,"target_name":title,
                  "revision":rev,"requested_at":nowz,
                  "status_path":f"ttittulares/image-runs/jobs/{eid}.json",
                  "executor":"pc_chat_ttittulares_dedicated","auto_repair":True,"auto_repair_attempt":attempt
              })
              queued.append((eid,attempt,command))
              changed=True

          # Purgar del índice jobs históricos o de noticias que ya no están
          # en Listas. Los JSON de job se conservan como historial; solo reducimos
          # el índice que escanea el listener.
          before_jobs=list(index.get("jobs",[]))
          filtered=[]
          seen=set()
          for x in reversed(before_jobs):
              tid=str(x.get("target_id") or "")
              if tid not in wanted_ids or tid in seen:
                  continue
              seen.add(tid); filtered.append(x)
          filtered.reverse()
          if filtered != before_jobs:
              index["jobs"]=filtered
              changed=True
              print("TTITTULARES_AI_INDEX_PRUNED",len(before_jobs),"->",len(filtered))

          if changed:
              index["updated_at"]=nowz
              index_path.parent.mkdir(parents=True,exist_ok=True)
              index_path.write_text(json.dumps(index,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          for x in queued: print("TTITTULARES_AI_REPAIR_QUEUED",*x)
          print("TTITTULARES_AI_REPAIR_COUNT="+str(len(queued)))
          PY
          cd /tmp/tt-control-branch
          if git diff --quiet -- ttittulares/image-runs; then
            echo "Sin IA para encolar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ttittulares/image-runs
          git commit -m "Reparar automáticamente IA de Listas"
          for n in 1 2 3 4 5; do
            git pull --rebase origin "$CONTROL" || { git rebase --abort || true; sleep $((n*2)); continue; }
            if git push origin HEAD:"$CONTROL"; then exit 0; fi
            sleep $((n*2))
          done
          echo "No se pudo encolar reparación IA" >&2
          exit 1

