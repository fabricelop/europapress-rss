name: Reparar TTiTTulares Listas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ttittulares/prepared.json"
      - ".github/workflows/repair-ttittulares-listas.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: ttittulares-listas-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar cliente HTTP
        run: python3 -m pip install --quiet requests

      - name: Encolar IA automática no bloqueante (un trabajo a la vez)
        shell: bash
        run: |
          set -euo pipefail
          # Releer los datos editoriales de Listas antes de encolar; sin necesidad de entrega Telegram.
          git fetch origin main
          git reset --hard origin/main
          CONTROL="control/ttittulares-run-trigger-v2"
          git fetch --no-tags origin "+refs/heads/$CONTROL:refs/remotes/origin/$CONTROL"
          rm -rf /tmp/tt-control-branch
          git worktree add -B "$CONTROL" /tmp/tt-control-branch "origin/$CONTROL"
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, time
          from shared.tt_image_idempotency import may_enqueue_image_job
          from datetime import datetime, timezone

          MAIN=pathlib.Path(".")
          CTRL=pathlib.Path("/tmp/tt-control-branch")
          prepared=json.loads((MAIN/"ttittulares/prepared.json").read_text(encoding="utf-8"))
          deliveries=json.loads((MAIN/"telegram/ttittulares-deliveries.json").read_text(encoding="utf-8"))
          # Usar el estado MÁS RECIENTE de Telegram por noticia: un borrado posterior
          # anula cualquier envío previo y nunca debe reabrir una orden de imagen.
          last_delivery_by_id={}
          for row in deliveries.get("items",[]):
              eid=str(row.get("event_id") or "").strip()
              if eid:
                  last_delivery_by_id[eid]=row
          delivered_ids={eid for eid,row in last_delivery_by_id.items()
                         if str(row.get("status") or "").lower()=="sent" and row.get("telegram_message_id")}
          index_path=CTRL/"ttittulares/image-runs/index.json"
          index=json.loads(index_path.read_text(encoding="utf-8")) if index_path.exists() else {"version":1,"jobs":[]}
          now=datetime.now(timezone.utc)
          nowz=now.isoformat().replace("+00:00","Z")
          changed=False
          # Borrar de Telegram es terminal: nunca crear una nueva orden IA.
          decisions=json.loads((MAIN/"ttittulares/decisions.json").read_text(encoding="utf-8"))
          closed_ids={str(row.get("event_id") or "") for row in decisions.get("items",[])
                      if str(row.get("status") or "").lower() in {"deleted","dismissed","published","treated"}}
          eligible_ids={str(row.get("event_id") or "") for row in prepared.get("items",[])
                        if str(row.get("event_id") or "") and str(row.get("event_id") or "") not in closed_ids}
          def elapsed_seconds(when):
              if not when:return 999999
              try:return (now-datetime.fromisoformat(str(when).replace("Z","+00:00"))).total_seconds()
              except (ValueError,TypeError):return 999999

          NO_PEPPER="REGLA VISUAL OBLIGATORIA: el emoji 🌶️ es únicamente un marcador TIPOGRÁFICO del remate escrito. PROHIBIDO dibujar guindillas, chiles, pimientos picantes o su icono, logotipo, silueta o mascota, tanto en primer plano como en fondo, carteles, ropa, objetos, decoración o firma. El gag debe representar la IDEA del remate, nunca el emoji. "
          STYLE_BASE=("PRINCIPIO FIJO: más gag, menos barroquismo. Una sola idea visual fuerte, lectura inmediata en 1-2 segundos, composición limpia, "
                      "uno a tres elementos protagonistas y fondo solo si ayuda al chiste. Acabado cuidado y rico en dibujo, pero sin acumulación decorativa. "
                      "El gag debe nacer del hecho/remate y no limitarse a ilustrar literalmente el titular. Casi sin texto; solo el imprescindible para el gag. "+NO_PEPPER)
          STYLE_BANK=[
              ("tinta_acuarela","Caricatura editorial contemporánea de alta calidad, línea de tinta expresiva y acuarela controlada, gestos muy trabajados y fondo ligero."),
              ("comic_europeo","Cómic europeo contemporáneo, entintado preciso, volumen sólido, expresiones fuertes y composición cinematográfica pero despejada."),
              ("poster_grafico","Póster gráfico editorial sofisticado, formas contundentes, geometría limpia, textura de impresión y jerarquía visual muy clara; no aspecto infantil."),
              ("absurdo_semirrealista","Escena absurda semi-realista, materiales y texturas cuidados, iluminación natural y situación imposible tratada con precisión visual."),
              ("stop_motion","Diorama editorial tipo stop-motion/clay, personajes y objetos con volumen artesanal, iluminación de estudio y detalle selectivo."),
              ("retro_60s","Ilustración publicitaria retro de los años 60 reinterpretada con acabado moderno, dibujo elegante, ironía visual y composición limpia."),
              ("grabado_moderno","Grabado/linograbado moderno de alta calidad con textura rica, contraste controlado y un único foco narrativo."),
              ("pop_art","Pop art editorial refinado, serigrafía y tramas controladas, energía gráfica sin llenar la escena de elementos."),
              ("cartoon_3d","Cartoon 3D editorial estilizado, modelado cuidado, expresiones claras, materiales pulidos y escena sencilla pero no simplona."),
              ("novela_grafica","Novela gráfica satírica, dibujo detallado, sombras contenidas, gesto expresivo y puesta en escena sobria.")
          ]
          
          def pick_style(key):
              digest=hashlib.sha256(key.encode("utf-8")).digest()
              idx=int.from_bytes(digest[:4],"big") % len(STYLE_BANK)
              name,detail=STYLE_BANK[idx]
              return idx,name,STYLE_BASE+"ESTILO ASIGNADO PARA ESTA IMAGEN: "+detail

          def ai_valid(item):
              ai=item.get("ai_image") or {}
              return (
                  str(item.get("ai_image_status") or "").lower()=="ready"
                  and str(ai.get("provider") or "")=="chat-imagegen"
                  and str(ai.get("origin") or "")=="executing_chat"
                  and int(ai.get("width") or 0)>=1024
                  and int(ai.get("height") or 0)>=576
                  and bool(str(ai.get("url") or "").strip())
                  and bool(str(ai.get("sha256") or "").strip())
              )

          def load_old(path):
              try: return json.loads(path.read_text(encoding="utf-8"))
              except Exception: return {}

          # Fallback until the live Cloudflare Worker receives the ACK handler update:
          # the already-scheduled repair pass closes ACK-proven launches without
          # opening chats or changing the image itself.
          for job_file in (CTRL/"ttittulares/image-runs/jobs").glob("*.json"):
              old_job=load_old(job_file)
              if (str(old_job.get("delivery_mode") or "")!="launch_only"
                  or not old_job.get("pc_launched_at")
                  or str(old_job.get("status") or "").upper()=="LAUNCHED"
                  or elapsed_seconds(old_job.get("pc_launched_at"))>48*3600):
                  continue
              old_job.update(status="LAUNCHED",phase="pc_launched",
                             finished_at=str(old_job["pc_launched_at"]),
                             updated_at=nowz,
                             message="Prompt confirmado en ChatGPT Images; sin recuperar raster.")
              job_file.write_text(json.dumps(old_job,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              changed=True
              print("TTITTULARES_AI_ACK_RECONCILED",str(old_job.get("target_id") or ""),str(old_job.get("command_id") or ""))
          active={"REQUESTED","RUNNING","PERSISTING"}
          # Una orden automática sin respuesta del PC no bloquea la cola eternamente.
          def is_active_job(ref):
              path=str(ref.get("status_path") or "")
              if not path.startswith("ttittulares/image-runs/jobs/"):return False
              job=load_old(CTRL/path)
              if str(job.get("status") or "").upper() not in active:return False
              if not job.get("auto_repair"):return True  # No alterar el modo manual.
              if str(job.get("target_id") or "") not in eligible_ids:return False
              # No caducar una espera en cola: el PC puede estar apagado.
              # Al lanzarse el prompt, sale del índice pero conserva el recibo.
              return not bool(job.get("pc_launched_at"))
          # Encolar todas las noticias independientemente; el listener consume secuencialmente.
          # Ningún REQUESTED de otra noticia impide crear el siguiente trabajo.
          queued=[]
          wanted_ids=set()

          for item in prepared.get("items",[]):
              eid=str(item.get("event_id") or "").strip()
              rev=int(item.get("revision") or 1)
              tweet=item.get("tweet") or {}
              text=str(tweet.get("text") or "").strip()
              remate=str(tweet.get("remate") or "").strip()
              if not eid or not text or not remate or eid in closed_ids:
                  continue
              # No procesar retrospectivamente noticias antiguas.
              # prepared.json de Listas puede omitir prepared_at/ready_at aunque
              # Telegram ya haya entregado la noticia; usar su recibo confirmado.
              delivery=last_delivery_by_id.get(eid) or {}
              entered=str(item.get("prepared_at") or item.get("ready_at") or
                          delivery.get("delivered_at") or delivery.get("updated_at") or "")
              try:
                  entered_dt=datetime.fromisoformat(entered.replace("Z","+00:00"))
              except (ValueError,TypeError):
                  continue
              # No reactivar noticias de antes de la simplificación; conservar
              # 24 h de cola para no perder noticias si otra imagen tarda.
              launch_only_start=datetime.fromisoformat("2026-10-14T06:20:00+00:00")
              if entered_dt < launch_only_start or (now-entered_dt).total_seconds()>24*3600:
                  continue
              # Una noticia sigue siendo elegible mientras permanezca en Listas; Telegram ya no es requisito.
              # Intentar todas las noticias, incluidas las sensibles. El estilo cambia; no se descartan.
              is_sensitive=any(k in (str(item.get("title") or "")+" "+str(item.get("factual_summary") or "")).casefold()
                     for k in ("fallece","muere","muerte","muertos","muertas","heridos","heridas","asesinat","suicid","violación","agresión sexual","menor fallecid","cáncer","enfermedad terminal","atentado","operado","operación quirúrgica","hospitalizado","adenocarcinoma","nódulo pulmonar","enfermedad grave","accidente mortal","víctimas mortales","abuso infantil","misiles balísticos","bombardeo"))
              # No detener imágenes automáticas por flags de las antiguas fotografías de archivo.
              if ai_valid(item):
                  continue
              # El índice operativo solo debe contener noticias ACTUALES de Listas
              # que todavía necesitan IA. El historial antiguo multiplica lecturas
              # de estado y puede retrasar el siguiente Gag IA.
              wanted_ids.add(eid)

              job_path=CTRL/f"ttittulares/image-runs/jobs/{eid}.json"
              old=load_old(job_path)
              manual_retry_version=int(item.get("ai_image_regenerate_request_version") or 0)
              # Durable identity: project / ID / editorial revision.
              # A PC ERROR after pickup can coexist with generating=true.
              # Do not repeat a prompt on ambiguous evidence or a stale timer.
              if not may_enqueue_image_job(old, rev, manual_retry_version=manual_retry_version):
                  continue
              attempt=int(old.get("auto_repair_attempt") or 0)
              force_retry=manual_retry_version>int(old.get("manual_retry_version") or 0)
              attempt+=1
              command=f"tt-img-auto-{eid}-r{rev}-a{attempt}-{int(time.time()*1000)}"
              style_index,style_name,style=pick_style(f"ttittulares|{eid}|r{rev}|a{attempt}|{command}")
              if is_sensitive:
                  style_index,style_name,style=(-1,"rigor_y_respeto",
                      "ILUSTRACIÓN PERIODÍSTICA SERIA: rigor documental, sobriedad y respeto. Evita humor, sátira, caricaturas, ironías, metáforas que banalicen daños, víctimas reconocibles inventadas y escenas gráficas. Una única imagen editorial sobria, contextual y no sensacionalista. Sin afirmaciones visuales no documentadas.")
              style=style+" "+NO_PEPPER
              factual=str(item.get("factual_summary") or "")
              title=str(item.get("title") or eid)
              prompt=(style+"\n\nTEXTO EXACTO DE LA NOTICIA YA LISTA:\n"+text+
                      "\n\nREMATE EXACTO:\n"+remate+
                      "\n\nCONTEXTO FACTUAL COMPLEMENTARIO:\n"+factual+
                      "\n\n"+NO_PEPPER+"\n\nConstruye una sola escena coherente. No hagas infografía, interfaz, diagrama, collage ni captura de pantalla. "
                      "Genera exactamente UNA imagen.")

              job={
                  "version":1,
                  "command_id":command,
                  "requested_at":nowz,
                  "updated_at":nowz,
                  "status":"REQUESTED",
                  "phase":"queued",
                  "mode":"automatic_ready_repair",
                  "delivery_mode":"launch_only",
                  "editorial_image_mode":"rigor" if is_sensitive else "humor",
                  "executor":"pc_chat_ttittulares_dedicated",
                  "project":"ttittulares",
                  "task":"image",
                  "target_id":eid,
                  "event_id":eid,
                  "target_name":title,
                  "revision":rev,
                  "regenerate":bool(old),
                  "auto_repair":True,
                  "auto_repair_attempt":attempt,
                  "manual_retry_version":manual_retry_version,
                  "chat_command_version":7,
                  "instruction_profile":"ttittulares_gag_v9_varied_style_single_gag",
                  "context_snapshot":{
                      "title":title,
                      "revision":rev,
                      "factual_summary":factual,
                      "tweet_text":text,
                      "remate":remate,
                      "image_style":style,
                      "editorial_image_mode":"rigor" if is_sensitive else "humor",
                      "image_style_name":style_name,
                      "image_style_index":style_index,
                      "image_prompt":prompt,
                      "url":str(item.get("url") or ""),
                      "citations":item.get("citations") or []
                  },
                  "instructions":{
                      "scope":"Una sola noticia y una sola imagen.",
                      "exact_input":"Usa literalmente tweet_text y remate.",
                      "visual":("Imagen sobria y rigurosa, sin humor ni banalización." if is_sensitive else "Una sola idea visual fuerte; más gag y menos barroquismo.")+" Respeta image_style del context_snapshot.",
                      "prohibitions":"No infografía, no interfaz, no diagrama, no collage, no screenshot. "+NO_PEPPER,
                      "lifecycle":"Pestaña fija ChatGPT; prompt lanzado; el usuario recoge la imagen en ChatGPT Images. NO capturar ni enviar raster a Telegram."
                  },
                  "message":"Reintento manual de imagen IA desde Telegram." if force_retry else "Reparación automática de imagen IA para noticia en Listas."
              }
              job_path.parent.mkdir(parents=True,exist_ok=True)
              job_path.write_text(json.dumps(job,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              index["jobs"]=[x for x in index.get("jobs",[]) if str(x.get("target_id") or "")!=eid]
              index["jobs"].append({
                  "command_id":command,"target_id":eid,"event_id":eid,"target_name":title,
                  "revision":rev,"requested_at":nowz,
                  "status_path":f"ttittulares/image-runs/jobs/{eid}.json",
                  "executor":"pc_chat_ttittulares_dedicated","auto_repair":True,"auto_repair_attempt":attempt
              })
              queued.append((eid,attempt,command))
              changed=True

          # Resolver atascos y borrados antes de que el listener de Windows
          # pueda recuperar órdenes automáticas caducadas después de horas.
          before_jobs=list(index.get("jobs",[]))
          filtered=[]
          seen=set()
          for x in reversed(before_jobs):
              tid=str(x.get("target_id") or "")
              path=str(x.get("status_path") or "")
              if tid in seen or not path.startswith("ttittulares/image-runs/jobs/"):
                  continue
              job_path=CTRL/path
              job=load_old(job_path)
              automated=bool(job.get("auto_repair") or x.get("auto_repair"))
              if not automated:
                  # NO cancelar ni podar generación manual por el filtro automático.
                  if str(job.get("status") or "").upper() in active:
                      seen.add(tid);filtered.append(x)
                  continue
              status=str(job.get("status") or "").upper()
              reason=None
              if status in active:
                  if tid not in eligible_ids:reason="not_eligible_or_deleted"
                  elif job.get("pc_launched_at") and job.get("delivery_mode")!="launch_only" and elapsed_seconds(job.get("pc_launched_at"))>=300:
                      reason="five_minute_generation_deadline"
                  elif (status!="REQUESTED" and not job.get("pc_launched_at")
                        and elapsed_seconds(job.get("updated_at"))>=900):
                      reason="bridge_stalled_before_launch"
              if reason:
                  job.update(status="CANCELLED",phase="expired",finished_at=nowz,
                             updated_at=nowz,message=reason)
                  job_path.write_text(json.dumps(job,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
                  changed=True
                  print("TTITTULARES_AI_AUTO_CANCELLED",tid,reason)
              # Jobs automáticos terminados/expirados fuera del índice;
              # sólo conservar el actual si sigue dentro de la ventana viva.
              if tid in wanted_ids and is_active_job(x) and not reason:
                  seen.add(tid);filtered.append(x)
          filtered.reverse()
          if filtered != before_jobs:
              index["jobs"]=filtered
              changed=True
              print("TTITTULARES_AI_INDEX_PRUNED",len(before_jobs),"->",len(filtered))

          if changed:
              index["updated_at"]=nowz
              index_path.parent.mkdir(parents=True,exist_ok=True)
              index_path.write_text(json.dumps(index,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          for x in queued: print("TTITTULARES_AI_REPAIR_QUEUED",*x)
          print("TTITTULARES_AI_REPAIR_COUNT="+str(len(queued)))
          PY
          cd /tmp/tt-control-branch
          if git diff --quiet -- ttittulares/image-runs; then
            echo "Sin IA para encolar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ttittulares/image-runs
          git commit -m "Reparar automáticamente IA de Listas"
          # Fast-forward push is the atomic claim; NEVER rebase a stale job
          # over a newer launch ACK or newer revision in the control branch.
          if ! git push origin HEAD:"$CONTROL"; then
            echo "TT_IMAGE_CLAIM_CONFLICT: remote moved; next repair pass must re-read latest jobs" >&2
            exit 1
          fi


      - name: Reparar imagen de archivo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, urllib.parse, time, hashlib
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          import requests

          P=pathlib.Path("ttittulares/prepared.json")
          doc=json.loads(P.read_text(encoding="utf-8"))
          now=datetime.now(timezone.utc).isoformat().replace("+00:00","Z")
          changed=False

          class MetaParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.candidates=[]
              def handle_starttag(self,tag,attrs):
                  a={str(k).lower():str(v or "") for k,v in attrs}
                  if tag.lower()=="meta":
                      key=(a.get("property") or a.get("name") or "").lower()
                      if key in {"og:image","og:image:url","twitter:image","twitter:image:src"} and a.get("content"):
                          self.candidates.append(a["content"])
                  elif tag.lower()=="link" and "image_src" in a.get("rel","").lower() and a.get("href"):
                      self.candidates.append(a["href"])

          def valid_archive(a):
              return isinstance(a,dict) and bool(str(a.get("url") or "").strip()) and not bool(a.get("generated"))

          def try_source(page_url):
              if not page_url or not str(page_url).startswith(("http://","https://")):
                  return None
              try:
                  rr=requests.get(page_url,timeout=20,headers={"User-Agent":"Mozilla/5.0 TTiTTulares/1"},allow_redirects=True)
                  rr.raise_for_status()
                  parser=MetaParser(); parser.feed(rr.text[:1500000])
                  for candidate in parser.candidates[:8]:
                      url=urllib.parse.urljoin(rr.url,candidate.strip())
                      if not url.startswith(("http://","https://")):
                          continue
                      try:
                          ir=requests.get(url,timeout=20,headers={"User-Agent":"Mozilla/5.0 TTiTTulares/1","Referer":rr.url},stream=True,allow_redirects=True)
                          ct=str(ir.headers.get("content-type") or "").lower()
                          if ir.ok and ct.startswith("image/"):
                              ir.close()
                              return {
                                  "url":url,
                                  "source":urllib.parse.urlparse(rr.url).hostname or "archivo",
                                  "source_url":rr.url,
                                  "rights_status":"unverified",
                                  "generated":False,
                                  "alt":""
                              }
                          ir.close()
                      except Exception:
                          pass
              except Exception:
                  pass
              return None

          for item in doc.get("items",[]):
              tweet=item.get("tweet") or {}
              # Solo Listas reales: texto + remate.
              if not str(tweet.get("text") or "").strip() or not str(tweet.get("remate") or "").strip():
                  continue

              # La generación IA está retirada. No reactivar sus estrategias.
              if item.get("image_mode")!="archive_only":
                  item["image_mode"]="archive_only"; changed=True
              if item.get("image_strategy")!="archive_only":
                  item["image_strategy"]="archive_only"; changed=True

              archive=item.get("archive_image")
              fallback=item.get("fallback_image")
              if not valid_archive(archive) and valid_archive(fallback):
                  item["archive_image"]=dict(fallback)
                  item["archive_image_status"]="ready"
                  changed=True
                  archive=item["archive_image"]

              if valid_archive(archive):
                  if item.get("archive_image_status")!="ready":
                      item["archive_image_status"]="ready"; changed=True
                  continue

              # Evita golpear la misma fuente varias veces dentro de 30 min.
              last=str(item.get("archive_image_search_attempted_at") or "")
              if last:
                  try:
                      dt=datetime.fromisoformat(last.replace("Z","+00:00"))
                      if (datetime.now(timezone.utc)-dt).total_seconds()<1800:
                          continue
                  except Exception:
                      pass

              urls=[]
              for u in [item.get("url")]+[x.get("url") for x in (item.get("citations") or []) if isinstance(x,dict)]:
                  u=str(u or "").strip()
                  if u and u not in urls: urls.append(u)
              found=None
              for u in urls[:4]:
                  found=try_source(u)
                  if found: break

              item["archive_image_search_attempted_at"]=now
              item["fallback_image_search_attempted_at"]=now
              if found:
                  found["alt"]=str(item.get("title") or "")
                  item["archive_image"]=found
                  item["fallback_image"]=dict(found)
                  item["archive_image_status"]="ready"
                  item["fallback_image_status"]="ready"
                  if str(item.get("image_choice") or "") in {"","none"}:
                      item["image_choice"]="fallback"
                  changed=True
                  print("TTITTULARES_ARCHIVE_READY",item.get("event_id"),found["url"])
              else:
                  if item.get("archive_image_status") not in {"none","ready"}:
                      item["archive_image_status"]="none"; changed=True
                  print("TTITTULARES_ARCHIVE_NONE",item.get("event_id"))

          if changed:
              doc["updated_at"]=now
              P.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("TTITTULARES_ARCHIVE_CHANGED="+str(int(changed)))
          PY

      - name: Guardar reparación de archivo
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ttittulares/prepared.json; then
            echo "Sin cambios de archivo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ttittulares/prepared.json
          git commit -m "Reparar imagen de archivo en Listas"
          for n in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep $((n*2)); continue; }
            if git push origin HEAD:main; then break; fi
            sleep $((n*2))
          done
          git fetch origin main
          git reset --hard origin/main

      - name: Listas e imágenes quedan disponibles sin Telegram
        run: echo "Las imágenes se encolan por prepared.json; sin envío a Telegram"
