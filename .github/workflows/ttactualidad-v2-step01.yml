name: TTActualidad V2 - Pasos 1-4 aislados
on:
  push:
    branches: [feature/ttactualidad-v2-clean]
    paths:
      - 'v2/**'
      - '!v2/ttendencias/state/**'
      - '.github/workflows/ttactualidad-v2-step01.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: ttactualidad-v2-top30-history
  cancel-in-progress: false

jobs:
  test-step-01:
    if: github.ref == 'refs/heads/feature/ttactualidad-v2-clean' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ttactualidad-v2-clean
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet requests beautifulsoup4
      - name: Validar Top30 V2 sin red y sin modificar producción
        run: >-
          python3 -m unittest -v
          v2.ttendencias.test_assess_freshness
          v2.ttendencias.test_capture_top30
          v2.ttendencias.test_chatgpt_transcript
          v2.ttendencias.test_detect_changes
          v2.ttendencias.test_editorial_capture_state
          v2.ttendencias.test_editorial_consumer
          v2.ttendencias.test_editorial_queue
          v2.ttendencias.test_web_top30_v2
          v2.ttendencias.test_auto_editorial_v2
      - name: Validar sintaxis del rescate y arranque automatico V2
        run: >-
          python3 -m py_compile
          v2/ttendencias/recover_existing_chat_v2.py
          v2/ttendencias/editorial_daemon_v2.py
          v2/ttendencias/chatgpt_transcript.py
          v2/ttendencias/chatgpt_target_tracker.py
          v2/ttendencias/editorial_run_v2.py
      - name: V2 5B - probar cierre de navegador efímero con simulación
        run: node --test v2/ttendencias/browser-lifecycle.test.cjs
      - name: Captura REAL GetDayTrends España (solo lectura)
        run: |
          python3 -m v2.ttendencias.capture_top30 --output v2/ttendencias/state/live-capture.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("v2/ttendencias/state/live-capture.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          assert data["mode"]=="live" and data["count"]==len(data["top30"])==30
          assert data["country"]=="ES" and not data["verified_against_x"]
          print("TT_V2_STEP01_REAL_CAPTURE_OK",data["observed_at"],"top30_count",len(data["top30"]))
          PY
      - name: Diagnosticar frescura sin dar por verificado el origen X
        run: |
          python3 -m v2.ttendencias.assess_freshness v2/ttendencias/state/live-capture.json > v2/ttendencias/state/freshness-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("v2/ttendencias/state/freshness-report.json").read_text())
          assert r["step"]=="02_freshness"
          assert r["eligible_for_editorial"] is True
          assert r["source_freshness_verified"] is False
          assert r["source_policy"] == "getdaytrends_single_source"
          assert r["status"] == "accepted_getdaytrends_single_source"
          print("TT_V2_STEP02_CAPTURE_STATUS",r["status"],"capture_age_minutes",r["capture_age_minutes"])
          PY
      - name: Paso 3 - detectar movimientos sin modificar colas
        run: |
          python3 -m v2.ttendencias.detect_changes v2/ttendencias/state/live-capture.json --output v2/ttendencias/state/movement-state.json > v2/ttendencias/state/movement-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("v2/ttendencias/state/movement-report.json").read_text())
          state=json.loads(Path("v2/ttendencias/state/movement-state.json").read_text())
          assert report["step"]=="03_movement"
          assert report["bootstrap"] and report["changes"]==[]
          assert len(state["top30"])==30 and len(state["topics"])==30
          print("TT_V2_STEP03_BOOTSTRAP_OK",len(state["topics"]),"sin falsas entradas ni escrituras en producción")
          PY
      - name: Persistir historial SOLO en la rama V2
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="feature/ttactualidad-v2-clean"
          cp v2/ttendencias/state/live-capture.json /tmp/tt-v2-live-capture.json
          git config user.name "ttactualidad-v2-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            mkdir -p v2/ttendencias/state
            cp /tmp/tt-v2-live-capture.json v2/ttendencias/state/live-capture.json
            if [ -f v2/ttendencias/state/history.json ]; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          from v2.ttendencias.assess_freshness import moment
          new=json.loads(Path("v2/ttendencias/state/live-capture.json").read_text())
          old=json.loads(Path("v2/ttendencias/state/history.json").read_text())
          if moment(new["observed_at"])<=moment(old["observed_at"]):
              print("TT_V2_HISTORY_OLDER_CAPTURE_SKIP")
              Path("/tmp/tt-v2-skip").touch()
          PY
              if [ -f /tmp/tt-v2-skip ]; then exit 0; fi
              python3 -m v2.ttendencias.detect_changes v2/ttendencias/state/live-capture.json --previous v2/ttendencias/state/history.json --output v2/ttendencias/state/history.json > /tmp/tt-v2-movements.json
            else
              python3 -m v2.ttendencias.detect_changes v2/ttendencias/state/live-capture.json --output v2/ttendencias/state/history.json > /tmp/tt-v2-movements.json
            fi
            if [ -f v2/ttendencias/state/editorial-queue.json ]; then
              python3 -m v2.ttendencias.editorial_queue v2/ttendencias/state/history.json --previous v2/ttendencias/state/editorial-queue.json --output v2/ttendencias/state/editorial-queue.json > /tmp/tt-v2-queue.json
            else
              python3 -m v2.ttendencias.editorial_queue v2/ttendencias/state/history.json --output v2/ttendencias/state/editorial-queue.json > /tmp/tt-v2-queue.json
            fi
            python3 -m v2.ttendencias.web_top30_v2 \
              --history v2/ttendencias/state/history.json \
              --queue v2/ttendencias/state/editorial-queue.json \
              --output v2/ttendencias/state/web-top30.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("v2/ttendencias/state/history.json").read_text())
          changes=json.loads(Path("/tmp/tt-v2-movements.json").read_text())
          assert len(state["top30"])==30
          assert all(t.get("trend_id","").startswith("trv2-") for t in state["topics"].values())
          queue=json.loads(Path("v2/ttendencias/state/editorial-queue.json").read_text())
          assert queue["effects_enabled"] is False
          assert set(queue["items"]).issubset({t["trend_id"] for t in state["topics"].values()})
          assert queue["source_observed_at"]==state["observed_at"]
          print("TT_V2_HISTORY_PERSISTENCE_READY",state["observed_at"],
                "historical_topics",len(state["topics"]),"changes",len(changes["changes"]),
                "editorial_pending",queue["pending_count"],"no_external_effects",True)
          PY
            git add -f v2/ttendencias/state/history.json v2/ttendencias/state/editorial-queue.json v2/ttendencias/state/web-top30.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "V2: guardar historial Top30 aislado"
            if git push origin "HEAD:$BRANCH"; then
              echo "TT_V2_HISTORY_PERSISTED branch=$BRANCH"
              exit 0
            fi
            sleep "$attempt"
          done
          echo "TT_V2_HISTORY_PERSIST_FAILED" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ttactualidad-v2-step01-live-top30
          path: v2/ttendencias/state/*.json
          retention-days: 7
