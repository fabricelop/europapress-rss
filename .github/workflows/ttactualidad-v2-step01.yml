name: TTActualidad V2 - Pasos 1-3 aislados
on:
  push:
    branches: [feature/ttactualidad-v2-clean]
    paths:
      - 'v2/**'
      - '.github/workflows/ttactualidad-v2-step01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-step-01:
    if: github.ref == 'refs/heads/feature/ttactualidad-v2-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet requests beautifulsoup4
      - name: Validar Top30 V2 sin red y sin modificar producción
        run: python3 -m unittest discover -s v2/ttendencias -p 'test_*.py' -v
      - name: Captura REAL GetDayTrends España (solo lectura)
        run: |
          python3 -m v2.ttendencias.capture_top30 --output v2/ttendencias/state/live-capture.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("v2/ttendencias/state/live-capture.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          assert data["mode"]=="live" and data["count"]==len(data["top30"])==30
          assert data["country"]=="ES" and not data["verified_against_x"]
          print("TT_V2_STEP01_REAL_CAPTURE_OK",data["observed_at"],"top30_count",len(data["top30"]))
          PY
      - name: Diagnosticar frescura sin dar por verificado el origen X
        run: |
          python3 -m v2.ttendencias.assess_freshness v2/ttendencias/state/live-capture.json > v2/ttendencias/state/freshness-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("v2/ttendencias/state/freshness-report.json").read_text())
          assert r["step"]=="02_freshness"
          assert r["eligible_for_editorial"] is True
          assert r["source_freshness_verified"] is False
          assert r["source_policy"] == "getdaytrends_single_source"
          assert r["status"] == "accepted_getdaytrends_single_source"
          print("TT_V2_STEP02_CAPTURE_STATUS",r["status"],"capture_age_minutes",r["capture_age_minutes"])
          PY
      - name: Paso 3 - detectar movimientos sin modificar colas
        run: |
          python3 -m v2.ttendencias.detect_changes v2/ttendencias/state/live-capture.json --output v2/ttendencias/state/movement-state.json > v2/ttendencias/state/movement-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("v2/ttendencias/state/movement-report.json").read_text())
          state=json.loads(Path("v2/ttendencias/state/movement-state.json").read_text())
          assert report["step"]=="03_movement"
          assert report["bootstrap"] and report["changes"]==[]
          assert len(state["top30"])==30 and len(state["topics"])==30
          print("TT_V2_STEP03_BOOTSTRAP_OK",len(state["topics"]),"sin falsas entradas ni escrituras en producción")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ttactualidad-v2-step01-live-top30
          path: v2/ttendencias/state/*.json
          retention-days: 7
