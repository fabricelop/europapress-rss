name: RainETA HARMONIE Field Validation
on:
  push:
    paths:
      - 'ios/raineta/tests/harmonie_inspection.py'
      - '.github/workflows/raineta-harmonie-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install GeoTIFF scientific tools
        run: python3 -m pip install --quiet requests rasterio numpy pillow
      - name: Inspect authentic AEMET precipitation fields
        working-directory: ios/raineta
        run: python3 tests/harmonie_inspection.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raineta-harmonie-precipitation-proof
          path: ios/raineta/harmonie-science/
          retention-days: 14
