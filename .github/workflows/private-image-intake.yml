name: Private image intake both projects
on:
  push:
    paths: ['windows/TTendenciasWebImages.cjs', 'windows/TTiTTularesWebImages.cjs', 'windows/tests/user-bubble-reader.test.cjs', 'windows/TTImageApprovalReceiver.cjs', 'windows/Actualizar-Recogida-Privada-TT.ps1', 'windows/tests/test_private_image_intake.cjs', '.github/workflows/private-image-intake.yml']
  pull_request:
    paths: ['windows/TTendenciasWebImages.cjs', 'windows/TTiTTularesWebImages.cjs', 'windows/tests/user-bubble-reader.test.cjs', 'windows/TTImageApprovalReceiver.cjs', 'windows/Actualizar-Recogida-Privada-TT.ps1', 'windows/tests/test_private_image_intake.cjs', '.github/workflows/private-image-intake.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test windows/tests/test_private_image_intake.cjs windows/tests/user-bubble-reader.test.cjs
      - run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'windows/Actualizar-Recogida-Privada-TT.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){throw ($errors | Out-String)}
        shell: pwsh
