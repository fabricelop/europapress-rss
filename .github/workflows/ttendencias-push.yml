name: Avisar TTendencias ready

on:
  push:
    branches:
      - main
    paths:
      - "trends/prepared.json"
      - "trends/requests.json"

permissions:
  contents: read
  id-token: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener identidad OIDC de GitHub Actions
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Comprobar nuevos tuits listos
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" \
            "https://europapress-rss-git-ttendencias-release-fabricelopezillac-9660.vercel.app/api/ttendencias-control?view=push-scan&source=github"
