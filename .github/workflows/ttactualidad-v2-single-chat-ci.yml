name: TTActualidad V2 - ImageGen en el mismo chat (CI aislado)
on:
  push:
    branches: [feature/ttactualidad-v2-clean]
    paths:
      - 'v2/ttendencias/editorial_run_v2.py'
      - 'v2/ttendencias/image_intake_v2.py'
      - 'v2/ttendencias/image_job_v2.py'
      - 'v2/ttendencias/image_same_chat_v2.py'
      - 'v2/ttendencias/test_image_same_chat_v2.py'
      - '.github/workflows/ttactualidad-v2-single-chat-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation dependency
        run: python -m pip install --quiet Pillow
      - name: Compile isolated V2 implementation
        run: python -m py_compile v2/ttendencias/editorial_run_v2.py v2/ttendencias/image_intake_v2.py v2/ttendencias/image_job_v2.py v2/ttendencias/image_same_chat_v2.py
      - name: Verify one-chat flow and durable no-resend guard
        run: python -m unittest -v v2.ttendencias.test_image_same_chat_v2
