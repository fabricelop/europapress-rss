name: Aplicar borradores Radar TTendencias

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "trends/anticipation-outbox/**"
      - "trends/apply_anticipation_outbox.py"
      - ".github/workflows/ttendencias-anticipation-apply.yml"

permissions:
  contents: write

concurrency:
  group: ttendencias-anticipation-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Aplicar resultados Radar
        run: |
          set -euo pipefail
          git config user.name "ttendencias-radar"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch --depth=1 origin main
            git reset --hard origin/main

            apply_status=0
            python3 trends/apply_anticipation_outbox.py || apply_status=$?
            python3 trends/auto_queue_new.py

            git add trends/requests.json trends/anticipation-metrics.json trends/editorial-queue.json
            if git diff --cached --quiet; then
              exit "$apply_status"
            fi

            git commit -m "Aplicar borradores Radar TTendencias"
            if git push origin HEAD:main; then
              exit "$apply_status"
            fi

            echo "Main avanzó; reaplicando Radar sobre estado fresco ($attempt/4)."
            sleep $((attempt * 2))
          done

          echo "No se pudo persistir el Radar tras 4 intentos" >&2
          exit 1
