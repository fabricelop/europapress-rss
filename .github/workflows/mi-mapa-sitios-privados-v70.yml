name: "Mi Mapa Sitios Privados 1.0.70 - IPA iPhone"
on:
  push:
    branches:
      - feature/sitios-privados-gestion-v70
    paths:
      - 'gps-ios/native/Sources/**'
      - 'gps-ios/native/Tests/**'
      - 'gps-ios/native/project.yml'
      - '.github/workflows/mi-mapa-sitios-privados-v70.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mi-mapa-sitios-privados-v70
  cancel-in-progress: true
jobs:
  test-and-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: gps-ios/native
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxis y generar proyecto
        run: |
          set -euo pipefail
          swiftc -frontend -parse Sources/*.swift Shared/*.swift Live/*.swift Tests/*.swift
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 tools/make_icon.py
          xcodegen generate --spec project.yml
      - name: Pruebas en simulador iPhone
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          all=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))["devices"]
          phones=[d for rt,ds in all.items() if "iOS" in rt for d in ds if "iPhone" in d["name"] and d["state"]!="Unavailable"]
          assert phones
          open("/tmp/sites70-simulator","w").write(phones[0]["udid"])
          PY
          xcodebuild test -project MiMapaDelTiempo.xcodeproj -scheme MiMapaDelTiempo \
            -configuration Debug -destination "platform=iOS Simulator,id=$(cat /tmp/sites70-simulator)" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Compilar IPA sin firma y validar integridad
        run: |
          set -euo pipefail
          xcodebuild -project MiMapaDelTiempo.xcodeproj -scheme MiMapaDelTiempo \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/sitios70" CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/sitios70/Build/Products/Release-iphoneos/MiMapaDelTiempo.app"
          APP="$APP" python3 - <<'PY'
          import os,plistlib
          from pathlib import Path
          app=Path(os.environ["APP"])
          assert app.is_dir()
          info=plistlib.loads((app/"Info.plist").read_bytes())
          assert info["CFBundleIdentifier"]=="es.mimapadeltiempo.appprueba"
          assert info["CFBundleShortVersionString"]=="1.0.70"
          assert info["CFBundleVersion"]=="71"
          assert info["UISupportedInterfaceOrientations"]==["UIInterfaceOrientationPortrait"]
          assert (app/"PlugIns"/"MiMapaWidgets.appex").is_dir()
          PY
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -q -r MiMapaDelTiempo-Sitios-Privados-1.0.70.ipa Payload
          unzip -t MiMapaDelTiempo-Sitios-Privados-1.0.70.ipa >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MiMapaDelTiempo-Sitios-Privados-1.0.70-build71-unsigned
          path: gps-ios/native/MiMapaDelTiempo-Sitios-Privados-1.0.70.ipa
          retention-days: 14
          if-no-files-found: error
