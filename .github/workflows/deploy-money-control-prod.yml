name: Deploy Money Control Prod

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vercel-webhook/.money-control-prod-trigger"

permissions:
  contents: read

concurrency:
  group: money-control-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_H8xHbBIbIKnsaLeITszidyOK
      VERCEL_PROJECT_ID: prj_X1UxNqQasd8Ouf7jUpxNccbQdASf
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar favicon Money Control
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vercel-webhook/money-control/index.html','utf8');
          if(!html.includes('rel="icon"') || !html.includes('%E2%82%AC')) {
            throw new Error('Falta el favicon € de Money Control');
          }
          console.log('MONEY_CONTROL_FAVICON_VALIDATED');
          NODE

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Vincular proyecto
        run: |
          mkdir -p vercel-webhook/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > vercel-webhook/.vercel/project.json
          vercel pull --yes --environment=production --cwd vercel-webhook --token="$VERCEL_TOKEN"

      - name: Construir producción
        run: vercel build --prod --cwd vercel-webhook --token="$VERCEL_TOKEN"

      - name: Desplegar producción
        run: |
          vercel deploy --prebuilt --prod --cwd vercel-webhook --token="$VERCEL_TOKEN"

      - name: Verificar favicon público
        run: |
          for i in {1..20}; do
            HTML="$(curl -fsS https://europapress-rss.vercel.app/money-control/ || true)"
            if printf '%s' "$HTML" | grep -q 'rel="icon"' && printf '%s' "$HTML" | grep -q '%E2%82%AC'; then
              echo MONEY_CONTROL_FAVICON_LIVE
              exit 0
            fi
            sleep 3
          done
          echo "El favicon no aparece aún en producción" >&2
          exit 1
