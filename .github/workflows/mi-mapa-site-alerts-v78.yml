name: "Mi Mapa Sitios: avisos interactivos v78 - iPhone"
on:
  push:
    branches:
      - feature/mimapa-site-notifications-v78
    paths:
      - 'gps-ios/native/Sources/**'
      - 'gps-ios/native/Tests/**'
      - 'gps-ios/native/project.yml'
      - '.github/workflows/mi-mapa-site-alerts-v78.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mimapa-site-alerts-v78
  cancel-in-progress: true
jobs:
  test-and-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: gps-ios/native
    steps:
      - uses: actions/checkout@v4
      - name: Parseo Swift y XcodeGen
        run: |
          set -euo pipefail
          swiftc -frontend -parse Sources/*.swift Shared/*.swift Live/*.swift Tests/*.swift
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 tools/make_icon.py
          xcodegen generate --spec project.yml
      - name: Pruebas iOS simulador
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          obj=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          phones=[d for rt,ds in obj["devices"].items() if "iOS" in rt
                    for d in ds if "iPhone" in d["name"] and d["state"]!="Unavailable"]
          assert phones,"No iOS simulator"
          open("/tmp/mimapa-v78-udid","w").write(phones[0]["udid"])
          PY
          xcodebuild test -project MiMapaDelTiempo.xcodeproj -scheme MiMapaDelTiempo \
            -configuration Debug -destination "platform=iOS Simulator,id=$(cat /tmp/mimapa-v78-udid)" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Generar IPA iPhone sin firma
        run: |
          set -euo pipefail
          xcodebuild -project MiMapaDelTiempo.xcodeproj -scheme MiMapaDelTiempo \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/mimapa-site-v78" CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/mimapa-site-v78/Build/Products/Release-iphoneos/MiMapaDelTiempo.app"
          APP="$APP" python3 - <<'PY'
          import os,plistlib
          from pathlib import Path
          app=Path(os.environ["APP"]);assert app.is_dir()
          info=plistlib.loads((app/"Info.plist").read_bytes())
          assert info["CFBundleIdentifier"]=="es.mimapadeltiempo.appprueba"
          assert info["CFBundleShortVersionString"]=="1.0.78"
          assert info["CFBundleVersion"]=="79"
          assert info["UISupportedInterfaceOrientations"]==["UIInterfaceOrientationPortrait"]
          assert (app/"PlugIns"/"MiMapaWidgets.appex").is_dir()
          assert "mimapadeltiempoprueba" in str(info["CFBundleURLTypes"])
          PY
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -q -r MiMapaDelTiempo-Sitios-Alertas-1.0.78.ipa Payload
          unzip -t MiMapaDelTiempo-Sitios-Alertas-1.0.78.ipa >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MiMapaDelTiempo-Sitios-Alertas-1.0.78-build79-unsigned
          path: gps-ios/native/MiMapaDelTiempo-Sitios-Alertas-1.0.78.ipa
          retention-days: 14
          if-no-files-found: error
