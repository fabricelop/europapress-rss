name: Probar borrado webhook Telegram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-telegram-delete.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probar borrado directo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request, urllib.error
          token=os.environ["TELEGRAM_BOT_TOKEN"]; chat=os.environ["TELEGRAM_CHAT_ID"]
          base=f"https://api.telegram.org/bot{token}"
          def post(url,payload):
              req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return r.status,r.read().decode()
              except urllib.error.HTTPError as e:return e.code,e.read().decode()
          st,body=post(base+"/sendMessage",{"chat_id":chat,"text":"Prueba técnica temporal TT Control"})
          msg=json.loads(body); mid=msg["result"]["message_id"]
          print("sent",mid)
          st,body=post("https://tt-control.fabricelop.workers.dev/api/telegram-webhook",{"callback_query":{"id":"technical-test","data":"dg:"+str(mid),"message":{"message_id":mid,"chat":{"id":int(chat)}}}})
          print("worker",st,body)
          st2,body2=post(base+"/deleteMessage",{"chat_id":chat,"message_id":mid})
          print("second_delete",st2,body2)
          if st!=200: raise SystemExit("Worker webhook failed")
          if st2==200: raise SystemExit("Worker did not delete test message")
          if "message to delete not found" not in body2.lower(): raise SystemExit("Unexpected second delete result: "+body2)
          print("DELETE_VERIFIED")
          PY
