name: Actualizar Top 30 y cola editorial TTendencias

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: [main]
    paths:
      - "trends/refresh-trigger.txt"
      - "trends/auto_queue_new.py"
      - "trends/ensure_pc_editorial.py"
      - "trends/test_ensure_pc_editorial.py"
      - "trends/anticipation.py"
      - "trends/test_anticipation.py"
      - "trends/update_trends.py"
      - "trends/rank_movement.py"
      - "tests/test_site_top30_movement.py"
      - "tests/test_getdaytrends_spain_current.py"
      - ".github/scripts/test_ttendencias_top30_queue.py"
      - ".github/scripts/test_ttendencias_anchor_freshness.py"
      - ".github/scripts/test_ttendencias_radar_source_diversity.py"
      - ".github/scripts/test_ttendencias_radar_history.py"
      - ".github/workflows/ttendencias-refresh.yml"

permissions:
  contents: write
  actions: write
  issues: read

concurrency:
  group: ttendencias-refresh-quarter-hour
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Tracked Python cache files otherwise change during preflight and
      # conflict on git pull/rebase (observed 7 Nov 2026 at 22:59 UTC).
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar selección de fuentes frescas del Top 10
        run: python3 .github/scripts/test_ttendencias_anchor_freshness.py

      - name: Verificar consenso diverso frente a fuentes duplicadas
        run: python3 .github/scripts/test_ttendencias_radar_source_diversity.py

      - name: Verificar radar emergente y continuidad de observaciones
        run: python3 .github/scripts/test_ttendencias_radar_history.py

      - name: Verificar Top 30 automático y protección de estados vigentes
        run: python3 .github/scripts/test_ttendencias_top30_queue.py

      - name: Verificar preparación anticipada limitada y captura paralela
        run: python3 -m unittest discover -s trends -p 'test_anticipation.py' -v

      - name: Verificar movimientos persistentes del Top 30
        run: python3 -m unittest discover -s tests -p 'test_site_top30_movement.py' -v

      - name: Verificar 30 tendencias reales y relleno España
        run: python3 -m unittest discover -s tests -p 'test_getdaytrends_spain_current.py' -v

      - name: Comprobar inicio editorial inmediato e idempotente
        run: python3 -m unittest trends.test_ensure_pc_editorial -v

      - name: Actualizar Top 30 y cola web
        run: |
          git config user.name "ttendencias-bot"
          git config user.email "actions@users.noreply.github.com"
          # Discard only generated binary cache changes, never editorial JSON.
          git restore --worktree --staged -- trends/__pycache__/suppression.cpython-312.pyc 2>/dev/null || true
          git pull --rebase --autostash origin main
          cp trends/editorial-queue.json /tmp/tt-queue-before.json 2>/dev/null || printf '{"items":[]}\n' >/tmp/tt-queue-before.json

          python3 trends/update_trends.py
          python3 trends/auto_queue_new.py
          # GITHUB_TOKEN pushes do NOT fire another push workflow. Publish
          # Site Top30 in the SAME commit as the iPhone radar snapshot.
          python3 -m unittest discover -s tests -p 'test_site_top30_export.py' -q
          python3 trends/export_site_top30.py

          python3 - <<'PY'
          import json
          from pathlib import Path
          def load(p):
              try: return json.loads(Path(p).read_text(encoding="utf-8"))
              except Exception: return {"items":[]}
          before=load("/tmp/tt-queue-before.json")
          after=load("trends/editorial-queue.json")
          def keys(doc):
              return {(str(x.get("id") or ""),int(x.get("revision") or 0))
                      for x in doc.get("items",[])
                      if str(x.get("status") or "") in {"preparing","update","problematic"}}
          new=sorted(keys(after)-keys(before))
          Path("/tmp/tt-new-explanations.json").write_text(json.dumps(new),encoding="utf-8")
          print("Nuevas explicaciones pendientes:",new)
          PY


          echo "TTActualidad: actualización editorial web, sin sincronización Telegram"

          git add trends/recent.json trends/checkpoint.json trends/requests.json trends/editorial-queue.json trends/telegram-manual-explained.json trends/anticipation-metrics.json trends/site-top30-current.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Actualizar Top 30 TTendencias"
          # Otras pasadas escriben en main varias veces por minuto. Un
          # rechazo de push no debe perder las nuevas pendientes.
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase --autostash origin main || {
              git rebase --abort || true
              echo "TTENDENCIAS_REFRESH_REBASE_FAILED" >&2
              exit 1
            }
            if git push origin HEAD:main; then
              echo "TTENDENCIAS_REFRESH_PERSISTED"
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "TTENDENCIAS_REFRESH_PUSH_CONFLICT" >&2
              exit 1
            fi
            sleep "$attempt"
          done

          # Toda pendiente del Top 30 entra automáticamente en elaboración.
          # Los cierres, explicaciones vigentes y revisiones siguen protegidos.

      - name: Despertar editor de pendientes TTendencias persistidas
        # A control-channel outage must not stop RSS/news/radar persistence.
        # The durable watchdog retains the recovery responsibility.
        continue-on-error: true
        # Recheck all pending work, including rows queued by the other radar.
        # The shared guard preserves active runs and recent control commands.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trends/ensure_pc_editorial.py

      # El panel Cloudflare consulta directamente el estado versionado en GitHub.
      # Sin notificaciones push heredadas ni peticiones a Vercel.

      - name: Comprobar salud TTendencias
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 trends/healthcheck.py

      - name: Guardar estado de salud
        if: always()
        run: |
          git config user.name "ttendencias-health"
          git config user.email "actions@users.noreply.github.com"

          # El repositorio recibe muchas escrituras concurrentes desde la web y
          # otros workflows. Rebasar y reintentar evita que health-status quede
          # congelado durante horas por una carrera de push.
          git pull --rebase --autostash origin main || true
          git add trends/health-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar salud TTendencias"

          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push health-status falló (intento $attempt); rebasando y reintentando"
            git pull --rebase origin main || {
              git rebase --abort || true
              exit 1
            }
            sleep $((attempt * 2))
          done

          echo "No se pudo persistir health-status tras 4 intentos" >&2
          exit 1

