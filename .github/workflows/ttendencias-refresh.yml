name: Actualizar Top 10 TTendencias

on:
  workflow_dispatch:
  schedule:
    - cron: '5,20,35,50 * * * *'
  push:
    branches: [main]
    paths:
      - "trends/refresh-trigger.txt"

permissions:
  contents: write
  actions: write

concurrency:
  group: ttendencias-refresh-quarter-hour
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar Top 10 y cola web
        run: |
          git config user.name "ttendencias-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main

          python3 trends/update_trends.py
          python3 trends/auto_queue_new.py

          MODE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(str(json.loads(Path("trends/control-mode.json").read_text(encoding="utf-8")).get("mode") or "telegram").strip().lower())
          except Exception:
              print("telegram")
          PY
          )"
          echo "Modo TTendencias: $MODE"

          if [ "$MODE" != "web" ]; then
            python3 trends/telegram_bot.py sync
            git add trends/telegram-bot-state.json
          else
            echo "Control web activo: no se sincroniza el panel Telegram"
          fi

          git add trends/recent.json trends/checkpoint.json trends/requests.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Actualizar Top 10 TTendencias"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Comprobar salud TTendencias
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
        run: python3 trends/healthcheck.py

      - name: Guardar estado de salud
        if: always()
        run: |
          git config user.name "ttendencias-health"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add trends/health-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar salud TTendencias"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
