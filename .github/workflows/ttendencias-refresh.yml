name: Actualizar Top 10 TTendencias

on:
  workflow_dispatch:
  schedule:
    - cron: '0,15,30,45 * * * *'

permissions:
  contents: write

concurrency:
  group: ttendencias-refresh-quarter-hour
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar Top 10 y panel
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
        run: |
          git config user.name "ttendencias-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main

          python3 trends/update_trends.py
          python3 trends/telegram_bot.py sync

          git add trends/recent.json trends/checkpoint.json trends/telegram-bot-state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Actualizar Top 10 TTendencias"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
