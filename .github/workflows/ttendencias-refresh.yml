name: Actualizar Top 10 TTendencias

on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
  push:
    branches: [main]
    paths:
      - "trends/refresh-trigger.txt"

permissions:
  contents: write
  actions: write

concurrency:
  group: ttendencias-refresh-quarter-hour
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar Top 10 y panel
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
        run: |
          git config user.name "ttendencias-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main

          python3 trends/update_trends.py

          MODE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(str(json.loads(Path("trends/control-mode.json").read_text(encoding="utf-8")).get("mode") or "telegram").strip().lower())
          except Exception:
              print("telegram")
          PY
          )"
          echo "Modo TTendencias: $MODE"

          if [ "$MODE" != "web" ]; then
            python3 trends/telegram_bot.py sync
            git add trends/telegram-bot-state.json
          else
            echo "Control web activo: no se sincroniza el panel Telegram"
          fi

          git add trends/recent.json trends/checkpoint.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Actualizar Top 10 TTendencias"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Notificar nuevas tendencias en modo web
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          try:
              mode = str(json.loads(Path("trends/control-mode.json").read_text(encoding="utf-8")).get("mode") or "telegram").strip().lower()
          except Exception:
              mode = "telegram"
          if mode != "web":
              raise SystemExit(0)

          recent = json.loads(Path("trends/recent.json").read_text(encoding="utf-8"))
          new_entries = [str(x).strip() for x in recent.get("new_entries", []) if str(x).strip()]
          if not new_entries:
              print("Sin nuevas tendencias que notificar")
              raise SystemExit(0)

          state = json.loads(Path("trends/telegram-bot-state.json").read_text(encoding="utf-8"))
          chat_id = state.get("chat_id")
          token = os.environ.get("TTENDENCIAS_BOT_TOKEN")
          if not chat_id or not token:
              print("Telegram no enlazado para notificaciones")
              raise SystemExit(0)

          text = "🟣 TTendencias · nuevas tendencias\n" + "\n".join(f"• {x}" for x in new_entries) + "\n\nGestiónalas desde la aplicación web."
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps({"chat_id": chat_id, "text": text}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              result = json.loads(r.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError(result)
          print("Notificación de nuevas tendencias enviada")
          PY

      - name: Comprobar salud TTendencias
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
        run: python3 trends/healthcheck.py

      - name: Guardar estado de salud
        if: always()
        run: |
          git config user.name "ttendencias-health"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add trends/health-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar salud TTendencias"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
