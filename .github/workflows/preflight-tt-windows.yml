name: Preflight TT Windows

on:
  push:
    branches: [main]
    paths:
      - "windows/TTiTTularesDedicatedListener.ps1"
      - "windows/TTendenciasDedicatedListener.ps1"
      - "windows/TT-AutoUpdater.ps1"
      - "windows/TT-LocalWatchdog.ps1"
      - "windows/Install-TT-RestartSafe.ps1"
      - "windows/TTiTTularesImageBridge.js"
      - "windows/TTendenciasImageBridge.js"
      - ".github/workflows/preflight-tt-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "windows/TTiTTularesDedicatedListener.ps1"
      - "windows/TTendenciasDedicatedListener.ps1"
      - ".github/workflows/preflight-tt-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            "windows/TTiTTularesDedicatedListener.ps1",
            "windows/TTendenciasDedicatedListener.ps1",
            "windows/TT-AutoUpdater.ps1",
            "windows/TT-LocalWatchdog.ps1",
            "windows/Install-TT-RestartSafe.ps1"
          )
          foreach ($p in $files) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p), [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Host "::error file=$p::$($_.Message)" }
              throw "PowerShell syntax error: $p"
            }
            Write-Host "OK $p"
          }

      - name: Check Node bridges
        shell: pwsh
        run: |
          node --check windows/TTiTTularesImageBridge.js
          if ($LASTEXITCODE -ne 0) { throw "TTiTTularesImageBridge.js inválido" }
          node --check windows/TTendenciasImageBridge.js
          if ($LASTEXITCODE -ne 0) { throw "TTendenciasImageBridge.js inválido" }

      - name: Smoke Git control branches and RAW triggers (read-only)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "https://github.com/fabricelop/europapress-rss.git"
          $controls = @(
            @{ Name="TTiTTulares"; Branch="control/ttittulares-run-trigger-v2"; File="ttittulares/run-now-trigger.json"; Project="ttittulares" },
            @{ Name="TTendencias"; Branch="control/ttendencias-run-trigger"; File="trends/run-now-trigger.json"; Project="ttendencias" }
          )
          foreach ($c in $controls) {
            $line = git ls-remote $repo ("refs/heads/" + $c.Branch)
            if ($LASTEXITCODE -ne 0 -or -not $line) { throw "$($c.Name): no se pudo resolver la rama por git" }
            $sha = ($line | Select-Object -First 1) -split "\s+" | Select-Object -First 1
            if ($sha -notmatch "^[0-9a-fA-F]{40}$") { throw "$($c.Name): SHA incorrecto" }
            $url = "https://raw.githubusercontent.com/fabricelop/europapress-rss/$sha/$($c.File)"
            $data = Invoke-RestMethod -Uri $url -TimeoutSec 20
            if (-not $data.command_id -or $data.project -ne $c.Project) { throw "$($c.Name): RAW trigger inválido" }
            Write-Host "OK $($c.Name): Git SHA + RAW command_id comprobados"
          }

      - name: Guard shared anonymous GitHub quota
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @("windows/TTiTTularesDedicatedListener.ps1", "windows/TTendenciasDedicatedListener.ps1")) {
            $code = Get-Content -LiteralPath $path -Raw
            foreach ($required in @("git ls-remote", "Get-ControlRawUrl", "ControlHeadApiRetryAt", "AddMinutes(15)")) {
              if (-not $code.Contains($required)) { throw "$path no contiene $required" }
            }
          }
          $tr = Get-Content "windows/TTendenciasDedicatedListener.ps1" -Raw
          if ($tr.Contains('api.github.com/repos/fabricelop/europapress-rss/contents/trends/run-now-trigger.json')) {
            throw "TTendencias sigue haciendo polling directo sin autenticar"
          }
          Write-Host "OK: ambos listeners tienen fallback Git/RAW y limitan REST"

      - name: Test TTendencias editorial retry state on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content "windows/TTendenciasDedicatedListener.ps1" -Raw
          $tokens=$null; $errs=$null
          $ast=[Management.Automation.Language.Parser]::ParseInput($src,[ref]$tokens,[ref]$errs)
          if($errs.Count){ throw "TTendencias syntax error" }
          $needed=@("Write-Log","Save-State","Ensure-StateFields","Test-EditorialRetryBackoff","Set-EditorialRetryBackoff")
          foreach($n in $needed){
            $fn=$ast.FindAll({param($node) $node -is [Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $n},$true)|Select-Object -First 1
            if(-not $fn){throw "Missing function $n"}
            Invoke-Expression $fn.Extent.Text
          }
          $StatePath=Join-Path $env:RUNNER_TEMP "ttendencias-state-test.json"
          $LogPath=Join-Path $env:RUNNER_TEMP "ttendencias-listener-test.log"
          $EditorialRetryBackoffMinutes=10
          $state=[pscustomobject]@{last_command_id=""}
          Ensure-StateFields $state
          foreach($p in @("image_commands","active_image_commands","editorial_retry_after","editorial_retry_command_id")){
            if(-not ($state.PSObject.Properties.Name -contains $p)){throw "Missing migrated state field $p"}
          }
          if(Test-EditorialRetryBackoff $state "test-id"){throw "Unexpected initial backoff"}
          Set-EditorialRetryBackoff $state "test-id"
          if(-not (Test-EditorialRetryBackoff $state "test-id")){throw "Backoff not active"}
          if(Test-EditorialRetryBackoff $state "next-command"){throw "New command must not be blocked"}
          $state2=Get-Content $StatePath -Raw | ConvertFrom-Json
          if(-not (Test-EditorialRetryBackoff $state2 "test-id")){throw "Backoff did not survive reload"}
          $state2.active_image_commands=@("img-test")
          Ensure-StateFields $state2
          if(@($state2.active_image_commands).Count -ne 1){throw "Images active state lost"}
          Write-Host "OK: migrated image state and durable per-command retry cooldown"
