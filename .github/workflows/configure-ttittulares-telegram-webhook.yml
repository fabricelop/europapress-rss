name: Configurar webhook Telegram TTiTTulares

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-ttittulares-telegram-webhook.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar webhook en Worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "Falta TELEGRAM_BOT_TOKEN" >&2
            exit 2
          fi
          if [ -z "${TELEGRAM_WEBHOOK_SECRET:-}" ]; then
            echo "Falta TELEGRAM_WEBHOOK_SECRET" >&2
            exit 3
          fi
          RESP=$(curl --fail --silent --show-error             -X POST             "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook"             --data-urlencode "url=https://tt-control.fabricelop.workers.dev/api/telegram-webhook"             --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}"             --data-urlencode 'allowed_updates=["callback_query","message"]')
          echo "$RESP"
          curl --fail --silent --show-error             "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo"             -o /tmp/webhook.json
          python3 - <<'PY'
          import json, pathlib, datetime
          w=json.load(open('/tmp/webhook.json',encoding='utf-8'))
          r=w.get('result') or {}
          out={
            "checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z"),
            "webhook":{
              "url":r.get("url"),
              "pending_update_count":r.get("pending_update_count"),
              "last_error_date":r.get("last_error_date"),
              "last_error_message":r.get("last_error_message"),
              "max_connections":r.get("max_connections"),
              "ip_address":r.get("ip_address")
            }
          }
          pathlib.Path("telegram/webhook-config-result.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY

      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram/webhook-config-result.json
          git commit -m "Registrar configuración webhook Telegram"
          git pull --rebase origin main
          git push origin HEAD:main
