name: "Mi Mapa Live BIOGRID v73 - IPA rápida"
on:
  push:
    branches: [feature/live-biogrid-reloj-colores-v73]
    paths: ['.github/workflows/mi-mapa-live-biogrid-v73-quick.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gps-ios/native
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis y paquete iPhone
        run: |
          set -euo pipefail
          swiftc -frontend -parse Sources/*.swift Shared/*.swift Live/*.swift Tests/*.swift
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 tools/make_icon.py
          xcodegen generate --spec project.yml
          xcodebuild -project MiMapaDelTiempo.xcodeproj -scheme MiMapaDelTiempo \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/livebio73" CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/livebio73/Build/Products/Release-iphoneos/MiMapaDelTiempo.app"
          APP="$APP" python3 - <<'PY'
          import os,plistlib
          from pathlib import Path
          app=Path(os.environ["APP"]);assert app.is_dir()
          info=plistlib.loads((app/"Info.plist").read_bytes())
          assert info["CFBundleIdentifier"]=="es.mimapadeltiempo.appprueba"
          assert info["CFBundleShortVersionString"]=="1.0.73"
          assert info["CFBundleVersion"]=="74"
          assert info["UISupportedInterfaceOrientations"]==["UIInterfaceOrientationPortrait"]
          assert (app/"PlugIns"/"MiMapaWidgets.appex").is_dir()
          PY
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -q -r MiMapaDelTiempo-Live-BIOGRID-1.0.73.ipa Payload
          unzip -t MiMapaDelTiempo-Live-BIOGRID-1.0.73.ipa >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MiMapaDelTiempo-Live-BIOGRID-1.0.73-build74-quick-unsigned
          path: gps-ios/native/MiMapaDelTiempo-Live-BIOGRID-1.0.73.ipa
          retention-days: 14
          if-no-files-found: error

