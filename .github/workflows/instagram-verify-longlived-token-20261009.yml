name: Instagram - verificar token Meta de larga duración (solo lectura)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instagram-verify-longlived-token-20261009.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Diagnosticar botón Telegram Trump sin publicar ni modificar estado
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          INSTAGRAM_INTERNAL_SECRET: ${{ secrets.INSTAGRAM_INTERNAL_SECRET }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,datetime
          def get(url,timeout=20):
              req=urllib.request.Request(url,headers={"user-agent":"TTActualidad-TrumpReadOnly/1.0","accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,r.read(12*1024*1024)
              except urllib.error.HTTPError as e:return e.code,e.read(16384)
              except Exception as e:return 0,str(type(e).__name__).encode()
          prefix="https://raw.githubusercontent.com/fabricelop/europapress-rss/main/"
          code,raw=get(prefix+"telegram/ttittulares-deliveries.json")
          if code==200:
              doc=json.loads(raw)
              matches=[x for x in doc.get("items",[]) if x.get("event_id")=="2dd09208e418"]
              print("TRUMP_DELIVERY",json.dumps([{"message_id":x.get("telegram_message_id"),"status":x.get("status"),"has_instagram_snapshot":bool((x.get("instagram") or {}).get("image_url")),"caption_valid":bool((x.get("instagram") or {}).get("caption"))} for x in matches],ensure_ascii=False))
          else:print("TRUMP_DELIVERY_READ_FAILED",code)
          for label,url in (
              ("telegram_gateway","https://tt-control.fabricelop.workers.dev/api/ttittulares-webhook-version"),
              ("telegram_gateway_callback","https://tt-control.fabricelop.workers.dev/api/ttittulares-telegram-callback"),
              ("ttittulares_instagram_route","https://ttittulares-no-vercel-test.fabricelop.workers.dev/api/ttittulares-instagram-route-version"),
              ("ttittulares_callback_credential","https://ttittulares-no-vercel-test.fabricelop.workers.dev/api/ttittulares-telegram-credential-ready"),
              ("instagram_publisher","https://tt-actualidad-instagram-pilot.fabricelop.workers.dev/health")
          ):
              status,body=get(url)
              try:
                  response=json.loads(body)
                  public={k:response.get(k) for k in ("ok","version","status","active","telegram_callback_credential_ready","service","error") if k in response}
              except Exception:public={"json":False,"body_bytes":len(body)}
              print("TRUMP_ROUTE",label,status,json.dumps(public,ensure_ascii=False),flush=True)
          token=os.environ.get("TELEGRAM_BOT_TOKEN","")
          if token:
              status,body=get("https://api.telegram.org/bot"+token+"/getWebhookInfo")
              try:
                  data=(json.loads(body).get("result") or {})
                  fields={k:data.get(k) for k in ("url","pending_update_count","last_error_date","last_error_message") if k in data}
                  print("TRUMP_WEBHOOK_INFO",status,json.dumps(fields,ensure_ascii=False))
              except Exception:print("TRUMP_WEBHOOK_INFO_FAILED",status)
          else:print("TRUMP_WEBHOOK_TOKEN_MISSING")
          account=os.environ.get("CF_ACCOUNT_ID","")
          token=os.environ.get("CF_API_TOKEN","")
          if account and token:
              db="4eacd44c-212c-4a49-a907-fbbf561b969f"
              endpoint="https://api.cloudflare.com/client/v4/accounts/"+account+"/d1/database/"+db+"/query"
              payload=json.dumps({"sql":"SELECT state,media_id,permalink,container_id,updated_at FROM instagram_posts WHERE id = ? LIMIT 1","params":["ttittulares:2dd09208e418"]}).encode()
              req=urllib.request.Request(endpoint,method="POST",data=payload,headers={"Authorization":"Bearer "+token,"Content-Type":"application/json","User-Agent":"TTActualidad-ReadOnlyD1"})
              try:
                  with urllib.request.urlopen(req,timeout=25) as res:code=res.status;body=res.read(65536)
              except urllib.error.HTTPError as err:code=err.code;body=err.read(65536)
              except Exception as err:code=0;body=b""
              try:
                  data=json.loads(body)
                  rows=(data.get("result") or [{}])[0].get("results") or []
                  # Only state, media id and permalink; never credentials or captions.
                  print("TRUMP_D1",code,json.dumps({"success":data.get("success"),"row":rows[0] if rows else None},ensure_ascii=False))
              except Exception:print("TRUMP_D1_QUERY_FAILED",code)
          else:print("TRUMP_D1_NOT_AVAILABLE_NO_CLOUDFLARE_ACTION_SECRETS")
          print("TRUMP_AUDIT_READ_ONLY_COMPLETE")
          PY

      - name: Validar autenticación de botón Instagram TTiTTulares y chat de Telegram
        env:
          INSTAGRAM_INTERNAL_SECRET: ${{ secrets.INSTAGRAM_INTERNAL_SECRET }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse
          base="https://ttittulares-no-vercel-test.fabricelop.workers.dev"
          secret=os.environ.get("INSTAGRAM_INTERNAL_SECRET","")
          chat=os.environ.get("TELEGRAM_CHAT_ID","")
          if len(secret)<32:raise SystemExit("INSTAGRAM_INTERNAL_SECRET_MISSING")
          url=base+"/api/ttittulares-instagram-preflight"
          if chat:url+="?"+urllib.parse.urlencode({"chat_id":chat})
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+secret,
            "User-Agent":"TTActualidad-TTiRouteReadOnly/1.0"})
          try:
              with urllib.request.urlopen(req,timeout=28) as response:
                  code=response.status;data=json.loads(response.read(20000))
          except urllib.error.HTTPError as error:
              code=error.code
              try:data=json.loads(error.read(20000))
              except Exception:data={}
          result={k:data.get(k) for k in ("ok","error","publisher_authenticated","publisher_http",
           "publisher_url_valid","allowed_chat_configured","chat_matches","github_configured",
           "telegram_bot_configured") if k in data}
          print("TRUMP_TTI_INSTAGRAM_PREFLIGHT http",code,json.dumps(result,ensure_ascii=False),flush=True)
          if code!=200:raise SystemExit("TTI_INSTAGRAM_PREFLIGHT_UNAVAILABLE_OR_SECRET_MISMATCH")
          PY

      - name: Consultar estado D1 Instagram Trump sin publicar ni reconciliar
        env:
          INSTAGRAM_INTERNAL_SECRET: ${{ secrets.INSTAGRAM_INTERNAL_SECRET }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          base="https://tt-actualidad-instagram-pilot.fabricelop.workers.dev"
          token=os.environ.get("INSTAGRAM_INTERNAL_SECRET","")
          if len(token)<32:raise SystemExit("MISSING_AUTH_TOKEN")
          url=base+"/publication-status?source=ttittulares&event_id=2dd09208e418"
          req=urllib.request.Request(url,headers={"authorization":"Bearer "+token,
            "user-agent":"TTActualidad-ReadOnlyTrumpStatus/1.0"})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  code=response.status; data=json.loads(response.read(20000))
          except urllib.error.HTTPError as err:
              code=err.code;data=json.loads(err.read(20000))
          result={k:data.get(k) for k in ("ok","source","event_id","found","state","media_id","permalink","container_id","updated_at","error") if k in data}
          print("TRUMP_PUBLISH_STATUS http",code,json.dumps(result,ensure_ascii=False),flush=True)
          if code!=200:raise SystemExit("TRUMP_PUBLISH_STATUS_READ_FAILED")
          PY

      - name: Validar Worker, Meta, Instagram y D1 sin publicar
        env:
          INSTAGRAM_INTERNAL_SECRET: ${{ secrets.INSTAGRAM_INTERNAL_SECRET }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          base="https://tt-actualidad-instagram-pilot.fabricelop.workers.dev"
          secret=os.environ.get("INSTAGRAM_INTERNAL_SECRET","")
          if len(secret)<32:
              raise SystemExit("TOKEN_CHECK_MISSING_GITHUB_SECRET")
          for name,path,auth in (("health","/health",False),("meta_preflight","/meta-preflight",True)):
              headers={"user-agent":"TTActualidad-TokenVerification/1.0"}
              if auth: headers["authorization"]="Bearer "+secret
              req=urllib.request.Request(base+path,headers=headers,method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      code=response.status
                      data=json.loads(response.read(16000))
              except urllib.error.HTTPError as error:
                  code=error.code
                  try:data=json.loads(error.read(16000))
                  except ValueError:data={}
              except Exception as error:
                  print("TOKEN_CHECK_NETWORK_FAILURE",name,type(error).__name__,flush=True)
                  raise SystemExit(1)
              fields={k:data.get(k) for k in (
                "ok","active","read_only","service","page_token_matches_expected_page",
                "instagram_account_linked","instagram_username_matches","schema_ready",
                "error","meta_check","meta_http_status","meta_error_code","meta_error_subcode"
              ) if k in data}
              print("TOKEN_CHECK",name,"http",code,json.dumps(fields,ensure_ascii=False),flush=True)
              if code!=200: raise SystemExit("TOKEN_CHECK_FAILED_"+name)
              if name=="health" and (data.get("active") is not True or data.get("service")!="tt-actualidad-instagram"):
                  raise SystemExit("TOKEN_CHECK_HEALTH_INVALID")
              if name=="meta_preflight":
                  if not all(data.get(k) is True for k in (
                    "ok","read_only","active","page_token_matches_expected_page",
                    "instagram_account_linked","instagram_username_matches","schema_ready")):
                      raise SystemExit("TOKEN_CHECK_PREFLIGHT_INVALID")
          print("TOKEN_META_LARGA_DURACION_VERIFICADO_EN_PRODUCCION",flush=True)
          PY

# Confirm live TTiTTulares-to-Instagram Cloudflare service binding (read-only).
