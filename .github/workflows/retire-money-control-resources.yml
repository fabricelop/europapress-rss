name: Retire Money Control resources

on:
  push:
    branches: [main]
    paths:
      - ".retire-money-control-trigger"

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_H8xHbBIbIKnsaLeITszidyOK
      VERCEL_PROJECT_ID: prj_X1UxNqQasd8Ouf7jUpxNccbQdASf
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Delete old TT backup branches
        shell: bash
        run: |
          set -euo pipefail
          for b in BackupTtendencias20261005 BackupTtittulares20261005 TTendenciasBACKUP01; do
            if git ls-remote --exit-code --heads origin "$b" >/dev/null 2>&1; then
              git push origin --delete "$b"
            fi
          done

      - name: Remove MoneyWiz-only environment variables
        shell: bash
        run: |
          set -euo pipefail
          delete_env () {
            local id="$1"
            local out code
            out="$(mktemp)"
            code="$(curl -sS -o "$out" -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$id?teamId=$VERCEL_ORG_ID")"
            if [ "$code" = "200" ] || [ "$code" = "204" ] || [ "$code" = "404" ]; then
              echo "Environment variable $id removed/already absent (HTTP $code)"
            else
              echo "Failed to delete env $id (HTTP $code)" >&2
              cat "$out" >&2
              exit 1
            fi
            rm -f "$out"
          }
          delete_env 6yufApLbsC2xqerB
          delete_env vIynN8hNhna6nZ7K

      - name: Install Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g vercel@latest

      - name: Delete dedicated MoneyWiz Blob store
        shell: bash
        run: |
          set -euo pipefail
          # The store is dedicated to Money Control/MoneyWiz (1 object, ~59 MB)
          # and is connected only to europapress-rss.
          printf 'y\n' | script -qefc "vercel blob delete-store store_lUkOIpD97OzOjLef --token='$VERCEL_TOKEN'" /dev/null
