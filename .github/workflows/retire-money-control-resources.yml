name: Retire Money Control resources

on:
  push:
    branches: [main]
    paths:
      - ".retire-money-control-trigger"

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: team_H8xHbBIbIKnsaLeITszidyOK
      VERCEL_PROJECT_ID: prj_X1UxNqQasd8Ouf7jUpxNccbQdASf
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      MONEYWIZ_STORE_ID: store_lUkOIpD97OzOjLef
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete old TT backup branches
        shell: bash
        run: |
          set -euo pipefail
          for b in BackupTtendencias20261005 BackupTtittulares20261005 TTendenciasBACKUP01; do
            if git ls-remote --exit-code --heads origin "$b" >/dev/null 2>&1; then
              git push origin --delete "$b"
            fi
          done

      - name: Remove MoneyWiz-only environment variables
        shell: bash
        run: |
          set -euo pipefail
          delete_env () {
            local id="$1"
            local out code
            out="$(mktemp)"
            code="$(curl -sS -o "$out" -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$id?teamId=$VERCEL_ORG_ID")"
            case "$code" in
              200|204|404) echo "Environment variable $id removed/already absent (HTTP $code)" ;;
              *) echo "Failed to delete env $id (HTTP $code)" >&2; cat "$out" >&2; exit 1 ;;
            esac
            rm -f "$out"
          }
          delete_env 6yufApLbsC2xqerB
          delete_env vIynN8hNhna6nZ7K

      - name: Disconnect dedicated MoneyWiz Blob store
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp)"
          code="$(curl -sS -o "$out" -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/storage/stores/$MONEYWIZ_STORE_ID/connections?teamId=$VERCEL_ORG_ID")"
          case "$code" in
            200|204|404) echo "MoneyWiz Blob connections removed/already absent (HTTP $code)" ;;
            *) echo "Failed to disconnect MoneyWiz Blob store (HTTP $code)" >&2; cat "$out" >&2; exit 1 ;;
          esac
          rm -f "$out"

      - name: Delete dedicated MoneyWiz Blob store
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp)"
          code="$(curl -sS -o "$out" -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/storage/stores/blob/$MONEYWIZ_STORE_ID?teamId=$VERCEL_ORG_ID")"
          case "$code" in
            200|204|404) echo "MoneyWiz Blob store deleted/already absent (HTTP $code)" ;;
            *) echo "Failed to delete MoneyWiz Blob store (HTTP $code)" >&2; cat "$out" >&2; exit 1 ;;
          esac
          rm -f "$out"
