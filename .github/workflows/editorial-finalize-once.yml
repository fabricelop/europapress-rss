name: Finalizar cola editorial TTiTTulares

on:
  workflow_dispatch:
  schedule:
    - cron: "15,45 * * * *"
  push:
    branches: [main]
    paths:
      - "telegram/editorial-finalize-trigger.txt"

permissions:
  contents: write

concurrency:
  group: ttittulares-editorial-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Marcar entregas confirmadas
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('telegram/editorial-processing.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          changed=[]
          # Cierre genérico: si los 4 mensajes de un grupo constan como enviados,
          # cualquier PROCESSING correspondiente pasa a READY.
          sent_path=Path('telegram/emergency-sent.json')
          sent={'messages':[]}
          if sent_path.exists():
              raw=sent_path.read_text(encoding='utf-8')
              try:
                  sent=json.loads(raw)
              except json.JSONDecodeError:
                  # Compatibilidad con históricos que terminaron con un "\\n"
                  # literal o con varios documentos JSON concatenados.
                  raw=raw.replace('}\\n','}').strip()
                  dec=json.JSONDecoder(); pos=0; docs=[]
                  while pos < len(raw):
                      while pos < len(raw) and raw[pos].isspace(): pos += 1
                      if pos >= len(raw): break
                      obj,end=dec.raw_decode(raw,pos); docs.append(obj); pos=end
                  merged=[]
                  for obj in docs:
                      if isinstance(obj,dict):
                          merged.extend(obj.get('messages',[]) or [])
                  sent={'messages':merged}
          sent_ids={str(m.get('id')) for m in sent.get('messages',[]) if isinstance(m,dict)}
          for x in d.get('items',[]):
              if x.get('status')!='PROCESSING':
                  continue
              eid=str(x.get('event_id'))
              rv=x.get('rewrite_version') if x.get('selection_mode')=='REWRITE' else None
              base=f"editorial-{eid}-rewrite-{rv}" if rv else f"editorial-{eid}"
              expected={base+'-original',base+'-a',base+'-b',base+'-c'}
              if expected.issubset(sent_ids):
                  x['status']='READY'
                  x['delivered_at']=now
                  x['delivery_confirmation']='emergency-sent'
                  changed.append(eid)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          print('FINALIZED',','.join(changed))
          PY
      - name: Guardar sin pisar cambios concurrentes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram/editorial-processing.json
          git diff --cached --quiet && exit 0
          git commit -m "Confirmar entregas editoriales TTiTTulares"
          git pull --rebase origin main
          git push origin HEAD:main
