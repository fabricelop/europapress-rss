name: TTendencias X context - isolated contracts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trends/x_context.js'
      - 'trends/publish_x_context.js'
      - 'trends/test_x_context.cjs'
      - 'trends/test_publish_x_context.cjs'
      - 'trends/check_x_playwright.cjs'
      - '.github/workflows/ttendencias-x-context.yml'
      - 'windows/Run-TTendencias-X-Local.ps1'
      - 'windows/Install-TTendencias-XContext.ps1'
      - 'windows/TTendencias-XContext-hidden.vbs'
  pull_request:
    paths:
      - 'trends/x_context.js'
      - 'trends/publish_x_context.js'
      - 'trends/test_x_context.cjs'
      - 'trends/test_publish_x_context.cjs'
      - 'trends/check_x_playwright.cjs'
      - '.github/workflows/ttendencias-x-context.yml'
      - 'windows/Run-TTendencias-X-Local.ps1'
      - 'windows/Install-TTendencias-XContext.ps1'
      - 'windows/TTendencias-XContext-hidden.vbs'
permissions:
  contents: read
jobs:
  node-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /trends/x_context.js
            /trends/publish_x_context.js
            /trends/test_x_context.cjs
            /trends/test_publish_x_context.cjs
            /trends/check_x_playwright.cjs
            /selorecordamos/git_publish_lock.js
      - name: Validate read-only local X collection and safe publishing
        run: |
          node --check trends/x_context.js
          node --check trends/publish_x_context.js
          node --check trends/check_x_playwright.cjs
          node --test trends/test_x_context.cjs trends/test_publish_x_context.cjs
      - name: Confirm protected Git safe.directory against simulated foreign owner
        shell: bash
        run: |
          set -euo pipefail
          repo="$(mktemp -d)"
          trap 'sudo rm -rf "$repo"' EXIT
          git init -q "$repo"
          # Use real foreign ownership rather than test env flags; GitHub
          # may preconfigure safe.directory=*, so isolate global/system config.
          chmod -R a+rX "$repo"
          sudo chown -R 65534:65534 "$repo"
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_SYSTEM=/dev/null
          if git -C "$repo" rev-parse --is-inside-work-tree 2>/dev/null; then
            echo 'Expected dubious ownership check did not trigger'
            exit 1
          fi
          output="$(git -c "safe.directory=$repo" -C "$repo" rev-parse --is-inside-work-tree)"
          test "$output" = true
          echo 'TT_X_GIT_DUBIOUS_OWNERSHIP_SIMULATION_OK'
  windows-parser:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /windows/Run-TTendencias-X-Local.ps1
            /windows/Install-TTendencias-XContext.ps1
            /windows/TTendencias-XContext-hidden.vbs
            /trends/check_x_playwright.cjs
      - name: Verify PowerShell 5.1 syntax (no script execution)
        shell: powershell
        run: |
          foreach ($path in @('windows/Run-TTendencias-X-Local.ps1','windows/Install-TTendencias-XContext.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "$path : $($errors[0].Message)" }
          }
          Write-Host 'TT_X_WINDOWS_PS51_SYNTAX_OK'
      - name: Reproduce dubious Git ownership and verify per-command scoped trust
        shell: powershell
        run: |
          $repo = Join-Path $env:RUNNER_TEMP 'TT-XContext-ownership-probe'
          & git.exe init --quiet $repo
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize isolated Git probe' }
          $env:GIT_TEST_ASSUME_DIFFERENT_OWNER = '1'
          try {
            $null = & git.exe -C $repo rev-parse --is-inside-work-tree 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'Git ownership simulation not enforced in this runner'
            } else {
              Write-Host 'TT_X_GIT_DUBIOUS_OWNERSHIP_REPRODUCED'
            }
            $trusted = 'safe.directory=' + $repo.Replace('\','/')
            $inside = (& git.exe -c $trusted -C $repo rev-parse --is-inside-work-tree) -join ''
            if ($LASTEXITCODE -ne 0 -or $inside -ne 'true') { throw 'Local safe.directory exception did not work' }
            $global = (& git.exe config --global --get-all safe.directory 2>$null) -join ''
            if ($global -eq '*') { throw 'Global Git security wildcard must not be used' }
            Write-Host 'TT_X_GIT_SCOPED_SAFE_DIRECTORY_OK'
          } finally {
            Remove-Item Env:GIT_TEST_ASSUME_DIFFERENT_OWNER -ErrorAction SilentlyContinue
          }
          exit 0 # git config --get-all can return 1 when unset; do not inherit it
      - name: Validate invisible Windows Script Host launcher without running X
        shell: powershell
        run: |
          & cscript.exe //NoLogo windows/TTendencias-XContext-hidden.vbs --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Invisible VBS launcher preflight failed' }
          $installer = Get-Content -LiteralPath windows/Install-TTendencias-XContext.ps1 -Raw
          if ($installer -notmatch "System32\\wscript[.]exe|System32\\wscript" -and $installer -notmatch "'System32\\wscript.exe'") {
            throw 'Installer no longer uses the invisible GUI launcher'
          }
          Write-Host 'TT_X_INVISIBLE_TASK_LAUNCHER_VALIDATED'
      - name: Smoke test installer in an ordinary non-Git runtime folder
        shell: powershell
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'TTiTTulares-runtime-not-a-repo'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          if (Test-Path (Join-Path $runtime '.git')) { throw 'Smoke test must start without .git' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/Install-TTendencias-XContext.ps1 -RepoRoot $runtime -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'CheckOnly failed without a Git checkout' }
          Write-Host 'TT_X_NON_GIT_RUNTIME_CHECK_OK'
      - name: Verify real Playwright module using the PowerShell-safe file invocation
        shell: powershell
        run: |
          $local = Join-Path $env:RUNNER_TEMP 'TT-XContext'
          New-Item -Path $local -ItemType Directory -Force | Out-Null
          Copy-Item 'trends/check_x_playwright.cjs' (Join-Path $local 'check_x_playwright.cjs')
          & npm.cmd install --prefix $local --no-save --no-package-lock playwright
          if ($LASTEXITCODE -ne 0) { throw 'Playwright package installation failed on Windows CI' }
          & node.exe (Join-Path $local 'check_x_playwright.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell-safe Playwright module check failed' }
          Write-Host 'TT_X_WINDOWS_PLAYWRIGHT_MODULE_OK'
