name: Mi Mapa del Tiempo - Tests iOS

on:
  push:
    branches:
      - feature/mi-mapa-del-tiempo-ios
    paths:
      - '.github/workflows/mi-mapa-del-tiempo-ios-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-tests:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: gps-ios/native
    steps:
      - uses: actions/checkout@v4
      - name: Generar proyecto e icono
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 tools/make_icon.py
          xcodegen generate --spec project.yml
      - name: Elegir simulador iPhone disponible
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          python3 - <<'PY'
          import json,subprocess,os
          raw=subprocess.check_output(["xcrun","simctl","list","devices","available","-j"])
          objects=json.loads(raw)["devices"]
          matches=[d for runtime, devices in objects.items() if "iOS" in runtime
                   for d in devices if "iPhone" in d["name"] and d["state"] != "Unavailable"]
          if not matches:
              raise SystemExit("No hay simulador iPhone disponible en runner")
          device=matches[0]
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write("SIMULATOR_ID="+device["udid"]+"\n")
          print("Simulador:",device["name"],device["udid"])
          PY
      - name: Ejecutar XCTest (SQLite, migración, GPS y diario)
        run: |
          set -euo pipefail
          xcodebuild test -project MiMapaDelTiempo.xcodeproj \
            -scheme MiMapaDelTiempo \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
