name: TTendencias consolidar editorial directo
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttendencias-editorial-reconcile.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 shared/ttendencias_queue_reconcile.py selftest

      - name: Consolidar registro confirmado
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            echo '' | base64 -d | python3
            python3 shared/ttendencias_queue_reconcile.py
            python3 trends/export_site_top30.py
            git add trends/requests.json trends/telegram-manual-explained.json trends/editorial-queue.json trends/site-top30-current.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Consolidar explicaciones verificadas en TTActualidad"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
