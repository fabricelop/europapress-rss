name: TTendencias web image association
on:
  push:
    branches: [main]
    paths:
      - windows/TTendenciasWebImages.cjs
      - windows/TTendenciasImageBridge.js
      - windows/TTendenciasDedicatedListener.ps1
      - windows/tests/test_web_images.cjs
      - windows/tests/test_web_images_dpapi.cjs
      - windows/tests/test_web_image_handoff_dpapi.cjs
      - windows/tests/test_image_web_independence.cjs
      - windows/tests/test_trends_sites_return.cjs
      - windows/tests/test_web_images_passive.cjs
      - windows/tests/test_web_image_delivery_start.cjs
      - tests/ttendencias-web-images.test.cjs
      - vercel-webhook/lib/ttendencias-web-image-receipt.js
      - vercel-webhook/lib/ttendencias-run-handler.js
      - vercel-webhook/lib/ttendencias-run-status-handler.js
      - no-vercel/ttendencias-worker/**
      - .github/workflows/ttendencias-web-images-test.yml
  pull_request:
    paths:
      - windows/TTendenciasImageBridge.js
      - windows/TTendenciasDedicatedListener.ps1
      - windows/TTendenciasWebImages.cjs
      - windows/tests/test_image_web_independence.cjs
      - .github/workflows/ttendencias-web-images-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  association:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identity and raster selection
        run: node --test tests/ttendencias-web-images.test.cjs windows/tests/test_web_images.cjs windows/tests/test_web_images_passive.cjs windows/tests/test_web_image_delivery_start.cjs
      - name: Bridge launch regressions
        run: |
          node --test windows/tests/test_trends_sites_return.cjs
          node --test windows/tests/test_image_web_independence.cjs
          node windows/tests/test_image_submission_evidence.cjs
          node windows/tests/test_image_prompt_injection.cjs
          node windows/tests/test_image_immediate_submit.cjs
      - name: Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'windows/TTendenciasDedicatedListener.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){$errors | Format-List; exit 1}
      - name: DPAPI enrollment round trip
        shell: powershell
        run: |
          node windows/tests/test_web_images_dpapi.cjs
          node windows/tests/test_web_image_handoff_dpapi.cjs
      - name: Receiver regression tests with Cloudflare adapter
        run: npm --prefix no-vercel/ttendencias-worker test
