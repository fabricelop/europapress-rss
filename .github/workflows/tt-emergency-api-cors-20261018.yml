name: TT Emergency API browser preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tt-emergency-api-cors-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check GitHub API preflight without tokens or writes
        shell: bash
        run: |
          set -eu
          curl -sS -D /tmp/tt-cors.headers -o /tmp/tt-cors.body -X OPTIONS \
            'https://api.github.com/repos/fabricelop/europapress-rss/issues' \
            -H 'Origin: https://fabricelop.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-github-api-version'
          grep -Ei '^(HTTP/|access-control-allow-origin:|access-control-allow-headers:|access-control-allow-methods:|vary:)' /tmp/tt-cors.headers || true
          head -c 200 /tmp/tt-cors.body || true
          echo
