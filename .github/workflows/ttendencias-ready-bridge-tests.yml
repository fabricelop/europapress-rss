name: TTendencias READY-to-Listas reconciliation tests
on:
  pull_request:
    paths:
      - "trends/auto_queue_new.py"
      - "trends/reconcile_prepared_ready.py"
      - "trends/test_reconcile_prepared_ready.py"
      - ".github/workflows/ttendencias-ready-bridge-tests.yml"
  push:
    branches: [main]
    paths:
      - "trends/auto_queue_new.py"
      - "trends/reconcile_prepared_ready.py"
      - "trends/test_reconcile_prepared_ready.py"
      - ".github/workflows/ttendencias-ready-bridge-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate reconciler and original queue syntax
        run: |
          python3 -m py_compile trends/reconcile_prepared_ready.py trends/auto_queue_new.py
          PYTHONPATH=trends python3 -m unittest discover -s trends -p 'test_reconcile_prepared_ready.py' -v
