name: Test SeLoRecordamos X search

on:
  workflow_dispatch:
  push:
    paths:
      - 'selorecordamos/search_x.js'
      - '.github/workflows/test-selorecordamos-x.yml'

jobs:
  test-x-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run X search test
        run: node selorecordamos/search_x.js

      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selorecordamos-x-debug
          path: selorecordamos/debug/
          if-no-files-found: warn
          retention-days: 3
