name: Test SeLoRecordamos X search

# X bloquea a veces el navegador de los runners públicos. La prueba real
# queda disponible manualmente; la sintaxis se valida en CI sin consumir X.
on:
  workflow_dispatch:

jobs:
  test-x-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run X search test
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
        run: node selorecordamos/search_x.js

      - name: Upload debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selorecordamos-x-debug
          path: selorecordamos/debug/
          if-no-files-found: warn
          retention-days: 3
