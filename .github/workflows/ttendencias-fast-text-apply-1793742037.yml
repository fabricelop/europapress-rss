name: TTendencias fast text apply tr-autoguard-1793742037

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ttendencias-fast-text-apply-1793742037.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancelar aplicadores lentos de esta misma pasada
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/actions/runs/41724847781/cancel" >/dev/null 2>&1 || true
          gh api --method POST "repos/$REPO/actions/runs/41724700311/cancel" >/dev/null 2>&1 || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /trends/requests.json
            /trends/telegram-manual-explained.json
            /trends/editorial-queue.json

      - name: Aplicar lote textual con barrera JIT
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: "6616212428"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ttendencias-editorial"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" --jq .body > /tmp/tt-comment.txt

            python3 - <<'PY'
          import json
          from pathlib import Path

          body=Path('/tmp/tt-comment.txt').read_text(encoding='utf-8')
          payload=json.loads(body.split('\n',1)[1])
          explained_at=payload['explained_at']
          bykey={(str(x['id']),int(x.get('revision',0))):x for x in payload.get('items',[])}

          rp=Path('trends/requests.json')
          req=json.loads(rp.read_text(encoding='utf-8'))
          applied={}
          for r in req.get('requests',[]):
              k=(str(r.get('id')),int(r.get('revision',0)))
              x=bykey.get(k)
              if not x or str(r.get('status') or '') not in {'preparing','update'}:
                  continue
              group_id='grp-'+str(x['id'])
              member_revs=[{'id':x['id'],'name':x['name'],'revision':x['revision']}]
              with_image=bool(r.get('with_image'))
              r.update(
                  status='explained', explained_at=explained_at, updated_at=explained_at,
                  last_attempt_at=explained_at, explanation=x['explanation'],
                  closer_text=x.get('closer_text',''), rank_at_explanation=x['rank'],
                  category=x.get('category','Otros'), source='editorial_fast_text_apply',
                  editorial_engine='chatgpt-automation-outbox',
                  verification_sources=x.get('verification_sources',[]),
                  news_disposition='ignored', news_note=x.get('news_note',''),
                  group_id=group_id, explanation_group_id=group_id, group_title=x['name'],
                  group_leader_id=x['id'], trend_names=[x['name']],
                  grouped_member_revisions=member_revs,
                  disable_ai_image=False, image_strategy='ai_plus_fallback',
                  ai_image_status='pending' if with_image else 'none',
                  fallback_image_status='pending' if with_image else 'none',
                  image_choice='none', image_status='pending' if with_image else 'none',
                  image_pending=with_image, editorial_grouping_state='pending',
                  telegram_package_status='pending',
              )
              applied[k]=x

          req['updated_at']=explained_at
          req['count']=len(req.get('requests',[]))
          rp.write_text(json.dumps(req,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          ep=Path('trends/telegram-manual-explained.json')
          exp=json.loads(ep.read_text(encoding='utf-8'))
          arr=exp.setdefault('items',[])
          for k,x in applied.items():
              arr[:]=[e for e in arr if not (str(e.get('id'))==str(x['id']) and int(e.get('revision',0))==int(x['revision']))]
              with_image=True
              arr.append({
                  'id':x['id'],'name':x['name'],'revision':x['revision'],'status':'explained',
                  'explained_at':explained_at,'updated_at':explained_at,
                  'explanation':x['explanation'],'closer_text':x.get('closer_text',''),
                  'rank':x['rank'],'rank_at_explanation':x['rank'],'category':x.get('category','Otros'),
                  'source':'editorial_fast_text_apply','editorial_engine':'chatgpt-automation-outbox',
                  'verification_sources':x.get('verification_sources',[]),'news_note':x.get('news_note',''),
                  'group_id':'grp-'+str(x['id']),'explanation_group_id':'grp-'+str(x['id']),
                  'group_title':x['name'],'group_leader_id':x['id'],'trend_names':[x['name']],
                  'grouped_member_revisions':[{'id':x['id'],'name':x['name'],'revision':x['revision']}],
                  'with_image':with_image,'image_strategy':'ai_plus_fallback',
                  'ai_image_status':'pending','fallback_image_status':'pending',
                  'image_status':'pending','image_choice':'none','image_pending':True,
                  'editorial_grouping_state':'pending','telegram_package_status':'pending',
              })
          exp['updated_at']=explained_at
          exp['count']=len(arr)
          ep.write_text(json.dumps(exp,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          qp=Path('trends/editorial-queue.json')
          q=json.loads(qp.read_text(encoding='utf-8'))
          keys=set(applied)
          q['items']=[e for e in q.get('items',[]) if (str(e.get('id')),int(e.get('revision',0))) not in keys]
          q['count']=len(q['items'])
          q['updated_at']=explained_at
          qp.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('TTENDENCIAS_FAST_TEXT_APPLIED',sorted(keys))
          PY

            git add --sparse trends/requests.json trends/telegram-manual-explained.json trends/editorial-queue.json
            if git diff --cached --quiet; then
              echo "Sin cambios: revisiones ya aplicadas u obsoletas."
              exit 0
            fi
            git commit -m "TTendencias: aplicar texto tr-autoguard-1793742037"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$attempt"
          done
          exit 1
