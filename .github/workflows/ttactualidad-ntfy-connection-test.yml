name: TTActualidad · prueba puntual ntfy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttactualidad-ntfy-connection-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      NTFY_TOPIC: ${{ secrets.TT_ACTUALIDAD_NTFY_TOPIC }}
    steps:
      - name: Verify subscription secret exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$NTFY_TOPIC" ]]; then
            echo "::error::El secreto TT_ACTUALIDAD_NTFY_TOPIC no está configurado."
            exit 1
          fi
          if [[ ! "$NTFY_TOPIC" =~ ^[A-Za-z0-9_-]{12,128}$ ]]; then
            echo "::error::El canal configurado no cumple el formato."
            exit 1
          fi
          echo "Canal configurado, longitud válida, sin mostrarlo."
      - name: Send one harmless TTActualidad test notification
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 20 \
            -o /dev/null \
            -H "Title: TTActualidad - prueba de notificaciones" \
            -H "Priority: default" \
            -H "Tags: white_check_mark" \
            --data-binary "Prueba de conexión correcta. Los avisos reales se enviarán solo cuando una lista pase de vacía a tener contenido." \
            "https://ntfy.sh/$NTFY_TOPIC"
          echo "Servidor ntfy aceptó el mensaje de prueba. La entrega en el teléfono requiere confirmación del usuario."
