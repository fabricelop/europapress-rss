name: RainETA Real Radar Backtest
on:
  push:
    paths:
      - 'ios/raineta/tests/real_radar_backtest.py'
      - '.github/workflows/raineta-backtest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install scientific dependencies
        run: python3 -m pip install --quiet requests numpy h5py opencv-python-headless matplotlib pyproj
      - name: Test optical flow versus actual later OPERA scans
        working-directory: ios/raineta
        run: python3 tests/real_radar_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raineta-real-nowcast-backtest
          path: ios/raineta/radar-science/
          retention-days: 14
