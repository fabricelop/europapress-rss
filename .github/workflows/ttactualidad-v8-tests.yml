name: TTActualidad V8 safe live rollout
on:
  push:
    branches: ['fix/ttactualidad-live-actions-20261016']
    paths:
      - 'pilot/apply-ttactualidad-action.py'
      - 'pilot/test_ttactualidad_direct_actions.py'
      - 'pilot/ttactualidad-live/**'
      - '.github/workflows/ttactualidad-direct-actions.yml'
      - '.github/workflows/ttactualidad-v8-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python3 -m py_compile pilot/apply-ttactualidad-action.py pilot/ttactualidad-live/test_live_actions.py
      - name: Earlier GitHub direct-action regression tests
        run: python3 -m unittest discover -s pilot -p 'test_ttactualidad_direct_actions.py' -v
      - name: New live editorial actions
        run: python3 -m unittest discover -s pilot/ttactualidad-live -p 'test_live_actions.py' -v
      - name: Trend card freshness and live interface
        run: node pilot/ttactualidad-live/test_listas.mjs
      - name: Worker actions and safe retry
        run: node pilot/ttactualidad-live/test_worker_live.mjs
      - name: Validate browser and Worker JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('pilot/ttactualidad-live/index.html').read_text()
          a=html.index('<script>')+len('<script>');b=html.index('</script>',a)
          Path('/tmp/ttactualidad-v8-ui.js').write_text(html[a:b])
          assert "Pasar a En Elaboración" in html
          assert 'current-explained>48*3600000' in html
          assert 'Probar Desestimar' not in html and '¿Cómo funciona este piloto?' not in html
          for token in ('TTImages','Publicar en X','Copiar GAG Completo','Abrir ChatGPTImages','Copiar Texto','Copiar Foto Archivo','Quitar de Listas','Buscar en X'):
              assert token in html,token
          worker=Path('pilot/ttactualidad-live/worker.js').read_text()
          assert "signed_cookie_v1" in worker
          assert "['deleted','discard','prepare'].includes" in worker
          assert "crypto.subtle.verify" in worker
          wf=Path('.github/workflows/ttactualidad-direct-actions.yml').read_text()
          assert 'ttittulares/editorial-queue.json' in wf and 'trends/editorial-queue.json' in wf
          PY
          node --check /tmp/ttactualidad-v8-ui.js
          cp pilot/ttactualidad-live/worker.js /tmp/ttactualidad-v8-worker.mjs
          node --check /tmp/ttactualidad-v8-worker.mjs
      - name: Confirm no changes to production GH Pages, Tremending, TTImages or SeLoRecordamos
        run: |
          python3 - <<'PY'
          import subprocess
          allowed={'pilot/test_ttactualidad_direct_actions.py',
                   'pilot/apply-ttactualidad-action.py',
                   '.github/workflows/ttactualidad-direct-actions.yml'}
          subprocess.check_call(['git','fetch','--depth=1','origin','main'])
          paths=subprocess.check_output(['git','diff','--name-only','origin/main','HEAD'],text=True).splitlines()
          assert all(p in allowed or p.startswith('pilot/ttactualidad-live/') or p=='.github/workflows/ttactualidad-v8-tests.yml' for p in paths),paths
          assert 'main/docs/index.html' not in paths and 'docs/index.html' not in paths
          print('ISOLATION_OK',paths)
          PY
