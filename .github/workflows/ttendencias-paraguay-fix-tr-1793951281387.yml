name: TTendencias Paraguay text fix tr-1793951281387

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttendencias-paraguay-fix-tr-1793951281387.yml'

permissions:
  contents: write

concurrency:
  group: ttendencias-paraguay-fix-tr-1793951281387
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /trends/requests.json
            /trends/telegram-manual-explained.json
            /trends/requests_json.py

      - name: Correct exact Paraguay r0 text only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ttendencias-editorial"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          from trends.requests_json import dumps_for_path

          files = {
              "trends/requests.json": "requests",
              "trends/telegram-manual-explained.json": "items",
          }
          ident = "69446521a2f3"
          old = (
              "TT#3 Paraguay es tendencia por la crisis tras el colapso de Ueno Bank: "
              "Santiago Peña ofreció dimitir, el Congreso rechazó su salida y el Senado abrió un juicio político.\n"
              "#Paraguay #SantiagoPeña\n"
              "🌶️ El banco cerró ventanillas y la crisis abrió sesión en el Senado."
          )
          new = (
              "TT#3 Paraguay es tendencia por la crisis de Ueno Bank: Santiago Peña presentó su renuncia, "
              "pero no se tramitó por falta de cuórum y el Senado abrió un juicio político.\n"
              "#Paraguay #SantiagoPeña\n"
              "🌶️ La renuncia quedó pendiente; el juicio político siguió."
          )
          closer = "🌶️ La renuncia quedó pendiente; el juicio político siguió."
          sources = [
              {"url":"https://efe.com/mundo/2026-11-06/senado-paraguay-juicio-politico-presidente-santiago-pena/"},
              {"url":"https://www.europapress.es/internacional/noticia-presidente-paraguay-mantiene-cargo-senado-retoma-viernes-juicio-politico-20261106000343.html"},
          ]
          note = (
              "Peña presentó su renuncia tras la crisis de Ueno Bank; una sesión del Congreso "
              "sin cuórum no pudo tramitarla y el Senado abrió el juicio político."
          )
          now = datetime.now(timezone.utc).isoformat()
          changed = 0
          for path, field in files.items():
              doc = json.loads(Path(path).read_text(encoding="utf-8"))
              for row in doc.get(field, []):
                  if (row.get("id") == ident and int(row.get("revision") or 0) == 0
                      and row.get("explanation") == old):
                      row["explanation"] = new
                      row["closer_text"] = closer
                      row["verification_sources"] = sources
                      row["news_note"] = note
                      row["updated_at"] = now
                      changed += 1
              if changed:
                  doc["updated_at"] = now
              Path(path).write_text(dumps_for_path(path, doc), encoding="utf-8")
          print("PARAGUAY_TEXT_ROWS_CHANGED", changed)
          PY
            git add -- trends/requests.json trends/telegram-manual-explained.json
            if git diff --cached --quiet; then
              echo "No correction required."
              exit 0
            fi
            git commit -m "TTendencias: corregir Paraguay r0 sin imágenes [skip actions]"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
