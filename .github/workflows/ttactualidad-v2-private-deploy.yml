name: TTActualidad V2 - desplegar SOLO staging privado Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttactualidad-v2-private-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate credentials present (never print values)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test isolated private Worker
        working-directory: v2/private-worker
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test
          npx wrangler deploy --dry-run --outdir .wrangler-private-check
      - name: Publish separate Cloudflare staging Worker, never V1 or FabCalendar
        working-directory: v2/private-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Confirm no secrets or production changes were requested
        run: echo 'TT_V2_PRIVATE_STAGING_DEPLOY_REQUESTED=YES - requires AUTH_PASSWORD and SESSION_SECRET in Cloudflare'
