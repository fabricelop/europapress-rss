name: Process MoneyWiz Backup

on:
  repository_dispatch:
    types: [moneywiz_backup_uploaded]

permissions:
  contents: read

concurrency:
  group: moneywiz-backup-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CURRENT_URL: ${{ github.event.client_payload.current_url }}
      PREVIOUS_URL: ${{ github.event.client_payload.previous_url }}
      CURRENT_FILENAME: ${{ github.event.client_payload.current_filename }}
      PREVIOUS_FILENAME: ${{ github.event.client_payload.previous_filename }}
      PROCESSED_PUT_URL: ${{ github.event.client_payload.processed_put_url }}
      PROCESSED_PATH: ${{ github.event.client_payload.processed_path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Procesar backup MoneyWiz
        run: |
          python .github/scripts/moneywiz-process-backup.py \
            --current-url "$CURRENT_URL" \
            --previous-url "$PREVIOUS_URL" \
            --current-filename "$CURRENT_FILENAME" \
            --previous-filename "$PREVIOUS_FILENAME" \
            --output /tmp/moneywiz-patch.json

      - name: Validar delta
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/moneywiz-patch.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x.get('format')=='moneywiz-auto-patch'
          assert x.get('version')==1
          assert isinstance(x.get('accountsUpsert'),list)
          assert isinstance(x.get('transactionsUpsert'),list)
          assert isinstance(x.get('transactionDeletes'),list)
          assert p.stat().st_size < 3*1024*1024
          print('MONEYWIZ_PATCH_VALID', x.get('snapshotDate'), x.get('stats'))
          PY

      - name: Guardar delta privado
        run: |
          curl --fail --silent --show-error \
            -X PUT \
            -H 'content-type: application/json' \
            --data-binary @/tmp/moneywiz-patch.json \
            "$PROCESSED_PUT_URL"

      - name: Resumen
        run: |
          echo "Procesado: $CURRENT_FILENAME"
          echo "Anterior:  $PREVIOUS_FILENAME"
          echo "Destino:   $PROCESSED_PATH"
