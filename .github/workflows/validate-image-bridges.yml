name: Validar bridges de imagen

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "windows/TTiTTularesImageBridge.js"
      - "windows/TTendenciasImageBridge.js"
      - "windows/tests/test_trends_composer_preflight.cjs"
      - "windows/Install-TTendencias-Composer-Fix.ps1"
      - "windows/tests/test_image_prompt_injection.cjs"
      - "windows/tests/test_image_composer_preflight.cjs"
      - "windows/Install-TTiTTulares-Composer-Fix.ps1"
      - "windows/Install-TTendencias-Composer-Fix.ps1"
      - ".github/workflows/validate-image-bridges.yml"
  push:
    branches: [main]
    paths:
      - "windows/TTiTTularesImageBridge.js"
      - "windows/TTiTTularesDedicatedListener.ps1"
      - "windows/TTendenciasDedicatedListener.ps1"
      - "windows/TTendenciasImageBridge.js"
      - "windows/tests/test_trends_target_close.cjs"
      - "windows/tests/test_chrome9223_spa_reuse.cjs"
      - "windows/tests/test_image_prompt_injection.cjs"
      - "windows/tests/test_image_submission_evidence.cjs"
      - "windows/tests/test_image_immediate_submit.cjs"
      - "windows/Install-TTImages-PromptFix-Safe.ps1"
      - "windows/Install-TTiTTulares-Composer-Fix.ps1"
      - ".github/workflows/validate-image-bridges.yml"

permissions:
  contents: read

jobs:
  node-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /windows/TTiTTularesImageBridge.js
            /windows/TTiTTularesDedicatedListener.ps1
            /windows/TTendenciasImageBridge.js
            /windows/tests/test_trends_target_close.cjs
            /windows/tests/test_chrome9223_spa_reuse.cjs
            /windows/tests/test_image_prompt_injection.cjs
            /windows/tests/test_image_composer_preflight.cjs
            /windows/tests/test_trends_composer_preflight.cjs
            /windows/tests/test_image_submission_evidence.cjs
            /windows/tests/test_image_immediate_submit.cjs
            /windows/Install-TTImages-PromptFix-Safe.ps1
            /windows/Install-TTiTTulares-Composer-Fix.ps1
            /windows/Install-TTendencias-Composer-Fix.ps1
            /windows/TTendenciasDedicatedListener.ps1
            /windows/Install-ImageBridge-Hotfix.ps1
            /windows/TT-LocalWatchdog.ps1
      - name: Validar sintaxis Node
        run: |
          node --check windows/TTiTTularesImageBridge.js
          node --check windows/TTendenciasImageBridge.js
      - name: Validar sintaxis PowerShell
        shell: pwsh
        run: |
          $files=@(
            "windows/TTiTTularesDedicatedListener.ps1",
            "windows/TTendenciasDedicatedListener.ps1",
            "windows/Install-ImageBridge-Hotfix.ps1",
            "windows/Install-TTImages-PromptFix-Safe.ps1",
            "windows/Install-TTiTTulares-Composer-Fix.ps1",
            "windows/Install-TTendencias-Composer-Fix.ps1",
            "windows/TT-LocalWatchdog.ps1"
          )
          foreach($file in $files){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0){
              $errors | ForEach-Object { Write-Error ($file+": "+$_.Message) }
              exit 1
            }
          }
          $source=Get-Content windows/TTiTTularesDedicatedListener.ps1 -Raw -Encoding UTF8
          if($source -notmatch '(?m)^\$MaxParallelImageChats\s*=\s*1\s*$'){
            throw 'REGRESSION: el listener TTiTTulares tiene que permitir una imagen activa (slot=1)'
          }
          if($source -notmatch 'delivery_mode.*launch_only'){
            throw 'REGRESSION: no se bloquean prompts ya lanzados en modo launch_only'
          }
          $trends=Get-Content windows/TTendenciasDedicatedListener.ps1 -Raw -Encoding UTF8
          if($trends -notmatch '(?m)^\$MaxParallelImageChats\s*=\s*1\s*$'){
            throw 'REGRESSION: listener TTendencias debe permitir un prompt IA activo'
          }
          if($trends -notmatch 'delivery_mode.*launch_only'){
            throw 'REGRESSION: TTendencias debe omitir prompts launch_only ya enviados'
          }

      - name: Comprobar que el instalador aislado no reinicia servicios
        shell: pwsh
        run: |
          $s=Get-Content 'windows/Install-TTiTTulares-Composer-Fix.ps1' -Raw
          foreach($forbidden in @('Stop-Process','Start-Process','Restart-Service','Start-ScheduledTask','Set-ScheduledTask','TTendenciasImageBridge.js','TTImages-Repair-Gallery9234.js')){
            if($s.Contains($forbidden)){throw ('Unsafe installer marker: '+$forbidden)}
          }
          if(-not $s.Contains('if($CheckOnly)')){throw 'Missing read-only mode'}
          if(-not $s.Contains('before-composer-')){throw 'Missing rollback backup'}
          Write-Host 'TT_COMPOSER_ISOLATED_INSTALLER_OK'

      - name: Garantizar que TTendencias tiene despliegue aislado y reversible
        shell: pwsh
        run: |
          $s=Get-Content 'windows/Install-TTendencias-Composer-Fix.ps1' -Raw
          foreach($forbidden in @('Stop-Process','Start-Process','Restart-Service','Start-ScheduledTask','Set-ScheduledTask')){
            if($s.Contains($forbidden)){throw ('Unsafe installer marker: '+$forbidden)}
          }
          if(-not $s.Contains('if($CheckOnly)')){throw 'Missing read-only mode'}
          if(-not $s.Contains('before-composer-')){throw 'Missing backup'}
          if(-not $s.Contains('TTendenciasImageBridge.js')){throw 'Wrong bridge target'}
          Write-Host 'TRENDS_COMPOSER_ISOLATED_INSTALLER_OK'

      - name: Probar reutilizacion SPA de Chrome 9223 sin recargas innecesarias
        run: node windows/tests/test_chrome9223_spa_reuse.cjs

      - name: Probar cierre aislado y recuperación de la pestaña congelada
        run: node windows/tests/test_trends_target_close.cjs

      - name: Probar compositor visible, reintento sin prompts duplicados
        run: node windows/tests/test_image_prompt_injection.cjs

      - name: Probar reconocimiento del compositor tras hidratación y recuperación segura
        run: node windows/tests/test_image_composer_preflight.cjs

      - name: Probar compositor TTendencias ante hidratación, borradores y generación activa
        run: node windows/tests/test_trends_composer_preflight.cjs

      - name: Probar reconocimiento de generacion activa sin /c/ y sin falsos positivos
        run: node windows/tests/test_image_submission_evidence.cjs

      - name: Comprobar envío inmediato del prompt sin duplicados ni borradores ajenos
        run: node windows/tests/test_image_immediate_submit.cjs

      - name: Validar contrato launch-only sin false ERROR ni raster
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const tt=fs.readFileSync('windows/TTiTTularesImageBridge.js','utf8');
          const tr=fs.readFileSync('windows/TTendenciasImageBridge.js','utf8');
          // This variable must be in the outer job scope, not inside the ACK if.
          assert.match(tt,/const launchOnly=String\(job\.delivery_mode\|\|""\)==="launch_only";[\s\S]*?if\(!launchOnly\)throw Error\("legacy_raster_mode_disabled_request_launch_only_job"\);[\s\S]*?cdp=await openFreshDedicatedConversation\(\)/);
          assert.match(tt,/if\(launchOnly\)\s*\{[\s\S]*?BRIDGE LAUNCH ONLY CONFIRMED/);
          assert.match(tr,/const launchOnly=String\(job\.delivery_mode\|\|""\)==="launch_only"/);
          assert.match(tr,/if\(!launchOnly\)throw Error\("legacy_raster_mode_disabled_request_launch_only_job"\)/);
          assert.match(tr,/await confirmPromptLaunched\(\)/);
          assert.match(tr,/if\(launchOnly\)\s*\{[\s\S]*?TTENDENCIAS LAUNCH_ONLY CONFIRMED/);
          assert.match(tt,/await confirmPromptLaunched\(\)/);
          console.log('LAUNCH_ONLY_CONTRACT_OK');
          NODE
