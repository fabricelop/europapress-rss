name: Validar bridges de imagen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "windows/TTiTTularesImageBridge.js"
      - "windows/TTendenciasImageBridge.js"
      - ".github/workflows/validate-image-bridges.yml"

permissions:
  contents: read

jobs:
  node-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /windows/TTiTTularesImageBridge.js
            /windows/TTendenciasImageBridge.js
            /windows/TTiTTularesDedicatedListener.ps1
            /windows/TTendenciasDedicatedListener.ps1
            /windows/Install-ImageBridge-Hotfix.ps1
            /windows/TT-LocalWatchdog.ps1
      - name: Validar sintaxis Node
        run: |
          node --check windows/TTiTTularesImageBridge.js
          node --check windows/TTendenciasImageBridge.js
      - name: Validar sintaxis PowerShell
        shell: pwsh
        run: |
          $files=@(
            "windows/TTiTTularesDedicatedListener.ps1",
            "windows/TTendenciasDedicatedListener.ps1",
            "windows/Install-ImageBridge-Hotfix.ps1",
            "windows/TT-LocalWatchdog.ps1"
          )
          foreach($file in $files){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0){
              $errors | ForEach-Object { Write-Error ($file+": "+$_.Message) }
              exit 1
            }
          }
