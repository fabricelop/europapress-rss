name: TTiTTulares Telegram informativo (sin IA ni publicación)
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "TT Autocorrección automática"
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "ttittulares/prepared.json"
      - "ttittulares/editorial-queue.json"
      - "telegram/events.json"
      - "telegram/editorial-processing.json"
      - "ttittulares/decisions.json"
      - "shared/telegram_readonly_delivery.py"
      - "shared/telegram_orphan_audit.py"
      - "ttittulares/treated_news.py"
      - "ttittulares/auto_queue.py"
      - "ttittulares/filter_processing_batch.py"
      - "telegram/radar_no_d1.py"
      - "ttittulares/treated-stories.json"
      - ".github/workflows/send-ttittulares-ready-telegram.yml"
permissions:
  contents: write
concurrency:
  group: ttittulares-telegram-readonly
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /shared/telegram_readonly_delivery.py
            /shared/tt_bidirectional_audit.py
            /telegram/bidirectional-audit-ttittulares.json
            /telegram/bidirectional-audit-ttendencias.json
            /telegram/lifecycle-baseline.json
            /trends/mobile-decisions.json
            /shared/telegram_orphan_audit.py
            /telegram/orphan-audit-ttittulares.json
            /telegram/editorial-processing.json
            /telegram/ttittulares-deliveries.json
            /ttittulares/prepared.json
            /ttittulares/editorial-queue.json
            /ttittulares/status.json
            /telegram/events.json
            /tests/test_tti_authentic_title.py
            /tests/test_tti_ai_delivery.py
            /ttittulares/decisions.json
            /ttittulares/treated_news.py
            /ttittulares/auto_queue.py
            /ttittulares/filter_processing_batch.py
            /telegram/content_filters.py
            /telegram/radar_no_d1.py
            /telegram/source_publication.py
            /telegram/source_telemetry.py
            /ttittulares/treated-stories.json
            /trends/requests.json
            /trends/editorial-queue.json
            /trends/recent.json
            /trends/explained.json
            /trends/telegram-manual-explained.json
            /trends/telegram-image-deliveries.json
            /trends/telegram-bot-state.json
      - name: Dependencias HTTP y comprobaciones
        run: |
          python3 -m pip install -q requests pillow
          python3 -m py_compile shared/telegram_readonly_delivery.py
          python3 -m py_compile telegram/radar_no_d1.py ttittulares/auto_queue.py ttittulares/filter_processing_batch.py
          python3 ttittulares/treated_news.py
          python3 ttittulares/auto_queue.py --selftest
          python3 shared/telegram_readonly_delivery.py selftest
          python3 shared/telegram_orphan_audit.py selftest
          python3 -m unittest discover -s tests -p "test_tti_authentic_title.py" -v
          python3 -m unittest discover -s tests -p "test_tti_ai_delivery.py" -v
      - name: Enviar o actualizar mensaje Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          # La comprobación inicial puede haber hecho checkout antes de otro envío.
          # Releer main inmediatamente antes de hablar con Telegram evita duplicados
          # entre ejecuciones consecutivas y protege las decisiones de borrado.
          git fetch origin main
          git reset --hard origin/main
          python3 shared/telegram_readonly_delivery.py ttittulares
          cp telegram/ttittulares-deliveries.json /tmp/telegram-readonly-ledger.json
      - name: Guardar ledger sin perder borrados
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path("telegram/ttittulares-deliveries.json")
          live=json.loads(path.read_text(encoding="utf8"))
          incoming=json.loads(Path("/tmp/telegram-readonly-ledger.json").read_text(encoding="utf8"))
          rows=live.setdefault("items",[])
          terminal={"deleted","removed","dismissed","published"}
          # A TTiTTulares card keeps the same Telegram message across editorial
          # revisions. Merge by event+message, not by revision, so an edited
          # final revision replaces its stale provisional row instead of
          # leaving a false orphan behind.
          def row_key(x):
              return (str(x.get("event_id") or ""),int(x.get("telegram_message_id") or 0))
          def row_time(x):
              return str(x.get("updated_at") or x.get("delivered_at") or "")
          by_id={}
          deduped=[]
          for row in rows:
              key=row_key(row)
              old=by_id.get(key)
              if old is None:
                  deduped.append(row)
                  by_id[key]=row
                  continue
              old_terminal=str(old.get("status") or "").lower() in terminal
              new_terminal=str(row.get("status") or "").lower() in terminal
              if old_terminal and not new_terminal:
                  continue
              if (new_terminal and not old_terminal) or row_time(row)>=row_time(old):
                  old.clear()
                  old.update(row)
          rows[:]=deduped
          for row in incoming.get("items",[]):
              key=row_key(row)
              old=by_id.get(key)
              if old is None:
                  rows.append(row)
                  by_id[key]=row
              elif str(old.get("status") or "").lower() not in terminal:
                  # Never overwrite a terminal delete from concurrent callback.
                  if row_time(row)>=row_time(old):
                      old.update(row)
          live["updated_at"]=incoming.get("updated_at") or live.get("updated_at")
          path.write_text(json.dumps(live,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          PY
            git add telegram/ttittulares-deliveries.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Registrar entrega Telegram informativa ttittulares"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo "No se pudo guardar ledger Telegram" >&2
          exit 1

      - name: Auditar los avisos de Telegram después de la ejecución
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The audit MUST compare against the committed delivery ledger.
          git fetch origin main
          git reset --hard origin/main
          python3 shared/telegram_orphan_audit.py ttittulares
          python3 shared/tt_bidirectional_audit.py
          for side in ttittulares ttendencias; do cp "telegram/bidirectional-audit-$side.json" "/tmp/bidirectional-audit-$side.json"; done
          cp telegram/orphan-audit-ttittulares.json /tmp/orphan-audit-ttittulares.json
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/orphan-audit-ttittulares.json telegram/orphan-audit-ttittulares.json
            for side in ttittulares ttendencias; do cp "/tmp/bidirectional-audit-$side.json" "telegram/bidirectional-audit-$side.json"; done
            git add --sparse telegram/orphan-audit-ttittulares.json telegram/bidirectional-audit-ttittulares.json telegram/bidirectional-audit-ttendencias.json
            if git diff --cached --quiet; then
              echo "TT_ORPHAN_AUDIT_NO_CHANGE"
              exit 0
            fi
            git commit -m "TT auditoría de avisos Telegram ttittulares"
            if git push origin HEAD:main; then
              echo "TT_ORPHAN_AUDIT_PERSISTED"
              exit 0
            fi
            sleep "$attempt"
          done
          echo "TT_ORPHAN_AUDIT_PERSIST_FAILED" >&2
          exit 1
