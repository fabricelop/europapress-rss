name: Radar editorial sin D1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'telegram/radar-trigger.txt'

permissions:
  contents: write

concurrency:
  group: radar-editorial-no-d1
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar barrido TTiTTulares
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 telegram/radar_no_d1.py
      - name: Guardar estado
        run: |
          git config user.name "tt-control-bot"
          git config user.email "actions@users.noreply.github.com"
          git add telegram/events.json telegram/processed-events.json telegram/editorial-processing.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Actualizar estado radar editorial"
          git pull --rebase origin main
          git push origin main
