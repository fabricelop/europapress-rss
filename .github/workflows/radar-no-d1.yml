name: Watchdog radar TTiTTulares

on:
  workflow_dispatch:
  schedule:
    # Desfasado 5 minutos respecto al reloj principal. Comprueba siempre el
    # radar: last_run por sí solo no demuestra que la ingestión esté sana.
    - cron: '5,15,25,35,45,55 * * * *'
  push:
    branches: [main]
    paths:
      - ".github/workflows/radar-no-d1.yml"
      - "telegram/radar_no_d1.py"
      - "telegram/content_filters.py"
      - "ttittulares/auto_queue.py"
      - "ttittulares/apply_editorial_outbox.py"
      - "ttittulares/editorial-outbox/**"

permissions:
  contents: write

concurrency:
  group: ttittulares-radar-watchdog
  cancel-in-progress: false

jobs:
  radar-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del radar
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet Pillow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verificar, recuperar y guardar radar TTiTTulares
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "ttittulares-radar-watchdog"
          git config user.email "actions@users.noreply.github.com"

          # Ejecutamos la captación real en cada tick del watchdog. Esto evita
          # el falso positivo anterior: otro proceso podía refrescar last_run
          # aunque las fuentes no hubieran aportado las noticias recientes.
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            python3 telegram/radar_no_d1.py
            python3 telegram/prune_events.py
            python3 ttittulares/auto_queue.py --selftest
            python3 ttittulares/auto_queue.py
            python3 ttittulares/reconcile_state.py
            python3 ttittulares/apply_editorial_outbox.py
            python3 ttittulares/build_status.py
            python3 telegram/autocheck_ttittulares.py

            git add telegram/events.json telegram/event-seeds.json telegram/processed-events.json telegram/editorial-processing.json \
              telegram/autocheck-status.json telegram/autocheck-alert-state.json ttittulares/status.json ttittulares/prepared.json ttittulares/editorial-queue.json
            git add -A -- ttittulares/editorial-outbox 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "Radar verificado: sin cambios nuevos."
              exit 0
            fi

            git commit -m "Actualizar radar TTiTTulares"
            git fetch origin main
            BASE="$(git rev-parse HEAD^)"
            REMOTE="$(git rev-parse origin/main)"

            if [ "$REMOTE" != "$BASE" ]; then
              if git diff --quiet "$BASE" "$REMOTE" -- \
                telegram/events.json \
                telegram/event-seeds.json \
                telegram/processed-events.json \
                telegram/editorial-processing.json \
                telegram/autocheck-status.json \
                telegram/autocheck-alert-state.json \
                ttittulares/status.json; then
                echo "Cambios concurrentes ajenos a TTiTTulares; integrando."
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "Rebase falló; recalculando ($intento/4)..."
                  sleep $((intento * 2))
                  continue
                fi
              else
                echo "Estado TTiTTulares actualizado en paralelo; recalculando para no perder entradas."
                sleep $((intento * 2))
                continue
              fi
            fi

            if git push origin HEAD:main; then
              echo "Radar actualizado correctamente."
              exit 0
            fi

            echo "Push concurrente; recalculando ($intento/4)..."
            sleep $((intento * 2))
          done

          echo "ERROR: watchdog no pudo guardar el radar tras 4 intentos."
          exit 1
