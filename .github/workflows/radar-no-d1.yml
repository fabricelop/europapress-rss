name: Radar editorial TTiTTulares

on:
  workflow_dispatch:
  schedule:
    - cron: '10,25,40,55 * * * *'
  push:
    branches: [main]
    paths:
      - ".github/workflows/radar-no-d1.yml"

permissions:
  contents: write

concurrency:
  group: ttittulares-repo-write
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar y guardar radar TTiTTulares
        run: |
          set -e
          git config user.name "ttittulares-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          for intento in 1 2 3 4; do
            # El radar es autónomo: siempre recalcula sobre el main actual.
            # No depende de TTendencias ni de Telegram.
            git fetch origin main
            git reset --hard origin/main

            # Europa Press forma parte del radar y debe refrescarse ANTES del
            # cruce multifuente. Esto recupera también el hueco desde el último
            # crawl válido porque generate_feed.py recorre el archivo desde state.json.
            python3 generate_feed.py
            python3 - <<'PY'
            import json
            from pathlib import Path
            data=json.loads(Path("latest.json").read_text(encoding="utf-8"))
            items=data.get("items",[])[:200]
            recent={"source":data.get("source"),"generated_at":data.get("generated_at"),"count":len(items),"items":items}
            Path("recent.json").write_text(json.dumps(recent,ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf-8")
            print(f"Europa Press refrescada: {len(items)} noticias recientes")
            PY

            python3 telegram/radar_no_d1.py
            python3 telegram/prune_events.py
            python3 ttittulares/auto_queue.py
            python3 ttittulares/reconcile_state.py
            python3 ttittulares/build_status.py
            python3 telegram/autocheck_ttittulares.py

            git add feed.xml latest.json recent.json state.json archive/ \
              telegram/events.json telegram/processed-events.json telegram/editorial-processing.json \
              telegram/autocheck-status.json telegram/autocheck-alert-state.json ttittulares/status.json

            if git diff --cached --quiet; then
              echo "Radar sin cambios."
              exit 0
            fi

            git commit -m "Actualizar radar TTiTTulares"
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
              echo "Cambio concurrente detectado; recalculando ($intento/4)..."
              sleep $((intento * 2))
              continue
            fi

            if git push origin HEAD:main; then
              echo "Radar guardado correctamente."
              exit 0
            fi

            echo "Push concurrente; recalculando ($intento/4)..."
            sleep $((intento * 2))
          done

          echo "ERROR: no se pudo guardar el radar tras 4 recálculos seguros."
          exit 1
