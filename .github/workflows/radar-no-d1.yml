name: Radar editorial sin D1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'telegram/radar-trigger.txt'

permissions:
  contents: write

concurrency:
  group: ttittulares-repo-write
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ejecutar barrido TTiTTulares
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 telegram/radar_no_d1.py
      - name: Guardar estado
        run: |
          git config user.name "tt-control-bot"
          git config user.email "actions@users.noreply.github.com"
          git add telegram/events.json telegram/processed-events.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Actualizar estado radar editorial"
          for intento in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((intento * 2))
          done
          echo "ERROR: no se pudo guardar el estado del radar"
          exit 1
