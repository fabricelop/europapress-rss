name: Watchdog radar TTiTTulares

on:
  workflow_dispatch:
  schedule:
    # Desfasado 5 minutos respecto al reloj principal. Solo actúa si el radar
    # lleva demasiado tiempo sin actualizarse.
    - cron: '5,15,25,35,45,55 * * * *'
  push:
    branches: [main]
    paths:
      - ".github/workflows/radar-no-d1.yml"
      - "telegram/radar_no_d1.py"
      - "ttittulares/apply_editorial_outbox.py"
      - "ttittulares/editorial-outbox/**"

permissions:
  contents: write

concurrency:
  # Independiente del workflow monolítico: si este se atasca, el watchdog
  # debe poder recuperar TTiTTulares sin esperar detrás de él.
  group: ttittulares-radar-watchdog
  cancel-in-progress: false

jobs:
  radar-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar frescura del radar
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          force = os.environ.get("EVENT_NAME") in {"workflow_dispatch", "push"}
          stale = force
          age = None
          try:
              data = json.loads(Path("telegram/events.json").read_text(encoding="utf-8"))
              stamp = str(data.get("last_run") or "")
              last = datetime.fromisoformat(stamp.replace("Z","+00:00")).astimezone(timezone.utc)
              age = (datetime.now(timezone.utc) - last).total_seconds()
              if age >= 9 * 60:
                  stale = True
          except Exception as exc:
              print("No se pudo validar last_run:", exc)
              stale = True

          print("RADAR_AGE_SECONDS", None if age is None else round(age, 1))
          print("RADAR_WATCHDOG_STALE", stale)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"stale={'true' if stale else 'false'}\n")
          PY

      - name: Preparar Python
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del radar
        if: steps.freshness.outputs.stale == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet Pillow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Recuperar y guardar radar TTiTTulares
        if: steps.freshness.outputs.stale == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "ttittulares-radar-watchdog"
          git config user.email "actions@users.noreply.github.com"

          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            python3 telegram/radar_no_d1.py
            python3 telegram/prune_events.py
            python3 ttittulares/auto_queue.py
            python3 ttittulares/reconcile_state.py
            python3 ttittulares/apply_editorial_outbox.py
            python3 ttittulares/build_status.py
            python3 telegram/autocheck_ttittulares.py

            git add telegram/events.json telegram/processed-events.json telegram/editorial-processing.json \
              telegram/autocheck-status.json telegram/autocheck-alert-state.json ttittulares/status.json ttittulares/prepared.json ttittulares/editorial-queue.json
            git add -A -- ttittulares/generated-images
            git add -A -- ttittulares/editorial-outbox 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "Radar sin cambios."
              exit 0
            fi

            git commit -m "Recuperar radar TTiTTulares"
            git fetch origin main
            BASE="$(git rev-parse HEAD^)"
            REMOTE="$(git rev-parse origin/main)"

            if [ "$REMOTE" != "$BASE" ]; then
              if git diff --quiet "$BASE" "$REMOTE" -- \
                telegram/events.json \
                telegram/processed-events.json \
                telegram/editorial-processing.json \
                telegram/autocheck-status.json \
                telegram/autocheck-alert-state.json \
                ttittulares/status.json; then
                echo "Cambios concurrentes ajenos a TTiTTulares; integrando."
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "Rebase falló; recalculando ($intento/4)..."
                  sleep $((intento * 2))
                  continue
                fi
              else
                echo "Estado TTiTTulares ya fue actualizado en paralelo; se descarta este snapshot antiguo."
                exit 0
              fi
            fi

            if git push origin HEAD:main; then
              echo "Radar recuperado correctamente."
              exit 0
            fi

            echo "Push concurrente; recalculando ($intento/4)..."
            sleep $((intento * 2))
          done

          echo "ERROR: watchdog no pudo guardar el radar tras 4 intentos."
          exit 1

      - name: Radar todavía fresco
        if: steps.freshness.outputs.stale != 'true'
        run: echo "Radar fresco; watchdog no interviene."
