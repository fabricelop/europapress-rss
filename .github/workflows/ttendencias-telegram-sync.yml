name: TTendencias Telegram Sync

on:
  push:
    branches: [main]
    paths:
      - "trends/recent.json"
      - "trends/telegram-manual-explained.json"
  workflow_dispatch:

concurrency:
  group: ttendencias-telegram-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar tabla TTendencias
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
        run: python3 trends/telegram_bot.py sync
