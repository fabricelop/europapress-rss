name: TTActualidad V8.1 KV decision recovery
on:
  push:
    branches: ['fix/ttactualidad-worker-kv-decisions-20261016']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Confirm worker syntax and decision recovery
        run: |
          cp pilot/ttactualidad-live/worker.js /tmp/ttactualidad-worker-v81.mjs
          node --check /tmp/ttactualidad-worker-v81.mjs
          node pilot/ttactualidad-live/test_worker_live.mjs
      - name: Protect non-live actions and existing UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w=Path('pilot/ttactualidad-live/worker.js').read_text()
          assert "if(!live&&existing.decision!==decision)" in w
          assert "sameRevision" in w and "crypto.subtle.verify" in w
          assert "v8.1-kv-conflict-fix" in w
          ui=Path('pilot/ttactualidad-live/index.html').read_text()
          assert "Pasar a En Elaboraci" in ui
          assert "current-explained>48*3600000" in ui
          assert "https://t.me/TTImages_bot" in ui
          print('Worker changes isolated; UI unchanged')
          PY
  windows-ps51:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'Needs Windows PowerShell 5.1'}
          $path='pilot/ttactualidad-live/Update-TTActualidad-V81-KV.ps1'
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path $path))
          if(@($bytes | Where-Object { $_ -gt 127 }).Count -ne 0){throw 'Non-ASCII installer source'}
          $tokens=$null;$parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$parseErrors) | Out-Null
          if($parseErrors.Count){throw ($parseErrors | Out-String)}
          $script=Get-Content -Raw -LiteralPath $path
          if(!$script.Contains('worker.before-v81-')){throw 'No local rollback'}
          if(!$script.Contains('v8.1-kv-conflict-fix')){throw 'No exact version verification'}
          if(!$script.Contains('crypto.subtle.verify')){throw 'Session regression'}
          if($script.Contains('site\\index.html') -and $script.Contains('WriteAllText($site')){throw 'Do not modify UI'}
          $worker=[IO.File]::ReadAllText((Resolve-Path 'pilot/ttactualidad-live/worker.js'),[Text.Encoding]::UTF8)
          foreach($marker in @('v8.1-kv-conflict-fix','if(!live&&existing.decision!==decision)')){
           if(!$worker.Contains($marker)){throw ('Worker marker missing: '+$marker)}
          }
          Write-Host 'WINDOWS_PS51_V81_OK'
