name: Rechazar generador IA legado

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "trends/image-jobs/**"
      - "ttittulares/image-jobs/**"
      - ".github/workflows/ai-image-generate.yml"

permissions:
  contents: read

jobs:
  reject-legacy-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que no se usa el generador legado
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jobs=(trends/image-jobs/*.json ttittulares/image-jobs/*.json)
          if ((${#jobs[@]})); then
            printf 'Los jobs visuales heredados ya no se procesan. ImageGen debe ejecutarse en el mismo chat editorial y entregar un image-outbox V3.\n' >&2
            printf 'Job legado: %s\n' "${jobs[@]}" >&2
            exit 1
          fi
          echo "LEGACY_AI_IMAGE_GENERATOR_DISABLED"

# Barrera de seguridad: no llama a Vercel/OpenAI, no rasteriza SVG y no escribe
# ai_image. Solo se admite ImageGen desde el chat ejecutor mediante image-outbox V3.
