name: Prueba Telegram raster ImageGen

on:
  push:
    branches: [main]
    paths:
      - "ttittulares/generated-images/telegram-test-lobato-20261004-*"
      - "telegram/image-delivery-test-trigger.txt"

permissions:
  contents: read

concurrency:
  group: telegram-imagegen-delivery-test
  cancel-in-progress: false

jobs:
  send-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Localizar o reconstruir raster
        id: image
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'ttittulares/generated-images/telegram-test-lobato-20261004-*' | head -n 1 || true)"
          if [ -n "$FILE" ] && [ -f "$FILE" ]; then
            echo "Usando raster materializado: $FILE"
          else
            shopt -s nullglob
            chunks=(telegram/image-delivery-test-chunks/*.b64)
            test "${#chunks[@]}" -gt 0
            cat "${chunks[@]}" | tr -d '\r\n' | base64 --decode > /tmp/telegram-image.jpg
            FILE="/tmp/telegram-image.jpg"
            echo "Raster reconstruido desde bloques de prueba."
          fi
          test -s "$FILE"
          echo "2641eb6b3456dc54b4b9d1ceca4bc1b7163fc0969c84d00d3eb5ba8ac671d2f5  $FILE" | sha256sum -c -
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          file "$FILE"

      - name: Preparar caption y botones
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse
          from pathlib import Path
          d=json.loads(Path("telegram/image-delivery-test.json").read_text(encoding="utf-8"))
          tweet=str(d["tweet_text"])
          if len(tweet)>256:
              raise SystemExit(f"Tweet de prueba demasiado largo: {len(tweet)}/256")
          caption="🧪 PRUEBA FINAL TTiTTulares → Telegram\n\n"+tweet
          target=str(d["target_id"])
          raw_image="https://raw.githubusercontent.com/fabricelop/europapress-rss/main/ttittulares/generated-images/telegram-test-lobato-20261004-r1.jpg"
          copy_url="https://tt-control.fabricelop.workers.dev/copy-image?"+urllib.parse.urlencode({"src":raw_image})
          x_url="https://tt-control.fabricelop.workers.dev/x-compose?"+urllib.parse.urlencode({"text":tweet})
          keyboard={
              "inline_keyboard":[
                  [{"text":"🖼️ Copiar imagen","url":copy_url}],
                  [
                      {"text":"📋 Copiar tuit","copy_text":{"text":tweet}},
                      {"text":"✍️ Abrir en X","url":x_url}
                  ],
                  [
                      {"text":"🗑 Desestimar","callback_data":"tt:d:"+target},
                      {"text":"✅ Publicado","callback_data":"tt:p:"+target}
                  ]
              ]
          }
          Path("/tmp/tt-caption.txt").write_text(caption,encoding="utf-8")
          Path("/tmp/tt-reply.json").write_text(json.dumps(keyboard,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          print(f"Tweet: {len(tweet)}/256")
          PY

      - name: Enviar fichero real a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMAGE_FILE: ${{ steps.image.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "photo=@${IMAGE_FILE}" \
            --form-string "caption=$(cat /tmp/tt-caption.txt)" \
            --form-string "reply_markup=$(cat /tmp/tt-reply.json)")"
          printf '%s\n' "$RESPONSE" > /tmp/telegram-response.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/telegram-response.json",encoding="utf-8"))
          if not d.get("ok"):
              raise SystemExit("Telegram no confirmó el envío: "+json.dumps(d,ensure_ascii=False))
          m=d.get("result") or {}
          photos=m.get("photo") or []
          print("TELEGRAM_SENDPHOTO_OK")
          print("message_id="+str(m.get("message_id")))
          print("photo_sizes="+str(len(photos)))
          PY
