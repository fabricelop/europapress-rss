name: Procesar decisiones TTiTTulares Telegram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "telegram/emergency-requests.json"
      - "telegram/ttittulares-callback-inbox.json"
      - ".github/workflows/process-ttittulares-telegram-decisions.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: ttittulares-telegram-decisions
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Aplicar Publicado o Desestimar
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, os, urllib.request, urllib.error
          from datetime import datetime, timezone

          ROOT=pathlib.Path(".")
          now=datetime.now(timezone.utc).isoformat().replace("+00:00","Z")

          def load(path,default):
              p=ROOT/path
              try:
                  raw=p.read_text(encoding="utf-8").strip()
                  return json.loads(raw) if raw else default
              except Exception:
                  return default

          def save(path,obj):
              p=ROOT/path
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          req=load("telegram/emergency-requests.json",{"requests":[]})
          callbacks=load("telegram/ttittulares-callback-inbox.json",{"requests":[]})
          state=load("telegram/ttittulares-decision-events.json",{"version":1,"processed":[]})
          processed_ids={str(x.get("update_id")) for x in state.get("processed",[]) if x.get("update_id") is not None}
          token=os.environ.get("TELEGRAM_BOT_TOKEN","").strip()
          # Delivery IDs are public, but the private Telegram chat ID and bot token
          # are never written to this public repository.
          authoritative_deliveries=load("telegram/ttittulares-deliveries.json",{"items":[]}).get("items",[])

          actions=[]
          candidates=[*req.get("requests",[]),*callbacks.get("requests",[])]
          for row in candidates:
              uid=str(row.get("update_id"))
              if uid in processed_ids:
                  continue
              if str(row.get("type") or "")!="emergency_action":
                  continue
              text=str(row.get("text") or "")
              if "|" not in text:
                  continue
              action,eid=text.split("|",1)
              eid=eid.strip()
              if action not in {"ttp","ttd"} or not eid:
                  continue
              if row.get("source")=="ttittulares_cloudflare_callback_v1":
                  qid=str(row.get("callback_query_id") or "")
                  mid=int(row.get("message_id") or 0)
                  linked=any(str(x.get("event_id") or "")==eid
                             and mid in [int(x.get("telegram_message_id") or 0),
                                         int(x.get("archive_telegram_message_id") or 0)]
                             for x in authoritative_deliveries)
                  if not linked or not qid or not token:
                      print("TTITTULARES_CALLBACK_REJECTED",uid,"reason=unlinked_message_or_missing_bot")
                      continue
                  payload=json.dumps({"callback_query_id":qid,"text":"Registrando decisión…"}).encode("utf8")
                  try:
                      request=urllib.request.Request(
                        "https://api.telegram.org/bot"+token+"/answerCallbackQuery",
                        data=payload,headers={"content-type":"application/json"})
                      with urllib.request.urlopen(request,timeout=18) as response:
                          answer=json.load(response)
                      if not answer.get("ok"):
                          print("TTITTULARES_CALLBACK_REJECTED",uid,"reason=telegram_not_confirmed")
                          continue
                  except Exception as exc:
                      print("TTITTULARES_CALLBACK_REJECTED",uid,"reason=callback_expired_or_invalid",type(exc).__name__)
                      continue
                  print("TTITTULARES_CALLBACK_VERIFIED",uid,eid,action)
              actions.append((row,action,eid))

          if not actions:
              print("TTITTULARES_DECISIONS_NEW=0")
              raise SystemExit(0)

          decisions=load("ttittulares/decisions.json",{"project":"TTiTTulares","items":[]})
          prepared=load("ttittulares/prepared.json",{"project":"TTiTTulares","items":[]})
          editorial=load("telegram/editorial-processing.json",{"items":[]})
          events=load("telegram/events.json",{"events":[]})
          manual=load("ttittulares/manual-submissions.json",{"items":[]})
          deliveries=load("telegram/ttittulares-deliveries.json",{"version":3,"items":[]})
          deleteq=load("telegram/delete-message-queue.json",{"version":1,"items":[]})

          decisions["items"]=decisions.get("items") or []
          editorial["items"]=editorial.get("items") or []
          events["events"]=events.get("events") or []
          manual["items"]=manual.get("items") or []
          deliveries["items"]=deliveries.get("items") or []
          deleteq["items"]=deleteq.get("items") or []

          existing_delete={int(x.get("message_id") or 0) for x in deleteq["items"]}

          for row,action,eid in actions:
              status="published" if action=="ttp" else "dismissed"
              terminal="PUBLISHED" if status=="published" else "DISMISSED"
              field="published_at" if status=="published" else "dismissed_at"

              drow=next((x for x in decisions["items"] if str(x.get("event_id") or "")==eid),None)
              if drow is None:
                  drow={"event_id":eid}; decisions["items"].append(drow)
              drow.update({"status":status,"updated_at":now,"decision_source":"telegram_emergency_callback"})

              prepared["items"]=[x for x in (prepared.get("items") or []) if str(x.get("event_id") or "")!=eid]

              for x in editorial["items"]:
                  if str(x.get("event_id") or x.get("id") or "")==eid:
                      x["status"]=terminal; x[field]=now; x["decision_source"]="telegram_emergency_callback"

              for x in events["events"]:
                  if str(x.get("id") or x.get("event_id") or "")==eid:
                      x["status"]=terminal; x[field]=now; x["decision_source"]="telegram_emergency_callback"

              for x in manual["items"]:
                  if str(x.get("event_id") or "")==eid:
                      x["status"]=terminal; x["updated_at"]=now; x["decision_source"]="telegram_emergency_callback"

              mids=[]
              for x in deliveries["items"]:
                  if str(x.get("event_id") or "")!=eid:
                      continue
                  if str(x.get("status") or "").lower() in {"sent",status}:
                      x["status"]=status; x[field]=now; x["decision_source"]="telegram_emergency_callback"
                      for k in ("telegram_message_id","archive_telegram_message_id"):
                          mid=int(x.get(k) or 0)
                          if mid and mid not in mids:
                              mids.append(mid)

              for mid in mids:
                  if mid not in existing_delete:
                      deleteq["items"].append({
                          "message_id":mid,
                          "event_id":eid,
                          "reason":status+"_telegram_callback",
                          "status":"pending"
                      })
                      existing_delete.add(mid)

              state.setdefault("processed",[]).append({
                  "update_id":row.get("update_id"),
                  "event_id":eid,
                  "action":action,
                  "status":status,
                  "processed_at":now,
                  "message_ids":mids
              })
              print("TTITTULARES_DECISION_APPLIED",eid,status,"messages",",".join(map(str,mids)))

          for doc in (decisions,prepared,editorial,events,manual,deliveries,deleteq,state):
              doc["updated_at"]=now

          save("ttittulares/decisions.json",decisions)
          save("ttittulares/prepared.json",prepared)
          save("telegram/editorial-processing.json",editorial)
          save("telegram/events.json",events)
          save("ttittulares/manual-submissions.json",manual)
          save("telegram/ttittulares-deliveries.json",deliveries)
          save("telegram/delete-message-queue.json",deleteq)
          state["processed"]=state.get("processed",[])[-1000:]
          save("telegram/ttittulares-decision-events.json",state)
          print("TTITTULARES_DECISIONS_NEW="+str(len(actions)))
          PY

      - name: Guardar cierres
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in ttittulares/decisions.json ttittulares/prepared.json telegram/editorial-processing.json telegram/events.json ttittulares/manual-submissions.json telegram/ttittulares-deliveries.json telegram/delete-message-queue.json telegram/ttittulares-decision-events.json; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Sin decisiones nuevas."
            exit 0
          fi
          git commit -m "Aplicar decisión TTiTTulares desde Telegram"
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if git rebase origin/main; then
              continue
            fi
            git rebase --abort || true
            sleep $((n*2))
          done
          echo "No se pudo persistir la decisión Telegram" >&2
          exit 1


      - name: Borrar inmediatamente mensajes cerrados
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error

          token=os.environ.get("TELEGRAM_BOT_TOKEN","").strip()
          chat=os.environ.get("TELEGRAM_CHAT_ID","").strip()
          if not token or not chat:
              raise SystemExit("Faltan TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID")

          qpath=pathlib.Path("telegram/delete-message-queue.json")
          if not qpath.exists():
              print("TTITTULARES_DELETE_IMMEDIATE=0")
              raise SystemExit(0)

          doc=json.loads(qpath.read_text(encoding="utf-8"))
          pending=[x for x in doc.get("items",[]) if str(x.get("status") or "")=="pending"]
          ok=0
          for row in pending:
              mid=int(row.get("message_id") or 0)
              if not mid:
                  continue
              payload=json.dumps({"chat_id":chat,"message_id":mid}).encode("utf-8")
              req=urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/deleteMessage",
                  data=payload,
                  headers={"content-type":"application/json"}
              )
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      out=json.loads(r.read().decode("utf-8"))
                  if out.get("ok"):
                      ok+=1
                      print("TTITTULARES_DELETE_IMMEDIATE_OK",mid)
                  else:
                      print("TTITTULARES_DELETE_IMMEDIATE_WARNING",mid,out.get("description"))
              except urllib.error.HTTPError as e:
                  body=e.read().decode("utf-8","replace")
                  # Si Telegram dice que el mensaje ya no existe, el objetivo ya está cumplido.
                  if "message to delete not found" in body.lower():
                      ok+=1
                      print("TTITTULARES_DELETE_IMMEDIATE_ALREADY_GONE",mid)
                  else:
                      print("TTITTULARES_DELETE_IMMEDIATE_WARNING",mid,e.code,body[:300])
              except Exception as e:
                  print("TTITTULARES_DELETE_IMMEDIATE_WARNING",mid,str(e))
          print("TTITTULARES_DELETE_IMMEDIATE="+str(ok))
          PY

      - name: Lanzar borrado de respaldo
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run delete-ttittulares-telegram-messages.yml --repo "$REPO" --ref main
