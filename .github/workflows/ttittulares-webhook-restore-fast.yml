name: TTiTTulares Cloudflare webhook watchdog (no checkout)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttittulares-webhook-restore-fast.yml'
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
permissions:
  contents: read
concurrency:
  group: ttittulares-webhook-watchdog
  cancel-in-progress: false
jobs:
  verify-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Verify TTit Worker and Telegram; repair webhook only if wrong
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${TELEGRAM_BOT_TOKEN:-}" ]] || { echo 'Bot credential unavailable'; exit 2; }
          # Never re-enable Cloudflare after the explicitly gated native cutover.
          if python3 - <<'PY'
          import json,urllib.request
          url='https://raw.githubusercontent.com/fabricelop/europapress-rss/main/telegram/ttittulares-transport.json'
          with urllib.request.urlopen(url,timeout=18) as response:
              cfg=json.load(response)
          active=cfg.get('mode')=='native' and cfg.get('native_ready') is True
          print('TTITTULARES_NATIVE_TRANSPORT_ACTIVE' if active else 'TTITTULARES_WEBHOOK_TRANSPORT')
          raise SystemExit(0 if active else 1)
          PY
          then
            echo 'TTITTULARES_NATIVE_TRANSPORT_SKIP_WEBHOOK_REPAIR'
            exit 0
          fi
          curl -fsS --retry 2 --max-time 20 \
            https://ttittulares-no-vercel-test.fabricelop.workers.dev/health \
            -o /tmp/ttit.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ttit.json'))
          assert d.get('ok') and d.get('service')=='ttittulares-cloudflare'
          print('TTiTTulares Cloudflare health: OK')
          PY
          target='https://tt-control.fabricelop.workers.dev/api/telegram-webhook'
          curl -fsS --max-time 25 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" -o /tmp/telegram-before.json
          current=$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/telegram-before.json')).get('result',{}).get('url',''))
          PY
          )
          if [[ "$current" != "$target" ]]; then
            echo "::warning::TTiTTulares Telegram webhook drift detected: $current"
            curl -fsS --retry 2 --max-time 25 \
              https://tt-control.fabricelop.workers.dev/api/ttittulares-webhook-version \
              -o /tmp/receiver.json
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/receiver.json'))
          assert str(d.get('version','')).startswith('2026-10-04-telegram')
          print('Cloudflare Telegram receiver: OK')
          PY
            # El Worker conserva secret_token cifrado: nunca registrar un webhook inseguro.
            curl -fsS --retry 2 --max-time 30 \
              'https://tt-control.fabricelop.workers.dev/api/telegram-webhook-self-heal-20261004' \
              -o /tmp/set.json
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/set.json'))
          assert d.get('ok') is True
          print('TTITTULARES_WEBHOOK_AUTO_REPAIRED_WITH_SECRET')
          PY
          fi
          curl -fsS --max-time 30 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" -o /tmp/telegram-after.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/telegram-after.json')).get('result',{})
          expected='https://tt-control.fabricelop.workers.dev/api/telegram-webhook'
          print('TTITTULARES_WEBHOOK_STATUS '+json.dumps({k:d.get(k) for k in ('url','pending_update_count','last_error_date','last_error_message')},ensure_ascii=False))
          assert d.get('url')==expected,'Webhook points away from Cloudflare'
          print('TTITTULARES_WEBHOOK_HEALTHY')
          PY
          # /run needs an authenticated GitHub writer and a Telegram bot token.
          curl -fsS --retry 2 --max-time 25 \
            'https://tt-control.fabricelop.workers.dev/api/ttittulares-webhook-version' \
            -o /tmp/ttittulares-webhook-prereqs.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/ttittulares-webhook-prereqs.json',encoding='utf8'))
          expected=['github_token_available','telegram_bot_available',
                    'webhook_secret_available']
          status={key:bool(data.get(key)) for key in expected}
          print('TTITTULARES_RUN_PREREQUISITES '+json.dumps(status))
          # GitHub token is deliberately absent from TT Control.
          # The authenticated service binding provides it via the editorial
          # Worker. Verify that relay has a working bot credential and rejects
          # public requests before treating /run as ready.
          assert status['telegram_bot_available'] and status['webhook_secret_available'],status
          PY
          curl -fsS --retry 2 --max-time 25 \
            'https://ttittulares-no-vercel-test.fabricelop.workers.dev/api/ttittulares-telegram-credential-ready' \
            -o /tmp/ttittulares-native-relay-credential.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ttittulares-native-relay-credential.json'))
          assert d.get('telegram_callback_credential_ready') and d.get('ok'),d
          print('TTITTULARES_INTERNAL_RELAY_CREDENTIAL_READY')
          PY
          unauth=$(curl -sS --max-time 25 -X POST \
            -H 'Content-Type: application/json' -d '{}' \
            -o /tmp/ttittulares-internal-relay-unauth.json -w '%{http_code}' \
            'https://ttittulares-no-vercel-test.fabricelop.workers.dev/api/ttittulares-telegram-editorial-run')
          [[ "$unauth" == "401" ]] || { echo "TTITTULARES_RUN_RELAY_NOT_READY: HTTP=$unauth"; exit 1; }
          echo 'TTITTULARES_RUN_RELAY_READY_AUTHENTICATED_SERVICE_BINDING'
