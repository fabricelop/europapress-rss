name: TTiTTulares manual run bridge

on:
  push:
    branches:
      - main
    paths:
      - "ttittulares/run-now-trigger.json"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ttittulares-manual-run-bridge
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Read trigger
        id: trigger
        uses: actions/github-script@v7
        with:
          script: |
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "ttittulares/run-now-trigger.json",
              ref: context.sha
            });
            const doc = JSON.parse(Buffer.from(file.content, "base64").toString("utf8"));
            const commandId = String(doc.command_id || "").trim();
            const requestedAt = String(doc.requested_at || "").trim();
            const mode = String(doc.mode || "manual").trim();
            if (!commandId || !requestedAt) {
              core.setFailed("Trigger incompleto");
              return;
            }
            if (!["manual","smoke"].includes(mode)) {
              core.setFailed("Modo no permitido: " + mode);
              return;
            }
            core.setOutput("body", [
              "RUN TTITTULARES",
              "command_id: " + commandId,
              "requested_at: " + requestedAt,
              "mode: " + mode
            ].join("\n"));

      - name: Comment permanent trigger PR
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.trigger.outputs.body }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              body: process.env.BODY
            });
