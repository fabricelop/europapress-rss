name: TT imagenes sin guindillas
on:
  workflow_dispatch:
  push:
    branches: [main, fix/tt-images-no-guindilla-20261016]
    paths:
      - windows/TTiTTularesImageBridge.js
      - windows/TTendenciasImageBridge.js
      - windows/test-image-no-guindilla.cjs
      - .github/workflows/repair-ttittulares-listas.yml
      - .github/workflows/repair-ttendencias-explicadas.yml
      - ttittulares/editorial-run-prompt.md
      - trends/editorial-run-prompt.md
      - trends/editorial-style.md
      - .github/workflows/tt-image-no-pepper-policy.yml
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis y prompts de imagen
        run: |
          node --check windows/TTiTTularesImageBridge.js
          node --check windows/TTendenciasImageBridge.js
          node --check windows/test-image-no-guindilla.cjs
          node windows/test-image-no-guindilla.cjs
