name: Verificar estados y botón Preparar TT Actualidad
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "trends/auto_queue_new.py"
      - ".github/scripts/test_tt_actualidad_top_status.py"
      - ".github/scripts/test_ttendencias_top30_queue.py"
      - ".github/workflows/verify-tt-actualidad-top-status.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/index.html
            /trends/auto_queue_new.py
            /.github/scripts/test_tt_actualidad_top_status.py
            /.github/scripts/test_ttendencias_top30_queue.py
      - name: Comprobar sintaxis JS e invariantes de TT Actualidad
        run: |
          python3 .github/scripts/test_tt_actualidad_top_status.py
          python3 - <<'PY'
          from pathlib import Path
          html=Path("docs/index.html").read_text(encoding="utf8")
          assert "<script>" in html and "</script>" in html
          script=html.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/tt-actualidad-main.js").write_text(script,encoding="utf8")
          PY
          node --check /tmp/tt-actualidad-main.js
      - name: Comprobar Top10 automático y preparación 11-30 manual
        run: python3 .github/scripts/test_ttendencias_top30_queue.py
