name: Deploy Vercel Production Manual

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/deploy-vercel-production-trigger"

permissions:
  contents: read

concurrency:
  group: vercel-production-manual
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_H8xHbBIbIKnsaLeITszidyOK
      VERCEL_PROJECT_ID: prj_X1UxNqQasd8Ouf7jUpxNccbQdASf
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preflight TT
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          COUNT=$(find vercel-webhook/api -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')
          echo "Vercel Functions candidatas: $COUNT"
          test "$COUNT" = "6"
          node --check vercel-webhook/api/ttittulares-control.js
          node --check vercel-webhook/api/ttendencias-control.js
          node --check vercel-webhook/api/telegram-webhook.js
          node --check vercel-webhook/api/ai-image.js
          node --check vercel-webhook/api/money-control-snapshot.js
          node --check vercel-webhook/api/money-control-interpret.js

      - name: Validar listeners PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($p in @("windows/TTiTTularesDedicatedListener.ps1","windows/TTendenciasDedicatedListener.ps1","windows/TT-AutoUpdater.ps1")) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p), [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "$p :: $($_.Message)" }
              throw "PowerShell syntax error: $p"
            }
            Write-Host "OK $p"
          }

      - name: Build production
        shell: bash
        run: |
          set -euo pipefail
          # El proyecto Vercel ya tiene rootDirectory=vercel-webhook.
          # Ejecutar CLI desde la raíz evita resolver vercel-webhook/vercel-webhook.
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production prebuilt
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tee /tmp/vercel-url.txt
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 /tmp/vercel-url.txt >> "$GITHUB_STEP_SUMMARY"
