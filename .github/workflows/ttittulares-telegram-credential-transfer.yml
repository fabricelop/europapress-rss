name: 'TTiTTulares - transferir credenciales Telegram cifradas'
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ttittulares-telegram-credential-transfer.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ttittulares-telegram-webhook-registration
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comprobar clave pública del receptor y secretos existentes
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}" && test -n "${TELEGRAM_CHAT_ID:-}"
          curl -fsS --retry 4 --retry-delay 3 --max-time 25             https://raw.githubusercontent.com/fabricelop/tt-control/main/tt-control/telegram-public.pem             -o /tmp/tt-control-public.pem
          openssl pkey -pubin -in /tmp/tt-control-public.pem -noout >/dev/null
          echo 'TELEGRAM_ENCRYPTION_PUBLIC_KEY_READY'
      - name: Cifrar tres credenciales con RSA-OAEP (nunca guardarlas en claro)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,json,secrets,subprocess,base64,pathlib
          key='/tmp/tt-control-public.pem'
          secret=secrets.token_urlsafe(48)
          pathlib.Path('/tmp/tt-secret-for-registration').write_text(secret,encoding='ascii')
          def enc(value):
              args=['openssl','pkeyutl','-encrypt','-pubin','-inkey',key,
                    '-pkeyopt','rsa_padding_mode:oaep',
                    '-pkeyopt','rsa_oaep_md:sha256','-pkeyopt','rsa_mgf1_md:sha256']
              p=subprocess.run(args,input=value.encode('utf8'),stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
              return base64.b64encode(p.stdout).decode('ascii')
          payload={'version':1,'algorithm':'RSA-OAEP-SHA256',
                   'bot_token':enc(os.environ['TELEGRAM_BOT_TOKEN']),
                   'chat_id':enc(os.environ['TELEGRAM_CHAT_ID']),
                   'webhook_secret':enc(secret)}
          path=pathlib.Path('telegram/ttittulares-chat-credential.enc.json')
          path.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n',encoding='utf8')
          print('TT_TELEGRAM_CREDENTIALS_ENCRYPTED_NO_PLAINTEXT')
          PY
      - name: Persistir cifrado y no perder actualizaciones concurrentes
        shell: bash
        run: |
          set -euo pipefail
          cp telegram/ttittulares-chat-credential.enc.json /tmp/chat-credential.enc.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/chat-credential.enc.json telegram/ttittulares-chat-credential.enc.json
            git add telegram/ttittulares-chat-credential.enc.json
            git diff --cached --quiet && break
            git commit -m "Guardar credenciales Telegram RSA cifradas para chat TTiTTulares"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
      - name: Exigir que Cloudflare pueda descifrar antes de tocar el webhook
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 16); do
            curl -fsS --max-time 20               'https://tt-control.fabricelop.workers.dev/api/ttittulares-webhook-version'               -o /tmp/telegram-worker-ready.json || true
            if python3 - <<'PY'
          import json
          d=json.load(open('/tmp/telegram-worker-ready.json'))
          keys=('telegram_bot_available','telegram_chat_available','webhook_secret_available')
          assert all(d.get(k) is True for k in keys)
          print('TELEGRAM_DECRYPTION_VALIDATED_NO_SECRET_EXPOSED')
          PY
            then ready=1; break; fi
            sleep 5
          done
          test "$ready" = 1
      - name: Registrar webhook de Telegram autenticado y verificar sin mensajes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request
          secret=open('/tmp/tt-secret-for-registration',encoding='ascii').read().strip()
          payload=json.dumps({
             'url':'https://tt-control.fabricelop.workers.dev/api/telegram-webhook',
             'secret_token':secret,
             'allowed_updates':['callback_query','message'],
             'drop_pending_updates':False
          }).encode('utf8')
          base='https://api.telegram.org/bot'+os.environ['TELEGRAM_BOT_TOKEN']+'/'
          req=urllib.request.Request(base+'setWebhook',data=payload,headers={'content-type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as response:
              result=json.load(response)
          assert result.get('ok') is True
          with urllib.request.urlopen(base+'getWebhookInfo',timeout=30) as response:
              info=json.load(response).get('result') or {}
          assert info.get('url')=='https://tt-control.fabricelop.workers.dev/api/telegram-webhook'
          print('TT_TELEGRAM_CHAT_SECURE_WEBHOOK_OK '+json.dumps({
              k:info.get(k) for k in ('pending_update_count','last_error_message')
          },ensure_ascii=False))
          PY
          rm -f /tmp/tt-secret-for-registration /tmp/chat-credential.enc.json
