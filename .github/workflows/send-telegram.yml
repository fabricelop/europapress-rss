name: Enviar TTiTTulares a Telegram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "telegram/latest.json"

concurrency:
  group: ttittulares-telegram
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enviar mensajes a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          with open("telegram/latest.json", encoding="utf-8") as f:
              data = json.load(f)

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          api = f"https://api.telegram.org/bot{token}/sendMessage"

          for msg in data.get("messages", []):
              payload = {
                  "chat_id": chat_id,
                  "text": msg["text"],
                  "disable_web_page_preview": True
              }

              buttons = msg.get("buttons", [])
              if buttons:
                  keyboard = []
                  for b in buttons:
                      button = {"text": b["label"]}
                      if b.get("url"):
                          button["url"] = b["url"]
                      elif b.get("callback_data"):
                          button["callback_data"] = b["callback_data"]
                      else:
                          raise ValueError(f"Botón sin url ni callback_data: {b}")
                      keyboard.append([button])
                  payload["reply_markup"] = {"inline_keyboard": keyboard}

              req = urllib.request.Request(
                  api,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"}
              )

              with urllib.request.urlopen(req) as r:
                  result = json.loads(r.read().decode("utf-8"))
                  if not result.get("ok"):
                      raise RuntimeError(result)

              print("Mensaje enviado.")
          PY
