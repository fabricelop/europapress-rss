name: TTN2 INC safe read-only audit
on:
  push:
    branches: [feature/ttactualidad-v2-news-inc-audit-20261118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check live public endpoints and recent D1 action counts (no writes)
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,datetime
          token=os.environ.get("CLOUDFLARE_API_TOKEN","")
          account=os.environ.get("CLOUDFLARE_ACCOUNT_ID","")
          headers={"User-Agent":"TTN2-INC-Audit/1.0","Accept":"application/json"}
          origin="https://ttactualidad-v2-private-test.fabricelop.workers.dev"
          def get(url,headers):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=20) as resp:return json.load(resp)
          for path in ["/health","/api/public-news-controls","/api/public-news"]:
            try:
              v=get(origin+path,headers)
              print("INC_PUBLIC",path,"health",v.get("ok"),"source",v.get("source"),"items",len(v.get("items",[])) if isinstance(v.get("items"),list) else None,"revision",v.get("schema_version"))
            except Exception as e:print("INC_PUBLIC_ERROR",path,type(e).__name__,getattr(e,"code",""))
          if not token or not account:
            print("INC_D1_AUDIT_UNAVAILABLE_MISSING_CREDENTIALS")
            raise SystemExit(0)
          api="https://api.cloudflare.com/client/v4/accounts/"+account
          private={**headers,"Authorization":"Bearer "+token}
          try:
            v=get(api+"/workers/scripts/ttactualidad-v2-private-test/settings",private)
            binds={b.get("name"):b for b in (v.get("result") or {}).get("bindings",[])}
            dbid=(binds.get("MARKS_DB") or {}).get("id") or (binds.get("MARKS_DB") or {}).get("database_id")
            if not dbid:print("INC_D1_AUDIT_UNAVAILABLE_NO_BINDING");raise SystemExit(0)
            endpoint=api+"/d1/database/"+dbid+"/query"
            def query(sql):
              data=json.dumps({"sql":sql}).encode()
              req=urllib.request.Request(endpoint,data=data,headers={**private,"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=30) as response:result=json.load(response)
              if result.get("success") is not True:raise RuntimeError("D1_QUERY_FAILED")
              groups=result.get("result") or []
              return (groups[0].get("results") or []) if groups else []
            for label,sql in [
              ("total_actions","SELECT count(*) AS total, max(created_at) AS last_at FROM news_actions"),
              ("recent_actions","SELECT json_extract(body, '$.action') AS action, count(*) AS count, max(created_at) AS last_at FROM news_actions WHERE created_at >= '2026-11-18T17:00:00Z' GROUP BY json_extract(body, '$.action') ORDER BY count DESC"),
              ("latest_inc_actions","SELECT json_extract(body, '$.action') AS action,created_at FROM news_actions WHERE json_extract(body, '$.action') IN ('dismiss','retry_editorial') ORDER BY created_at DESC LIMIT 14"),
              ("preferences","SELECT count(*) AS total, sum(CASE WHEN json_extract(body,'$.incident_hidden')=1 THEN 1 ELSE 0 END) AS suppressed, sum(CASE WHEN json_extract(body,'$.editorial_retry_requested')=1 THEN 1 ELSE 0 END) AS retry_requested FROM news_preferences"),
            ]:
              try:print("INC_D1",label,json.dumps(query(sql),ensure_ascii=False))
              except Exception as e:print("INC_D1_QUERY_ERROR",label,type(e).__name__,getattr(e,"code",""))
          except Exception as e:print("INC_D1_AUDIT_ERROR",type(e).__name__,getattr(e,"code",""))
          PY
