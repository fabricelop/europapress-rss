name: TTActualidad live readonly smoke 2026-10-18
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttactualidad-live-smoke-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Live Worker health (no write, no old pages)
        shell: bash
        run: |
          set -euo pipefail
          base="https://ttactualidad-decisions-pilot.fabricelop.workers.dev"
          curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 7 --max-time 25 \
            -D /tmp/tt-health.headers -o /tmp/tt-health.json "$base/health"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/tt-health.json'))
          assert d.get('ok') is True, f"Worker health not OK: {d}"
          assert d.get('kind')=='ttactualidad-direct-live',f"Unexpected Worker architecture: {d}"
          print('LIVE_HEALTH_OK kind=',d['kind'],'version=',d.get('version'),'production_connected=',d.get('production_connected'),'session_auth=',d.get('session_auth'))
          PY
      - name: Normal TTActualidad app active over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          base="https://ttactualidad-decisions-pilot.fabricelop.workers.dev"
          curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 7 --max-time 25 \
            -D /tmp/tt-ui.headers -o /tmp/tt-ui.html "$base/"
          python3 - <<'PY'
          s=open('/tmp/tt-ui.html',encoding='utf8').read()
          wanted=('TTActualidad','ttittulares','ttendencias','Top 30','En elaboración','Creciendo','Tremending','Listas','Quitar de Listas','TTImages')
          missing=[x for x in wanted if x not in s]
          if missing: raise AssertionError('Unexpected/stale Worker UI missing: '+', '.join(missing))
          assert 'location.origin' in s or '/api/decision' in s
          # Read-only architecture/version probe. A missing NEW marker means
          # GitHub main is newer than the deployed Worker; never redeploy here.
          markers={
              'top30_separates_live_historic':'EXPLICACIÓN HISTÓRICA' in s and "EN LISTAS" in s,
              'combined_iphone_badge':'function badgeCount()' in s,
              'manual_news':'id="manual-open"' in s and '/api/manual-news' in s,
              'original_backend':'/api/decision' in s,
              'historic_browser_ui':'https://t.me/TTiTTulares_bot' in s
          }
          print('LIVE_UI_OK bytes=',len(s),'markers=',len(wanted),'ARCHITECTURE_MARKERS=',markers)
          if not markers['original_backend'] or not markers['manual_news']:
              raise AssertionError('Live worker is missing current direct-action controls')
          PY

      - name: Verify iPhone-facing 48h and stay-in-list UI deployment
        shell: bash
        run: |
          set -euo pipefail
          cloud="https://ttactualidad-decisions-pilot.fabricelop.workers.dev/"
          pages="https://fabricelop.github.io/europapress-rss/ttactualidad/"
          curl -4 -fsSL --retry 2 --connect-timeout 8 --max-time 35 -o /tmp/tt-iphone-cloud.html "$cloud"
          curl -4 -fsSL --retry 2 --connect-timeout 8 --max-time 35 -o /tmp/tt-iphone-pages.html "$pages"
          python3 - <<'PY'
          from pathlib import Path
          origin=Path('/tmp/tt-iphone-cloud.html').read_text(encoding='utf-8')
          backup=Path('/tmp/tt-iphone-pages.html').read_text(encoding='utf-8')
          markers={
            'stay_in_current_tab': "// Stay in the list where the action was performed.",
            'source_card_disappears': 'source_app:state.app,source_tab:state.tab,source_id:',
            'target_visible_from_other_tab': 'op.source_tab!==state.tab||op.source_app!==state.app',
            'no_jump_to_listas_on_completion': 'disponible en Listas sin cambiar de sección.',
            'top30_counter_uses_filtered_items': 'const count=trendRowsFor(key).filter(x=>!isTemporarilyRemoved(x)).length;',
          }
          overall=True
          for label,html in [('ORIGINAL_WORKER',origin),('GITHUB_PAGES_FALLBACK',backup)]:
            found={key:(needle in html) for key,needle in markers.items()}
            legacy_navigation="if(decision==='prepare'||decision==='rework'){state.tab='elaboracion';render();}" in html
            ok=all(found.values()) and not legacy_navigation
            print(label,'bytes=',len(html),'LATEST_BEHAVIOR_PRESENT=',ok,'markers=',found,'old_forced_navigation=',legacy_navigation,flush=True)
            overall &= ok
          assert overall,'Some live iPhone entrypoints still serve an old UI; source changes are not proof of deployment'
          PY
