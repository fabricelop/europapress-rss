name: Remove retired Money Control envs

on:
  push:
    branches: [main]
    paths:
      - ".retire-money-control-envs-trigger"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_ORG_ID: team_H8xHbBIbIKnsaLeITszidyOK
      VERCEL_PROJECT_ID: prj_X1UxNqQasd8Ouf7jUpxNccbQdASf
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Remove retired Money Control environment variables
        shell: bash
        run: |
          set -euo pipefail
          for id in MpAcWO5ZjD29AGU7 cpmiy8OmmdqNcxig; do
            out="$(mktemp)"
            code="$(curl -sS -o "$out" -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$id?teamId=$VERCEL_ORG_ID")"
            case "$code" in
              200|204|404) echo "Retired env $id removed/already absent (HTTP $code)" ;;
              *) echo "Failed to remove retired env $id (HTTP $code)" >&2; cat "$out" >&2; exit 1 ;;
            esac
            rm -f "$out"
          done
