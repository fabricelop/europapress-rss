name: TTiTTulares V2 - Radar automatico cada 15 minutos

# Only the default branch owns the clock. Code and every data write remain in V2.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ttittulares-v2-radar-scheduled.yml']

permissions:
  contents: read

jobs:
  radar-v2:
    uses: fabricelop/europapress-rss/.github/workflows/ttittulares-v2-radar-persist-once.yml@feature/ttactualidad-v2-clean
    permissions:
      contents: write
# The called workflow owns one concurrency group, shared with manual runs.
# Do not add the same concurrency group here: a caller must not hold its callee's lock.
