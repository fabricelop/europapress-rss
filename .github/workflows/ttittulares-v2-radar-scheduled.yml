name: TTiTTulares V2 - Radar automatico cada 15 minutos

# Only the default branch owns the clock. Code and every data write remain in V2.
# 2026-11-17: resynchronization tick after scheduled events stopped firing for hours.
# This push triggers one isolated radar pass without restarting Windows or editorial jobs.
# 2026-11-17: publish compact radar freshness summary and redeploy the verified V2 UI.
# 2026-11-18: isolated wake-up tick after scheduled clock stopped; no worker, image or publication side effects.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar-v2:
    uses: fabricelop/europapress-rss/.github/workflows/ttittulares-v2-radar-persist-once.yml@feature/ttactualidad-v2-clean
    permissions:
      contents: write
# The called workflow owns one concurrency group, shared with manual runs.
# Do not add the same concurrency group here: a caller must not hold its callee's lock.
