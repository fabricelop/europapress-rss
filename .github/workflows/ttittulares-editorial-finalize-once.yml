name: Finalizar corrección editorial TTiTTulares
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ttittulares-editorial-finalize-once.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          git config user.name "ttittulares-editorial"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          ids={'4f505a406f02','e4345623501b'}; now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          qpath=Path('telegram/editorial-processing.json'); ppath=Path('ttittulares/prepared.json'); spath=Path('ttittulares/status.json'); epath=Path('telegram/events.json')
          q=json.loads(qpath.read_text()); p=json.loads(ppath.read_text()); prep={x['event_id']:x for x in p.get('items',[])}
          for x in q.get('items',[]):
            if x.get('event_id') in ids:
              y=prep.get(x['event_id']); ok=y and [v.get('name') for v in y.get('variants',[])]==['Principal','A','B','C'] and all(len(v.get('text',''))<=280 for v in y['variants'])
              if ok:
                x['status']='READY'; x['delivered_at']=now; x['delivery_confirmation']='prepared_web'; x.pop('problem_reason',None); x.pop('checked_at',None)
          q['updated_at']=now; qpath.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n')
          s=json.loads(spath.read_text()); e=json.loads(epath.read_text()); proc=[x for x in q['items'] if x.get('status')=='PROCESSING']; ready=[x for x in q['items'] if x.get('status')=='READY']
          s.update(updated_at=now,processing_count=len(proc),processing_items=[{k:x.get(k) for k in ('event_id','title','url','selected_at','selection_mode','source_count','sources')} for x in proc],ready_count=len(ready),healthy_source_count=e.get('healthy_source_count',s.get('healthy_source_count')),configured_sources=e.get('configured_sources',s.get('configured_sources')),source_failures=e.get('source_failures',[])); spath.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n')
          PY
          git add telegram/editorial-processing.json ttittulares/status.json
          git rm .github/workflows/ttittulares-editorial-finalize-once.yml
          git commit -m "Confirmar editoriales corregidas TTiTTulares"
          git pull --rebase origin main
          git push origin HEAD:main
