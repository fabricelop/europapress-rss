name: Finalizar editorial TTiTTulares una vez

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttittulares-editorial-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalizar items preparados
        run: |
          git config user.name "ttittulares-editorial"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          ids={'4f505a406f02','e4345623501b','1fc958519906'}
          qpath=Path('telegram/editorial-processing.json')
          ppath=Path('ttittulares/prepared.json')
          spath=Path('ttittulares/status.json')
          epath=Path('telegram/events.json')
          q=json.loads(qpath.read_text(encoding='utf-8'))
          p=json.loads(ppath.read_text(encoding='utf-8'))
          prepared={x.get('event_id'):x for x in p.get('items',[]) if isinstance(x,dict)}
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          for item in q.get('items',[]):
              eid=item.get('event_id')
              if eid not in ids or item.get('status')!='PROCESSING':
                  continue
              x=prepared.get(eid)
              ok=(x and [v.get('name') for v in x.get('variants',[])]==['Principal','A','B','C'] and all(len(v.get('text',''))<=280 for v in x.get('variants',[])))
              if not ok:
                  item['status']='PROBLEMATIC'
                  item['problem_reason']='prepared.json no contiene una entrada válida Principal/A/B/C <=280 caracteres'
                  item['checked_at']=now
                  continue
              item['status']='READY'
              item['delivered_at']=now
              item['delivery_confirmation']='prepared_web'
          q['updated_at']=now
          qpath.write_text(json.dumps(q,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          s=json.loads(spath.read_text(encoding='utf-8'))
          e=json.loads(epath.read_text(encoding='utf-8'))
          processing=[x for x in q.get('items',[]) if x.get('status')=='PROCESSING']
          ready=[x for x in q.get('items',[]) if x.get('status')=='READY']
          s['updated_at']=now
          s['processing_count']=len(processing)
          s['processing_items']=[{k:x.get(k) for k in ('event_id','title','url','selected_at','selection_mode','source_count','sources')} for x in processing]
          s['ready_count']=len(ready)
          s['healthy_source_count']=e.get('healthy_source_count',s.get('healthy_source_count'))
          s['configured_sources']=e.get('configured_sources',s.get('configured_sources'))
          s['source_failures']=e.get('source_failures',[])
          spath.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add telegram/editorial-processing.json ttittulares/status.json
          git rm .github/workflows/ttittulares-editorial-finalize-once.yml
          git commit -m "Cerrar cola editorial TTiTTulares preparada"
          git pull --rebase origin main
          git push origin HEAD:main
