name: TTActualidad direct-actions regression tests
on:
  pull_request:
    paths:
      - 'pilot/**'
      - 'ttittulares/request_pc_editorial.py'
      - '.github/workflows/ttactualidad-manual-news.yml'
      - '.github/workflows/ttactualidad-direct-actions.yml'
      - '.github/workflows/ttactualidad-direct-ci.yml'
  push:
    branches: [main]
    paths:
      - 'pilot/apply-ttactualidad-action.py'
      - 'ttittulares/request_pc_editorial.py'
      - '.github/workflows/ttactualidad-manual-news.yml'
      - 'pilot/trends_hints.py'
      - 'pilot/test_trends_hints.py'
      - 'pilot/test_ttactualidad_direct_actions.py'
      - '.github/workflows/ttactualidad-direct-actions.yml'
      - '.github/workflows/ttactualidad-direct-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate direct Listas remove and isolation
        run: |
          python3 -m py_compile pilot/apply-ttactualidad-action.py pilot/trends_hints.py
          python3 -m unittest discover -s pilot -p 'test_ttactualidad_direct_actions.py' -v
          python3 -m unittest discover -s pilot -p 'test_trends_hints.py' -v
          python3 -m py_compile ttittulares/request_pc_editorial.py
          python3 ttittulares/request_pc_editorial.py --selftest
          node pilot/ttactualidad-live/test_worker_live.mjs
          node pilot/ttactualidad-live/test_trend_image.mjs
