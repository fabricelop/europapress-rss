name: TTendencias remate rating checks

on:
  push:
    branches: [main]
    paths:
      - "vercel-webhook/lib/ttendencias-remate-ratings.js"
      - "vercel-webhook/test/ttendencias-remate-ratings.test.js"
      - ".github/workflows/ttendencias-remate-rating-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse source and endpoint
        run: |
          node --check vercel-webhook/lib/ttendencias-remate-ratings.js
          node --check vercel-webhook/api/ttendencias-control.js
      - name: Parse app inline JavaScript
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import os from "node:os";
            import path from "node:path";
            import { execFileSync } from "node:child_process";
            for (const page of ["vercel-webhook/ttendencias/index.html", "vercel-webhook/ttendencias/explicadas/index.html"]) {
              const html = fs.readFileSync(page, "utf8");
              const match = html.match(/<script>([\s\S]*?)<\/script>/);
              if (!match) throw new Error("Missing inline script: " + page);
              const file = path.join(os.tmpdir(), "ttendencias-check-" + path.basename(path.dirname(page)) + ".mjs");
              fs.writeFileSync(file, match[1]);
              execFileSync(process.execPath, ["--check", file], { stdio: "inherit" });
            }
          '
      - name: Validate identity, scores and stale revisions
        run: node --test vercel-webhook/test/ttendencias-remate-ratings.test.js
