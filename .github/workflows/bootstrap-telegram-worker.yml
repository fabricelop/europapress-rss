name: Cargar credenciales Telegram en TT Control

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-telegram-worker.yml"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Cargar credenciales en Worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIDGE_TOKEN: ${{ secrets.TT_CONTROL_BRIDGE_TOKEN }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request, urllib.error
          bridge=os.environ.get("BRIDGE_TOKEN","")
          print("bridge_present",bool(bridge))
          if not bridge: raise SystemExit("BRIDGE_TOKEN_MISSING")
          payload=json.dumps({"token":os.environ["TELEGRAM_BOT_TOKEN"],"chat_id":os.environ["TELEGRAM_CHAT_ID"]}).encode()
          req=urllib.request.Request(
            "https://tt-control.fabricelop.workers.dev/api/telegram-credentials",
            data=payload,
            headers={"Content-Type":"application/json","Authorization":"Bearer "+bridge,"User-Agent":"TelegramBot (like TwitterBot)"}
          )
          try:
            with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode(); print("status",r.status,body)
              if r.status!=200: raise SystemExit(1)
          except urllib.error.HTTPError as e:
            print("status",e.code,e.read().decode()); raise
          PY
