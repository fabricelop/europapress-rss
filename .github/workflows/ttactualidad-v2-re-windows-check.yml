name: TTActualidad V2 - validacion de activacion RE en Windows
on:
  push:
    branches: [feature/ttactualidad-v2-clean]
    paths:
      - 'v2/ttendencias/Activate-V2-RE-Priority.ps1'
      - 'v2/ttendencias/editorial_daemon_v2.py'
      - 'v2/ttendencias/auto_editorial_policy_v2.py'
      - 'v2/ttendencias/sync_private_re_v2.py'
      - 'v2/ttendencias/private-worker/**'
      - 'v2/ttendencias/re_request_v2.py'
      - 'v2/ttendencias/image_worker_v2.py'
      - 'v2/ttendencias/image_job_v2.py'
      - 'v2/ttendencias/image_target_tracker_v2.py'
      - 'v2/ttendencias/chrome_profile_process_v2.py'
      - 'v2/ttendencias/test_chrome_profile_process_v2.py'
      - 'v2/ttendencias/test_image_worker_v2.py'
      - 'v2/ttendencias/Upgrade-V2-Image-Send.ps1'
      - 'v2/ttendencias/Upgrade-V2-Incident-Images.ps1'
      - 'v2/ttendencias/editorial_run_v2.py'
      - '.github/workflows/ttactualidad-v2-re-windows-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight-win:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxis y contrato no destructivo de activacion
        shell: powershell
        run: |
          $file = 'v2/ttendencias/Activate-V2-RE-Priority.ps1'
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $source = Get-Content $file -Raw
          foreach ($marker in @('TT_V2_RE_STAGE_TESTS=OK','TT_V2_RE_WAITING_FOR_CURRENT_JOB=YES','TT_V2_RE_PRIORITY_INSTALLED=YES','TT_V2_RE_ROLLBACK=OK')) {
            if (!$source.Contains($marker)) { throw "Contrato ausente: $marker" }
          }
          if ($source -match '(?i)\b(Stop-Process|Stop-ScheduledTask|taskkill)\b') {
            throw 'La activacion no debe detener procesos a la fuerza'
          }
          Write-Host 'TT_V2_RE_ACTIVATOR_PS51=VALID'
      - name: Pruebas de priorizacion RE y sincronizacion idempotente
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'v2/ttendencias'
          python -m unittest -v test_auto_editorial_v2 test_re_request_v2 test_sync_private_re_v2 test_incident_retry_v2
      - name: Validar actualizacion y contrato general de imagenes RE y RE-X
        shell: powershell
        run: |
          $file = 'v2/ttendencias/Upgrade-V2-Image-Send.ps1'
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $source = Get-Content $file -Raw
          foreach ($marker in @('TT_V2_IMAGE_SEND_INSTALLED=YES','TT_V2_CHROME_EXACT_PROFILE=INSTALLED','TT_V2_EDITORIAL_LOGIC_AND_V1=UNTOUCHED','TT_V2_PUBLICATION=NO')) {
            if (!$source.Contains($marker)) { throw "Contrato ausente: $marker" }
          }
          if ($source -match '(?i)\b(Stop-Process|Stop-ScheduledTask|taskkill)\b') {
            throw 'La actualizacion no debe interrumpir chats ni matar Chrome'
          }
          # Test the exact .NET Framework File.Replace overload used by the
          # installer; a null backup path failed on the owner's Windows PC.
          $folder = Join-Path $env:RUNNER_TEMP ('tt-v2-replace-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $folder | Out-Null
          $sourceFile = Join-Path $folder 'incoming.txt'
          $targetFile = Join-Path $folder 'installed.txt'
          $backupFile = Join-Path $folder 'backup.txt'
          [IO.File]::WriteAllText($sourceFile, 'version2')
          [IO.File]::WriteAllText($targetFile, 'version1')
          [IO.File]::Replace($sourceFile, $targetFile, $backupFile)
          if ([IO.File]::ReadAllText($targetFile) -ne 'version2' -or
              [IO.File]::ReadAllText($backupFile) -ne 'version1') {
            throw 'La sustitucion atomica con backup ha fallado'
          }
          if (!$source.Contains("('replaced-' + `$name)")) {
            throw 'El instalador no usa el backup valido probado'
          }
          Write-Host 'TT_V2_IMAGE_SEND_UPGRADE_PS51=VALID'
      - name: Comprobar imagen inicial y reexplicada con el mismo protocolo
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'v2/ttendencias'
          python -m pip install --disable-pip-version-check playwright
          python -m unittest -v test_chrome_profile_process_v2 test_image_worker_v2 test_parallel_dispatch_v2
      - name: Validar instalador seguro de incidencias e imagenes
        shell: powershell
        run: |
          $file = 'v2/ttendencias/Upgrade-V2-Incident-Images.ps1'
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $source = Get-Content $file -Raw
          foreach ($marker in @('TT_V2_INCIDENT_REX_PC_INSTALLED=YES','TT_V2_RE_IMAGES_OUTSIDE_TOP30=INSTALLED','TT_V2_V1_AND_PUBLICATION=UNTOUCHED')) {
            if (!$source.Contains($marker)) { throw "Contrato ausente: $marker" }
          }
          if ($source -match '(?i)\b(Stop-Process|Stop-ScheduledTask|taskkill)\b') {
            throw 'El instalador no debe matar Chrome ni interrumpir chats'
          }
      - name: Comprobar botón RE-X, validación de pistas y compatibilidad RE
        shell: pwsh
        run: |
          node --test v2/ttendencias/private-worker/tests/re-x.test.mjs v2/ttendencias/private-worker/tests/incident-rex.test.mjs v2/ttendencias/private-worker/tests/publication-count.test.mjs v2/ttendencias/private-worker/tests/re-explain.test.mjs v2/ttendencias/private-worker/tests/image-visibility.test.mjs
          node --check v2/ttendencias/private-worker/web-source/app.js
          node --check v2/ttendencias/private-worker/src/index.js
