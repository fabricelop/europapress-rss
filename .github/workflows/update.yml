name: Actualizar RSS Europa Press

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ttittulares-repo-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recorrer Europa Press y actualizar archivo
        run: python generate_feed.py

      - name: Crear JSON reciente para TTiTTulares
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("latest.json").read_text(encoding="utf-8"))
          items = data.get("items", [])[:200]

          recent = {
              "source": data.get("source"),
              "generated_at": data.get("generated_at"),
              "count": len(items),
              "items": items,
          }

          Path("recent.json").write_text(
              json.dumps(recent, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          print(f"recent.json creado con {len(items)} noticias")
          PY

      - name: Guardar cambios sin pisar otros procesos
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml latest.json recent.json state.json archive/

          if git diff --cached --quiet; then
            echo "No hay cambios."
            exit 0
          fi

          git commit -m "Actualizar archivo Europa Press"

          # Otro proceso (Telegram o TTiTTulares) puede haber escrito en main
          # mientras se recorría Europa Press. Rebasamos antes de publicar y,
          # si hubiera una carrera excepcional, reintentamos varias veces.
          for intento in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Cambios guardados correctamente (intento $intento)."
              exit 0
            fi
            echo "Push concurrente detectado; reintentando ($intento/4)..."
            sleep $((intento * 2))
          done

          echo "ERROR: no se pudo guardar tras 4 intentos."
          exit 1
