name: Actualizar RSS Europa Press

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ttittulares-repo-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recorrer Europa Press y actualizar archivo
        run: python generate_feed.py

      - name: Crear JSON reciente para TTiTTulares
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("latest.json").read_text(encoding="utf-8"))
          items = data.get("items", [])[:200]

          recent = {
              "source": data.get("source"),
              "generated_at": data.get("generated_at"),
              "count": len(items),
              "items": items,
          }

          Path("recent.json").write_text(
              json.dumps(recent, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          print(f"recent.json creado con {len(items)} noticias")
          PY

      - name: Refrescar TTendencias España
        run: |
          set -e
          HOUR=$(TZ=Europe/Madrid date +%H)
          if [ "$HOUR" -lt 6 ] || [ "$HOUR" -gt 23 ]; then
            echo "Fuera de la franja de TTendencias."
            exit 0
          fi
          for intento in 1 2 3; do
            if python trends/update_trends.py; then
              python3 <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          p = json.load(open('trends/recent.json', encoding='utf-8'))
          captured = datetime.fromisoformat(p['captured_at'])
          now = datetime.now(ZoneInfo('Europe/Madrid'))
          age = (now - captured).total_seconds()
          if age < 0 or age > 600:
              raise SystemExit(f"Snapshot TTendencias no fresco: {age:.0f}s")
          if len(p.get('top10', [])) != 10:
              raise SystemExit('Top 10 TTendencias incompleto')
          print(f"TTendencias actualizado: {age:.0f}s de antigüedad")
          PY
              exit 0
            fi
            echo "Captura TTendencias fallida; reintentando ($intento/3)..."
            sleep $((intento * 5))
          done
          echo "ERROR: no se pudo refrescar TTendencias."
          exit 1

      - name: Guardar cambios sin pisar otros procesos
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml latest.json recent.json state.json archive/ trends/recent.json

          if git diff --cached --quiet; then
            echo "No hay cambios."
            exit 0
          fi

          git commit -m "Actualizar archivo Europa Press y TTendencias"

          # Otro proceso (Telegram, TTiTTulares o TTendencias) puede haber escrito en main
          # mientras se actualizaban los datos. Rebasamos antes de publicar y reintentamos.
          for intento in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Cambios guardados correctamente (intento $intento)."
              exit 0
            fi
            echo "Push concurrente detectado; reintentando ($intento/4)..."
            sleep $((intento * 2))
          done

          echo "ERROR: no se pudo guardar tras 4 intentos."
          exit 1
