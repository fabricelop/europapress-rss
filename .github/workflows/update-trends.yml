name: Actualizar TTendencias España

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-trends.yml"
      - "trends/update_trends.py"
  schedule:
    # Refresco frecuente para que TTendencias use siempre un snapshot reciente.
    - cron: "*/5 * * * *"

permissions:
  contents: write

# No cancelar una captura ya iniciada si llega otra ejecución; una cancelación
# podía dejar recent.json sin refrescar durante demasiado tiempo.
concurrency:
  group: ttendencias-update
  cancel-in-progress: false

jobs:
  update-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Comprobar franja horaria Madrid
        id: timecheck
        run: |
          HOUR=$(TZ=Europe/Madrid date +%H)
          echo "hour=$HOUR" >> "$GITHUB_OUTPUT"
          if [ "$HOUR" -ge 6 ] && [ "$HOUR" -le 23 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar repositorio
        if: steps.timecheck.outputs.run == 'yes'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        if: steps.timecheck.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: steps.timecheck.outputs.run == 'yes'
        run: pip install -r requirements.txt

      - name: Capturar Top 10 España con reintentos
        if: steps.timecheck.outputs.run == 'yes'
        run: |
          set -e
          for intento in 1 2 3; do
            if python trends/update_trends.py; then
              exit 0
            fi
            echo "Captura fallida; reintentando ($intento/3)..."
            sleep $((intento * 5))
          done
          echo "ERROR: no se pudo obtener un Top 10 fiable tras 3 intentos."
          exit 1

      - name: Validar frescura del snapshot
        if: steps.timecheck.outputs.run == 'yes'
        run: |
          python3 <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          p = json.load(open('trends/recent.json', encoding='utf-8'))
          captured = datetime.fromisoformat(p['captured_at'])
          now = datetime.now(ZoneInfo('Europe/Madrid'))
          age = (now - captured).total_seconds()
          if age < 0 or age > 600:
              raise SystemExit(f"Snapshot no fresco: {age:.0f}s")
          if len(p.get('top10', [])) != 10:
              raise SystemExit('Top 10 incompleto')
          print(f"Snapshot válido: {age:.0f}s de antigüedad")
          PY

      - name: Guardar captura sin pisar otros procesos
        if: steps.timecheck.outputs.run == 'yes'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trends/recent.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Actualizar TTendencias España"
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Tendencias guardadas (intento $intento)."
              exit 0
            fi
            echo "Push concurrente detectado; reintentando ($intento/5)..."
            sleep $((intento * 2))
          done
          echo "ERROR: no se pudieron guardar tendencias."
          exit 1
