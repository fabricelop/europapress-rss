name: Actualizar TTendencias España

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-trends.yml"
      - "trends/update_trends.py"
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"

permissions:
  contents: write

concurrency:
  group: ttittulares-repo-write
  cancel-in-progress: false

jobs:
  update-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar franja horaria Madrid
        id: timecheck
        run: |
          HOUR=$(TZ=Europe/Madrid date +%H)
          echo "hour=$HOUR" >> "$GITHUB_OUTPUT"
          if { [ "$HOUR" -ge 6 ] && [ "$HOUR" -le 23 ]; } || [ "$HOUR" -eq 0 ] || [ "$HOUR" -eq 1 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar repositorio
        if: steps.timecheck.outputs.run == 'yes'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        if: steps.timecheck.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        if: steps.timecheck.outputs.run == 'yes'
        run: pip install -r requirements.txt

      - name: Capturar Top 10 España
        if: steps.timecheck.outputs.run == 'yes'
        run: python trends/update_trends.py

      - name: Guardar captura sin pisar otros procesos
        if: steps.timecheck.outputs.run == 'yes'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trends/recent.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Actualizar TTendencias España"
          for intento in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Tendencias guardadas (intento $intento)."
              exit 0
            fi
            sleep $((intento * 2))
          done
          echo "ERROR: no se pudieron guardar tendencias."
          exit 1
