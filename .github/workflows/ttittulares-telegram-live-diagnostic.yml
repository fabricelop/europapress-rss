name: TTiTTulares Telegram current webhook & bot diagnostic (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ttittulares-telegram-live-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Inspect bot identity and delivery errors without exposing secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOT_TOKEN"
          curl -fsS --max-time 20 "https://api.telegram.org/bot${BOT_TOKEN}/getMe" -o /tmp/me.json
          curl -fsS --max-time 20 "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo" -o /tmp/webhook.json
          python3 - <<'PY'
          import json,datetime
          m=json.load(open('/tmp/me.json'))['result']
          h=json.load(open('/tmp/webhook.json'))['result']
          print('BOT_USERNAME='+str(m.get('username','')))
          print('BOT_ID='+str(m.get('id','')))
          print('WEBHOOK_URL='+str(h.get('url','')))
          print('PENDING='+str(h.get('pending_update_count','')))
          print('LAST_ERROR_DATE='+str(h.get('last_error_date','')))
          print('LAST_ERROR='+str(h.get('last_error_message','')))
          print('ALLOWED_UPDATES='+str(h.get('allowed_updates',[])))
          PY
