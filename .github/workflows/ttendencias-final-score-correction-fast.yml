name: TTendencias correction Getafe-Sevilla final score fast

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ttendencias-final-score-correction-fast.yml"

permissions:
  contents: write

concurrency:
  group: ttendencias-final-score-correction-fast
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Corregir registros por API
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const stamp = new Date().toISOString();
            const targets = {
              "listas-joint-f8769365147a3582": {
                revision: 1,
                text: "TT#5 Getafe-Sevilla · Kike Salas y Gudelj sigue siendo tendencia tras el 3-1 del Getafe: Kike Salas adelantó al Sevilla, pero el equipo azulón remontó; Gudelj fue titular ante su exequipo.\n#GetafeSevilla #LaLiga\n🌶️ Salas abrió; el Getafe dio la vuelta al guion.",
                closer: "🌶️ Salas abrió; el Getafe dio la vuelta al guion.",
                sources: [
                  {url:"https://www.europapress.es/deportes/partidos-en-directo/noticia-getafe-sevilla-directo-hoy-sigue-partido-laliga-ea-sports-minuto-minuto-20261101130113.html"},
                  {url:"https://www.europapress.es/deportes/futbol-00162/noticia-getafe-refuerza-exsevillista-nemanja-gudelj-20260830152347.html"}
                ],
                note: "Resultado final verificado: Getafe 3-1 Sevilla. Kike Salas abrió el marcador; el Getafe remontó y Gudelj fue titular ante su exequipo."
              },
              "cb9bc0ab3d67": {
                revision: 0,
                text: "TT#10 #GetafeSevilla sigue siendo tendencia tras el 3-1 del Getafe: Kike Salas adelantó al Sevilla, pero Enes Ünal y Satriano iniciaron la remontada, cerrada en el descuento.\n#LaLiga #GetafeCF #SevillaFC\n🌶️ Del 0-1 al 3-1: el segundo tiempo cambió el partido.",
                closer: "🌶️ Del 0-1 al 3-1: el segundo tiempo cambió el partido.",
                sources: [
                  {url:"https://www.europapress.es/deportes/partidos-en-directo/noticia-getafe-sevilla-directo-hoy-sigue-partido-laliga-ea-sports-minuto-minuto-20261101130113.html"}
                ],
                note: "Resultado final verificado: Getafe 3-1 Sevilla. Kike Salas hizo el 0-1; Enes Ünal empató, Martín Satriano puso el 2-1 y el Getafe cerró el resultado en el descuento."
              }
            };

            async function readJson(path) {
              const r = await github.rest.repos.getContent({owner, repo, path, ref:"main"});
              if (Array.isArray(r.data) || !r.data.content) throw new Error("Contenido no legible: " + path);
              return {
                sha: r.data.sha,
                doc: JSON.parse(Buffer.from(r.data.content, r.data.encoding || "base64").toString("utf8"))
              };
            }

            async function writeJson(path, sha, doc, message) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch:"main", sha, message,
                content: Buffer.from(JSON.stringify(doc, null, 2) + "\n", "utf8").toString("base64")
              });
            }

            // requests.json
            {
              const {sha, doc} = await readJson("trends/requests.json");
              const seen = new Set();
              for (const item of (doc.requests || [])) {
                const cfg = targets[String(item.id || "")];
                if (!cfg || Number(item.revision || 0) !== cfg.revision) continue;
                if (!["explained","published","deleted"].includes(String(item.status || ""))) {
                  throw new Error("Estado inesperado " + item.id + ": " + item.status);
                }
                item.explanation = cfg.text;
                item.closer_text = cfg.closer;
                item.verification_sources = cfg.sources;
                item.news_note = cfg.note;
                item.updated_at = stamp;
                item.explained_at = stamp;
                item.last_attempt_at = stamp;
                item.final_result_verified_at = stamp;
                seen.add(item.id);
              }
              if (seen.size !== 2) throw new Error("No se localizaron ambos targets en requests");
              doc.updated_at = stamp;
              await writeJson("trends/requests.json", sha, doc, "TTendencias: corregir Getafe-Sevilla al 3-1 final");
            }

            // telegram-manual-explained.json
            {
              const {sha, doc} = await readJson("trends/telegram-manual-explained.json");
              const seen = new Set();
              for (const item of (doc.items || [])) {
                const cfg = targets[String(item.id || "")];
                if (!cfg || Number(item.revision || 0) !== cfg.revision) continue;
                item.explanation = cfg.text;
                item.closer_text = cfg.closer;
                item.verification_sources = cfg.sources;
                item.news_note = cfg.note;
                item.updated_at = stamp;
                item.explained_at = stamp;
                item.final_result_verified_at = stamp;
                seen.add(item.id);
              }
              if (seen.size !== 2) throw new Error("No se localizaron ambos targets en Listas");
              doc.updated_at = stamp;
              doc.count = (doc.items || []).length;
              await writeJson("trends/telegram-manual-explained.json", sha, doc, "TTendencias: sincronizar Getafe-Sevilla 3-1 en Listas");
            }

            // prepared.json, si conserva las tarjetas.
            try {
              const {sha, doc} = await readJson("trends/prepared.json");
              let changed = false;
              for (const item of (doc.items || [])) {
                const cfg = targets[String(item.id || "")];
                if (!cfg || Number(item.revision || 0) !== cfg.revision) continue;
                item.explanation = cfg.text;
                item.closer_text = cfg.closer;
                item.verification_sources = cfg.sources;
                item.news_note = cfg.note;
                item.generated_at = stamp;
                if (item.primary && typeof item.primary === "object") item.primary.text = cfg.text;
                if (Array.isArray(item.alternatives)) {
                  for (const alt of item.alternatives) if (alt && typeof alt === "object") alt.tweet_text = cfg.text;
                }
                changed = true;
              }
              if (changed) {
                doc.updated_at = stamp;
                await writeJson("trends/prepared.json", sha, doc, "TTendencias: sincronizar preparado Getafe-Sevilla 3-1");
              }
            } catch (e) {
              core.info("prepared.json no requerido o cambió concurrentemente: " + e.message);
            }

            // Elimina este workflow de corrección.
            try {
              const self = await github.rest.repos.getContent({owner,repo,path:".github/workflows/ttendencias-final-score-correction-fast.yml",ref:"main"});
              await github.rest.repos.deleteFile({
                owner,repo,path:".github/workflows/ttendencias-final-score-correction-fast.yml",
                branch:"main",sha:self.data.sha,message:"TTendencias: retirar corrección temporal"
              });
            } catch (e) {
              core.info("No se pudo retirar el workflow temporal en este paso: " + e.message);
            }
