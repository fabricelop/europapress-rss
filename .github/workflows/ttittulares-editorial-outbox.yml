name: Aplicar editorial TTiTTulares

on:
  push:
    branches: [main]
    paths:
      - "ttittulares/editorial-outbox/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ttittulares-repo-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar validador de imágenes
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow
      - name: Aplicar resultados editoriales
        run: |
          python3 ttittulares/apply_editorial_outbox.py
      - name: Guardar estado
        run: |
          set -e
          git config user.name "ttittulares-editorial-bot"
          git config user.email "actions@users.noreply.github.com"
          git add telegram/editorial-processing.json ttittulares/prepared.json ttittulares/status.json ttittulares/editorial-queue.json
          git add -A -- ttittulares/generated-images
          git add -A -- ttittulares/editorial-outbox 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios editoriales."
            exit 0
          fi
          git commit -m "Aplicar editorial TTiTTulares"
          for intento in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python3 ttittulares/apply_editorial_outbox.py
            git add telegram/editorial-processing.json ttittulares/prepared.json ttittulares/status.json ttittulares/editorial-queue.json
            git add -A -- ttittulares/generated-images
            git add -A -- ttittulares/editorial-outbox 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -m "Aplicar editorial TTiTTulares"
            sleep $((intento * 2))
          done
          exit 1
