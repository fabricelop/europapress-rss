name: Diagnostico seguro Instagram 403 Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instagram-publisher-edge-403-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar JSON del worker y filtros 403 sin publicar
        env:
          INTERNAL_SECRET: ${{ secrets.INSTAGRAM_INTERNAL_SECRET }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.error,urllib.request
          root="https://tt-actualidad-instagram-pilot.fabricelop.workers.dev"
          cases=[
           ("health","GET","/health",None,None),
           ("unauthenticated_invalid","POST","/publish",{},None),
           ("authenticated_invalid","POST","/publish",{"source":"invalid","event_id":"TEST_NOT_PUBLISHABLE"},os.environ.get("INTERNAL_SECRET","")),
           ("invalid_path","GET","/not-a-route",None,None),
          ]
          for name,method,path,payload,secret in cases:
            headers={"user-agent":"TTActualidad-Diagnostic/1.0"}
            if payload is not None: headers["content-type"]="application/json"
            if secret and len(secret)>=32: headers["authorization"]="Bearer "+secret
            request=urllib.request.Request(root+path,method=method,headers=headers,data=json.dumps(payload).encode() if payload is not None else None)
            try:
              with urllib.request.urlopen(request,timeout=22) as r: code=r.status; body=r.read(8192); hdr=r.headers
            except urllib.error.HTTPError as err: code=err.code; body=err.read(8192); hdr=err.headers
            except Exception as err:
              print("EDGE_PROBE",name,"network_error="+type(err).__name__);continue
            content_type=hdr.get("content-type","")
            marker="JSON" if content_type.startswith("application/json") else "HTML_OR_OTHER"
            title="cloudflare-challenge" if b"Just a moment" in body or b"cf-chl" in body else ("cloudflare-403" if b"Forbidden" in body else "other")
            result={"case":name,"http":code,"response":marker,"edge_hint":title,"cf_mitigated":hdr.get("cf-mitigated",""),"server":hdr.get("server",""),"ray_present":bool(hdr.get("cf-ray",""))}
            if marker=="JSON":
              try:
                d=json.loads(body.decode("utf8"))
                result["publisher_error"]=str(d.get("error",""))[:70]
                result["publisher_service"]=str(d.get("service",""))[:45]
                result["active"]=bool(d.get("active"))
              except ValueError: pass
            print("EDGE_PROBE",json.dumps(result,ensure_ascii=False))
          PY
      - name: Aislar WAF sobre la imagen y el texto real sin poder publicar
        env:
          INTERNAL_SECRET: ${{ secrets.INSTAGRAM_INTERNAL_SECRET }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          root="https://tt-actualidad-instagram-pilot.fabricelop.workers.dev/publish"
          manifest="https://raw.githubusercontent.com/fabricelop/europapress-rss/main/"
          cases=[
            ("shakira","trends/telegram-image-deliveries.json","3ff255e46d90",391),
            ("real_madrid","telegram/ttittulares-deliveries.json","1dc952e6340e",3105),
          ]
          secret=os.environ.get("INTERNAL_SECRET","")
          if len(secret)<32: raise SystemExit("GITHUB_SECRET_NOT_AVAILABLE")
          for label,path,event,mid in cases:
            with urllib.request.urlopen(manifest+path,timeout=25) as r:
              doc=json.loads(r.read(12*1024*1024).decode())
            matches=[x for x in doc.get("items",[]) if x.get("event_id")==event and x.get("telegram_message_id")==mid]
            if len(matches)!=1: raise SystemExit("IDENTITY_MISMATCH "+label)
            x=matches[0]
            payload={
             "source":"ttendencias" if label=="shakira" else "ttittulares",
             "event_id":event,"revision":1,
             # This invalid message ID GUARANTEES worker rejects before Meta/D1.
             "telegram_message_id":0,
             "image_url":x["instagram"]["image_url"],
             "caption":x["instagram"]["caption"],
            }
            for ua in ("Python-urllib/3.12","TTActualidad-Diagnostic/1.0"):
              req=urllib.request.Request(root,method="POST",
                data=json.dumps(payload,ensure_ascii=False).encode(),
                headers={"authorization":"Bearer "+secret,"content-type":"application/json","user-agent":ua})
              try:
                with urllib.request.urlopen(req,timeout=22) as response:
                  status=response.status;headers=response.headers;body=response.read(8192)
              except urllib.error.HTTPError as exc:
                status=exc.code;headers=exc.headers;body=exc.read(8192)
              out={"case":label,"ua":ua,"status":status,
                   "content_type":headers.get("content-type","")[:55],
                   "mitigated":headers.get("cf-mitigated",""),
                   "cf_ray_present":bool(headers.get("cf-ray","")),
                   "html_challenge":b"Just a moment" in body or b"cf-chl" in body}
              if "json" in out["content_type"]:
                try:out["error"]=str(json.loads(body).get("error",""))[:40]
                except Exception:pass
              print("PAYLOAD_PROBE",json.dumps(out))
          PY
      - name: Verificar JPEG ante identificadores de descarga de Meta
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          images=[
            ("shakira","trends/instagram-images/ig-3ff255e46d90-r1-3efa0c8a287a.jpg"),
            ("real_madrid","ttittulares/instagram-images/ig-1dc952e6340e-r1-2d9b8fae4f17.jpg")
          ]
          for label,path in images:
            uri="https://raw.githubusercontent.com/fabricelop/europapress-rss/main/"+path
            for agent in ("facebookexternalhit/1.1","Meta-ExternalAgent/1.1","TTActualidad-Diagnostic/1.0"):
              req=urllib.request.Request(uri,headers={"User-Agent":agent})
              try:
                with urllib.request.urlopen(req,timeout=16) as r:
                  status=r.status; mime=r.headers.get("content-type",""); starts_jpeg=r.read(2)==bytes([255,216])
              except urllib.error.HTTPError as e:
                status=e.code;mime=e.headers.get("content-type","");starts_jpeg=False
              print("META_IMAGE_FETCH_PROBE",json.dumps({"image":label,"agent":agent,"http":status,"mime":mime,"jpeg_magic":starts_jpeg}))
          PY
