name: "Mi Mapa BIOGRID 1.0.44 - IPA iPhone"
on:
  push:
    branches:
      - feature/biogrid-mvp-v44
    paths:
      - 'gps-ios/native/tools/biogrid_*.gz.b64'
      - 'gps-ios/native/tools/install_biogrid_mvp.py'
      - '.github/workflows/mi-mapa-biogrid-v44.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mi-mapa-biogrid-v44
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: gps-ios/native
    steps:
      - uses: actions/checkout@v4
      - name: Integrar codigo BIOGRID sin modificar GPS original
        run: |
          set -euo pipefail
          python3 tools/install_biogrid_mvp.py
          swiftc -frontend -parse Sources/*.swift Shared/*.swift Live/*.swift Tests/*.swift
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 tools/make_icon.py
          xcodegen generate --spec project.yml
      - name: Pruebas iPhone simulator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          devices=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))["devices"]
          phones=[d for rt, ds in devices.items() if "iOS" in rt for d in ds if "iPhone" in d["name"] and d["state"] != "Unavailable"]
          assert phones, "No iPhone simulator available"
          open("/tmp/biogrid_simulator","w").write(phones[0]["udid"])
          PY
          xcodebuild test -project MiMapaDelTiempo.xcodeproj -scheme MiMapaDelTiempo \
            -configuration Debug -destination "platform=iOS Simulator,id=$(cat /tmp/biogrid_simulator)" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Compilar IPA sin firma
        run: |
          set -euo pipefail
          xcodebuild -project MiMapaDelTiempo.xcodeproj -scheme MiMapaDelTiempo \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/biogrid_build" CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/biogrid_build/Build/Products/Release-iphoneos/MiMapaDelTiempo.app"
          APP="$APP" python3 - <<'PY'
          from pathlib import Path
          import os,plistlib
          app=Path(os.environ["APP"])
          assert app.exists()
          m=plistlib.loads((app/"Info.plist").read_bytes())
          assert m["CFBundleIdentifier"]=="es.mimapadeltiempo.appprueba"
          assert m["CFBundleShortVersionString"]=="1.0.44"
          assert m["CFBundleVersion"]=="45"
          assert (app/"PlugIns"/"MiMapaWidgets.appex").exists()
          PY
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -q -r MiMapaDelTiempo-BIOGRID-1.0.44.ipa Payload
          unzip -t MiMapaDelTiempo-BIOGRID-1.0.44.ipa >/dev/null
      - name: Confirmar fuentes compiladas en rama BIOGRID
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/BioGridEngine.swift Sources/BioGridView.swift Sources/TimeDiscoveryViews.swift project.yml
          if ! git diff --cached --quiet; then
            git commit -m "BIOGRID MVP 1.0.44: fuente iOS compilado y probado"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MiMapaDelTiempo-BIOGRID-1.0.44-unsigned
          path: gps-ios/native/MiMapaDelTiempo-BIOGRID-1.0.44.ipa
          retention-days: 14
          if-no-files-found: error
