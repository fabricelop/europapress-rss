name: Inspect Vercel Retention

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-vercel-retention.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_H8xHbBIbIKnsaLeITszidyOK
      PROJECT_ID: prj_X1UxNqQasd8Ouf7jUpxNccbQdASf
    steps:
      - name: Read project retention settings
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS             -H "Authorization: Bearer $VERCEL_TOKEN"             -H "Accept: application/json"             "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$TEAM_ID"             | jq '{id,name,previewDeploymentsDisabled,gitProviderOptions,deploymentExpiration,deploymentsToKeep,latestDeployments,latestDeployment}'
