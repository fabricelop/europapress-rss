name: TTendencias Telegram informativo (sin IA ni publicación)
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "trends/requests.json"
      - "trends/telegram-manual-explained.json"
      - "trends/explained.json"
      - "shared/telegram_readonly_delivery.py"
      - ".github/workflows/send-ttendencias-explained-telegram.yml"
permissions:
  contents: write
concurrency:
  group: ttendencias-telegram-readonly
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /shared/telegram_readonly_delivery.py
            /telegram/editorial-processing.json
            /telegram/ttittulares-deliveries.json
            /ttittulares/prepared.json
            /ttittulares/decisions.json
            /trends/requests.json
            /trends/recent.json
            /trends/explained.json
            /trends/telegram-manual-explained.json
            /trends/telegram-image-deliveries.json
            /trends/telegram-bot-state.json
      - name: Dependencias HTTP y comprobaciones
        run: |
          python3 -m pip install -q requests
          python3 -m py_compile shared/telegram_readonly_delivery.py
          python3 shared/telegram_readonly_delivery.py selftest
      - name: Enviar o actualizar mensaje Telegram
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
          
        run: |
          set -euo pipefail
          python3 shared/telegram_readonly_delivery.py ttendencias
          cp trends/telegram-image-deliveries.json /tmp/telegram-readonly-ledger.json
      - name: Guardar ledger sin perder borrados
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path("trends/telegram-image-deliveries.json")
          live=json.loads(path.read_text(encoding="utf8"))
          incoming=json.loads(Path("/tmp/telegram-readonly-ledger.json").read_text(encoding="utf8"))
          rows=live.setdefault("items",[])
          by_id={(str(x.get("event_id") or ""),int(x.get("revision") or 0),
                  int(x.get("telegram_message_id") or 0)):x for x in rows}
          terminal={"deleted","removed","dismissed","published"}
          for row in incoming.get("items",[]):
              key=(str(row.get("event_id") or ""),int(row.get("revision") or 0),
                  int(row.get("telegram_message_id") or 0))
              old=by_id.get(key)
              if old is None:
                  rows.append(row)
                  by_id[key]=row
              elif str(old.get("status") or "").lower() not in terminal:
                  # Never overwrite a terminal delete from concurrent callback.
                  if str(row.get("updated_at") or row.get("delivered_at") or "")>=str(old.get("updated_at") or old.get("delivered_at") or ""):
                      old.update(row)
          live["updated_at"]=incoming.get("updated_at") or live.get("updated_at")
          path.write_text(json.dumps(live,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          PY
            git add trends/telegram-image-deliveries.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Registrar entrega Telegram informativa ttendencias"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo "No se pudo guardar ledger Telegram" >&2
          exit 1
