name: Recoger bandeja Tremending

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: tremending-inbox-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python ttittulares/tremending/update_tremending.py
      - name: Guardar solo la bandeja Tremending
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ttittulares/tremending/items.json
          git diff --cached --quiet || (git commit -m "Actualizar bandeja Tremending" && git push)
