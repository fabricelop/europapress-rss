name: TT mobile authorized commands from GitHub Issues
on:
  issues:
    types: [opened]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      project:
        description: Proyecto editorial
        required: true
        type: choice
        options: [ttittulares, ttendencias]
      action:
        description: Acción solicitada desde Telegram
        required: true
        type: choice
        options: [published, deleted, rework, prepare]
      id:
        description: ID de noticia o tendencia
        required: true
        type: string
      context:
        required: false
        type: string
      instruction:
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'telegram/tt-mobile-command-queue.json'
      - '.github/scripts/tt_mobile_issue_command.py'
      - '.github/scripts/test_tt_mobile_issue_command.py'
      - '.github/ISSUE_TEMPLATE/tt-mobile-command.yml'
      - '.github/workflows/tt-mobile-github-commands.yml'
permissions:
  contents: write
  issues: write
concurrency:
  group: tt-mobile-issue-commands
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name != 'issues' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and authorization checks without mutations
        run: |
          python3 -m py_compile .github/scripts/tt_mobile_issue_command.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'.github/scripts')
          import tt_mobile_issue_command as m
          good={'sender':{'login':'fabricelop'},'issue':{'user':{'login':'fabricelop'},'title':'[TT-MOVIL] test',
            'body':'### Proyecto\n\nttittulares\n\n### Acción\n\npublished\n\n### ID del elemento\n\nabc123\n\n### Titular o contexto\n\nPrueba'}}
          assert m.parse_issue(good)[:3]==('ttittulares','published','abc123')
          good['sender']['login']='random'
          try:m.parse_issue(good);raise AssertionError('Unauthorized user accepted')
          except ValueError:pass
          print('TT_MOBILE_COMMANDS_SAFE_VALID')
          PY
          python3 .github/scripts/test_tt_mobile_issue_command.py
  apply:
    if: (github.event_name == 'issues' && github.event.issue.user.login == 'fabricelop' && github.event.sender.login == 'fabricelop' && startsWith(github.event.issue.title, '[TT-MOVIL]')) || (github.event_name == 'workflow_dispatch' && github.actor == 'fabricelop') || (github.event_name=='schedule') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'TT_MOBILE_QUEUE_WRITE:'))
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply only authorized changes to current main (retry on concurrent updates)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git checkout -B main origin/main
            if [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "schedule" ]]; then
              python3 .github/scripts/tt_mobile_issue_command.py "$GITHUB_EVENT_PATH" --queue
            else
              python3 .github/scripts/tt_mobile_issue_command.py "$GITHUB_EVENT_PATH"
            fi
            git add ttittulares/decisions.json ttittulares/prepared.json ttittulares/tremending/items.json telegram/editorial-processing.json \
              telegram/ttittulares-deliveries.json telegram/delete-message-queue.json \
              trends/requests.json trends/telegram-image-deliveries.json \
              telegram/tt-mobile-command-queue.json || true
            if test -e trends/mobile-decisions.json; then git add trends/mobile-decisions.json; fi
            if git diff --cached --quiet; then
              echo "TT_MOBILE_NO_CHANGE"
              break
            fi
            git commit -m "TT móvil: aplicar orden editorial autenticada"
            if git push origin HEAD:main; then
              echo "TT_MOBILE_PERSISTED"
              break
            fi
            if [[ "$attempt" == 6 ]]; then echo "TT_MOBILE_WRITE_CONFLICT" >&2;exit 1;fi
            sleep "$attempt"
          done
      - name: Acknowledge GitHub issue only after persisted change
        if: success() && github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} -R "$GITHUB_REPOSITORY" --body "$(cat /tmp/tt-mobile-issue-result.txt)
          
          Orden guardada en GitHub. Las tareas de borrado de mensajes se completan después por GitHub Actions. No se ha lanzado generación IA."
          gh issue close ${{ github.event.issue.number }} -R "$GITHUB_REPOSITORY" --reason completed
      - name: Confirm commands in Telegram and auto-clean auxiliary messages
        if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name=='schedule') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'TT_MOBILE_QUEUE_WRITE:')))
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TT_JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,time
          token=os.environ.get('TELEGRAM_BOT_TOKEN') or ''
          chat=os.environ.get('TELEGRAM_CHAT_ID') or ''
          if not token or not chat:
              print('TELEGRAM_ACK_CREDENTIAL_MISSING');raise SystemExit(0)
          success=os.environ.get('TT_JOB_STATUS')=='success'
          event=os.environ.get('GITHUB_EVENT_NAME','')
          messages=[]
          if event in ('push','schedule') and success:
              try:
                  items=json.load(open('/tmp/tt-mobile-queue-results.json',encoding='utf8'))
                  for item in items:
                      message=('✅ ' if item.get('ok') else '⚠️ ')+str(item.get('message',''))[:3000]
                      cleanup=[int(item.get(k) or 0) for k in ('cleanup_command_mid','cleanup_notice_mid')]
                      messages.append((message,item.get('ok') is True,cleanup))
              except (OSError,ValueError,TypeError):messages=[]
          elif success:
              try:
                  result=open('/tmp/tt-mobile-issue-result.txt',encoding='utf8').read().strip()
                  if result:messages=[('✅ '+result,False,[])]
              except FileNotFoundError:pass
          if not messages:
              if success:raise SystemExit(0)
              messages=[('⚠️ No se completó la orden. Comprueba el estado antes de reintentar.',False,[])]
          base='https://api.telegram.org/bot'+token+'/'
          def api(method,data):
              req=urllib.request.Request(base+method,
                data=json.dumps(data).encode(),
                headers={'content-type':'application/json'})
              with urllib.request.urlopen(req,timeout=25) as response:return json.load(response)
          cleanup_ids=set()
          for message,ok,mids in messages:
              try:
                  result=api('sendMessage',{'chat_id':chat,'text':message})
                  sent=int((result.get('result') or {}).get('message_id') or 0)
                  print('TELEGRAM_MOBILE_ACK_OK',bool(result.get('ok')))
                  if ok and sent:
                      # Always remove the confirmation. Older queued commands lack
                      # cleanup metadata, but the bot's own ACK can still be erased.
                      cleanup_ids.add(sent)
                      cleanup_ids.update(mid for mid in mids if mid>0)
              except Exception as error:
                  print('TELEGRAM_MOBILE_ACK_ERROR',type(error).__name__)
          if cleanup_ids:
              # Keep confirmation visible long enough to read on mobile.
              time.sleep(45)
              for mid in sorted(cleanup_ids):
                  try:
                      result=api('deleteMessage',{'chat_id':chat,'message_id':mid})
                      print('TELEGRAM_MOBILE_AUX_DELETE',mid,bool(result.get('ok')))
                  except Exception as error:
                      print('TELEGRAM_MOBILE_AUX_DELETE_WARNING',mid,type(error).__name__)
          PY
