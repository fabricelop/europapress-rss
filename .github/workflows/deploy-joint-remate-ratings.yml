name: Deploy conjunto remates TTendencias y TTiTTulares

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-joint-remate-ratings.yml"

permissions:
  contents: read

concurrency:
  group: europapress-rss-production-web-deploy
  cancel-in-progress: false

jobs:
  deploy-both:
    if: "github.event.head_commit.message == 'Deploy conjunto de puntuaciones TTendencias y TTiTTulares' || github.event.head_commit.message == 'Desplegar notificaciones TTendencias y TTiTTulares' || github.event.head_commit.message == 'Desplegar correccion de imagen TTiTTulares' || github.event.head_commit.message == 'Desplegar bandeja compacta Tremending'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_H8xHbBIbIKnsaLeITszidyOK
      VERCEL_PROJECT_ID: prj_X1UxNqQasd8Ouf7jUpxNccbQdASf
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirmar credencial antes de cualquier despliegue
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Falta el secreto VERCEL_TOKEN en GitHub Actions. No se ha desplegado nada."
            exit 1
          fi
      - name: Verificar acceso del token al proyecto Vercel
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/vercel-access-response.json --write-out "%{http_code}" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          if [ "$status" != "200" ]; then
            echo "::error::VERCEL_TOKEN no puede leer la configuración del proyecto (HTTP $status). No se ha iniciado despliegue."
            python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              data=json.loads(Path("/tmp/vercel-access-response.json").read_text())
              err=data.get("error",{})
              print("VERCEL_API_CODE:",str(err.get("code","unknown"))[:100])
              print("VERCEL_API_MESSAGE:",str(err.get("message","unknown"))[:250])
          except Exception:
              print("VERCEL_API_RESPONSE_UNREADABLE")
          PY
            exit 1
          fi
          echo "Token autorizado para el proyecto europapress-rss."
      - name: Validar ambos proyectos y sus remates
        run: |
          node --check vercel-webhook/api/ttendencias-control.js
          node --check vercel-webhook/api/ttittulares-control.js
          node --check vercel-webhook/lib/ttendencias-remate-ratings.js
          node --check vercel-webhook/lib/ttittulares-remate-ratings.js
          node --test vercel-webhook/test/ttendencias-remate-ratings.test.js vercel-webhook/test/ttittulares-remate-ratings.test.js
          node --test vercel-webhook/test/ttittulares-image-ui.test.mjs
          python3 - <<'PY'
          import re,subprocess
          from pathlib import Path
          pages=[
            "vercel-webhook/ttendencias/index.html",
            "vercel-webhook/ttendencias/explicadas/index.html",
            "vercel-webhook/ttittulares/index.html"
          ]
          for i,p in enumerate(pages):
              html=Path(p).read_text()
              scripts=re.findall(r"<script>([\s\S]*?)</script>",html,re.I)
              if not scripts: raise SystemExit("Missing JS: "+p)
              dst=Path(f"/tmp/joint-release-{i}.js");dst.write_text("\n".join(scripts))
              subprocess.run(["node","--check",str(dst)],check=True)
          assert "renderRemateRating" in Path(pages[1]).read_text()
          tt_page=Path(pages[2]).read_text()
          tt_lib=Path("vercel-webhook/lib/ttittulares-remate-ratings.js").read_text()
          assert "mountRemateRating" in tt_page and "function tweetFor" in tt_page
          assert "titular-remate-v2" in tt_page and "titular-remate-v2" in tt_lib
          assert "Principal es factual" not in tt_page
          print("JOINT_RELEASE_VERIFIED")
          PY
      - name: Publicar ambos proyectos mediante UNA solicitud REST Vercel
        run: node .github/scripts/deploy-joint-remate-ratings.mjs
