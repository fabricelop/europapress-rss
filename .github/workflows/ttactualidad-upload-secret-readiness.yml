name: TTActualidad private ingest secret readiness (diagnostic only)
on:
  push:
    branches: [diag/ttactualidad-upload-secret-readiness-20261104]
    paths: ['.github/workflows/ttactualidad-upload-secret-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      S1: ${{ secrets.INGEST_TOKEN }}
      S2: ${{ secrets.TT_IMAGE_INGEST_TOKEN }}
      S3: ${{ secrets.TT_IMAGE_INBOX_INGEST_TOKEN }}
      S4: ${{ secrets.TT_IMAGE_UPLOAD_SECRET }}
      S5: ${{ secrets.TT_ACTUALIDAD_INGEST_TOKEN }}
      S6: ${{ secrets.TT_ACTUALIDAD_IMAGE_INGEST_KEY }}
      S7: ${{ secrets.IMAGE_INBOX_INGEST_TOKEN }}
      S8: ${{ secrets.IMAGE_INBOX_KEY }}
      S9: ${{ secrets.TT_IMAGE_INGEST_KEY }}
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check only configuration, no network uploads, never expose secret values
        shell: bash
        run: |
          set -euo pipefail
          names=(INGEST_TOKEN TT_IMAGE_INGEST_TOKEN TT_IMAGE_INBOX_INGEST_TOKEN TT_IMAGE_UPLOAD_SECRET TT_ACTUALIDAD_INGEST_TOKEN TT_ACTUALIDAD_IMAGE_INGEST_KEY IMAGE_INBOX_INGEST_TOKEN IMAGE_INBOX_KEY TT_IMAGE_INGEST_KEY)
          for i in 1 2 3 4 5 6 7 8 9; do
            name="${names[$((i-1))]}"
            value="$(printenv S${i} || true)"
            if [[ -n "$value" ]]; then
              echo "${name}_PRESENT=yes"
            else
              echo "${name}_PRESENT=no"
            fi
            unset value
          done
          [[ -n "${CF:-}" ]] && echo "CLOUDFLARE_TOKEN_PRESENT=yes" || echo "CLOUDFLARE_TOKEN_PRESENT=no"
          [[ -n "${CA:-}" ]] && echo "CLOUDFLARE_ACCOUNT_PRESENT=yes" || echo "CLOUDFLARE_ACCOUNT_PRESENT=no"
          echo 'No publication, authentication, image read, or secret transfer performed.'
