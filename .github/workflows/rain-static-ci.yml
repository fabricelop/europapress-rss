name: RainETA static CI
on:
  pull_request:
    paths:
      - "vercel-webhook/rain/**"
      - "vercel-webhook/lib/ttittulares-push-handler.js"
      - "vercel-webhook/test/rain-static.test.js"
      - "vercel-webhook/vercel.json"
      - ".github/scripts/smoke-rain-static.mjs"
      - ".github/workflows/rain-static-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check vercel-webhook/rain/app.js
          node --check vercel-webhook/rain/core.js
          node --check vercel-webhook/rain/radar-core.js
          node --check vercel-webhook/rain/sw.js
          node --check vercel-webhook/lib/ttittulares-push-handler.js
      - name: Unit tests
        run: node --test vercel-webhook/test/rain-static.test.js
      - name: Live source smoke
        run: node .github/scripts/smoke-rain-static.mjs
