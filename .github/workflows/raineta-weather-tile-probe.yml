name: RainETA Weather Tile Probe
on:
  push:
    paths:
      - 'ios/raineta/tests/forecast_tiles_probe.py'
      - '.github/workflows/raineta-weather-tile-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate hourly forecast tiles
        working-directory: ios/raineta
        run: python3 tests/forecast_tiles_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raineta-provider-map-tiles
          path: ios/raineta/tile-probes/
          retention-days: 7
