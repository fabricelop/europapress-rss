name: TTActualidad V2 - atender solicitudes RE privadas

# Se consulta D1 cada 5 minutos, con respaldo al finalizar un flujo periódico;
# el respaldo se ejecuta aunque dicho flujo falle. El consumidor Windows
# consulta además las RE directamente para evitar esperas en GitHub Actions.
# No modifica colas de TTiTTulares, TTendencias V1 ni otros proyectos.
on:
  # Comprobar la primera puesta en marcha al actualizar este workflow.
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttactualidad-v2-re-editorial.yml'
  schedule:
    - cron: '*/5 * * * *'
  # Respaldo si GitHub retrasa u omite disparos programados.
  workflow_run:
    workflows:
      - 'TTendencias Site - Top30 parity with iPhone'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ttactualidad-v2-private-re-editorial
  cancel-in-progress: false

jobs:
  consume-re:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ttactualidad-v2-clean
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar revisión RE sin efectos
        run: |
          PYTHONPATH=v2/ttendencias python3 -m unittest -v \
            v2.ttendencias.test_re_request_v2 \
            v2.ttendencias.test_re_projection_v2 \
            v2.ttendencias.test_sync_private_re_v2 \
            v2.ttendencias.test_auto_editorial_v2
      - name: Transferir peticiones autorizadas D1 a la cola V2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$GH_TOKEN" && test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 -m v2.ttendencias.consume_re_requests
