name: Noticias V2 INC corrective CI
on:
  push:
    branches: [feature/ttactualidad-v2-news-inc-audit-20261118]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact incident queue controls and full private Worker
        working-directory: v2/ttendencias/private-worker
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test
