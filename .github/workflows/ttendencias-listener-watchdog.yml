name: "TTendencias watchdog Telegram - retirado TTActualidad"
# Retirado: TTActualidad es la interfaz; la elaboración, el radar y las imágenes
# funcionan mediante workflows independientes. Restaurable desde git history.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Sin consumidor Telegram
        run: echo "Retirado; sin llamadas a Telegram ni relanzamientos"
