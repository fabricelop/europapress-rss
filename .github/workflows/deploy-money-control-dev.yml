name: Deploy Money Control Dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vercel-webhook/.money-control-dev-trigger"

permissions:
  contents: read

concurrency:
  group: money-control-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_H8xHbBIbIKnsaLeITszidyOK
      VERCEL_PROJECT_ID: prj_X1UxNqQasd8Ouf7jUpxNccbQdASf
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar Money Control
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vercel-webhook/money-control/index.html','utf8');
          const m=html.match(/<script>([\s\S]*)<\/script>/);
          if(!m)throw new Error('Script no encontrado');
          new Function(m[1]);
          for(const x of ['nativeTransactions:[]','function duplicateAssessment(','Habla con Money Control','function analyzeIngest()','description:\'Ajuste\'']){
            if(!html.includes(x))throw new Error('Falta '+x);
          }
          console.log('MONEY_CONTROL_DEV_VALIDATED');
          NODE
          node --check vercel-webhook/api/money-control-interpret.js
          node --check vercel-webhook/api/money-control-moneywiz-upload.js
      - name: Publicar preview mínima Money Control
        run: node .github/scripts/deploy-money-control-dev.mjs
