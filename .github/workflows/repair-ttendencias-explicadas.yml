name: Reparar imágenes TTendencias Explicadas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "trends/telegram-manual-explained.json"
      - "trends/editorial-runtime.json"
      - "trends/pending-repair-trigger.json"
      - "trends/direct-reconcile-command.json"
      - "trends/apply_direct_reconcile.py"
      - ".github/workflows/repair-ttendencias-explicadas.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: ttendencias-explicadas-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Reconciliar cierre editorial directo
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f trends/direct-reconcile-command.json ]; then
            echo "Sin reconciliación editorial directa pendiente."
            exit 0
          fi
          git config user.name "ttendencias-editorial"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            if [ ! -f trends/direct-reconcile-command.json ]; then
              exit 0
            fi
            python3 trends/apply_direct_reconcile.py
            git add trends/requests.json trends/telegram-manual-explained.json trends/editorial-queue.json trends/direct-reconcile-command.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Reconciliar cierre editorial directo TTendencias"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Preparar dependencias
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow requests beautifulsoup4

      - name: Recuperar imágenes de archivo
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ttendencias-image-repair"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 trends/enrich_explained_images.py
            python3 trends/normalize_ai_flags.py
            git add trends/telegram-manual-explained.json
            if git diff --cached --quiet; then
              echo "TTENDENCIAS_ARCHIVE_UP_TO_DATE"
              break
            fi
            git commit -m "Reparar imágenes de archivo TTendencias"
            if git push origin HEAD:main; then
              echo "TTENDENCIAS_ARCHIVE_PERSISTED"
              break
            fi
            sleep $((attempt * 2))
          done
          git fetch origin main
          git reset --hard origin/main

      - name: Encolar imágenes en ChatGPT Images (solo lanzamiento)
        shell: bash
        run: |
          set -euo pipefail
          CONTROL="control/ttendencias-run-trigger"
          git fetch origin "$CONTROL"
          rm -rf /tmp/ttendencias-control
          git worktree add -B "$CONTROL" /tmp/ttendencias-control "origin/$CONTROL"

          python3 - <<'PY'
          import json, pathlib, time, hashlib
          from datetime import datetime, timezone
          from urllib.parse import unquote
          from PIL import Image
          from pilot.trend_maintenance import image_allowed
          from shared.tt_image_idempotency import may_enqueue_image_job, is_new_editorial_episode

          MAIN=pathlib.Path(".")
          CTRL=pathlib.Path("/tmp/ttendencias-control")
          explained=json.loads((MAIN/"trends/telegram-manual-explained.json").read_text(encoding="utf-8"))
          try:
              copy_state=json.loads((MAIN/"trends/explained-copy-state.json").read_text(encoding="utf-8"))
          except Exception:
              copy_state={"items":[]}
          archived_by_id={}
          archived_names_legacy={}
          for x in copy_state.get("items",[]):
              rev=int(x.get("revision") or 0)
              item_id=str(x.get("item_id") or x.get("id") or "").strip()
              if item_id:
                  archived_by_id.setdefault((item_id,rev),[]).append(x)
              else:
                  for name in x.get("trend_names") or []:
                      archived_names_legacy.setdefault((str(name or "").strip().casefold(),rev),[]).append(x)
          index_path=CTRL/"trends/image-runs/index.json"
          index=json.loads(index_path.read_text(encoding="utf-8")) if index_path.exists() else {"version":1,"jobs":[]}
          now=datetime.now(timezone.utc)
          nowz=now.isoformat().replace("+00:00","Z")
          CUTOFF=datetime.fromisoformat("2026-10-14T06:20:00+00:00").timestamp()
          ACTIVE={"REQUESTED","RUNNING","PERSISTING","GENERATING"}

          NO_PEPPER="REGLA VISUAL OBLIGATORIA: el emoji 🌶️ es únicamente un marcador TIPOGRÁFICO del remate escrito. PROHIBIDO dibujar guindillas, chiles, pimientos picantes o su icono, logotipo, silueta o mascota, tanto en primer plano como en fondo, carteles, ropa, objetos, decoración o firma. El gag debe representar la IDEA del remate, nunca el emoji. "
          STYLE_BASE=("PRINCIPIO FIJO: más gag, menos barroquismo. Una sola idea visual fuerte, lectura inmediata en 1-2 segundos, composición limpia, "
                      "uno a tres elementos protagonistas y fondo solo si ayuda al chiste. Acabado cuidado y rico en dibujo, pero sin acumulación decorativa. "
                      "El gag debe nacer del hecho/remate y no limitarse a ilustrar literalmente el titular. Casi sin texto; solo el imprescindible para el gag. "+NO_PEPPER)
          STYLE_BANK=[
              ("tinta_acuarela","Caricatura editorial contemporánea de alta calidad, línea de tinta expresiva y acuarela controlada, gestos muy trabajados y fondo ligero."),
              ("comic_europeo","Cómic europeo contemporáneo, entintado preciso, volumen sólido, expresiones fuertes y composición cinematográfica pero despejada."),
              ("poster_grafico","Póster gráfico editorial sofisticado, formas contundentes, geometría limpia, textura de impresión y jerarquía visual muy clara; no aspecto infantil."),
              ("absurdo_semirrealista","Escena absurda semi-realista, materiales y texturas cuidados, iluminación natural y situación imposible tratada con precisión visual."),
              ("stop_motion","Diorama editorial tipo stop-motion/clay, personajes y objetos con volumen artesanal, iluminación de estudio y detalle selectivo."),
              ("retro_60s","Ilustración publicitaria retro de los años 60 reinterpretada con acabado moderno, dibujo elegante, ironía visual y composición limpia."),
              ("grabado_moderno","Grabado/linograbado moderno de alta calidad con textura rica, contraste controlado y un único foco narrativo."),
              ("pop_art","Pop art editorial refinado, serigrafía y tramas controladas, energía gráfica sin llenar la escena de elementos."),
              ("cartoon_3d","Cartoon 3D editorial estilizado, modelado cuidado, expresiones claras, materiales pulidos y escena sencilla pero no simplona."),
              ("novela_grafica","Novela gráfica satírica, dibujo detallado, sombras contenidas, gesto expresivo y puesta en escena sobria.")
          ]
          
          def pick_style(key):
              digest=hashlib.sha256(key.encode("utf-8")).digest()
              idx=int.from_bytes(digest[:4],"big") % len(STYLE_BANK)
              name,detail=STYLE_BANK[idx]
              return idx,name,STYLE_BASE+"ESTILO ASIGNADO PARA ESTA IMAGEN: "+detail

          def parse_dt(v):
              try:return datetime.fromisoformat(str(v).replace("Z","+00:00")).astimezone(timezone.utc)
              except Exception:return None

          def archived_this_episode(row):
              # Archive decisions cover an editorial EPISODE, not every future
              # football match assigned the same ID and revision 0.
              item_id=str(row.get("id") or "")
              rev=int(row.get("revision") or 0)
              archives=(archived_by_id.get((item_id,rev),[]) if item_id
                        else archived_names_legacy.get((str(row.get("name") or "").strip().casefold(),rev),[]))
              current_at=parse_dt(row.get("explained_at"))
              for entry in archives:
                  archived_at=parse_dt(entry.get("explained_at"))
                  if archived_at and current_at:
                      if archived_at == current_at:
                          return True
                      continue
                  copied_at=parse_dt(entry.get("copied_at"))
                  if copied_at and current_at and current_at > copied_at:
                      continue
                  return True  # Unknown archive epoch: fail closed.
              return False

          def valid_ai(row):
              ai=row.get("ai_image") or {}
              url=str(ai.get("url") or "").strip()
              sha=str(ai.get("sha256") or "").strip().lower()
              if not (
                  str(row.get("ai_image_status") or "").lower()=="ready"
                  and str(ai.get("provider") or "")=="chat-imagegen"
                  and str(ai.get("origin") or "")=="executing_chat"
                  and int(ai.get("width") or 0)>=1024
                  and int(ai.get("height") or 0)>=576
                  and url and len(sha)==64
              ):
                  return False
              prefix="https://raw.githubusercontent.com/fabricelop/europapress-rss/main/"
              if not url.startswith(prefix):
                  return False
              try:
                  rel=unquote(url[len(prefix):])
                  path=(MAIN/rel).resolve()
                  path.relative_to(MAIN.resolve())
                  raw=path.read_bytes()
                  if hashlib.sha256(raw).hexdigest().lower()!=sha:
                      return False
                  with Image.open(path) as im:
                      width,height=im.size
                      im.verify()
                  return (
                      width>=1024 and height>=576
                      and width==int(ai.get("width") or 0)
                      and height==int(ai.get("height") or 0)
                  )
              except Exception:
                  return False

          def load(path):
              try:return json.loads(path.read_text(encoding="utf-8"))
              except Exception:return {}

          # Reconcile legacy RUNNING/ERROR jobs with a verified prompt receipt.
          # No CDP call, image download, or new GitHub Actions workflow needed.
          for job_file in (CTRL/"trends/image-runs/jobs").glob("*.json"):
              old_job=load(job_file)
              if (str(old_job.get("delivery_mode") or "")!="launch_only"
                  or not old_job.get("pc_launched_at")
                  or str(old_job.get("status") or "").upper()=="LAUNCHED"):
                  continue
              launched=parse_dt(old_job.get("pc_launched_at"))
              if not launched or (now-launched).total_seconds()>48*3600:
                  continue
              old_job.update(status="LAUNCHED",phase="pc_launched",
                             finished_at=str(old_job["pc_launched_at"]),
                             updated_at=nowz,
                             message="Prompt confirmado en ChatGPT Images; sin recuperar raster.")
              job_file.write_text(json.dumps(old_job,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              print("TTENDENCIAS_AI_ACK_RECONCILED",str(old_job.get("target_id") or ""),str(old_job.get("command_id") or ""))
          leaders=[]
          for row in explained.get("items",[]):
              if not image_allowed(row):
                  continue
              if str(row.get("status") or "").lower()!="explained":
                  continue
              if archived_this_episode(row):
                  continue
              if not str(row.get("explanation") or "").strip():
                  continue
              # También se permite la imagen de tendencias sensibles con enfoque sobrio.
              if str(row.get("telegram_package_status") or "").lower() in {"published","dismissed","deleted","removed","delete_pending","delete_failed"}:
                  continue
              # La sensibilidad editorial no bloquea ImageGen. Solo Tremending queda fuera
              # porque usa su flujo específico de captura real del tuit.
              at=parse_dt(row.get("explained_at"))
              if not at or at.timestamp() < CUTOFF or (now-at).total_seconds()>86400:
                  continue
              # TTActualidad: editorial "explained" is sufficient; no Telegram delivery required.
              leaders.append(row)

          queued=[]
          sensitive_words=("fallece","muere","muertos","muertas","heridos","heridas","asesinat","suicid","violación","agresión sexual","cáncer","atentado","bombardeo","víctimas","misiles","muerte","accidente mortal")
          for row in leaders:
              if valid_ai(row):
                  continue
              tid=str(row.get("id") or "").strip()
              if not tid:
                  continue
              revision=int(row.get("revision") or 0)
              job_path=CTRL/f"trends/image-runs/jobs/{tid}.json"
              old=load(job_path)
              manual_retry_version=int(row.get("ai_image_regenerate_request_version") or 0)
              # A trend ID can be reused at revision 0 for an entirely NEW
              # match/event. Its October 4 prompt cannot block October 26.
              # Keep the conservative no-duplicate gate for the SAME story.
              new_episode=is_new_editorial_episode(old, revision, row)
              prior={} if new_episode else old
              if new_episode:
                  print("TTENDENCIAS_NEW_EDITORIAL_EPISODE",tid,
                        (old.get("context_snapshot") or {}).get("explained_at"),
                        "->",row.get("explained_at"))
              if not may_enqueue_image_job(prior, revision, manual_retry_version=manual_retry_version):
                  continue
              force_retry=manual_retry_version>int(prior.get("manual_retry_version") or 0)
              auto_attempt=int(prior.get("auto_repair_attempt") or 0)
              previous_attempt=int(prior.get("attempt") or row.get("ai_image_attempt") or 0)
              auto_attempt+=1
              attempt=max(1,previous_attempt+1)
              command=f"tr-img-auto-{tid}-r{revision}-a{auto_attempt}-{int(time.time()*1000)}"
              style_index,style_name,style=pick_style(f"ttendencias|{tid}|r{revision}|a{attempt}|{command}")
              sensitive=any(x in (str(row.get("name") or "")+" "+str(row.get("explanation") or "")).casefold() for x in sensitive_words)
              if sensitive:
                  style_index,style_name,style=(-1,"rigor_y_respeto","Imagen editorial periodística sobria y rigurosa, sin humor ni caricaturas, sin banalizar sufrimiento, sin escenas gráficas o hechos inventados.")
              style=style+" "+NO_PEPPER
              explanation=str(row.get("explanation") or "")
              closer=str(row.get("closer_text") or "")
              context={
                  "name":str(row.get("name") or tid),
                  "revision":revision,
                  "explanation":explanation,
                  "closer_text":closer,
                  "trend_names":row.get("trend_names") or [str(row.get("name") or tid)],
                  "group_title":str(row.get("group_title") or ""),
                  "rank_at_explanation":row.get("rank_at_explanation",row.get("rank")),
                  "explained_at":row.get("explained_at"),
                  "verification_sources":row.get("verification_sources") or [],
                  "image_style":style,
                  "editorial_image_mode":"rigor" if sensitive else "humor",
                  "image_style_name":style_name,
                  "image_style_index":style_index
              }
              job={
                  "version":1,
                  "command_id":command,
                  "requested_at":nowz,
                  "updated_at":nowz,
                  "status":"REQUESTED",
                  "phase":"queued",
                  "mode":"automatic_explained_repair",
                  "delivery_mode":"launch_only",
                  "editorial_image_mode":"rigor" if sensitive else "humor",
                  "executor":"pc_chat_ttendencias_dedicated",
                  "project":"ttendencias",
                  "launcher_arg":"tendencias",
                  "task":"image",
                  "target_id":tid,
                  "trend_id":tid,
                  "target_name":str(row.get("name") or tid),
                  "revision":revision,
                  "attempt":attempt,
                  "auto_repair":True,
                  "auto_repair_attempt":auto_attempt,
                  "manual_retry_version":manual_retry_version,
                  "chat_command_version":4,
                  "instruction_profile":"ttendencias_gag_v5_varied_style_single_gag",
                  "context_snapshot":context,
                  "instructions":{
                      "scope":"Una sola tendencia y una sola imagen.",
                      "exact_input":"Usa literalmente explanation y closer_text como contexto editorial autoritativo.",
                      "visual":"Ilustración sobria sin humor" if sensitive else "Una sola idea visual fuerte con humor editorial.",
                      "prohibitions":"No infografía, interfaz, diagrama, collage ni screenshot. "+NO_PEPPER,
                      "lifecycle":"Pestaña física fija; conversación nueva; raster limpio >=1024x576; Listas de TTActualidad."
                  },
                  "message":"Reintento manual de imagen IA desde Telegram." if force_retry else "Reparación automática de imagen IA para tendencia Explicada."
              }
              job_path.parent.mkdir(parents=True,exist_ok=True)
              job_path.write_text(json.dumps(job,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              index["jobs"]=[x for x in index.get("jobs",[]) if str(x.get("target_id") or "")!=tid]
              index["jobs"].append({
                  "command_id":command,
                  "target_id":tid,
                  "trend_id":tid,
                  "target_name":str(row.get("name") or tid),
                  "revision":revision,
                  "requested_at":nowz,
                  "status_path":f"trends/image-runs/jobs/{tid}.json",
                  "executor":"pc_chat_ttendencias_dedicated",
                  "auto_repair":True,
                  "auto_repair_attempt":auto_attempt
              })
              queued.append((tid,row.get("name"),command,auto_attempt))

          # Only live, unlaunched work belongs in the PC discovery index.
          # Historical jobs forced the three-probe scanner to waste minutes
          # circling old entries while fresh Listas images remained REQUESTED.
          leaders_by_id={str(row.get("id") or ""):int(row.get("revision") or 0) for row in leaders}
          before=list(index.get("jobs",[]))
          filtered=[]
          seen=set()
          for x in reversed(before):
              tid=str(x.get("target_id") or "")
              path=str(x.get("status_path") or "")
              if not tid or tid in seen or not path.startswith("trends/image-runs/jobs/"):
                  continue
              job=load(CTRL/path)
              if str(job.get("command_id") or "")!=str(x.get("command_id") or ""):
                  continue
              status=str(job.get("status") or "").upper()
              if status not in ACTIVE or job.get("pc_launched_at"):
                  continue
              if parse_dt(job.get("requested_at")) and (now-parse_dt(job.get("requested_at"))).total_seconds()>12*3600:
                  continue
              auto=bool(job.get("auto_repair") or x.get("auto_repair"))
              if auto and (tid not in leaders_by_id or int(job.get("revision") or 0)!=leaders_by_id[tid]):
                  continue
              seen.add(tid)
              filtered.append(x)
          filtered.reverse()
          index["jobs"]=filtered
          if queued or filtered!=before:
              index["version"]=1
              index["updated_at"]=nowz
              index_path.parent.mkdir(parents=True,exist_ok=True)
              index_path.write_text(json.dumps(index,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              print("TTENDENCIAS_AI_INDEX_PRUNED",len(before),"->",len(filtered))

          for q in queued:print("TTENDENCIAS_AI_REPAIR_QUEUED",*q)
          print("TTENDENCIAS_AI_REPAIR_COUNT="+str(len(queued)))
          PY

          cd /tmp/ttendencias-control
          if git diff --quiet -- trends/image-runs; then
            echo "Sin jobs IA nuevos."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add trends/image-runs
            git commit -m "Reparar automáticamente IA de TTendencias"
            # Fast-forward Git ref claim; a stale commit must never overwrite
            # a newer ACK or revision. The next pass reads fresh branch state.
            if ! git push origin HEAD:"$CONTROL"; then
              echo "TT_IMAGE_CLAIM_CONFLICT: control branch changed" >&2
              exit 1
            fi
          fi
