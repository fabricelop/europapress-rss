name: TTActualidad V2 - Radar cada 15 minutos
on:
  # GitHub Actions no garantiza puntualidad del cron. Intentos cada 5 min
  # permiten recuperar capturas perdidas. Los commits de datos se protegen
  # con reintentos y control de antiguedad en el workflow reutilizable.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttactualidad-v2-radar-15m.yml'

permissions:
  contents: write

jobs:
  capture:
    name: Refrescar Top30 exclusivamente en rama V2
    uses: fabricelop/europapress-rss/.github/workflows/ttactualidad-v2-step01.yml@feature/ttactualidad-v2-clean
    permissions:
      contents: write
