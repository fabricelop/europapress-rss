name: TTActualidad V2 BUS-X RE-X premerge isolated verification
on:
  push:
    branches:
      - feature/ttactualidad-v2-busx-re-while-pending-20261118
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify queue, deferred instructions, and safe recovery
        env:
          PYTHONPATH: v2/ttendencias
        run: |
          python -m unittest -v v2.ttendencias.test_re_request_v2 v2.ttendencias.test_sync_private_re_v2 v2.ttendencias.test_incident_retry_v2
      - name: Verify private V2 worker UI and endpoints
        working-directory: v2/ttendencias/private-worker
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test
