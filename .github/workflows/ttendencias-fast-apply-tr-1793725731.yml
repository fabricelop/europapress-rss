name: TTendencias fast apply tr-autoguard-1793725731
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttendencias-fast-apply-tr-1793725731.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ttendencias-fast-apply-tr-1793725731
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply verified editorial state without checkout
        uses: actions/github-script@v7
        with:
          script: |
            const ids = ["6fffc2182bc6","75ed7ba01dcb","6b1527a11052","1055c1f7c2d8","e3556c5fad4c","9ecae1686395","6106415081f7","febcfc700f77"];
            const owner = context.repo.owner, repo = context.repo.repo;
            const decode = b => Buffer.from(b.content.replace(/\n/g,''), 'base64').toString('utf8');
            const encode = s => Buffer.from(s, 'utf8').toString('base64');
            async function getTrendsTree(commit) {
              const root = await github.rest.git.getTree({owner,repo,tree_sha:commit.tree.sha});
              const t = root.data.tree.find(x=>x.path==='trends' && x.type==='tree');
              if (!t) throw new Error('trends tree missing');
              return (await github.rest.git.getTree({owner,repo,tree_sha:t.sha})).data;
            }
            async function blob(sha) { return (await github.rest.git.getBlob({owner,repo,file_sha:sha})).data; }
            for (let attempt=1; attempt<=8; attempt++) {
              const ref = (await github.rest.git.getRef({owner,repo,ref:'heads/main'})).data;
              const head = ref.object.sha;
              const commit = (await github.rest.git.getCommit({owner,repo,commit_sha:head})).data;
              const trends = await getTrendsTree(commit);
              const byPath = Object.fromEntries(trends.tree.map(x=>[x.path,x]));
              for (const p of ['requests.json','editorial-queue.json','telegram-manual-explained.json','editorial-outbox']) {
                if (!byPath[p]) throw new Error('missing trends/'+p);
              }
              const [reqBlob,qBlob,manualBlob,outTree] = await Promise.all([
                blob(byPath['requests.json'].sha),
                blob(byPath['editorial-queue.json'].sha),
                blob(byPath['telegram-manual-explained.json'].sha),
                github.rest.git.getTree({owner,repo,tree_sha:byPath['editorial-outbox'].sha})
              ]);
              const requests = JSON.parse(decode(reqBlob));
              const queue = JSON.parse(decode(qBlob));
              const manual = JSON.parse(decode(manualBlob));
              const outBy = Object.fromEntries(outTree.data.tree.map(x=>[x.path,x]));
              const payloads = [];
              for (const id of ids) {
                const name = id+'-r0.json';
                const ent = outBy[name];
                if (!ent) {
                  const req=(requests.requests||[]).find(x=>String(x.id)===id);
                  if (req && req.status==='explained') continue;
                  throw new Error('missing outbox '+name);
                }
                payloads.push(JSON.parse(decode(await blob(ent.sha))));
              }
              const manualMap = new Map((manual.items||[]).map(x=>[String(x.id)+'@'+Number(x.revision||0),x]));
              for (const payload of payloads) {
                const id=String(payload.id), rev=Number(payload.revision||0), item=payload.prepared_item||{};
                const req=(requests.requests||[]).find(x=>String(x.id)===id);
                if (!req) throw new Error('request missing '+id);
                if (Number(req.revision||0)!==rev) throw new Error('revision mismatch '+id);
                if (!['preparing','update','problematic','ready','explained'].includes(String(req.status||''))) throw new Error('terminal state '+id+':'+req.status);
                const m=manualMap.get(id+'@'+rev);
                const expected=String(item.explanation||item.primary?.text||'').trim();
                if (!m || m.status!=='explained' || String(m.explanation||'').trim()!==expected) throw new Error('Listas not synchronized '+id);
                if (req.status==='explained' && String(req.explanation||'').trim()===expected) continue;
                const alts=item.alternatives||[];
                const texts=[item.primary?.text||'',...alts.map(a=>a.tweet_text||'')];
                if (!item.primary?.text || alts.length!==3 || texts.some(t=>!t || t.length>280)) throw new Error('invalid payload '+id);
                const src=(item.verification_sources||[]).map(s=>({url:String((typeof s==='object'?s.url:s)||'').trim()})).filter(s=>s.url);
                const at=String(item.generated_at||new Date().toISOString()), image=Boolean(req.with_image||item.with_image);
                Object.assign(req,{
                  status:'explained',updated_at:at,explained_at:at,last_attempt_at:at,explanation:expected,closer_text:String(item.closer_text||'').trim(),
                  rank_at_explanation:Number(item.rank||req.rank||0),category:String(item.category||req.category||'Actualidad'),
                  source:'editorial_outbox_applied',editorial_engine:'chatgpt-automation-outbox',verification_sources:src,news_note:String(item.news_note||''),
                  group_id:'grp-'+id,explanation_group_id:'grp-'+id,group_title:String(item.trend_name||req.name||''),group_leader_id:id,
                  trend_names:item.trend_names||[String(item.trend_name||req.name||'')],grouped_member_revisions:item.grouped_member_revisions||[{id,revision:rev}],
                  editorial_grouping_state:'pending',image_strategy:String(item.image_strategy||'ai_plus_fallback'),
                  fallback_image_status:image?'pending':'none',ai_image_status:image?'pending':'none',image_status:image?'pending':'none',
                  image_choice:'none',image_pending:image,telegram_package_status:'pending'
                });
                for (const k of ['ready_at','delivery_confirmation','problem_reason','problematic_at','problematic_attempts']) delete req[k];
              }
              requests.updated_at='2026-11-03T18:21:00+01:00';
              queue.items=(queue.items||[]).filter(x=>!ids.includes(String(x.id)) || Number(x.revision||0)!==0);
              queue.count=queue.items.length; queue.updated_at='2026-11-03T18:21:00+01:00';
              const reqText=JSON.stringify(requests)+'\n';
              const qText=JSON.stringify(queue,null,2)+'\n';
              const [newReq,newQ] = await Promise.all([
                github.rest.git.createBlob({owner,repo,content:encode(reqText),encoding:'base64'}),
                github.rest.git.createBlob({owner,repo,content:encode(qText),encoding:'base64'})
              ]);
              const tree = [
                {path:'trends/requests.json',mode:'100644',type:'blob',sha:newReq.data.sha},
                {path:'trends/editorial-queue.json',mode:'100644',type:'blob',sha:newQ.data.sha},
                ...payloads.map(p=>({path:'trends/editorial-outbox/'+p.id+'-r'+Number(p.revision||0)+'.json',mode:'100644',type:'blob',sha:null}))
              ];
              const newTree=(await github.rest.git.createTree({owner,repo,base_tree:commit.tree.sha,tree})).data;
              const newCommit=(await github.rest.git.createCommit({owner,repo,message:'TTendencias: aplicar requests tr-autoguard-1793725731',tree:newTree.sha,parents:[head]})).data;
              try {
                await github.rest.git.updateRef({owner,repo,ref:'heads/main',sha:newCommit.sha,force:false});
                core.info('APPLIED '+newCommit.sha+' queue='+queue.count);
                return;
              } catch (e) {
                core.warning('main avanzó en intento '+attempt+'; reintentando');
              }
            }
            core.setFailed('No se pudo aplicar tras 8 reintentos de main');
