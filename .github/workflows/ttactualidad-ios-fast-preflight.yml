name: TTActualidad iOS - Fast preflight (Linux)

on:
  push:
    paths:
      - "ios/ttactualidad/**"
      - ".github/workflows/ttactualidad-ios-fast-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check editorial and performance contracts
        run: python3 ios/ttactualidad/tests/preflight.py
      - name: Test isolated READY news rework
        run: python3 pilot/test_rework_ttittulares.py
      - name: Parse all Swift source for syntax errors
        run: |
          if command -v swiftc >/dev/null 2>&1; then
            find ios/ttactualidad -name '*.swift' -print0 |
              xargs -0 swiftc -frontend -parse
          else
            echo "Swift compiler unavailable; Python preflight already validated"
          fi
