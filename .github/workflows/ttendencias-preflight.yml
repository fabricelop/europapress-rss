name: Preflight TTendencias web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ttendencias-preflight.yml"
      - "trends/update_trends.py"
      - "trends/editorial-config.json"
      - "trends/auto_queue_new.py"
      - "trends/enrich_explained_images.py"
      - "trends/apply_editorial_outbox.py"
      - "trends/apply_ai_image_outbox.py"
      - "trends/migrate_legacy_chat_svg.py"
      - "trends/editorial-run-prompt.md"
      - "trends/telegram-manual-explained.json"
      - ".github/workflows/ai-image-generate.yml"
      - ".github/workflows/ttendencias-ai-image-apply.yml"
      - "vercel-webhook/ttendencias/**"
      - "vercel-webhook/test/ttendencias-image-ui.test.mjs"
      - "vercel-webhook/api/ttendencias-control.js"
      - "vercel-webhook/api/ttendencias-top10-push.js"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validar Python y JSON
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 -m py_compile trends/update_trends.py trends/auto_queue_new.py trends/enrich_explained_images.py trends/apply_editorial_outbox.py trends/apply_ai_image_outbox.py trends/migrate_legacy_chat_svg.py
          python3 trends/enrich_explained_images.py --selftest
          python3 trends/apply_ai_image_outbox.py --selftest
          python3 trends/migrate_legacy_chat_svg.py --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          explained=json.loads(Path("trends/telegram-manual-explained.json").read_text(encoding="utf-8"))
          for item in explained.get("items",[]):
              ai=item.get("ai_image") or {}
              if ai:
                  assert ai.get("provider")=="chat-imagegen" and ai.get("origin")=="executing_chat"
                  assert int((ai.get("context_guard") or {}).get("version") or 0)==3
              assert not (item.get("image_choice")=="ai" and not ai), "image_choice ai sin ImageGen válido"
          json.loads(Path("vercel-webhook/vercel.json").read_text(encoding="utf-8"))
          print("JSON_OK")
          PY

      - name: Validar JavaScript TTendencias
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for src,dst in [
              ("vercel-webhook/ttendencias/index.html","/tmp/ttendencias-index.js"),
              ("vercel-webhook/ttendencias/explicadas/index.html","/tmp/ttendencias-explicadas.js"),
          ]:
              html=Path(src).read_text(encoding="utf-8")
              scripts=re.findall(r"<script>([\s\S]*?)</script>",html,re.I)
              if not scripts:
                  raise SystemExit(f"No se encontró script inline en {src}")
              Path(dst).write_text("\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/ttendencias-index.js
          node --check /tmp/ttendencias-explicadas.js
          node --check vercel-webhook/api/ttendencias-control.js
          node --check vercel-webhook/api/ttendencias-top10-push.js
          node --check vercel-webhook/ttendencias/sw.js
          node --test vercel-webhook/test/ttendencias-image-ui.test.mjs

      - name: Validar contrato nuevo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          py=Path("trends/update_trends.py").read_text(encoding="utf-8")
          top=Path("vercel-webhook/ttendencias/index.html").read_text(encoding="utf-8")
          exp=Path("vercel-webhook/ttendencias/explicadas/index.html").read_text(encoding="utf-8")
          assert "entered_top10_at" in py
          assert "entered_top10_at" in top and "entryTime" in top and "rankMove" in top
          assert "collapseVisibleExplained" in exp and "const nextItems=collapseVisibleExplained(sorted)" in exp
          assert "Copiar" in exp and 'id="filter"' in exp
          assert "TT#" in exp
          assert "Gag IA" in exp and "Archivo / fallback" in exp
          assert "✨ Generar IA" in exp and "📝 Reexplicar" in exp
          assert "🔁 Rehacer remate + IA" not in exp
          assert "!x.copied&&!x.rewrite_pending" in exp
          assert 'id="workingCount"' in top and 'id="workingSheet"' in top and "openWorkingSheet" in top
          assert 'provider==="chat-imagegen"' in exp and 'origin==="executing_chat"' in exp
          api=Path("vercel-webhook/api/ttendencias-control.js").read_text(encoding="utf-8")
          assert 'action === "regenerate-image"' in api
          assert 'action === "use-fallback-image"' in api
          prompt=Path("trends/editorial-run-prompt.md").read_text(encoding="utf-8")
          assert "misma conversación" in prompt and "provider:\"chat-imagegen\"" in prompt
          assert "No uses el ImageGen interno" not in prompt
          legacy=Path(".github/workflows/ai-image-generate.yml").read_text(encoding="utf-8")
          assert "LEGACY_AI_IMAGE_GENERATOR_DISABLED" in legacy
          assert "TT_IMAGE_ENDPOINT" not in legacy and "cairosvg" not in legacy and '"provider": "chat-svg"' not in legacy
          print("CONTRACT_OK")
          PY
