name: TTActualidad Buffer - validacion IPA moderna (sin publicar)
on:
  push:
    paths:
      - "ios/ttactualidad/**"
      - ".github/workflows/ttactualidad-buffer-ios-verify.yml"
  pull_request:
    paths:
      - "ios/ttactualidad/**"
      - ".github/workflows/ttactualidad-buffer-ios-verify.yml"
permissions:
  contents: read
concurrency:
  group: ttactualidad-buffer-ios-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install xcodegen librsvg
      - name: Render icon
        working-directory: ios/ttactualidad
        run: |
          mkdir -p TTActualidad/Assets.xcassets/AppIcon.appiconset
          rsvg-convert --width 1024 --height 1024 --format png --output TTActualidad/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png art/AppIcon.svg
      - name: Preflight de fuentes y Live Activity
        run: python3 ios/ttactualidad/tests/preflight.py
      - name: Generate Xcode project
        working-directory: ios/ttactualidad
        run: xcodegen generate
      - name: Compile modern app + extension (no X publication)
        working-directory: ios/ttactualidad
        run: |
          set -o pipefail
          xcodebuild -project TTActualidad.xcodeproj -scheme TTActualidad \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath .build CODE_SIGNING_ALLOWED=NO build | tee /tmp/buffer-ios-build.log
      - name: Package PlumeImpactor unsigned IPA
        working-directory: ios/ttactualidad
        run: |
          set -euo pipefail
          APP=".build/Build/Products/Release-iphoneos/TTActualidad.app"
          test -d "$APP/PlugIns/TTActualidadLive.appex"
          test -s "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" | grep -Fx "0.4.83"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist" | grep -Fx "95"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qr TTActualidad-0.4.83-build95-Buffer-unsigned.ipa Payload
          unzip -l TTActualidad-0.4.83-build95-Buffer-unsigned.ipa | grep 'TTActualidadLive.appex/Info.plist'
          shasum -a 256 TTActualidad-0.4.83-build95-Buffer-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TTActualidad-0.4.83-build95-Buffer-IPA
          path: ios/ttactualidad/dist/TTActualidad-0.4.83-build95-Buffer-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
