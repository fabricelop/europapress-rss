name: Ingerir OUTBOX TTiTTulares desde PR #2

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: ttittulares-repo-write
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event.issue.number == 2 && startsWith(github.event.comment.body, 'TTITTULARES_OUTBOX_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar validador de imágenes
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow
      - name: Decodificar y validar OUTBOX del comentario
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import os, json, base64, re
          body=os.environ["COMMENT_BODY"]
          prefix="TTITTULARES_OUTBOX_V1\n"
          if not body.startswith(prefix):
              raise SystemExit("Prefijo OUTBOX inválido")
          raw=base64.b64decode(body[len(prefix):].strip(), validate=True)
          payload=json.loads(raw.decode("utf-8"))
          eid=str(payload.get("event_id") or "")
          rev=int(payload.get("revision") or 1)
          if not re.fullmatch(r"[A-Za-z0-9_-]{4,80}",eid):
              raise SystemExit("event_id inválido")
          if rev < 1:
              raise SystemExit("revision inválida")
          open("/tmp/ttittulares-outbox.json","wb").write(raw+b"\n")
          open("/tmp/ttittulares-outbox-name","w").write(f"{eid}-r{rev}.json")
          PY
      - name: Aplicar OUTBOX y persistir estado
        run: |
          set -e
          git config user.name "ttittulares-pr-outbox-bot"
          git config user.email "actions@users.noreply.github.com"
          NAME="$(cat /tmp/ttittulares-outbox-name)"
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ttittulares/editorial-outbox
            cp /tmp/ttittulares-outbox.json "ttittulares/editorial-outbox/$NAME"
            python3 ttittulares/apply_editorial_outbox.py
            git add telegram/editorial-processing.json ttittulares/prepared.json ttittulares/status.json ttittulares/editorial-queue.json ttittulares/execution-errors.json
            git add -A -- ttittulares/generated-images ttittulares/editorial-outbox 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "OUTBOX ya materializado o no aplicable."
              exit 0
            fi
            git commit -m "Aplicar OUTBOX TTiTTulares desde PR #2"
            if git push origin HEAD:main; then
              echo "OUTBOX materializado."
              exit 0
            fi
            sleep $((intento * 2))
          done
          echo "ERROR: no se pudo materializar OUTBOX tras 5 intentos."
          exit 1
