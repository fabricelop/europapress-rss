name: TTActualidad - publicar con Buffer (aprobacion manual)
on:
  repository_dispatch:
    types: [ttactualidad_buffer_publish_v1]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency:
  group: ttactualidad-buffer-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publicar solo el item aprobado o reconciliar pendientes
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TT_BUFFER_REQUEST_JSON: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || '{}' }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git reset --hard origin/main
          python3 pilot/ttactualidad_buffer_publish.py
