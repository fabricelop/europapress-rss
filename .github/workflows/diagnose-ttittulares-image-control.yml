name: Diagnosticar bloqueo IA TTiTTulares

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-ttittulares-image-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public control routes without mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, socket, urllib.request, urllib.error, datetime
          print("PROBE_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat())
          hosts=["tt-control.fabricelop.workers.dev",
                 "ttactualidad-decisions-pilot.fabricelop.workers.dev"]
          for host in hosts:
              try:
                  rr=socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
                  print("DNS",host, sorted(set((x[0].name,x[4][0]) for x in rr)))
              except Exception as e:
                  print("DNS_ERROR",host,type(e).__name__,str(e)[:160])
          probes=[
              ("control-health","https://tt-control.fabricelop.workers.dev/health"),
              ("control-status","https://tt-control.fabricelop.workers.dev/api/ttittulares-run-status?view=listener-snapshot"),
              ("control-image-job","https://tt-control.fabricelop.workers.dev/api/ttittulares-run-status?view=image-job&strong=1&id=29bd988db076"),
              ("control-webhook-version","https://tt-control.fabricelop.workers.dev/api/ttittulares-webhook-version"),
              ("app-health","https://ttactualidad-decisions-pilot.fabricelop.workers.dev/health"),
              ("github-image-index","https://raw.githubusercontent.com/fabricelop/europapress-rss/control/ttittulares-run-trigger-v2/ttittulares/image-runs/index.json"),
          ]
          for label,url in probes:
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"TTiTTularesImageControlDiagnostic/1","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req,timeout=14) as r:
                      body=r.read(12000).decode("utf-8","replace")
                      print("RESULT",label,r.status,"len",len(body))
                      if label=="control-status":
                          try:
                              d=json.loads(body)
                              print("STATUS_SUMMARY",json.dumps({k:v for k,v in d.items() if k in ("worker_id","updated_at","last_seen_at","listener","image_jobs","images","health","status","ok")},ensure_ascii=False)[:1000])
                          except Exception:print("STATUS_BODY",body[:320])
                      elif label=="control-image-job":
                          try:
                              d=json.loads(body)
                              print("JOB_SUMMARY",json.dumps({k:v for k,v in d.items() if k in ("status","command_id","pc_launched_at","updated_at","phase","error","message")},ensure_ascii=False)[:600])
                          except Exception:print("JOB_BODY",body[:280])
                      elif label=="control-health": print("HEALTH_BODY",body[:250])
              except urllib.error.HTTPError as e:
                  print("HTTP_ERROR",label,e.code,e.read(300).decode("utf-8","replace"))
              except Exception as e:
                  print("TRANSPORT_ERROR",label,type(e).__name__,str(e)[:260])
          # POST body intentionally invalid; no state-mutating action can be authorized.
          req=urllib.request.Request("https://tt-control.fabricelop.workers.dev/api/ttittulares-run",data=b'{}',
                                     headers={"Content-Type":"application/json","User-Agent":"TTImageControlDiagnostic/1"},method="POST")
          try:
              with urllib.request.urlopen(req,timeout=14) as r:
                  print("INVALID_POST",r.status,r.read(200).decode("utf-8","replace"))
          except urllib.error.HTTPError as e:
              print("INVALID_POST",e.code,e.read(240).decode("utf-8","replace"))
          except Exception as e:
              print("INVALID_POST_TRANSPORT_ERROR",type(e).__name__,str(e)[:240])
          # Probe the ACK handler with a deliberately wrong command_id.
          # It must reject before any write: HTTP 409 is a healthy route response.
          invalid=json.dumps({"task":"image_pc_ack","target_id":"29bd988db076",
                              "command_id":"TTIT_DIAGNOSTIC_NONEXISTENT_COMMAND",
                              "stage":"picked_up","worker_id":"ttit-readonly-probe"}).encode("utf-8")
          req=urllib.request.Request("https://tt-control.fabricelop.workers.dev/api/ttittulares-run",
                                     data=invalid,method="POST",
                                     headers={"Content-Type":"application/json",
                                              "User-Agent":"TTImageControlDiagnostic-ReadOnly/1"})
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  print("INVALID_IMAGE_ACK_RESULT",r.status,r.read(300).decode("utf-8","replace"))
          except urllib.error.HTTPError as e:
              print("INVALID_IMAGE_ACK_HTTP",e.code,e.read(300).decode("utf-8","replace"))
          except Exception as e:
              print("INVALID_IMAGE_ACK_TRANSPORT",type(e).__name__,str(e)[:240])
          PY
