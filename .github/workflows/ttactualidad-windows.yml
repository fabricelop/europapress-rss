name: TTActualidad Windows - EXE and source
on:
  push:
    paths:
      - "desktop/ttactualidad/**"
      - ".github/workflows/ttactualidad-windows.yml"
  pull_request:
    paths:
      - "desktop/ttactualidad/**"
      - ".github/workflows/ttactualidad-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ttactualidad-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native modern UI dependencies
        run: python -m pip install --disable-pip-version-check -r desktop/ttactualidad/requirements.txt pyinstaller
      - name: Check syntax and run legacy and modern UI tests
        run: |
          python -m py_compile desktop/ttactualidad/TTActualidad.py desktop/ttactualidad/TTActualidad_Moderno.pyw
          python -m unittest discover -s desktop/ttactualidad -p 'test_*.py' -v
      - name: Package modern native Windows application
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TTActualidad --paths desktop/ttactualidad --hidden-import=keyring.backends.Windows desktop/ttactualidad/TTActualidad_Moderno.pyw
          if (!(Test-Path dist/TTActualidad.exe)) { throw "Windows executable not produced" }
          Get-FileHash dist/TTActualidad.exe -Algorithm SHA256
      - name: Package alternative source ZIP with no EXE
        shell: pwsh
        run: |
          $items = @(
            'desktop/ttactualidad/TTActualidad.py',
            'desktop/ttactualidad/TTActualidad_Moderno.pyw',
            'desktop/ttactualidad/requirements.txt',
            'desktop/ttactualidad/GUIA-WINDOWS-SIN-EXE.md'
          )
          Compress-Archive -Path $items -DestinationPath dist/TTActualidad-Sin-EXE.zip -Force
          if (!(Test-Path dist/TTActualidad-Sin-EXE.zip)) { throw "Source ZIP not produced" }
      - uses: actions/upload-artifact@v4
        with:
          name: TTActualidad-Windows-Portable-EXE
          path: dist/TTActualidad.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: TTActualidad-Windows-Sin-EXE
          path: dist/TTActualidad-Sin-EXE.zip
          if-no-files-found: error
          retention-days: 30
