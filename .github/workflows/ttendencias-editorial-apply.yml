name: Aplicar resultados editoriales TTendencias

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "trends/editorial-outbox/**"
      - "trends/apply_editorial_outbox.py"
      - ".github/workflows/ttendencias-editorial-apply.yml"

permissions:
  contents: write

concurrency:
  group: ttendencias-editorial-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preparar imágenes
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow

      - name: Aplicar resultados editoriales
        run: |
          set -euo pipefail
          git config user.name "ttendencias-editorial"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git fetch --depth=1 origin main
            git reset --hard origin/main

            # Durante un mantenimiento solicitado por el usuario, consumir
            # cualquier outbox tardío de la ejecución cancelada sin aplicarlo.
            if python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("trends/editorial-queue.json")
          try:
              doc=json.loads(p.read_text(encoding="utf-8"))
          except Exception:
              doc={}
          raise SystemExit(0 if doc.get("maintenance_pause") else 1)
          PY
            then
              rm -f trends/editorial-outbox/*.json
              git add -A trends/editorial-outbox
              if ! git diff --cached --quiet; then
                git commit -m "Descartar outbox TTendencias durante mantenimiento"
                if git push origin HEAD:main; then
                  exit 0
                fi
                sleep $((attempt * 2))
                continue
              fi
              exit 0
            fi

            apply_status=0
            python3 trends/apply_editorial_outbox.py || apply_status=$?
            git add -A trends
            if git diff --cached --quiet; then
              exit "$apply_status"
            fi
            git commit -m "Aplicar resultados editoriales TTendencias"
            if git push origin HEAD:main; then
              exit "$apply_status"
            fi
            echo "Push editorial falló (intento $attempt); reaplicando estado fresco"
            sleep $((attempt * 2))
          done

          echo "No se pudo persistir el resultado editorial" >&2
          exit 1
