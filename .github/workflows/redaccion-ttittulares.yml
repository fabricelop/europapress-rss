name: Redaccion TTiTTulares programada

on:
  workflow_dispatch:
  schedule:
    - cron: '15,45 * * * *'

concurrency:
  group: ttittulares-redaccion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Registrar solicitud de redaccion
        run: python3 telegram/editorial_scheduler.py
      - name: Guardar solicitud
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram/editorial-processing.json telegram/editorial-schedule-state.json
          git diff --cached --quiet && exit 0
          git commit -m "Solicitar redaccion automatica TTiTTulares"
          git pull --rebase origin main
          git push origin HEAD:main
