name: Redaccion TTiTTulares programada

on:
  workflow_dispatch:
  schedule:
    - cron: '15,45 * * * *'

concurrency:
  group: ttittulares-redaccion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guardar solicitud sobre main actual sin conflictos de rebase
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # editorial-processing.json is updated concurrently by the radar,
          # Telegram and the editorial agent. Always re-read fresh main,
          # regenerate the request, and retry a non-fast-forward push.
          # Never resolve this shared JSON by a text merge/rebase.
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python3 telegram/editorial_scheduler.py
            git add telegram/editorial-processing.json telegram/editorial-schedule-state.json
            if git diff --cached --quiet; then
              echo "No hay nuevas solicitudes que guardar."
              exit 0
            fi
            git commit -m "Solicitar redaccion automatica TTiTTulares"
            if git push origin HEAD:main; then
              echo "Solicitud editorial guardada (intento $attempt)."
              exit 0
            fi
            echo "Main avanzo; releyendo cola fresca para reintentar ($attempt/6)."
            sleep "$attempt"
          done
          echo "No se pudo guardar la solicitud tras 6 intentos." >&2
          exit 1
