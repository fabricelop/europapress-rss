name: TTActualidad V2 PWA - publish without V1 test coupling
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/v2/**'
      - '.github/workflows/ttactualidad-v2-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tt-mobile-github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}v2/
    steps:
      - uses: actions/checkout@v4
      - name: Validate V2 PWA and stage existing site unchanged
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/v2/app.js
          node --check docs/v2/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import json,shutil
          src=Path('docs')
          assert (src/'index.html').is_file()
          for name in ('index.html','app.js','styles.css','manifest.webmanifest','sw.js'):
              assert (src/'v2'/name).is_file(),name
          m=json.loads((src/'v2/manifest.webmanifest').read_text())
          assert m['start_url']=='./' and m['display']=='standalone'
          assert 'feature/ttactualidad-v2-clean' in (src/'v2/app.js').read_text()
          dest=Path('/tmp/tt-v2-pages-site')
          shutil.copytree(src,dest)
          (dest/'.nojekyll').write_text('')
          print('TT_V2_PWA_STAGE=OK')
          PY
      - name: Prepare icons (preserve existing V1 files)
        run: |
          python3 -m pip install -q --disable-pip-version-check CairoSVG
          python3 - <<'PY'
          import cairosvg
          from pathlib import Path
          site=Path('/tmp/tt-v2-pages-site')
          svg=site/'icon.svg'
          assert svg.is_file()
          for filename,size in {'icon-32.png':32,'apple-touch-icon.png':180,'icon-192.png':192,'icon-512.png':512}.items():
              if not (site/filename).is_file():
                  cairosvg.svg2png(url=str(svg),write_to=str(site/filename),output_width=size,output_height=size)
          assert (site/'v2/index.html').is_file()
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/tt-v2-pages-site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm
        run: echo "TT_V2_PWA_URL=${{ steps.deployment.outputs.page_url }}v2/"
