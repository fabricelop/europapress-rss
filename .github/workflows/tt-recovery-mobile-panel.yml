name: Panel privado de recuperacion TT
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tt-recovery-mobile-panel.yml'
permissions:
  contents: read
jobs:
  private-recovery-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publicar boton de recuperacion privada (sin exponer tokens)
        env:
          TT_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TT_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TR_BOT: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
          TR_CHAT: ${{ secrets.TTENDENCIAS_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,sys
          def send(label,bot,chat,callback):
              token=os.getenv(bot,"").strip()
              target=os.getenv(chat,"").strip()
              if not token or not target:
                  print("RECOVERY_PANEL_NOT_CONFIGURED",label,flush=True)
                  return False
              data={
                "chat_id":target,
                "text":"Panel de recuperacion tecnica de "+label+"\n\nPulsa el boton cuando las imagenes o los mensajes esten atascados. Se solicita una revision y recuperacion segura al watchdog del PC. No reinicia Windows, no elimina noticias y no reemplaza una verificacion de entrega.\n\nEl PC debe estar encendido y conectado.",
                "disable_notification":True,
                "reply_markup":{"inline_keyboard":[[{"text":"🔧 Autocorregir ahora","callback_data":callback}]]}
              }
              payload=json.dumps(data,ensure_ascii=False).encode("utf-8")
              req=urllib.request.Request("https://api.telegram.org/bot"+token+"/sendMessage",
                 data=payload,headers={"Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=15) as result:
                      d=json.load(result)
                  if not d.get("ok"):
                      print("RECOVERY_PANEL_FAIL",label,str(d.get("description",""))[:200],flush=True)
                      return False
                  print("RECOVERY_PANEL_SENT",label,"message_id",(d.get("result") or {}).get("message_id"),flush=True)
                  return True
              except (urllib.error.URLError,ValueError) as ex:
                  print("RECOVERY_PANEL_ERROR",label,type(ex).__name__,flush=True)
                  return False
          ok_a=send("TTiTTulares","TT_BOT","TT_CHAT","tt:heal")
          ok_b=send("TTendencias","TR_BOT","TR_CHAT","tx:heal")
          if not (ok_a or ok_b):
              sys.exit("No se ha podido crear ningun boton; comprobar secretos y bots")
          PY
