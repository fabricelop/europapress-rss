name: Mi Mapa del Tiempo v1.0.10 - compilar y probar

on:
  push:
    branches:
      - feature/mi-mapa-del-tiempo-ios-v10
    paths:
      - 'gps-ios/native/**'
      - '.github/workflows/mi-mapa-del-tiempo-v10-verify.yml'

permissions:
  contents: write

concurrency:
  group: gps-ios-v10
  cancel-in-progress: true

jobs:
  validate-widgets:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: gps-ios/native
    steps:
      - uses: actions/checkout@v4
      - name: Registrar ID de compilación para diagnóstico
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          PATH_STATUS=".build-status/mi-mapa-v10-verify.json"
          CONTENT="$(printf '{"run_id":%s,"sha":"%s","kind":"verify"}' "$GITHUB_RUN_ID" "$GITHUB_SHA" | base64 | tr -d '\n')"
          OLD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$PATH_STATUS?ref=$GITHUB_REF_NAME" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$OLD_SHA" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$PATH_STATUS" -f message="CI: registrar identificador del run verify" -f content="$CONTENT" -f branch="$GITHUB_REF_NAME" -f sha="$OLD_SHA" >/dev/null || true
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$PATH_STATUS" -f message="CI: registrar identificador del run verify" -f content="$CONTENT" -f branch="$GITHUB_REF_NAME" >/dev/null || true
          fi
      - name: Preparar proyecto nativo
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          swiftc -frontend -parse Sources/*.swift Shared/*.swift Widgets/*.swift Tests/*.swift
          python3 tools/make_icon.py
          xcodegen generate --spec project.yml
          test -f MiMapaDelTiempo.xcodeproj/project.pbxproj
      - name: Compilar iPhone y extensión WidgetKit (sin firma)
        run: |
          set -euo pipefail
          xcodebuild -project MiMapaDelTiempo.xcodeproj \
            -scheme MiMapaDelTiempo -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/gps-widget-release" \
            CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/gps-widget-release/Build/Products/Release-iphoneos/MiMapaDelTiempo.app"
          test -d "$APP"
          test -d "$APP/PlugIns/MiMapaWidgets.appex"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APP/PlugIns/MiMapaWidgets.appex/Info.plist"
          APP="$APP" python3 - <<'PY'
          import os,plistlib
          from pathlib import Path
          a=Path(os.environ["APP"])
          app=plistlib.load((a/"Info.plist").open("rb"))
          ext=plistlib.load((a/"PlugIns/MiMapaWidgets.appex/Info.plist").open("rb"))
          assert app["CFBundleIdentifier"] == "es.mimapadeltiempo.app", app
          assert app["CFBundleVersion"] == "11", app
          assert app["CFBundleShortVersionString"] == "1.0.10", app
          assert ext["CFBundleIdentifier"] == "es.mimapadeltiempo.app.widgets", ext
          assert ext["CFBundleVersion"] == "11", ext
          assert ext["CFBundleShortVersionString"] == "1.0.10", ext
          assert ext["NSExtension"]["NSExtensionPointIdentifier"] == "com.apple.widgetkit-extension", ext
          print("App y widget con identificadores verificados")
          PY
      - name: Elegir simulador de iPhone
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,os
          devices=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))["devices"]
          matches=[d for runtime, group in devices.items() if "iOS" in runtime for d in group if "iPhone" in d["name"] and d["state"] != "Unavailable"]
          if not matches: raise SystemExit("No hay simulador iPhone")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write("SIMULATOR_ID="+matches[0]["udid"]+"\n")
          print(matches[0]["name"])
          PY
      - name: Ejecutar XCTest en simulador iPhone
        run: |
          set -euo pipefail
          xcodebuild test -project MiMapaDelTiempo.xcodeproj \
            -scheme MiMapaDelTiempo -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Empaquetar IPA de evaluación (sin firma)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/gps-widget-release/Build/Products/Release-iphoneos/MiMapaDelTiempo.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -q -r MiMapaDelTiempo-v10-unsigned.ipa Payload
          unzip -t MiMapaDelTiempo-v10-unsigned.ipa >/dev/null
      - name: Guardar IPA de evaluación
        uses: actions/upload-artifact@v4
        with:
          name: MiMapaDelTiempo-v10-unsigned
          path: gps-ios/native/MiMapaDelTiempo-v10-unsigned.ipa
          retention-days: 5
          if-no-files-found: error
