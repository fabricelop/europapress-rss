name: Mi Mapa del Tiempo v1.0.14 - IPA sin firma
on:
  push:
    branches:
      - feature/mi-mapa-del-tiempo-ios-v14-territories-outline
    paths:
      - '.github/workflows/mi-mapa-del-tiempo-v14-ipa.yml'
      - 'gps-ios/native/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gps-ios-v14-package
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: gps-ios/native
    steps:
      - uses: actions/checkout@v4
      - name: Registrar ID de compilación para diagnóstico
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          PATH_STATUS=".build-status/mi-mapa-v14-ipa.json"
          CONTENT="$(printf '{"run_id":%s,"sha":"%s","kind":"ipa"}' "$GITHUB_RUN_ID" "$GITHUB_SHA" | base64 | tr -d '\n')"
          OLD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$PATH_STATUS?ref=$GITHUB_REF_NAME" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$OLD_SHA" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$PATH_STATUS" -f message="CI: registrar identificador del run ipa" -f content="$CONTENT" -f branch="$GITHUB_REF_NAME" -f sha="$OLD_SHA" >/dev/null || true
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$PATH_STATUS" -f message="CI: registrar identificador del run ipa" -f content="$CONTENT" -f branch="$GITHUB_REF_NAME" >/dev/null || true
          fi
      - name: Preparar proyecto y validar sintaxis
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          swiftc -frontend -parse Sources/*.swift Shared/*.swift Widgets/*.swift Tests/*.swift
          python3 tools/make_icon.py
          xcodegen generate --spec project.yml
      - name: Compilar aplicación y WidgetKit para iPhone sin firma
        run: |
          set -euo pipefail
          xcodebuild -project MiMapaDelTiempo.xcodeproj -scheme MiMapaDelTiempo \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/gps-v14-package" CODE_SIGNING_ALLOWED=NO build
      - name: Verificar identificador, versiones, extensión y empaquetar
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/gps-v14-package/Build/Products/Release-iphoneos/MiMapaDelTiempo.app"
          test -d "$APP/PlugIns/MiMapaWidgets.appex"
          APP="$APP" python3 - <<'PY'
          import os,plistlib
          from pathlib import Path
          app=Path(os.environ["APP"])
          main=plistlib.loads((app/"Info.plist").read_bytes())
          widget=plistlib.loads((app/"PlugIns/MiMapaWidgets.appex/Info.plist").read_bytes())
          assert main["CFBundleIdentifier"]=="es.mimapadeltiempo.app", main
          assert main["CFBundleShortVersionString"]=="1.0.14", main
          assert main["CFBundleVersion"]=="15", main
          assert "location" in main["UIBackgroundModes"], main
          assert widget["CFBundleIdentifier"]=="es.mimapadeltiempo.app.widgets", widget
          assert widget["CFBundleShortVersionString"]=="1.0.14", widget
          assert widget["CFBundleVersion"]=="15", widget
          assert widget["NSExtension"]["NSExtensionPointIdentifier"]=="com.apple.widgetkit-extension", widget
          print("Bundle IDs, builds, modo location y extensión WidgetKit verificados")
          PY
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -q -r MiMapaDelTiempo-v14-unsigned.ipa Payload
          unzip -t MiMapaDelTiempo-v14-unsigned.ipa >/dev/null
          ls -lh MiMapaDelTiempo-v14-unsigned.ipa
      - name: Publicar IPA unsigned
        uses: actions/upload-artifact@v4
        with:
          name: MiMapaDelTiempo-v14-unsigned
          path: gps-ios/native/MiMapaDelTiempo-v14-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
