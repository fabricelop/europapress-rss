name: TTActualidad publication confirmation tests
on:
  pull_request:
    paths:
      - "pilot/apply-ttactualidad-action.py"
      - "pilot/test_ttactualidad_publications.py"
      - "pilot/ttactualidad-publication-events.json"
      - ".github/workflows/ttactualidad-direct-actions.yml"
      - ".github/workflows/ttactualidad-published-24h-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated publication tests (no production writes)
        run: python3 pilot/test_ttactualidad_publications.py -v
      - name: Verify Python syntax
        run: python3 -m py_compile pilot/apply-ttactualidad-action.py pilot/test_ttactualidad_publications.py
