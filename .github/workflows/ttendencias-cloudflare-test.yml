name: TTendencias sin Vercel - pruebas de compatibilidad
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'no-vercel/ttendencias-worker/**'
      - 'windows/TTendenciasDedicatedListener.ps1'
      - 'windows/TTendenciasImageBridge.js'
      - 'windows/TTendenciasMobileChatTriggerListener.ps1'
      - 'windows/MobileChatTriggerListener.ps1'
      - 'windows/TT-LocalWatchdog.ps1'
      - '.github/workflows/ttendencias-cloudflare-test.yml'
permissions:
  contents: read
jobs:
  worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: no-vercel/ttendencias-worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local development dependencies
        run: npm install --no-audit --no-fund
      - name: Test compatibility and critical editorial routes
        run: npm test
      - name: Verify Cloudflare bundle without deploying
        run: npx wrangler deploy --dry-run --outdir .wrangler-bundle-check
