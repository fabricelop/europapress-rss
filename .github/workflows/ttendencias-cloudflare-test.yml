name: TTendencias sin Vercel - pruebas de compatibilidad
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'no-vercel/ttendencias-worker/**'
      - 'windows/TTendenciasDedicatedListener.ps1'
      - 'windows/TTendenciasImageBridge.js'
      - 'windows/TTendenciasMobileChatTriggerListener.ps1'
      - 'windows/MobileChatTriggerListener.ps1'
      - 'windows/TT-LocalWatchdog.ps1'
      - '.github/workflows/ttendencias-cloudflare-test.yml'
permissions:
  contents: read
jobs:
  worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: no-vercel/ttendencias-worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local development dependencies
        run: npm install --no-audit --no-fund
      - name: Test compatibility and critical editorial routes
        run: npm test
      - name: Verify Cloudflare bundle without deploying
        run: npx wrangler deploy --dry-run --outdir .wrangler-bundle-check
      - name: Smoke-test Cloudflare runtime and public GitHub snapshot
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/ttendencias-worker-dev.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:8787/health -o /tmp/tt-healthy.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/ttendencias-worker-dev.log; exit 1; fi
          node -e 'const d=require("/tmp/tt-healthy.json");if(!d.ok)process.exit(1)'
          curl -fsS --max-time 12 http://127.0.0.1:8787/ttendencias/ -o /tmp/tt-original-panel.html
          grep -q 'TTendencias Control' /tmp/tt-original-panel.html
          code="$(curl -sS -o /tmp/tt-denied.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' --data '{"action":"queue","names":["PR-TEST"]}' \
            http://127.0.0.1:8787/api/ttendencias-control)"
          test "$code" = 401
          status="$(curl -sS --max-time 45 -o /tmp/tt-public-state.json -w '%{http_code}' \
            http://127.0.0.1:8787/api/ttendencias-control?view=state)"
          echo "TTendencias public state HTTP=$status"
          if [ "$status" = 200 ]; then
            node -e 'const f=require("node:fs"); const d=JSON.parse(f.readFileSync("/tmp/tt-public-state.json"));if(!(d.ok&&d.recent?.items&&d.requests?.requests&&d.explained?.items))process.exit(1)'
          else
            echo "FAIL: original TTendencias state endpoint must work independently of Vercel"
            head -c 1000 /tmp/tt-public-state.json || true
            tail -n 80 /tmp/ttendencias-worker-dev.log
            exit 1
          fi
