name: TTendencias text reconcile once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ttendencias-text-reconcile-once.yml'
permissions:
  contents: read
concurrency:
  group: ttendencias-text-reconcile-once
  cancel-in-progress: true
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "No-op; canonical concurrent run already reconciled the text."
