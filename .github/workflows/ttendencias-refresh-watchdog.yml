name: TTendencias refresh watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "8,23,38,53 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar frescura del Top 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from datetime import datetime, timezone

          repo=os.environ["GITHUB_REPOSITORY"]
          headers={
              "Accept":"application/vnd.github+json",
              "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"ttendencias-refresh-watchdog",
          }

          def get(url):
              req=urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          recent=get(f"https://api.github.com/repos/{repo}/contents/trends/recent.json?ref=main")
          data=json.loads(base64.b64decode(recent["content"]).decode())
          captured=datetime.fromisoformat(str(data["captured_at"]).replace("Z","+00:00")).astimezone(timezone.utc)
          age=(datetime.now(timezone.utc)-captured).total_seconds()/60
          print(f"Top10 age: {age:.1f} min")
          if age <= 18:
              raise SystemExit(0)

          runs=get(f"https://api.github.com/repos/{repo}/actions/workflows/ttendencias-refresh.yml/runs?per_page=20").get("workflow_runs",[])
          active=[x for x in runs if x.get("status") in {"queued","in_progress","pending","waiting"}]
          if active:
              print("Refresh ya activo/encolado:", [(x.get("id"),x.get("status")) for x in active[:3]])
              raise SystemExit(0)

          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/workflows/ttendencias-refresh.yml/dispatches",
              method="POST",
              data=json.dumps({"ref":"main"}).encode(),
              headers={**headers,"Content-Type":"application/json"},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              if r.status != 204:
                  raise SystemExit(f"dispatch inesperado: {r.status}")
          print("Refresh TTendencias relanzado por watchdog")
          PY
