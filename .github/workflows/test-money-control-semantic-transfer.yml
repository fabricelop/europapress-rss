name: Test Money Control semantic transfers

on:
  push:
    branches: [main]
    paths:
      - "vercel-webhook/money-control/index.html"
      - "vercel-webhook/api/money-control-interpret.js"
      - ".github/scripts/test-money-control-semantic-transfer.mjs"
      - ".github/workflows/test-money-control-semantic-transfer.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check vercel-webhook/api/money-control-interpret.js
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('vercel-webhook/money-control/index.html','utf8');
          const m=html.match(/<script>([\s\S]*)<\/script>/);
          if(!m)throw new Error('Script no encontrado');
          new Function(m[1]);
          console.log('MONEY_CONTROL_HTML_SYNTAX_OK');
          NODE
      - run: node .github/scripts/test-money-control-semantic-transfer.mjs
      - name: Probar intérprete IA real en producción
        run: |
          cat > /tmp/mc-payload.json <<'JSON'
          {
            "text": "Transferencia que viene de la cuenta de BBVA, hacia CI Comun: FECHA DE OPERACIÓN CONCEPTO FECHA VALOR IMPORTE SALDO\n05/10/2026 TRANSF CTA DE:FABRICE LOPEZ ILL 05/10/2026 200,00 EUR 6.793,01 EUR. Ya estaba en los movimientos de bbva. Estos son los ultimos de bbva: 05 octubre 2026 Adeudo mensual de tarjeta 4552232382975194 -100,99 EUR 1.029,18 EUR. 02 octubre 2026 Transferencia realizada Fabrice lopez illac -200,00 EUR 1.130,17 EUR",
            "today": "2026-10-05",
            "defaultAccount": "",
            "accounts": [
              {"id":"1","name":"BBVA","group":"Cuentas"},
              {"id":"2","name":"CI Comun","group":"Cuentas"}
            ]
          }
          JSON
          curl --fail-with-body -sS https://europapress-rss.vercel.app/api/money-control-interpret \
            -H 'content-type: application/json' \
            --data-binary @/tmp/mc-payload.json > /tmp/mc-response.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/mc-response.json','utf8'));
          if(!x.ok||!x.interpretation)throw new Error('Respuesta IA inválida: '+JSON.stringify(x));
          const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim().replace(/\s+/g,' ');
          const ms=x.interpretation.movements||[];
          const m=ms.find(v=>v.kind==='transfer'&&norm(v.account)==='BBVA'&&norm(v.destinationAccount)==='CI COMUN'&&Math.abs(Number(v.amount))===200);
          if(!m)throw new Error('No interpretó BBVA -> CI Comun: '+JSON.stringify(x.interpretation));
          if(m.existingSide!=='source')throw new Error('No marcó origen existente: '+JSON.stringify(m));
          const bs=x.interpretation.balances||[];
          const b=bs.find(v=>norm(v.account)==='CI COMUN'&&Math.abs(Number(v.balance)-6793.01)<0.001);
          if(!b)throw new Error('No interpretó saldo CI Comun 6793,01: '+JSON.stringify(x.interpretation));
          console.log('MONEY_CONTROL_REAL_AI_TRANSFER_OK');
          console.log(JSON.stringify({movement:m,balance:b,summary:x.interpretation.summary}));
          NODE
