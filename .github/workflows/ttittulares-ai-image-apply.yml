name: TTiTTulares · aplicar imagen IA sin bloqueo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ttittulares/image-outbox/**"
      - "ttittulares/apply_ai_image_outbox.py"
      - "ttittulares/apply_editorial_outbox.py"
      - ".github/workflows/ttittulares-ai-image-apply.yml"

permissions:
  contents: write
  issues: read

concurrency:
  group: ttittulares-ai-image-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar raster
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow
      - name: Validar consumidor
        run: python3 -m py_compile ttittulares/apply_ai_image_outbox.py ttittulares/apply_editorial_outbox.py
      - name: Probar puente raster aislado
        run: python3 ttittulares/apply_ai_image_outbox.py --selftest
      - name: Materializar IA sin tocar el texto
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "ttittulares-image-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 ttittulares/apply_ai_image_outbox.py
            git add -A ttittulares/prepared.json ttittulares/generated-images
            if [ -d ttittulares/image-outbox ]; then git add -A ttittulares/image-outbox; fi
            if ! git diff --cached --quiet; then
              git commit -m "Adjuntar imagen IA a TTiTTulares"
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
              continue
            fi
            if compgen -G "ttittulares/image-outbox/*.json" > /dev/null; then
              echo "READY aún no visible; reintentando ($attempt/5)"
              sleep $((attempt * 2))
              continue
            fi
            exit 0
          done
          echo "No se pudo aplicar la imagen IA tras cinco intentos" >&2
          exit 1
