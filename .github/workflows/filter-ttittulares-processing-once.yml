name: Filtrar lote anomalo TTiTTulares
on:
  push:
    branches: [main]
    paths:
      - "ttittulares/filter-processing-trigger.txt"
permissions:
  contents: write
concurrency:
  group: ttittulares-repo-write
  cancel-in-progress: false
jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Filtrar sin ejecutar editorial ni imagenes
        run: |
          set -e
          git config user.name "ttittulares-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python3 ttittulares/filter_processing_batch.py
          python3 ttittulares/build_status.py
          git add telegram/editorial-processing.json ttittulares/status.json ttittulares/editorial-queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Filtrar lote anomalo de TTiTTulares"
          git pull --rebase origin main
          git push origin HEAD:main
