name: Reparar callbacks Telegram TTendencias

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/fix_ttendencias_telegram_callbacks.py"
      - "vercel-webhook/api/telegram-webhook.js"
      - ".github/workflows/fix-ttendencias-telegram-callbacks.yml"

permissions:
  contents: write

concurrency:
  group: fix-ttendencias-telegram-callbacks
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar callback tx en webhook desplegado
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_ttendencias_telegram_callbacks.py
          node --check vercel-webhook/api/telegram-webhook.js

      - name: Persistir reparación si fuera necesaria
        run: |
          set -euo pipefail
          git config user.name "ttendencias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vercel-webhook/api/telegram-webhook.js
          if git diff --cached --quiet; then
            echo "Callback tx ya correcto."
            exit 0
          fi
          git commit -m "Corregir Publicado/Desestimar Telegram TTendencias"
          git pull --rebase origin main
          git push origin HEAD:main
