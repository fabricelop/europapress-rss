name: Mi Mapa del Tiempo v1.0.24 - IPA paralelo Impactor
on:
  push:
    branches:
      - feature/mi-mapa-del-tiempo-ios-v24-final-polish
    paths:
      - '.github/workflows/mi-mapa-del-tiempo-v24-impactor-ipa.yml'
      - 'gps-ios/native/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gps-ios-v24-parallel-package
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: gps-ios/native
    steps:
      - uses: actions/checkout@v4
      - name: Preparar proyecto y validar sintaxis
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          swiftc -frontend -parse Sources/*.swift Shared/*.swift Live/*.swift Tests/*.swift
          python3 tools/make_icon.py
          xcodegen generate --spec project.yml
          test -f Live/TimeLiveActivity.swift
          ! grep -q 'CODE_SIGN_ENTITLEMENTS = App.entitlements' MiMapaDelTiempo.xcodeproj/project.pbxproj
          ! grep -q 'CODE_SIGN_ENTITLEMENTS = Widgets/Widget.entitlements' MiMapaDelTiempo.xcodeproj/project.pbxproj
      - name: Compilar aplicación y En vivo para iPhone sin firma
        run: |
          set -euo pipefail
          xcodebuild -project MiMapaDelTiempo.xcodeproj -scheme MiMapaDelTiempo \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/gps-v24-parallel-package" CODE_SIGNING_ALLOWED=NO build
      - name: Verificar identificador, versiones, extensión y empaquetar
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/gps-v24-parallel-package/Build/Products/Release-iphoneos/MiMapaDelTiempo.app"
          test -d "$APP/PlugIns/MiMapaWidgets.appex"
          APP="$APP" python3 - <<'PY'
          import os,plistlib
          from pathlib import Path
          app=Path(os.environ["APP"])
          main=plistlib.loads((app/"Info.plist").read_bytes())
          widget=plistlib.loads((app/"PlugIns/MiMapaWidgets.appex/Info.plist").read_bytes())
          assert main["CFBundleIdentifier"]=="es.mimapadeltiempo.appprueba", main
          assert main["CFBundleShortVersionString"]=="1.0.24", main
          assert main["CFBundleVersion"]=="25", main
          assert "location" in main["UIBackgroundModes"], main
          assert widget["CFBundleIdentifier"]=="es.mimapadeltiempo.appprueba.widgets", widget
          assert widget["CFBundleShortVersionString"]=="1.0.24", widget
          assert widget["CFBundleVersion"]=="25", widget
          assert widget["NSExtension"]["NSExtensionPointIdentifier"]=="com.apple.widgetkit-extension", widget
          assert main["CFBundleDisplayName"]=="Mi Mapa del Tiempo", main
          assert widget["CFBundleDisplayName"]=="Mi Mapa del Tiempo", widget
          assert "mimapadeltiempoprueba" in str(main.get("CFBundleURLTypes",[]))
          print("IPA DE PRUEBA y extensión de Actividad en vivo verificadas")
          PY
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -q -r MiMapaDelTiempo-v24-unsigned.ipa Payload
          unzip -t MiMapaDelTiempo-v24-unsigned.ipa >/dev/null
          ls -lh MiMapaDelTiempo-v24-unsigned.ipa
      - name: Publicar IPA unsigned
        uses: actions/upload-artifact@v4
        with:
          name: MiMapaDelTiempo-v24-unsigned
          path: gps-ios/native/MiMapaDelTiempo-v24-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
