name: Telegram emergencia sin D1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "telegram/emergency.json"
      - "telegram/emergency-trigger.txt"

concurrency:
  group: telegram-emergency
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar alertas de emergencia
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 <<'PY'
          import json, os, urllib.parse, urllib.request
          with open("telegram/emergency.json", encoding="utf-8") as f:
              data=json.load(f)
          token=os.environ["TELEGRAM_BOT_TOKEN"]
          chat=os.environ["TELEGRAM_CHAT_ID"]
          api=f"https://api.telegram.org/bot{token}/sendMessage"
          edit_api=f"https://api.telegram.org/bot{token}/editMessageReplyMarkup"
          state_file="telegram/emergency-sent.json"
          try:
              raw=open(state_file,encoding="utf-8").read().strip()
              old=json.loads(raw) if raw else {"messages":[]}
          except Exception:
              try:
                  old,_=json.JSONDecoder().raw_decode(raw)
              except Exception:
                  old={"messages":[]}
          sent_map={str(x.get("id")):x for x in old.get("messages",[]) if x.get("id")}
          seen=set()
          groups={}
          for m in data.get("messages", []):
              key=str(m.get("id") or m.get("text",""))
              if key in seen: continue
              seen.add(key)
              if key in sent_map:
                  print("Ya enviado, se omite",key)
                  continue
              text=str(m.get("text","")).replace("\\\\n","\\n").strip()
              # Cinturón de seguridad visual: todo mensaje de remate A/B/C debe llevar 🌶️.
              mm=re.match(r"^(?:🌶️\\s*)?([ABC]\\))\\s*(.*)$",text)
              if mm:
                  text="🌶️ "+mm.group(1)+" "+mm.group(2).strip()
              # Los botones PUBLICAR deben llevar siempre un tuit completo <= 280.
              # Si una variante excede el límite, recorta solo el texto del intent, nunca el mensaje editorial.
              for row in m.get("buttons", []):
                  items=row if isinstance(row,list) else [row]
                  for b in items:
                      u=str(b.get("url") or "")
                      if "twitter.com/intent/tweet?text=" in u or "x.com/intent/post?text=" in u:
                          parts=urllib.parse.urlsplit(u); qs=urllib.parse.parse_qs(parts.query)
                          tw=(qs.get("text") or [""])[0]
                          if len(tw)>280:
                              tw=tw[:279].rstrip()+"…"
                              b["url"]=urllib.parse.urlunsplit((parts.scheme,parts.netloc,parts.path,urllib.parse.urlencode({"text":tw}),parts.fragment))
              if not text: continue
              payload={"chat_id":chat,"text":text,"disable_web_page_preview":True}
              keyboard=[]
              for row_items in m.get("buttons", []):
                  items=row_items if isinstance(row_items,list) else [row_items]
                  row=[]
                  for b in items:
                      btn={"text":str(b.get("label") or b.get("text") or "Acción")}
                      if b.get("url"): btn["url"]=b["url"]
                      elif b.get("callback_data"): btn["callback_data"]=b["callback_data"]
                      if len(btn)>1: row.append(btn)
                  if row: keyboard.append(row)
              for b in m.get("flat_buttons", []):
                  btn={"text":str(b.get("label") or b.get("text") or "Acción")}
                  if b.get("url"): btn["url"]=b["url"]
                  elif b.get("callback_data"): btn["callback_data"]=b["callback_data"]
                  if len(btn)>1:
                      row=int(b.get("row",len(keyboard)))
                      if b.get("same_row") and keyboard: keyboard[-1].append(btn)
                      else: keyboard.append([btn])
              if keyboard: payload["reply_markup"]={"inline_keyboard":keyboard}
              req=urllib.request.Request(api,data=json.dumps(payload).encode(),headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  out=json.loads(r.read().decode())
                  if not out.get("ok"): raise RuntimeError(out)
              mid=out.get("result",{}).get("message_id")
              sent_map[key]={"id":key,"message_id":mid,"group":str(m.get("group") or "").strip()}
              group=str(m.get("group") or "").strip()
              if group:
                  groups.setdefault(group,[]).append((mid,m))
              print("Alerta de emergencia enviada", mid)
          # Attach one BORRAR TODO button to the final message of each group,
          # now that all real Telegram message_ids are known.
          for group, entries in groups.items():
              # Include message_ids already persisted by previous partial runs,
              # so retries can rebuild BORRAR TODO without resending messages.
              current={str(m.get("id") or m.get("text","")):m for _,m in entries}
              ordered=[]
              for m in data.get("messages", []):
                  if str(m.get("group") or "").strip()!=group: continue
                  key=str(m.get("id") or m.get("text",""))
                  old_item=sent_map.get(key,{})
                  mid=old_item.get("message_id")
                  if mid: ordered.append((mid,m))
              if not ordered: continue
              ids=[str(mid) for mid,_ in ordered if mid]
              mid,last=ordered[-1]
              keyboard=[]
              for row_items in last.get("buttons", []):
                  items=row_items if isinstance(row_items,list) else [row_items]
                  row=[]
                  for b in items:
                      btn={"text":str(b.get("label") or b.get("text") or "Acción")}
                      if b.get("url"): btn["url"]=b["url"]
                      elif b.get("callback_data"): btn["callback_data"]=b["callback_data"]
                      if len(btn)>1: row.append(btn)
                  if row: keyboard.append(row)
              keyboard.append([{"text":"🗑️ BORRAR TODO","callback_data":"dg:"+",".join(ids)}])
              payload={"chat_id":chat,"message_id":mid,"reply_markup":{"inline_keyboard":keyboard}}
              req=urllib.request.Request(edit_api,data=json.dumps(payload).encode(),headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=20) as rr:
                  out=json.loads(rr.read().decode())
                  if not out.get("ok"): raise RuntimeError(out)
          with open("telegram/emergency-sent.json","w",encoding="utf-8") as f:
              json.dump({"messages":list(sent_map.values())[-1000:]},f,ensure_ascii=False,indent=2)
              f.write("\\n")
          PY

      - name: Guardar IDs enviados
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram/emergency-sent.json
          git diff --cached --quiet && exit 0
          git commit -m "Guardar IDs Telegram enviados"
          if git push origin HEAD:main; then
            exit 0
          fi
          cp telegram/emergency-sent.json /tmp/emergency-sent.json
          git fetch origin main
          git reset --hard origin/main
          python3 <<'PY'
          import json
          from pathlib import Path
          cur=Path("telegram/emergency-sent.json")
          incoming=Path("/tmp/emergency-sent.json")
          def load(p):
              try:return json.loads(p.read_text(encoding="utf-8"))
              except Exception:return {"messages":[]}
          a=load(cur); b=load(incoming)
          merged={}
          for x in (a.get("messages",[])+b.get("messages",[])):
              k=str(x.get("id") or "")
              if k: merged[k]=x
          cur.write_text(json.dumps({"messages":list(merged.values())[-1000:]},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git add telegram/emergency-sent.json
          git commit -m "Guardar IDs Telegram enviados" || true
          git push origin HEAD:main
