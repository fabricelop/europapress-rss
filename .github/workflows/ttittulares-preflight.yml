name: Preflight TTiTTulares web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ttittulares-preflight.yml"
      - "ttittulares/**"
      - "telegram/radar_no_d1.py"
      - "telegram/source_telemetry.py"
      - "telegram/source_publication.py"
      - "telegram/autocheck_ttittulares.py"
      - "vercel-webhook/ttittulares/**"
      - "vercel-webhook/test/ttittulares-image-ui.test.mjs"
      - "vercel-webhook/test/ttittulares-source-table.test.mjs"
      - "vercel-webhook/test/ttittulares-search-x.test.mjs"
      - "vercel-webhook/api/ttittulares-control.js"
      - "vercel-webhook/api/ttittulares-widget.js"
      - "vercel-webhook/api/ttittulares-run-status.js"
      - "vercel-webhook/api/ttittulares-run.js"
      - "windows/TTiTTularesDedicatedListener.ps1"
      - "windows/Install-TTiTTularesMobileChatTrigger.ps1"
      - "vercel-webhook/api/ttendencias-control.js"
      - "ttittulares/tremending/**"
      - ".github/workflows/tremending-collect.yml"
      - ".github/workflows/tremending-capture.yml"
      - ".github/workflows/ai-image-generate.yml"
      - ".github/workflows/ttittulares-ai-image-apply.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ttittulares-preflight.yml"
      - "ttittulares/**"
      - "telegram/radar_no_d1.py"
      - "telegram/source_telemetry.py"
      - "telegram/source_publication.py"
      - "telegram/autocheck_ttittulares.py"
      - "vercel-webhook/ttittulares/**"
      - "vercel-webhook/test/ttittulares-image-ui.test.mjs"
      - "vercel-webhook/test/ttittulares-source-table.test.mjs"
      - "vercel-webhook/test/ttittulares-search-x.test.mjs"
      - "vercel-webhook/api/ttittulares-control.js"
      - "vercel-webhook/api/ttittulares-widget.js"
      - "vercel-webhook/api/ttittulares-run-status.js"
      - "vercel-webhook/api/ttendencias-control.js"
      - "ttittulares/tremending/**"
      - ".github/workflows/tremending-collect.yml"
      - ".github/workflows/tremending-capture.yml"
      - ".github/workflows/ai-image-generate.yml"
      - ".github/workflows/ttittulares-ai-image-apply.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de los autodiagnósticos
        run: python3 -m pip install -r requirements.txt pillow

      - name: Validar Python
        run: |
          python3 -m py_compile telegram/radar_no_d1.py telegram/source_telemetry.py telegram/source_publication.py telegram/autocheck_ttittulares.py ttittulares/auto_queue.py ttittulares/build_status.py ttittulares/build_editorial_queue.py ttittulares/apply_editorial_outbox.py ttittulares/apply_ai_image_outbox.py ttittulares/ingest_pr_outbox_comment.py ttittulares/reconcile_confirmed_stale.py ttittulares/tremending/update_tremending.py
          python3 telegram/radar_no_d1.py --selftest-dedupe
          python3 telegram/source_telemetry.py
          python3 telegram/source_publication.py
          python3 ttittulares/auto_queue.py --selftest
          python3 ttittulares/apply_editorial_outbox.py --selftest-images
          python3 ttittulares/apply_ai_image_outbox.py --selftest
          python3 ttittulares/tremending/update_tremending.py --selftest

      - name: Validar JSON y reglas
        run: |
          python3 - <<'PY'
          import json, urllib.parse
          from pathlib import Path

          def load(p):
              return json.loads(Path(p).read_text(encoding="utf-8"))

          cfg=load("ttittulares/config.json")
          mode=load("ttittulares/control-mode.json")
          prepared=load("ttittulares/prepared.json")
          processing=load("telegram/editorial-processing.json")
          status=load("ttittulares/status.json")
          manifest=load("vercel-webhook/ttittulares/manifest.webmanifest")
          vercel=load("vercel-webhook/vercel.json")
          root_vercel=load("vercel.json")
          html=Path("vercel-webhook/ttittulares/index.html").read_text(encoding="utf-8")

          assert cfg["radar"]["minimum_sources"] == 4
          assert cfg["radar"]["waiting_ttl_hours"] == 24
          assert cfg["images"]["mode"] == "ai_plus_fallback"
          assert cfg["images"]["generate"] is True
          assert cfg["images"]["ai_attempts_initial"] == 1
          assert cfg["images"]["non_blocking"] is True
          assert cfg["images"]["fallback_enabled"] is True
          assert mode["mode"] in {"telegram","parallel","web"}
          if mode["mode"]=="parallel": assert mode.get("parallel_since"), "parallel_since obligatorio"
          def autodeploy_off(doc):
              value=(doc.get("git") or {}).get("deploymentEnabled")
              return value is False or (isinstance(value,dict) and value.get("main") is False)
          assert autodeploy_off(vercel), "autodeploy Vercel debe permanecer desactivado"
          assert autodeploy_off(root_vercel), "autodeploy Vercel raíz debe permanecer desactivado"
          # La antigua rama de preview ttittulares-release ya no forma parte del
          # flujo actual; no exigir una clave obsoleta que deja el preflight rojo.
          assert "Con 3 fuentes" not in html and "threeCount" not in html
          assert "fuentes funcionando" in html
          assert "En elaboración" in html and "Listas" in html
          appjs=Path("ttittulares/app.js").read_text(encoding="utf-8")
          assert "Gag IA" in appjs and "Archivo / fallback" in appjs
          assert "🔁 Rehacer" in appjs and "🖼️ Usar archivo/fallback" in appjs
          assert "✨ Generar IA" in html and "🖼️ Copiar imagen archivo" in html
          assert 'id="imageBar"' not in html and 'id="runImages"' not in html
          assert "Mensaje confirmado en ChatGPT" in html
          assert 'provider==="chat-imagegen"' in html and 'origin==="executing_chat"' in html
          assert "🔁 Rehacer remate + IA" in html
          assert "const imageInFlight=" in html and "imagen pendiente cancelada" in html, "La imagen no debe bloquear la publicación"
          assert manifest["start_url"] == "/ttittulares/"
          prompt=Path("ttittulares/editorial-run-prompt.md").read_text(encoding="utf-8")
          assert "misma conversación ejecutora" in prompt and "provider:\"chat-imagegen\"" in prompt
          assert "No uses el ImageGen interno" not in prompt and "crea exactamente UN trabajo visual" not in prompt
          run_api=Path("vercel-webhook/api/ttittulares-run.js").read_text(encoding="utf-8")
          run_status=Path("vercel-webhook/api/ttittulares-run-status.js").read_text(encoding="utf-8")
          control_api=Path("vercel-webhook/api/ttittulares-control.js").read_text(encoding="utf-8")
          listener=Path("windows/TTiTTularesDedicatedListener.ps1").read_text(encoding="utf-8")
          installer=Path("windows/Install-TTiTTularesMobileChatTrigger.ps1").read_text(encoding="utf-8")
          assert "const {doc:trigger}=await readTrigger();" in run_api
          assert "readControlJson(ACK_PATH)" in run_api
          assert "GitHub REST refleja el HEAD" in run_status
          assert "pc_worker_id" in run_status
          assert "readJson(PROCESSING)" in control_api
          assert '$WorkerId = "ttittulares-dedicated-v9"' in listener
          assert "worker=ttittulares-dedicated-v9" in installer

          ids=set()
          for item in prepared.get("items",[]):
              eid=str(item.get("event_id") or "")
              assert eid and eid not in ids, f"event_id duplicado: {eid}"
              ids.add(eid)
              ai=item.get("ai_image") or {}
              if ai:
                  assert ai.get("provider")=="chat-imagegen" and ai.get("origin")=="executing_chat", f"{eid}: ai_image sin procedencia de chat"
                  assert int((ai.get("context_guard") or {}).get("version") or 0)==3, f"{eid}: ai_image sin V3"
              assert not (item.get("image_choice")=="ai" and not ai), f"{eid}: image_choice ai sin ImageGen válido"
              drafted=int(item.get("drafted_source_count") or 0)
              # El umbral de 4 rige la selección automática del radar, no la
              # verificación editorial de una noticia ya preparada.
              cited={str(c.get("source") or "").strip() for c in item.get("citations",[]) if isinstance(c,dict)}
              assert drafted >= 2 and len(cited-{''}) >= 2, f"{eid}: faltan dos fuentes editoriales independientes ({drafted})"
              tweet=item.get("tweet")
              # Datos históricos pueden conservar variants; toda escritura nueva
              # usa un único tweet y el backend mantiene la lectura compatible.
              if isinstance(tweet,dict):
                  text=str(tweet.get("text") or "")
                  remate=str(tweet.get("remate") or "")
                  assert text and len(text) <= 280, f"{eid}: tuit vacío o >280"
                  assert remate.startswith("🌶️ "), f"{eid}: remate sin guindilla"
                  assert text.endswith("\n\n"+remate), f"{eid}: el tuit debe terminar con su remate"
                  assert "\\n" not in text and "\\n" not in remate, f"{eid}: contiene barra invertida+n literal"
                  url=str(tweet.get("url") or "")
                  if url:
                      q=urllib.parse.urlparse(url)
                      got=urllib.parse.parse_qs(q.query).get("text",[""])[0]
                      assert got == text, f"{eid}: enlace X no coincide con el texto"
              else:
                  variants=item.get("variants") or []
                  assert any(str(v.get("label") or "").upper()=="A" and str(v.get("remate") or "").startswith("🌶️ ") for v in variants), f"{eid}: histórico sin variante publicable"

          healthy=status.get("healthy_source_count")
          total=status.get("configured_sources")
          if healthy is not None and total is not None:
              assert 0 <= int(healthy) <= int(total)
          print("PREFLIGHT_JSON_OK")
          PY

      - name: Validar JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path("vercel-webhook/ttittulares/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script>([\s\S]*?)</script>",html,re.I)
          if not scripts:
              raise SystemExit("No se encontró script inline")
          Path("/tmp/ttittulares-inline.js").write_text("\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/ttittulares-inline.js
          node --check vercel-webhook/api/ttittulares-control.js
          node --check vercel-webhook/api/ttittulares-widget.js
          node --check vercel-webhook/api/ttittulares-run-status.js
          node --check vercel-webhook/api/ttittulares-run.js
          node --check ttittulares/tremending/capture_tweet.mjs
          node --check vercel-webhook/ttittulares/sw.js
          node --test vercel-webhook/test/ttittulares-image-ui.test.mjs vercel-webhook/test/ttittulares-source-table.test.mjs vercel-webhook/test/ttittulares-search-x.test.mjs

      - name: Resultado
        run: echo "TTiTTulares listo para preview técnico sin cambiar control-mode"
