name: Enviar TTendencias a Telegram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "trends/latest.json"

concurrency:
  group: telegram-send-serialized
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enviar mensajes TTendencias a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          with open("trends/latest.json", encoding="utf-8") as f:
              data = json.load(f)

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          api = f"https://api.telegram.org/bot{token}/sendMessage"

          def tweet_text_from_url(url):
              try:
                  parsed = urllib.parse.urlparse(url)
                  if parsed.netloc not in {"twitter.com", "www.twitter.com", "x.com", "www.x.com"}:
                      return None
                  values = urllib.parse.parse_qs(parsed.query).get("text")
                  return values[0] if values else None
              except Exception:
                  return None

          def remate_only(tweet_text):
              if not tweet_text:
                  return None
              pos = tweet_text.find("🌶️")
              return tweet_text[pos:].strip() if pos >= 0 else tweet_text.strip()

          for msg in data.get("messages", []):
              # Las alternativas deben verse en el propio mensaje de Telegram,
              # no quedar ocultas detrás de los botones.
              alt_texts = []
              for b in msg.get("buttons", []):
                  label = str(b.get("label", "")).lower()
                  if "alt." in label and b.get("url"):
                      t = remate_only(tweet_text_from_url(b["url"]))
                      if t:
                          alt_texts.append(t)
              visible_text = msg["text"]
              if alt_texts:
                  visible_text += "\n\nAlternativas:\n" + "\n".join(f"{i}) {t}" for i, t in enumerate(alt_texts, 1))

              payload = {"chat_id": chat_id, "text": visible_text, "disable_web_page_preview": True}
              keyboard = []
              for b in msg.get("buttons", []):
                  button = {"text": b["label"]}
                  if b.get("url"):
                      button["url"] = b["url"]
                      tweet_text = tweet_text_from_url(b["url"])
                      if tweet_text and "abrir" in b["label"].lower() and "x" in b["label"].lower():
                          keyboard.append([button, {"text": "📋 Copia", "copy_text": {"text": tweet_text}}])
                      else:
                          keyboard.append([button])
                  elif b.get("callback_data"):
                      button["callback_data"] = b["callback_data"]
                      keyboard.append([button])
                  elif b.get("copy_text"):
                      button["copy_text"] = {"text": b["copy_text"]}
                      keyboard.append([button])
                  else:
                      raise ValueError(f"Botón inválido: {b}")

              search_terms = [str(x).strip() for x in msg.get("search_terms", []) if str(x).strip()][:3]
              if search_terms:
                  query = " OR ".join(search_terms)
                  search_url = "https://x.com/search?" + urllib.parse.urlencode({"q": query, "src": "typed_query", "f": "live"})
                  keyboard.append([{"text": "🔎 Buscar en X", "url": search_url}])

              keyboard.append([{"text": "🗑️ Quitar", "callback_data": "delete:message"}])
              payload["reply_markup"] = {"inline_keyboard": keyboard}
              req = urllib.request.Request(api, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req) as r:
                  result = json.loads(r.read().decode("utf-8"))
                  if not result.get("ok"):
                      raise RuntimeError(result)
              print("TTendencia enviada.")
          PY
