name: Enviar TTendencias a Telegram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "trends/latest.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: ttendencias-telegram-send
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enviar mensajes TTendencias al bot propio
        id: send
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          root = Path("trends")
          data = json.loads((root / "latest.json").read_text(encoding="utf-8"))
          state_path = root / "telegram-bot-state.json"
          requests_path = root / "requests.json"

          state = json.loads(state_path.read_text(encoding="utf-8"))
          requests_doc = json.loads(requests_path.read_text(encoding="utf-8"))
          chat_id = state.get("chat_id")
          if not chat_id:
              raise SystemExit("TTendencias no está enlazado todavía: abre el bot y pulsa /start.")

          token = os.environ["TTENDENCIAS_BOT_TOKEN"]
          api_base = f"https://api.telegram.org/bot{token}"

          def telegram_json(method, payload):
              req = urllib.request.Request(
                  f"{api_base}/{method}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req) as r:
                  result = json.loads(r.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(result)
              return result["result"]

          def norm(s):
              return " ".join(str(s or "").split()).casefold()

          def noise_name(s):
              v = norm(s)
              return (
                  v.startswith("explore why ")
                  or (" is trending " in (" " + v + " ") and "latest viral tweets" in v)
                  or "real-time buzz from twitter" in v
              )

          def tweet_text_from_url(url):
              try:
                  parsed = urllib.parse.urlparse(url)
                  if parsed.netloc not in {"twitter.com", "www.twitter.com", "x.com", "www.x.com"}:
                      return None
                  values = urllib.parse.parse_qs(parsed.query).get("text")
                  return values[0] if values else None
              except Exception:
                  return None

          def remate_only(tweet_text):
              if not tweet_text:
                  return None
              pos = tweet_text.find("🌶️")
              return tweet_text[pos:].strip() if pos >= 0 else tweet_text.strip()

          def stable_x_compose_url(url):
              """Normaliza los enlaces de composición al Web Intent clásico,
              que conserva mejor la sesión/app que x.com/intent/post."""
              tweet_text = tweet_text_from_url(url)
              if not tweet_text:
                  return url
              return "https://twitter.com/intent/tweet?" + urllib.parse.urlencode({"text": tweet_text})

          def trend_name(msg, visible_text):
              explicit = str(msg.get("trend_name") or "").strip()
              if explicit:
                  return explicit
              m = re.search(r"\bT\d+\s*·\s*([^\n]+)", visible_text)
              return m.group(1).strip() if m else ""

          for msg in data.get("messages", []):
              alt_texts = []
              for b in msg.get("buttons", []):
                  label = str(b.get("label", "")).lower()
                  if "alt." in label and b.get("url"):
                      t = remate_only(tweet_text_from_url(b["url"]))
                      if t:
                          alt_texts.append(t)

              visible_text = msg["text"]
              if "🌶️" in visible_text and len(alt_texts) < 3:
                  print(
                      f"AVISO: {msg.get('trend_name') or 'TTendencia'} trae {len(alt_texts)} alternativa(s); "
                      "el objetivo editorial son 3, pero se envía igualmente para no perder la tendencia",
                      flush=True,
                  )
              if alt_texts:
                  visible_text += "\n\nAlternativas:\n" + "\n".join(
                      f"{i}) {t}" for i, t in enumerate(alt_texts, 1)
                  )

              name = trend_name(msg, visible_text)
              related_trends = [
                  str(x).strip() for x in msg.get("related_trends", [])
                  if str(x).strip() and not noise_name(x)
              ]
              if not related_trends and name:
                  related_trends = [name]

              related_norm = {norm(x) for x in related_trends}
              already_done = [
                  item for item in requests_doc.get("requests", [])
                  if norm(item.get("name")) in related_norm
                  and (
                      item.get("status") == "explained"
                      or (item.get("status") == "ready" and item.get("telegram_message_id"))
                  )
              ]
              if related_trends and len(already_done) >= len(related_norm):
                  print("TTendencia ya enviada/explicada; se omite:", name or "(sin nombre)")
                  continue

              key_basis = " | ".join(related_trends) if related_trends else name
              key = hashlib.sha256(key_basis.encode("utf-8")).hexdigest()[:12] if key_basis else ""

              payload = {
                  "chat_id": chat_id,
                  "text": visible_text,
                  "disable_web_page_preview": True,
              }
              keyboard = []
              for b in msg.get("buttons", []):
                  button = {"text": b["label"]}
                  if b.get("url"):
                      normalized_url = stable_x_compose_url(b["url"]) if ("abrir" in b["label"].lower() or "publicar" in b["label"].lower()) and "x" in b["label"].lower() else b["url"]
                      button["url"] = normalized_url
                      tweet_text = tweet_text_from_url(normalized_url)
                      if tweet_text and len(tweet_text) <= 256 and "abrir" in b["label"].lower() and "x" in b["label"].lower():
                          keyboard.append([
                              button,
                              {"text": "📋 Copia", "copy_text": {"text": tweet_text}},
                          ])
                      else:
                          keyboard.append([button])
                  elif b.get("copy_text"):
                      button["copy_text"] = {"text": b["copy_text"]}
                      keyboard.append([button])

              search_terms = [
                  str(x).strip() for x in msg.get("search_terms", [])
                  if str(x).strip()
              ][:3]
              if search_terms:
                  query = " OR ".join(search_terms)
                  search_url = "https://x.com/search?" + urllib.parse.urlencode({
                      "q": query, "src": "typed_query", "f": "live"
                  })
                  keyboard.append([{"text": "🔎 Buscar en X", "url": search_url}])

              if key:
                  keyboard.append([
                      {"text": "✅ EXPLICADA", "callback_data": f"explained:{key}"},
                      {"text": "✖ Cerrar", "callback_data": f"close:{key}"},
                  ])

              payload["reply_markup"] = {"inline_keyboard": keyboard}

              # Imagen editorial: debe ser la imagen generada para TTendencias.
              # Nunca se sustituye silenciosamente por una foto de archivo.
              image_path = str(msg.get("image_path") or "").strip()
              image_url = str(msg.get("image_url") or "").strip()
              image_message_id = None
              if image_path:
                  import mimetypes, uuid
                  photo_file = Path(image_path)
                  if not photo_file.is_file():
                      raise FileNotFoundError(f"Imagen editorial no encontrada: {image_path}")
                  boundary = "----TTendencias" + uuid.uuid4().hex
                  mime = mimetypes.guess_type(photo_file.name)[0] or "application/octet-stream"
                  fields = {"chat_id": str(chat_id), "disable_notification": "false"}
                  image_alt = str(msg.get("image_alt") or "").strip()
                  if image_alt:
                      fields["caption"] = image_alt[:1024]
                  body = bytearray()
                  for k, v in fields.items():
                      body.extend(f'--{boundary}\\r\\nContent-Disposition: form-data; name="{k}"\\r\\n\\r\\n{v}\\r\\n'.encode())
                  body.extend(f'--{boundary}\\r\\nContent-Disposition: form-data; name="photo"; filename="{photo_file.name}"\\r\\nContent-Type: {mime}\\r\\n\\r\\n'.encode())
                  body.extend(photo_file.read_bytes())
                  body.extend(f'\\r\\n--{boundary}--\\r\\n'.encode())
                  req = urllib.request.Request(
                      f"{api_base}/sendPhoto",
                      data=bytes(body),
                      headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
                  )
                  with urllib.request.urlopen(req) as r:
                      result = json.loads(r.read().decode("utf-8"))
                  if not result.get("ok"):
                      raise RuntimeError(result)
                  image_message_id = result["result"]["message_id"]
              elif image_url:
                  raise ValueError("No se permiten URLs/fotos de archivo como sustituto de una imagen editorial generada; usa image_path.")

              sent = telegram_json("sendMessage", payload)
              if key:
                  state.setdefault("pending", {})[key] = {
                      "name": name,
                      "related_trends": related_trends,
                      "message_id": sent["message_id"],
                      "chat_id": chat_id,
                      "image_message_id": image_message_id,
                  }
                  related_norm = {norm(x) for x in related_trends}
                  for item in requests_doc.get("requests", []):
                      if norm(item.get("name")) in related_norm and item.get("status") in {"preparing", "update"}:
                          item["status"] = "ready"
                          item["telegram_message_id"] = sent["message_id"]

              state_path.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              requests_path.write_text(
                  json.dumps(requests_doc, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              print("TTendencia enviada:", name or "(sin nombre)")

          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          requests_path.write_text(
              json.dumps(requests_doc, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Comprobar salud TTendencias
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
          SEND_OUTCOME: ${{ steps.send.outcome }}
        run: python3 trends/healthcheck.py

      - name: Guardar estado del bot TTendencias
        if: always()
        run: |
          cp trends/telegram-bot-state.json /tmp/tt-state-local.json
          cp trends/requests.json /tmp/tt-requests-local.json
          test -f trends/health-status.json && cp trends/health-status.json /tmp/tt-health-local.json || true

          git config user.name "ttendencias-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python3 trends/merge_runtime_state.py \
              --local-requests /tmp/tt-requests-local.json \
              --local-state /tmp/tt-state-local.json \
              --local-health /tmp/tt-health-local.json

            git add trends/telegram-bot-state.json trends/requests.json trends/health-status.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Registrar mensajes editoriales TTendencias"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Conflicto de escritura TTendencias; reintentando fusión semántica ($attempt/3)"
          done
          echo "No se pudo persistir estado TTendencias tras 3 intentos"
          exit 1
