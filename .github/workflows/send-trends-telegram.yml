name: Enviar TTendencias a Telegram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "trends/latest.json"

permissions:
  contents: write

concurrency:
  group: ttendencias-telegram-send
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enviar mensajes TTendencias al bot propio
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          root = Path("trends")
          data = json.loads((root / "latest.json").read_text(encoding="utf-8"))
          state_path = root / "telegram-bot-state.json"
          requests_path = root / "requests.json"

          state = json.loads(state_path.read_text(encoding="utf-8"))
          requests_doc = json.loads(requests_path.read_text(encoding="utf-8"))
          chat_id = state.get("chat_id")
          if not chat_id:
              raise SystemExit("TTendencias no está enlazado todavía: abre el bot y pulsa /start.")

          token = os.environ["TTENDENCIAS_BOT_TOKEN"]
          api_base = f"https://api.telegram.org/bot{token}"

          def telegram_json(method, payload):
              req = urllib.request.Request(
                  f"{api_base}/{method}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req) as r:
                  result = json.loads(r.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(result)
              return result["result"]

          def norm(s):
              return " ".join(str(s or "").split()).casefold()

          def tweet_text_from_url(url):
              try:
                  parsed = urllib.parse.urlparse(url)
                  if parsed.netloc not in {"twitter.com", "www.twitter.com", "x.com", "www.x.com"}:
                      return None
                  values = urllib.parse.parse_qs(parsed.query).get("text")
                  return values[0] if values else None
              except Exception:
                  return None

          def remate_only(tweet_text):
              if not tweet_text:
                  return None
              pos = tweet_text.find("🌶️")
              return tweet_text[pos:].strip() if pos >= 0 else tweet_text.strip()

          def trend_name(msg, visible_text):
              explicit = str(msg.get("trend_name") or "").strip()
              if explicit:
                  return explicit
              m = re.search(r"\bT\d+\s*·\s*([^\n]+)", visible_text)
              return m.group(1).strip() if m else ""

          for msg in data.get("messages", []):
              alt_texts = []
              for b in msg.get("buttons", []):
                  label = str(b.get("label", "")).lower()
                  if "alt." in label and b.get("url"):
                      t = remate_only(tweet_text_from_url(b["url"]))
                      if t:
                          alt_texts.append(t)

              visible_text = msg["text"]
              if alt_texts:
                  visible_text += "\n\nAlternativas:\n" + "\n".join(
                      f"{i}) {t}" for i, t in enumerate(alt_texts, 1)
                  )

              name = trend_name(msg, visible_text)
              related_trends = [
                  str(x).strip() for x in msg.get("related_trends", [])
                  if str(x).strip()
              ]
              if not related_trends and name:
                  related_trends = [name]
              key_basis = " | ".join(related_trends) if related_trends else name
              key = hashlib.sha256(key_basis.encode("utf-8")).hexdigest()[:12] if key_basis else ""

              payload = {
                  "chat_id": chat_id,
                  "text": visible_text,
                  "disable_web_page_preview": True,
              }
              keyboard = []
              for b in msg.get("buttons", []):
                  button = {"text": b["label"]}
                  if b.get("url"):
                      button["url"] = b["url"]
                      tweet_text = tweet_text_from_url(b["url"])
                      if tweet_text and "abrir" in b["label"].lower() and "x" in b["label"].lower():
                          keyboard.append([
                              button,
                              {"text": "📋 Copia", "copy_text": {"text": tweet_text}},
                          ])
                      else:
                          keyboard.append([button])
                  elif b.get("copy_text"):
                      button["copy_text"] = {"text": b["copy_text"]}
                      keyboard.append([button])

              search_terms = [
                  str(x).strip() for x in msg.get("search_terms", [])
                  if str(x).strip()
              ][:3]
              if search_terms:
                  query = " OR ".join(search_terms)
                  search_url = "https://x.com/search?" + urllib.parse.urlencode({
                      "q": query, "src": "typed_query", "f": "live"
                  })
                  keyboard.append([{"text": "🔎 Buscar en X", "url": search_url}])

              if key:
                  keyboard.append([
                      {"text": "✅ EXPLICADA", "callback_data": f"explained:{key}"},
                      {"text": "✖ Cerrar", "callback_data": f"close:{key}"},
                  ])

              payload["reply_markup"] = {"inline_keyboard": keyboard}

              # La imagen editorial es opcional. Cuando existe, se envía únicamente
              # a Telegram y antes del bloque de texto. Telegram acepta una URL HTTPS
              # pública en el campo photo, por lo que latest.json no necesita guardar
              # binarios ni el workflow tocar otros proyectos.
              image_url = str(msg.get("image_url") or "").strip()
              image_message_id = None
              if image_url:
                  if not image_url.lower().startswith("https://"):
                      raise ValueError(f"image_url debe ser HTTPS: {image_url}")
                  photo_payload = {
                      "chat_id": chat_id,
                      "photo": image_url,
                      "disable_notification": False,
                  }
                  image_alt = str(msg.get("image_alt") or "").strip()
                  if image_alt:
                      # Caption breve y descriptivo; nunca duplica el tuit completo.
                      photo_payload["caption"] = image_alt[:1024]
                  photo_sent = telegram_json("sendPhoto", photo_payload)
                  image_message_id = photo_sent["message_id"]

              sent = telegram_json("sendMessage", payload)
              if key:
                  state.setdefault("pending", {})[key] = {
                      "name": name,
                      "related_trends": related_trends,
                      "message_id": sent["message_id"],
                      "chat_id": chat_id,
                      "image_message_id": image_message_id,
                  }
                  related_norm = {norm(x) for x in related_trends}
                  for item in requests_doc.get("requests", []):
                      if norm(item.get("name")) in related_norm and item.get("status") == "preparing":
                          item["status"] = "ready"
                          item["telegram_message_id"] = sent["message_id"]

              print("TTendencia enviada:", name or "(sin nombre)")

          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          requests_path.write_text(
              json.dumps(requests_doc, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Guardar estado del bot TTendencias
        run: |
          git config user.name "ttendencias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trends/telegram-bot-state.json trends/requests.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Registrar mensajes editoriales TTendencias"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
