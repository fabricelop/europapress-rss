name: TT Control Telegram pager

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tt-control-telegram.yml'
      - 'telegram/tt-control-trigger.txt'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: tt-control-telegram-pager
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notify new TT Control drafts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request, urllib.parse, hashlib, hmac
          from pathlib import Path

          state_path=Path("telegram/tt-control-state.json")
          state=json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
          old_message=state.get("message_id")
          previous_count=state.get("ready_count")
          previous_signature=state.get("ready_signature")
          try:
              req=urllib.request.Request("https://tt-control.fabricelop.workers.dev/api/public/ready-count")
              with urllib.request.urlopen(req) as r:
                  payload=json.loads(r.read().decode())
                  ready_count=int(payload.get("ready",0))
                  ready_signature=str(payload.get("signature",""))
          except Exception as e:
              print("READY count query failed:",e)
              raise SystemExit(1)
          state["ready_count"]=ready_count
          state["ready_signature"]=ready_signature
          # Notify whenever the actual READY set changes and remains non-empty. Comparing
          # only the count missed a new draft when another READY item was published/deleted.
          if previous_signature is not None and ready_signature==str(previous_signature):
              state_path.write_text(json.dumps(state,indent=2)+"\n",encoding="utf-8")
              print("READY set unchanged; no Telegram notification.")
              raise SystemExit
          if ready_count==0:
              if old_message:
                  try:
                      post_token=os.environ["TELEGRAM_BOT_TOKEN"]; post_chat=os.environ["TELEGRAM_CHAT_ID"]
                      req=urllib.request.Request("https://api.telegram.org/bot"+post_token+"/deleteMessage",data=json.dumps({"chat_id":post_chat,"message_id":old_message}).encode(),headers={"Content-Type":"application/json"})
                      urllib.request.urlopen(req).read()
                  except Exception: pass
              state.pop("message_id",None)
              state_path.write_text(json.dumps(state,indent=2)+"\n",encoding="utf-8")
              print("READY empty; pager cleared.")
              raise SystemExit

          token=os.environ["TELEGRAM_BOT_TOKEN"]; chat=os.environ["TELEGRAM_CHAT_ID"]; secret=os.environ["TELEGRAM_WEBHOOK_SECRET"]
          def post(method,payload):
              req=urllib.request.Request("https://api.telegram.org/bot"+token+"/"+method,data=json.dumps(payload).encode(),headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req) as r: return json.loads(r.read().decode())

          if old_message:
              try: post("deleteMessage",{"chat_id":chat,"message_id":old_message})
              except Exception: pass

          n=ready_count
          sent=post("sendMessage",{"chat_id":chat,"text":f"📰 TT Control · {n} noticia{'s' if n!=1 else ''} lista{'s' if n!=1 else ''} para revisar","disable_web_page_preview":True})
          mid=sent["result"]["message_id"]
          sig=hmac.new(secret.encode(),str(mid).encode(),hashlib.sha256).hexdigest()
          open_url="https://tt-control.fabricelop.workers.dev/?view=READY"
          kb={"inline_keyboard":[[{"text":"ABRIR TT CONTROL","url":open_url}],[{"text":"🗑️ Borrar","callback_data":"delete:message"}]]}
          post("editMessageReplyMarkup",{"chat_id":chat,"message_id":mid,"reply_markup":kb})
          state["message_id"]=mid
          state_path.write_text(json.dumps(state,indent=2)+"\n",encoding="utf-8")
          print("TT Control alert sent:",n)
          PY

      - name: Save pager state
        run: |
          git config user.name "tt-control-telegram"
          git config user.email "actions@users.noreply.github.com"
          git add telegram/tt-control-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update TT Control Telegram pager state [skip ci]"
          git push
