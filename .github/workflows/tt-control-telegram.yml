name: TT Control Telegram pager

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tt-control-telegram.yml'
      - 'telegram/tt-control-trigger.txt'
      - 'telegram/tt-control-state.json'
  schedule:
    - cron: '17 5-22 * * *'

concurrency:
  group: tt-control-telegram-pager
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  pager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notify new TT Control drafts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TT_CONTROL_BRIDGE_TOKEN: ${{ secrets.TT_CONTROL_BRIDGE_TOKEN }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request, urllib.parse, hashlib, hmac
          from pathlib import Path

          state_path=Path("telegram/tt-control-state.json")
          raw_state=state_path.read_text(encoding="utf-8").strip().replace("\\n","") if state_path.exists() else "{}"
          state=json.loads(raw_state)
          old_message=state.get("message_id")
          previous_sha=state.get("result_commit_sha")
          media_baselined="media_alert_ids" in state
          seen_media=set(state.get("media_alert_ids",[]))

          token=os.environ["TELEGRAM_BOT_TOKEN"]; chat=os.environ["TELEGRAM_CHAT_ID"]
          bridge_token=os.environ.get("TT_CONTROL_BRIDGE_TOKEN","").strip()
          if bridge_token:
              try:
                  reqs=urllib.request.Request("https://tt-control.fabricelop.workers.dev/api/telegram-credentials",data=json.dumps({"token":token,"chat_id":chat}).encode(),headers={"Content-Type":"application/json","Authorization":"Bearer "+bridge_token})
                  with urllib.request.urlopen(reqs,timeout=15) as rr:
                      sync_body=rr.read().decode(); print("Telegram credentials sync:",sync_body)
                      state["credential_sync_ok"]=True
              except Exception as e:
                  state["credential_sync_ok"]=False; state["credential_sync_error"]=str(e); print("Telegram credentials sync failed:",e)
          # TTiTTulares usa un único consumidor getUpdates (telegram-input.yml), igual que el patrón estable de SLR.
          # Asegurar que Telegram no entrega callbacks a un webhook competidor.
          try:
              req=urllib.request.Request("https://api.telegram.org/bot"+token+"/deleteWebhook",data=json.dumps({"drop_pending_updates":False}).encode(),headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=15) as rr: print("Webhook disabled for polling:",rr.read().decode())
              req2=urllib.request.Request("https://api.telegram.org/bot"+token+"/getWebhookInfo")
              with urllib.request.urlopen(req2,timeout=15) as rr:
                  wi=json.loads(rr.read().decode()); result=wi.get("result",{}); state["webhook_diagnostic"]={"url":result.get("url"),"pending_update_count":result.get("pending_update_count"),"last_error_date":result.get("last_error_date"),"last_error_message":result.get("last_error_message"),"checked":True}; print("WebhookInfo:",json.dumps(state["webhook_diagnostic"]))
          except Exception as e: print("Webhook disable failed:",e)
          def post(method,payload):
              req=urllib.request.Request("https://api.telegram.org/bot"+token+"/"+method,data=json.dumps(payload).encode(),headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req) as r: return json.loads(r.read().decode())

          # One-shot end-to-end test of a NEW radar alert using a real recent headline.
          if state.pop("force_new_alert_test",False):
              test_title="Sevilla 1-3 Barcelona | Raphinha firma un 'hat-trick' perfecto"
              kb={"inline_keyboard":[[{"text":"PREPARAR","callback_data":"media:PREPARE:854"},{"text":"INTERESANTE","callback_data":"media:INTERESTING:854"},{"text":"DESCARTAR","callback_data":"media:DISMISS:854"}]]}
              post("sendMessage",{"chat_id":chat,"text":"🚨 TT Control · Radar de medios  ·  PRUEBA\n\n"+test_title,"reply_markup":kb,"disable_web_page_preview":True})
              state_path.write_text(json.dumps(state,indent=2)+"\\n",encoding="utf-8")
              print("Forced new-alert test sent.")

          # Forced end-to-end test: take a REAL media_radar candidate even if it is below alert threshold.
          if state.pop("force_real_radar_test",False):
              try:
                  req=urllib.request.Request("https://tt-control.fabricelop.workers.dev/api/public/media-test-candidate",headers={"User-Agent":"tt-control-telegram-pager/1.0"})
                  with urllib.request.urlopen(req,timeout=15) as r: cand=json.loads(r.read().decode()).get("candidate")
                  if cand:
                      aid=str(cand.get("id")); count=int(cand.get("source_count") or 1)
                      ts=str(cand.get("last_seen") or "")[:16].replace("T"," ")
                      txt="🚨 TT Control · RADAR · "+str(count)+"/9"+(" · "+ts if ts else "")+"\n\n"+str(cand.get("title") or "")
                      kb={"inline_keyboard":[[{"text":"PREPARAR","callback_data":"media:PREPARE:"+aid},{"text":"INTERESANTE","callback_data":"media:INTERESTING:"+aid},{"text":"DESCARTAR","callback_data":"media:DISMISS:"+aid}]]}
                      post("sendMessage",{"chat_id":chat,"text":txt,"reply_markup":kb,"disable_web_page_preview":True})
                      print("Forced REAL radar candidate sent:",aid,count)
              except Exception as e: print("Forced real radar test skipped:",e)
              state_path.write_text(json.dumps(state,indent=2)+"\\n",encoding="utf-8")

          # Independent high-importance media radar alerts. One Telegram message per event.
          try:
              req=urllib.request.Request("https://tt-control.fabricelop.workers.dev/api/public/media-alerts-feed",headers={"User-Agent":"tt-control-telegram-pager/1.0"})
              with urllib.request.urlopen(req,timeout=15) as r: media=json.loads(r.read().decode()).get("alerts",[])
              if not media_baselined:
                  seen_media.update(str(a.get("id")) for a in media)
                  state["media_alert_ids"]=list(seen_media)[-200:]
                  state_path.write_text(json.dumps(state,indent=2)+"\\n",encoding="utf-8")
                  print("Media radar baseline initialized; no historical alerts.")
                  media=[]
              for a in reversed(media):
                  aid=str(a.get("id"))
                  if aid in seen_media: continue
                  sources=", ".join(json.loads(a.get("sources_json") or "[]"))
                  count=int(a.get("source_count") or 1)
                  ts=str(a.get("last_seen") or "")[:16].replace("T"," ")
                  txt="🚨 TT Control · RADAR · "+str(count)+"/9"+(" · "+ts if ts else "")+"\n\n"+a.get("title","")
                  if sources: txt+="\n\nFuentes: "+sources
                  if a.get("reason"): txt+="\nMotivo: "+a.get("reason","")
                  kb={"inline_keyboard":[[{"text":"PREPARAR","callback_data":"media:PREPARE:"+aid},{"text":"INTERESANTE","callback_data":"media:INTERESTING:"+aid},{"text":"DESCARTAR","callback_data":"media:DISMISS:"+aid}],[{"text":"ABRIR FUENTE","url":a.get("url","https://tt-control.fabricelop.workers.dev/")}]]}
                  post("sendMessage",{"chat_id":chat,"text":txt,"reply_markup":kb,"disable_web_page_preview":True})
                  seen_media.add(aid)
              state["media_alert_ids"]=list(seen_media)[-200:]
              state_path.write_text(json.dumps(state,indent=2)+"\\n",encoding="utf-8")
          except Exception as e:
              print("Media radar notification skipped:",e)


          # Backup publishing channel: send the complete prepared copy to Telegram.
          try:
              req=urllib.request.Request("https://tt-control.fabricelop.workers.dev/api/public/ready-feed",headers={"User-Agent":"tt-control-telegram-pager/1.0"})
              with urllib.request.urlopen(req,timeout=15) as r: ready=json.loads(r.read().decode()).get("ready",[])
              ready_baselined=bool(state.get("ready_baselined",False))
              seen_ready=set(str(x) for x in state.get("ready_ids",[]))
              if not ready_baselined:
                  from datetime import datetime, timezone, timedelta
                  cutoff=datetime.now(timezone.utc)-timedelta(hours=12)
                  recent=[]
                  for p in ready:
                      try:
                          ts=str(p.get("updated_at") or "").replace(" ","T")+"Z"
                          if datetime.fromisoformat(ts.replace("Z","+00:00"))>=cutoff: recent.append(p)
                      except Exception: pass
                  ready=recent
                  state["ready_baselined"]=True
                  print("Ready backup initialized with last 12 hours:",len(ready))
              # READY delivery is handled directly by the editorial Telegram path.
              # Do not send the obsolete "ABRIR TT CONTROL" notification here.
              for p in reversed(ready):
                  pid=str(p.get("id",""))
                  if not pid or pid in seen_ready: continue
                  seen_ready.add(pid)
              state["ready_ids"]=list(seen_ready)[-200:]
              state_path.write_text(json.dumps(state,indent=2)+"\\n",encoding="utf-8")
          except Exception as e:
              print("Ready backup notification skipped:",e)

          # GitHub is the reliable bridge here: direct calls from GitHub Actions to the
          # Cloudflare Worker can be blocked by Cloudflare before reaching the Worker.
          api="https://api.github.com/repos/fabricelop/tt-control"
          def get_json(url):
              req=urllib.request.Request(url,headers={"User-Agent":"tt-control-telegram-pager","Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(req) as r: return json.loads(r.read().decode())
          try:
              commits=get_json(api+"/commits?path=bridge/results&per_page=1")
              if not commits:
                  print("No TT Control result commits yet."); raise SystemExit
              latest_sha=commits[0]["sha"]
              if previous_sha is None:
                  state["result_commit_sha"]=latest_sha
                  state_path.write_text(json.dumps(state,indent=2)+"\\n",encoding="utf-8")
                  print("Telegram pager baseline initialized; no historical alert."); raise SystemExit
              if previous_sha==latest_sha:
                  print("No new TT Control result commit."); raise SystemExit
              runs=get_json(api+"/actions/runs?head_sha="+urllib.parse.quote(latest_sha)+"&per_page=10").get("workflow_runs",[])
              bridge=[x for x in runs if x.get("name")=="TT Control bridge"]
              if not bridge or bridge[0].get("status")!="completed":
                  print("Latest TT Control delivery still pending; retry next cycle."); raise SystemExit
              if bridge[0].get("conclusion")!="success":
                  print("Latest TT Control delivery did not succeed; do not notify."); raise SystemExit
              commit=get_json(api+"/commits/"+latest_sha)
              changed=[x for x in commit.get("files",[]) if x.get("filename","").startswith("bridge/results/") and x.get("filename","").endswith(".json")]
              prepared=[]
              for x in changed:
                  try:
                      rid=Path(x["filename"]).stem
                      raw=urllib.request.urlopen(urllib.request.Request("https://raw.githubusercontent.com/fabricelop/tt-control/main/"+x["filename"],headers={"User-Agent":"tt-control-telegram-pager"}),timeout=10).read().decode()
                      obj=json.loads(raw); nid=str(obj.get("id") or rid); title=str(obj.get("title") or "").strip()
                      prepared.append({"id":nid,"title":title})
                  except Exception: pass
              new_count=max(1,len(changed))
          except SystemExit: raise
          except Exception as e:
              print("TT Control GitHub status query failed:",e); raise SystemExit(1)

          # READY notifications are delivered by the editorial Telegram workflow.
          # Keep only the webhook/radar pager responsibilities here.
          state["result_commit_sha"]=latest_sha
          state_path.write_text(json.dumps(state,indent=2)+"\\n",encoding="utf-8")
          print("READY legacy notification disabled:",new_count)
          PY

      - name: Pager state is ephemeral
        run: |
          echo "Pager delivery completed. Runtime state is not pushed back to GitHub to avoid concurrent state conflicts."

