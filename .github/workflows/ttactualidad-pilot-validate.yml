name: TTActualidad pilot - syntax-only checks
on:
  push:
    branches:
      - pilot/ttactualidad-direct-decisions-20261015
    paths:
      - 'pilot/**'
      - 'docs/index.html'
      - '.github/workflows/ttactualidad-pilot-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts with Windows PowerShell 5.1 parser
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @('pilot/Finish-TTActualidad-Pilot.ps1','pilot/Install-TTActualidad-Pilot.ps1','pilot/Verify-TTActualidad-Pilot.ps1','pilot/Diagnose-TTActualidad-Pilot-ReadOnly.ps1','pilot/Open-TTActualidad-iPhone-Pilot.ps1','pilot/Check-TTActualidad-Mobile.ps1','pilot/Start-TTActualidad-PC-Pilot.ps1','pilot/Update-TTActualidad-UI-v2.ps1','pilot/Update-TTActualidad-UI-v3.ps1')) {
            $tok = $null
            $errorsList = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$tok, [ref]$errorsList
            ) | Out-Null
            if ($errorsList.Count) {
              foreach ($e in $errorsList) { Write-Host "$f : $($e.Message)" }
              throw "PowerShell parsing failed: $f"
            }
            Write-Host "PowerShell parse OK: $f"
          }
      - name: Validate pilot Worker JavaScript
        shell: pwsh
        run: |
          Copy-Item pilot/ttactualidad-worker.js pilot/ttactualidad-worker.mjs
          node --check pilot/ttactualidad-worker.mjs
      - name: Check PC pilot simulator syntax and ten-minute state machine
        shell: pwsh
        run: |
          node --check pilot/ttactualidad-pc-dryrun.mjs
          node pilot/ttactualidad-pc-dryrun.mjs --self-test
      - name: Test on-demand action API and verify browser script syntax
        shell: pwsh
        run: |
          node pilot/test-ttactualidad-worker.mjs
          $html = Get-Content docs/index.html -Raw -Encoding UTF8
          $start = $html.IndexOf('<script>')
          $end = $html.IndexOf('</script>', $start)
          if ($start -lt 0 -or $end -le $start) { throw 'Missing inline script' }
          $js = $html.Substring($start + 8, $end - $start - 8)
          [IO.File]::WriteAllText('pilot/ttactualidad-web-check.js', $js)
          node --check pilot/ttactualidad-web-check.js
      - name: Validate direct non-Telegram GitHub applicator
        shell: pwsh
        run: |
          python -m unittest discover -s pilot -p 'test_ttactualidad_direct_actions.py' -v
          python -m py_compile pilot/apply-ttactualidad-action.py
      - name: Check v2 installer pinned artifacts remotely
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '2f494846223dd983a79538c8fc59b122ad50c35d'
          $base = 'https://raw.githubusercontent.com/fabricelop/europapress-rss/' + $version + '/'
          $w = (Invoke-WebRequest -UseBasicParsing -Uri ($base + 'pilot/ttactualidad-worker.js?source=' + $version)).Content
          $h = (Invoke-WebRequest -UseBasicParsing -Uri ($base + 'docs/index.html?source=' + $version)).Content
          if (-not $w.Contains('on_demand_no_polling') -or -not $w.Contains('env.ASSETS.fetch(req)')) { throw 'Pinned worker artifact mismatch' }
          if (-not $h.Contains('Conectar acciones directas') -or -not $h.Contains('pilotSwipes(card,item)')) { throw 'Pinned UI artifact mismatch' }
          Write-Host 'V2 pinned Worker and UI download validated'
      - name: Verify TTImages and simplified list controls in pinned V3
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = 'ae6d3bea1fa91d4bb2ac420f3ac40a668255ea02'
          $url = 'https://raw.githubusercontent.com/fabricelop/europapress-rss/' + $pin + '/docs/index.html?verify=' + $pin
          $html = (Invoke-WebRequest -UseBasicParsing -Uri $url).Content
          if (-not $html.Contains('id="ttimages-open"')) { throw 'TTImages missing' }
          if (-not $html.Contains('function telegramChatUrl(raw)')) { throw 'Telegram link validation missing' }
          if ($html.Contains("btn('Dejar elaborar'")) { throw 'Inert button survived' }
          if ($html.Contains("command('Ya publicada'")) { throw 'Duplicate status action survived' }
          if (-not $html.Contains("command('Quitar de Listas','deleted')")) { throw 'Single remove action missing' }
          if (-not $html.Contains('if(!pilotConfig())return')) { throw 'Direct action setup missing' }
          Write-Host 'UI V3 pinned download and controls: OK'
      - name: Verify exact V4 card grid, TTImages, and no useless buttons
        shell: pwsh
        run: |
          $html = Get-Content docs/index.html -Raw -Encoding UTF8
          foreach ($name in @('TTImages','Publicar en X','Copiar GAG Completo','Abrir ChatGPTImages','Copiar Texto','Copiar Foto Archivo','Quitar de Listas','Buscar en X')) {
            if (-not $html.Contains($name)) { throw "V4 missing button: $name" }
          }
          if (-not $html.Contains('grid-template-columns:repeat(2,minmax(0,1fr))')) { throw 'V4 must be two columns' }
          if (-not $html.Contains('https://t.me/TTImages_bot')) { throw 'TTImages exact chat link missing' }
          if ($html.Contains('function openTTImages(')) { throw 'V4 must never ask for TTImages URL' }
          if ($html.Contains("btn('Dejar elaborar'")) { throw 'V4 inert button must be removed' }
          if ($html.Contains("command('Ya publicada'")) { throw 'V4 duplicate button must be removed' }
          Write-Host 'V4 exact actions grid validated'
