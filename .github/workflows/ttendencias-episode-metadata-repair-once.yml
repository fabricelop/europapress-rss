name: TTendencias reparar metadatos episodio (temporal)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trends/episode-metadata-command.json'
permissions:
  contents: write
concurrency:
  group: ttendencias-episode-metadata-repair-once
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Aplicar metadatos JIT
        run: |
          set -euo pipefail
          git config user.name "ttendencias-editorial"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            if [ ! -f trends/episode-metadata-command.json ]; then
              exit 0
            fi
            python3 - <<'PY'
          import json
          from pathlib import Path
          from trends.requests_json import dumps_for_path
          cmd_path=Path("trends/episode-metadata-command.json")
          cmd=json.loads(cmd_path.read_text(encoding="utf-8"))
          target=str(cmd["id"])
          revision=int(cmd["revision"])
          expected=str(cmd["expected_explanation"])
          metadata=dict(cmd["metadata"])
          for rel,key in [
              ("trends/requests.json","requests"),
              ("trends/telegram-manual-explained.json","items"),
          ]:
              p=Path(rel)
              doc=json.loads(p.read_text(encoding="utf-8"))
              item=next((x for x in doc.get(key,[]) if str(x.get("id") or "")==target and int(x.get("revision") or 0)==revision),None)
              if item is None:
                  raise SystemExit(f"{rel}: item exacto no encontrado")
              if str(item.get("status") or "")!="explained" or str(item.get("explanation") or "")!=expected:
                  raise SystemExit(f"{rel}: barrera JIT no superada")
              item.update(metadata)
              p.write_text(dumps_for_path(p,doc),encoding="utf-8")
          PY
            rm -f trends/episode-metadata-command.json
            git add trends/requests.json trends/telegram-manual-explained.json trends/episode-metadata-command.json
            git commit -m "TTendencias: documentar episodio material de Alsina"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
