name: Instagram Renoir and Nobel - read-only status check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-renoir-nobel-readonly-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query both existing publication records, no POST
        env:
          INTERNAL_SECRET: ${{ secrets.INSTAGRAM_INTERNAL_SECRET }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          secret=os.environ.get('INTERNAL_SECRET','')
          if len(secret)<32:raise SystemExit('NO_AUTH_SECRET')
          base='https://tt-actualidad-instagram-pilot.fabricelop.workers.dev/publication-status'
          for name,source,id in [('RENOIR','ttittulares','1c7947cf57cf'),('NOBEL_PAZ','ttendencias','ddda27993e11')]:
            url=f'{base}?source={source}&event_id={id}'
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+secret,'User-Agent':'TTActualidad-ReadOnlyIncident/1.0'},method='GET')
            try:
              with urllib.request.urlopen(req,timeout=35) as res:code=res.status;doc=json.loads(res.read(20000))
            except urllib.error.HTTPError as e:
              code=e.code
              try:doc=json.loads(e.read(10000))
              except Exception:doc={'error':'NON_JSON'}
            public={k:doc.get(k) for k in ('ok','found','state','media_id','permalink','container_id','updated_at','error') if k in doc}
            print('INSTAGRAM_INCIDENT_STATUS',name,'http',code,json.dumps(public,ensure_ascii=False),flush=True)
            if code!=200:raise SystemExit('READ_FAILED_'+name)
          print('INSTAGRAM_INCIDENT_READ_ONLY_OK')
          PY
