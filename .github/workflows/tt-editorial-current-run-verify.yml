name: TT editorial active run guard regression
on:
  pull_request:
    paths:
      - "shared/tt_editorial_run_guard.py"
      - "tests/test_editorial_trigger_conflict.py"
      - "tests/test_editorial_radar_wakeup.py"
      - "trends/ensure_pc_editorial.py"
      - ".github/workflows/update.yml"
      - ".github/workflows/ttendencias-refresh.yml"
      - ".github/workflows/tt-editorial-current-run-verify.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /shared/
            /tests/
            /trends/*.py
            /.github/workflows/
      - name: Verify active vs previous and nonduplicating watchdog
        run: |
          python3 -m py_compile shared/tt_editorial_run_guard.py
          python3 shared/tt_editorial_run_guard.py selftest
          python3 -m unittest discover -s tests -p test_editorial_trigger_conflict.py -v
          python3 -m unittest discover -s tests -p test_editorial_radar_wakeup.py -v
