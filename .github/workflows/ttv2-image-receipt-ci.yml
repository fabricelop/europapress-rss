name: TTendencias V2 - comprobacion aislada de recibos de imagen
on:
  push:
    branches: [fix/ttv2-reiia-receipt-compat-20261121]
    paths:
      - '.github/workflows/ttv2-image-receipt-ci.yml'
      - 'v2/ttendencias/image_worker_v2.py'
      - 'v2/ttendencias/recover_image_receipts_v2.py'
      - 'v2/ttendencias/test_image_worker_v2.py'
      - 'v2/ttendencias/test_recover_image_receipts_v2.py'
      - 'v2/ttendencias/Repair-V2-Images-After-REI-IA.ps1'
  pull_request:
    branches: [feature/ttactualidad-v2-clean]
    paths:
      - '.github/workflows/ttv2-image-receipt-ci.yml'
      - 'v2/ttendencias/image_worker_v2.py'
      - 'v2/ttendencias/recover_image_receipts_v2.py'
      - 'v2/ttendencias/test_image_worker_v2.py'
      - 'v2/ttendencias/test_recover_image_receipts_v2.py'
      - 'v2/ttendencias/Repair-V2-Images-After-REI-IA.ps1'
permissions:
  contents: read
jobs:
  image-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /v2/ttendencias/*.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow playwright==1.57.0 psutil jsonschema==4.23.0
      - run: python -m unittest -v v2.ttendencias.test_image_worker_v2 v2.ttendencias.test_recover_image_receipts_v2 v2.ttendencias.test_image_github_v2 v2.ttendencias.test_image_retry_status_v2 v2.ttendencias.test_image_incident_v2
      - run: python -m py_compile v2/ttendencias/image_worker_v2.py v2/ttendencias/recover_image_receipts_v2.py
  safe-installer-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /v2/ttendencias/Repair-V2-Images-After-REI-IA.ps1
      - name: Comprobar PowerShell sin ejecutar ni instalar
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'v2\ttendencias\Repair-V2-Images-After-REI-IA.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){throw ($errors | Out-String)}
