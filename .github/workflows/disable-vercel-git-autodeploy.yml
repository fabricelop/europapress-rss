name: Disable Vercel Git Autodeploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/disable-vercel-git-autodeploy.yml"

permissions:
  contents: read

jobs:
  disable:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM_ID: team_H8xHbBIbIKnsaLeITszidyOK
      PROJECT_ID: prj_X1UxNqQasd8Ouf7jUpxNccbQdASf
    steps:
      - name: Disable automatic Git deployments at project level
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$TEAM_ID")"
          echo "$BEFORE" | jq '{before:.gitProviderOptions.createDeployments}'
          HTTP="$(curl -sS -o /tmp/patch.json -w "%{http_code}"             -X PATCH             -H "Authorization: Bearer $VERCEL_TOKEN"             -H "Content-Type: application/json"             "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$TEAM_ID"             --data '{"gitProviderOptions":{"createDeployments":"disabled"}}')"
          cat /tmp/patch.json | jq '{id,name,gitProviderOptions}'
          test "$HTTP" = "200"
          AFTER="$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$TEAM_ID")"
          VALUE="$(echo "$AFTER" | jq -r '.gitProviderOptions.createDeployments')"
          echo "after=$VALUE"
          test "$VALUE" = "disabled"
