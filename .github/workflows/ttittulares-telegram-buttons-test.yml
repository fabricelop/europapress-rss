name: Prueba aislada de botones Telegram TTiTTulares

on:
  issue_comment:
    types: [created]

permissions:
  issues: read

jobs:
  send:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 2 &&
      github.event.comment.user.login == 'fabricelop' &&
      startsWith(github.event.comment.body, 'TTITTULARES_TELEGRAM_BUTTONS_TEST_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enviar titular y foto sin cambiar la cola editorial
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, uuid
          from pathlib import Path

          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          body=event['comment']['body']
          prefix='TTITTULARES_TELEGRAM_BUTTONS_TEST_V1\n'
          if not body.startswith(prefix): raise SystemExit('Prefijo inválido')
          raster=base64.b64decode(body[len(prefix):].strip(),validate=True)
          if not (4096 <= len(raster) <= 50000 and raster[:3] == b'\xff\xd8\xff' and raster[-2:] == b'\xff\xd9'):
              raise SystemExit('JPEG inválido o tamaño inesperado')
          token=os.environ['TELEGRAM_BOT_TOKEN'];chat=os.environ['TELEGRAM_CHAT_ID']
          title='Miles de personas toman las calles de Madrid en defensa de la educación pública antes de la huelga indefinida'
          app='https://europapress-rss.vercel.app/ttittulares/?view=processing'
          def call(method,payload):
              req=urllib.request.Request(f'https://api.telegram.org/bot{token}/{method}',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response: data=json.load(response)
              if not data.get('ok'): raise RuntimeError(f'Telegram {method} rejected')
              return data['result']
          headline=call('sendMessage',{'chat_id':chat,'text':title,'disable_web_page_preview':True})
          headline_id=headline['message_id']
          keyboard={'inline_keyboard':[
              [{'text':'📋 Copiar titular','copy_text':{'text':title}},
               {'text':'📱 Abrir en app','url':app}],
              [{'text':'🗑️ Borrar titular + foto','callback_data':f'dg:{headline_id}'}]
          ]}
          boundary='----ttbuttons'+uuid.uuid4().hex
          payload=(f'--{boundary}\r\nContent-Disposition: form-data; name="chat_id"\r\n\r\n{chat}\r\n'
                   f'--{boundary}\r\nContent-Disposition: form-data; name="reply_markup"\r\n\r\n{json.dumps(keyboard,ensure_ascii=False)}\r\n'
                   f'--{boundary}\r\nContent-Disposition: form-data; name="photo"; filename="prueba-4da79a83822c.jpg"\r\nContent-Type: image/jpeg\r\n\r\n').encode()+raster+f'\r\n--{boundary}--\r\n'.encode()
          try:
              req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendPhoto',data=payload,headers={'Content-Type':f'multipart/form-data; boundary={boundary}'})
              with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
              if not result.get('ok'): raise RuntimeError('Telegram rechazó foto')
          except Exception:
              call('deleteMessage',{'chat_id':chat,'message_id':headline_id})
              raise
          print('TELEGRAM_BUTTONS_TEST_SENT','headline_id='+str(headline_id),'photo_id='+str(result['result']['message_id']),'bytes='+str(len(raster)))
          PY
