name: TTActualidad V2 - publicar RE-X en Worker privado
on:
  push:
    branches: [feature/ttactualidad-v2-clean]
    paths:
      - '.github/workflows/ttactualidad-v2-rex-deploy.yml'
      - 'v2/ttendencias/private-worker/src/**'
      - 'v2/ttendencias/private-worker/web-source/**'
      - 'v2/ttendencias/private-worker/scripts/news-browser-check.mjs'
      - 'v2/ttittulares/Repair-News-Editorial-V2.ps1'
      - 'v2/ttittulares/news_workflow_v2.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ttactualidad-v2-private-rex-deploy
  cancel-in-progress: false
jobs:
  windows-package-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /v2/ttendencias/Update-V2-ImageIncidents.ps1
            /v2/ttittulares/
            /v2/ttendencias/*.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: News automation and original-image regression on Windows
        run: |
          python -m pip install jsonschema==4.23.0 Pillow playwright==1.57.0
          python -m unittest v2.ttittulares.test_news_workflow_v2 v2.ttittulares.test_news_images_v2 v2.ttittulares.test_editorial_install_v2
      - name: Parse all news installers without launching jobs
        shell: powershell
        run: |
          Get-ChildItem v2/ttittulares/*.ps1 | ForEach-Object {
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){throw ($errors|Out-String)}
          }
      - name: Parse scoped local updater without executing it
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'v2\ttendencias\Update-V2-ImageIncidents.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count){throw ($errors | Out-String)}
          Write-Host 'TT_V2_IMAGE_INCIDENT_UPDATER_PARSE=PASS'
  deploy:
    needs: windows-package-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas integrales del Worker privado
        working-directory: v2/ttendencias/private-worker
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regresiones de persistencia e identidad de las incidencias de imagen
        run: |
          python -m pip install playwright==1.57.0 jsonschema==4.23.0 Pillow
          python -m unittest -v v2.ttendencias.test_image_incident_v2 v2.ttendencias.test_image_worker_v2 v2.ttendencias.test_web_top30_v2 v2.ttittulares.test_news_workflow_v2 v2.ttittulares.test_news_images_v2
      - name: Verificar Noticias en navegador de escritorio y movil
        working-directory: v2/ttendencias/private-worker
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
          node scripts/news-browser-check.mjs
      - name: Conservar capturas de comprobacion de Noticias
        uses: actions/upload-artifact@v4
        with:
          name: ttactualidad-v2-news-visual-qa
          path: ${{ runner.temp }}/ttv2-news-qa/
          retention-days: 7
      - name: Verificar proyeccion Noticias con el estado real de V2
        working-directory: v2/ttendencias/private-worker
        run: |
          node --input-type=module - <<'JS'
          import {readNews} from './src/news.js';
          const view=await readNews();
          if(view.project!=="ttittulares-v2"||view.read_only!==true||view.publication_allowed!==false)throw Error("NEWS_PROJECTION_INVALID");
          console.log("TT_V2_NEWS_REAL_PROJECTION="+JSON.stringify({observed_at:view.observed_at,counts:view.counts,default_filter:view.filter,displayed_items:view.items.length}));
          JS
      - name: Conservar configuracion, credenciales, reloj y privacidad actuales
        working-directory: v2/ttendencias/private-worker
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request
          token=os.environ.get("CLOUDFLARE_API_TOKEN","")
          account=os.environ.get("CLOUDFLARE_ACCOUNT_ID","")
          if not token or not account: raise SystemExit("CLOUDFLARE_CREDENTIALS_MISSING")
          base="https://api.cloudflare.com/client/v4/accounts/"+account+"/workers/scripts/ttactualidad-v2-private-test"
          def get(path):
              req=urllib.request.Request(base+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=30) as resp: result=json.load(resp)
              if not result.get("success"): raise SystemExit("CLOUDFLARE_PREFLIGHT_FAILED")
              return result.get("result")
          settings=get("/settings") or {}
          bindings={b.get("name"):b for b in settings.get("bindings",[])}
          expected={"ASSETS":"assets","MARKS_DB":"d1","LOGIN_LIMITER":"ratelimit",
              "AUTH_PASSWORD":"secret_text","SESSION_SECRET":"secret_text",
              "REELABORATION_ENABLED":"plain_text","SESSION_HOURS":"plain_text"}
          if {k:v.get("type") for k,v in bindings.items()}!=expected:
              raise SystemExit("CLOUDFLARE_BINDINGS_CHANGED_NO_DEPLOY")
          db=bindings["MARKS_DB"]
          dbid=db.get("id") or db.get("database_id")
          if not isinstance(dbid,str) or not re.fullmatch("[a-f0-9-]{36}",dbid):
              raise SystemExit("CLOUDFLARE_D1_ID_NOT_VERIFIED")
          limit=bindings["LOGIN_LIMITER"]
          cfg_limit=limit.get("simple") or {}
          namespace=str(limit.get("namespace_id") or "")
          if not namespace.isdigit() or cfg_limit.get("period") not in (10,60) or not isinstance(cfg_limit.get("limit"),int):
              raise SystemExit("CLOUDFLARE_RATE_LIMIT_NOT_VERIFIED")
          schedules=get("/schedules") or {}
          crons=[x.get("cron") for x in schedules.get("schedules",[]) if isinstance(x,dict)]
          if crons not in (["*/15 * * * *"], ["0,15,30,45 * * * *"]):
              raise SystemExit("CLOUDFLARE_CRON_DIFFERENT_NO_DEPLOY")
          config={"name":"ttactualidad-v2-private-test","main":"src/index.js",
              "compatibility_date":settings.get("compatibility_date") or "2026-11-14",
              "keep_vars":True,"workers_dev":True,
              "assets":{"directory":"./dist","binding":"ASSETS","run_worker_first":True},
              "d1_databases":[{"binding":"MARKS_DB","database_name":"ttactualidad-v2-marks","database_id":dbid}],
              "ratelimits":[{"name":"LOGIN_LIMITER","namespace_id":namespace,
                 "simple":{"limit":cfg_limit["limit"],"period":cfg_limit["period"]}}],
              "vars":{"REELABORATION_ENABLED":bindings["REELABORATION_ENABLED"].get("text"),
                      "SESSION_HOURS":bindings["SESSION_HOURS"].get("text")},
              "triggers":{"crons":crons}}
          if any(not isinstance(x,str) or len(x)>100 for x in config["vars"].values()):
              raise SystemExit("CLOUDFLARE_VARS_NOT_VERIFIED")
          if not re.fullmatch(r"20\d\d-\d\d-\d\d",config["compatibility_date"]):
              raise SystemExit("CLOUDFLARE_COMPAT_DATE_NOT_VERIFIED")
          with open("wrangler.json","w",encoding="utf-8") as out:json.dump(config,out,indent=2)
          print("TT_V2_PRIVATE_BINDINGS_AND_CRON_PRESERVED=YES")
          PY
      - name: Publicar solo el Worker privado conservando variables y secretos
        working-directory: v2/ttendencias/private-worker
        run: |
          npx wrangler deploy --keep-vars --config wrangler.json
      - name: Verificar version y rutas del Worker publicado
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          origin="https://ttactualidad-v2-private-test.fabricelop.workers.dev"
          headers={"User-Agent":"TTActualidadV2-Deploy-Verify/1.0","Accept":"application/json"}
          def verify_get(path):
              req=urllib.request.Request(origin+path,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as response:return json.load(response)
          for attempt in range(6):
              try:
                  health=verify_get("/health")
                  flags=verify_get("/api/public-editorial-overrides")
                  if health.get("build")=="v2-re-x-20261115" and health.get("configured") is True and health.get("news_view")=="v2-news-inbox-20261116" and health.get("news_layout")=="compact-ready-20261116" and health.get("image_incidents")=="v2-image-incidents-20261116" and health.get("news_actions")=="news-workflow-20261116" and flags.get("schema_version")==1:
                      try:
                          verify_get("/api/news")
                          raise SystemExit("NEWS_PRIVATE_ACCESS_NOT_ENFORCED")
                      except urllib.error.HTTPError as blocked:
                          if blocked.code!=401:raise SystemExit("NEWS_PRIVATE_ACCESS_CHECK_FAILED")
                      controls=verify_get("/api/public-news-controls")
                      feed=verify_get("/api/public-news")
                      if controls.get("project")!="ttittulares-v2" or feed.get("source")!="ttittulares-v2" or not isinstance(feed.get("items"),list):
                          raise SystemExit("NEWS_V2_PUBLIC_FEED_NOT_VERIFIED")
                      print("TT_V2_NEWS_PUBLIC_FEED_VERIFIED="+str(len(feed["items"])))
                      print("TT_V2_NEWS_PRIVATE_ROUTE_PROTECTED=YES")
                      print("TT_V2_PRIVATE_RE_X_LIVE=YES")
                      break
              except Exception as exc:
                  print("TT_V2_PRIVATE_POST_DEPLOY_RETRY="+type(exc).__name__+":"+str(exc)[:120],flush=True)
              if attempt==5:raise SystemExit("RE_X_DEPLOY_NOT_VERIFIED")
              time.sleep(7)
          PY
# V2-writing-sanitize-20261116: deploy validated private text cleanup without altering bindings.
# V2-causal-language-20261116: deploy neutral headline composition for unconfirmed trends.
# V2-private-manual-image-20261116: deploy authenticated owner paste and PU/incident RE-X after tests.
# V2-ios-header-prompt-20261116: deploy safe-area header and manual ImageGen prompt copying.
# V2-gpt-ima-20261116: deploy direct ChatGPT Images link for explained trends without an IA image.

# V2-editorial-lead-parser-20261116: rebuild and deploy private UI after count-suffixed X heading fix.
# V2-image-incidents-20261116: deploy exact-revision I detail after Node/Python/browser regressions.

# V2-editorial-lead-parser-20261116-retry: rerun Worker deploy after correcting regression test.

# V2-dossier-display-20261116: show captured explanation safely when a brief cannot be extracted.

# V2-short-dossier-20261116: use the same concise adapted text in V2 and X, never the full dossier.

# V2-news-inbox-20261116: publish read-only Noticias from isolated V2 radar and pending jobs.

# V2-news-browser-search-20261116: wait for the actual debounced query and reset before asserting.


# V2-news-auto-compact-20261116: default Elaboradas, compact filters, short record read and scheduled-radar status.

# Recheck compact filters with real four-digit counts after image-incidence integration.

# News V2 workflow: deploy persisted actions PUB/archive and exact-revision image UI after Windows/Node/Python/browser checks.

# News V2 private worker controls: owner-verified GitHub authentication; never expose RE-X hints publicly.

# Public news image responses allow V1 embedding only after exact identity, hash and visibility checks.
# V2-editorial-diagnostic-suffix-20261117: deploy 4f119311 correction; strip character counters and 'Sin hashtags' from trend copy.
# V2-news-pub-browser-qa-20261117: keep expected Noticias PUB count regression and retry suffix-fix deploy after green tests.
# V2-news-actions-browser-qa-20261117: verify renamed R/Quitar controls and confirmed PUB before deploy.
