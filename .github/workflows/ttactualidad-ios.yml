name: TTActualidad iOS - PlumeImpactor IPA

on:
  push:
    paths:
      - "ios/ttactualidad/**"
      - ".github/workflows/ttactualidad-ios.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/ttactualidad/**"
      - ".github/workflows/ttactualidad-ios.yml"

permissions:
  contents: read

concurrency:
  group: ttactualidad-ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen librsvg
      - name: Render AppIcon asset
        working-directory: ios/ttactualidad
        run: |
          mkdir -p TTActualidad/Assets.xcassets/AppIcon.appiconset
          rsvg-convert --width 1024 --height 1024 --format png --output TTActualidad/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png art/AppIcon.svg
          file TTActualidad/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
      - name: Validate Live Activity contract and GitHub data sources
        run: python3 ios/ttactualidad/tests/preflight.py
      - name: Test isolated READY news rework (no editorial writes)
        run: python3 pilot/test_rework_ttittulares.py
      - name: Generate Xcode project
        working-directory: ios/ttactualidad
        run: xcodegen generate
      - name: Test native quick actions and editorial progress
        working-directory: ios/ttactualidad
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if x["name"].startswith("iPhone")))')
          xcodebuild -project TTActualidad.xcodeproj \
            -scheme TTQuickActions -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath .test-build \
            CODE_SIGNING_ALLOWED=NO test | tee /tmp/ttactualidad-quick-actions-tests.log
      - name: Build native iPhone app and Live Activity
        working-directory: ios/ttactualidad
        run: |
          set -o pipefail
          xcodebuild -project TTActualidad.xcodeproj \
            -scheme TTActualidad \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/ttactualidad-ios-build.log
      - name: Package unsigned IPA (sign with PlumeImpactor on Windows)
        working-directory: ios/ttactualidad
        run: |
          set -euo pipefail
          APP=".build/Build/Products/Release-iphoneos/TTActualidad.app"
          test -d "$APP"
          test -d "$APP/PlugIns/TTActualidadLive.appex"
          test -s "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$APP/Info.plist" | grep -qi true
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qr TTActualidad-0.4.32-PlumeImpactor-unsigned.ipa Payload
          unzip -l TTActualidad-0.4.32-PlumeImpactor-unsigned.ipa | grep 'TTActualidadLive.appex/Info.plist'
          shasum -a 256 TTActualidad-0.4.32-PlumeImpactor-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TTActualidad-0.4.32-PlumeImpactor-IPA
          path: ios/ttactualidad/dist/TTActualidad-0.4.32-PlumeImpactor-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

