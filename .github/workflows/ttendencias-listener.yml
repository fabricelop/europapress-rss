name: TTendencias Telegram continuo
# manual-refresh-trigger

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches: [main]
    paths:
      - "trends/telegram_bot.py"
      - "trends/update_trends.py"
      - ".github/workflows/ttendencias-listener.yml"

permissions:
  contents: write

concurrency:
  group: ttendencias-telegram-continuo
  cancel-in-progress: true

jobs:
  listener:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Sincronizar panel al arrancar
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
        run: |
          python3 trends/update_trends.py
          python3 trends/telegram_bot.py sync
          git config user.name "ttendencias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trends/recent.json trends/checkpoint.json trends/requests.json trends/telegram-bot-state.json trends/telegram-manual-explained.json
          if ! git diff --cached --quiet; then
            git commit -m "Sincronizar panel TTendencias"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Escuchar bot TTendencias
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
          TTENDENCIAS_LISTEN_SECONDS: "14520"
        run: python3 trends/telegram_bot.py listen

      - name: Guardar estado final
        if: always()
        run: |
          git config user.name "ttendencias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trends/recent.json trends/checkpoint.json trends/requests.json trends/telegram-bot-state.json trends/telegram-manual-explained.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Actualizar estado final TTendencias"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
