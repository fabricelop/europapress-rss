name: TTendencias Telegram continuo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "trends/telegram_bot.py"
      - ".github/workflows/ttendencias-listener.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: ttendencias-telegram-continuo
  cancel-in-progress: true

jobs:
  listener:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependencias de actualización
        run: python3 -m pip install -q requests beautifulsoup4

      - name: Sincronizar panel sin persistir
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
        run: python3 trends/telegram_bot.py sync

      - name: Escuchar bot TTendencias
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
          TTENDENCIAS_LISTEN_SECONDS: "1500"
          TTENDENCIAS_REFRESH_SECONDS: "900"
        run: python3 trends/telegram_bot.py listen

      - name: Encadenar siguiente listener
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 2
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          url=f"https://api.github.com/repos/{repo}/actions/workflows/ttendencias-listener.yml/dispatches"
          req=urllib.request.Request(
              url,
              method="POST",
              data=json.dumps({"ref":"main"}).encode(),
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"ttendencias-listener-chain",
                  "Content-Type":"application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              if r.status != 204:
                  raise SystemExit(f"dispatch inesperado: {r.status}")
          print("Siguiente listener TTendencias encolado")
          PY
