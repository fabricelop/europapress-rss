name: TTendencias Telegram continuo

on:
  workflow_dispatch:
  schedule:
    - cron: '3,33 * * * *'
  push:
    branches: [main]
    paths:
      - "trends/telegram_bot.py"
      - "trends/listener-heartbeat.txt"
      - ".github/workflows/ttendencias-listener.yml"

permissions:
  contents: write

concurrency:
  group: ttendencias-telegram-continuo
  cancel-in-progress: true

jobs:
  listener:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependencias de actualización
        run: python3 -m pip install -q requests beautifulsoup4

      - name: Sincronizar panel sin persistir
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
        run: python3 trends/telegram_bot.py sync

      - name: Escuchar bot TTendencias
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
          TTENDENCIAS_LISTEN_SECONDS: "3300"
          TTENDENCIAS_REFRESH_SECONDS: "900"
        run: python3 trends/telegram_bot.py listen

      - name: Encadenar siguiente listener
        if: always()
        run: |
          git config user.name "ttendencias-listener"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          mkdir -p trends
          printf '%s\n' "restart $(date -u +%Y-%m-%dT%H:%M:%SZ)" > trends/listener-heartbeat.txt
          git add trends/listener-heartbeat.txt
          git diff --cached --quiet && exit 0
          git commit -m "Mantener listener TTendencias activo"
          git push origin HEAD:main
