name: RainETA Radar Science Inputs
on:
  push:
    paths:
      - 'ios/raineta/tests/radar_science_inputs.py'
      - '.github/workflows/raineta-radar-science.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install scientific image prerequisites
        run: python3 -m pip install --quiet numpy h5py requests
      - name: Inspect actual ODIM HDF5 and HARMONIE archive
        working-directory: ios/raineta
        run: python3 tests/radar_science_inputs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raineta-real-radar-inputs
          path: ios/raineta/radar-science/
          retention-days: 14
