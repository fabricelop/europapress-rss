name: TTendencias fast API editorial batch 20261109

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ttendencias-fast-api-20261109.yml"
      - "trends/fast-api-trigger-20261109.txt"

permissions:
  contents: write
  actions: write

concurrency:
  group: ttendencias-fast-api-20261109
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Cancel superseded slow runs
        shell: bash
        run: |
          set +e
          for run in 42542235497 42542252771 42542429659; do
            gh api --method POST "repos/$REPO/actions/runs/$run/cancel" >/dev/null 2>&1 || true
          done
          echo "TTENDENCIAS_SUPERSEDED_RUNS_CANCEL_REQUESTED"

      - name: Apply current episodes directly through Git data API
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, time, unicodedata
          import urllib.error, urllib.parse, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          REPO=os.environ["REPO"]; TOKEN=os.environ["GH_TOKEN"]
          BASE="https://api.github.com"; MADRID=ZoneInfo("Europe/Madrid")
          RUN_ID="tr-1794185100000-manual"
          STARTED_AT="2026-11-09T01:45:00+01:00"
          PATHS=[
              "trends/run-batch-20261109.json",
              "trends/requests.json",
              "trends/telegram-manual-explained.json",
              "trends/editorial-queue.json",
              "trends/prepared.json",
              "trends/editorial-runtime.json",
              "trends/recent.json",
              "trends/site-top30-current.json",
          ]

          def api(method,path,payload=None,attempts=5):
              url=BASE+path
              data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode("utf-8")
              headers={
                  "Authorization":"Bearer "+TOKEN,
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"ttendencias-fast-editorial",
              }
              if data is not None: headers["Content-Type"]="application/json"
              last=None
              for n in range(attempts):
                  req=urllib.request.Request(url,data=data,headers=headers,method=method)
                  try:
                      with urllib.request.urlopen(req,timeout=90) as resp:
                          raw=resp.read()
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as exc:
                      body=exc.read().decode("utf-8","replace")
                      last=RuntimeError(f"{method} {path}: HTTP {exc.code}: {body[:500]}")
                      if exc.code not in {409,422,429,500,502,503,504}: raise last
                  except Exception as exc:
                      last=exc
                  time.sleep(1+n)
              raise last

          def get_ref():
              return api("GET",f"/repos/{REPO}/git/ref/heads/main")["object"]["sha"]

          def get_commit(sha):
              return api("GET",f"/repos/{REPO}/git/commits/{sha}")

          def load_json(path,head):
              quoted=urllib.parse.quote(path,safe="/")
              meta=api("GET",f"/repos/{REPO}/contents/{quoted}?ref={head}")
              blob=api("GET",f"/repos/{REPO}/git/blobs/{meta['sha']}")
              return json.loads(base64.b64decode(blob["content"]).decode("utf-8"))

          def make_blob(obj):
              raw=(json.dumps(obj,ensure_ascii=False,indent=2)+"\n").encode("utf-8")
              return api("POST",f"/repos/{REPO}/git/blobs",{
                  "content":base64.b64encode(raw).decode("ascii"),"encoding":"base64"
              })["sha"]

          def norm(value):
              text=unicodedata.normalize("NFD",str(value or ""))
              text="".join(ch for ch in text if unicodedata.category(ch)!="Mn")
              return " ".join(text.casefold().split()).lstrip("#")

          def source_rows(spec):
              return [{"url":str(u)} for u in spec.get("sources",[]) if str(u).startswith("https://")]

          def live_rank(recent,name):
              key=norm(name)
              for row in recent.get("items",[]) or []:
                  if norm(row.get("name"))==key:
                      rank=int(row.get("rank") or 0)
                      if 1 <= rank <= 30: return rank
              return 0

          def latest_active(requests,name):
              key=norm(name)
              rows=[r for r in requests.get("requests",[]) or []
                    if norm(r.get("name"))==key and str(r.get("status") or "").lower() in {"preparing","update","problematic"}]
              rows.sort(key=lambda r:(int(r.get("revision") or 0),str(r.get("requested_at") or ""),str(r.get("updated_at") or "")),reverse=True)
              return rows[0] if rows else None

          def already_done(manual,spec):
              key=norm(spec["name"])
              rows=[r for r in manual.get("items",[]) or []
                    if norm(r.get("name"))==key and str(r.get("status") or "").lower()=="explained"
                    and str(r.get("explanation") or "").strip()==str(spec["text"]).strip()
                    and str(r.get("explained_at") or "") >= STARTED_AT]
              rows.sort(key=lambda r:str(r.get("explained_at") or ""),reverse=True)
              return rows[0] if rows else None

          def request_by_id_revision(requests,item_id,revision):
              for row in requests.get("requests",[]) or []:
                  if str(row.get("id") or "")==str(item_id) and int(row.get("revision") or 0)==int(revision):
                      return row
              return None

          fixed_now=datetime.now(MADRID).isoformat(timespec="seconds")
          final_commit=None; final_incidents=[]

          for outer in range(1,5):
              head=get_ref(); base_tree=get_commit(head)["tree"]["sha"]
              docs={p:load_json(p,head) for p in PATHS}
              cmd=docs["trends/run-batch-20261109.json"]
              requests=docs["trends/requests.json"]
              manual=docs["trends/telegram-manual-explained.json"]
              queue=docs["trends/editorial-queue.json"]
              prepared=docs["trends/prepared.json"]
              runtime=docs["trends/editorial-runtime.json"]
              recent=docs["trends/recent.json"]
              site=docs["trends/site-top30-current.json"]

              if cmd.get("project")!="TTendencias" or cmd.get("run_id")!=RUN_ID:
                  raise SystemExit("Comando de lote no coincide con la pasada solicitada")

              outcomes=[]; incidents=[]
              for spec in cmd.get("items",[]) or []:
                  name=str(spec["name"]); nkey=norm(name)
                  rank=live_rank(recent,name)
                  if not rank:
                      incidents.append({"name":name,"reason":"left_top30_before_jit"})
                      continue
                  text=str(spec.get("text") or "").strip()
                  closer=str(spec.get("closer") or "").strip()
                  if not text.startswith("TT#") or len(text)>=280:
                      raise SystemExit(f"Texto inválido {name}: {len(text)}")
                  if closer and (not closer.startswith("🌶️ ") or text.count(closer)!=1):
                      raise SystemExit(f"Remate inválido {name}")

                  done=already_done(manual,spec)
                  if done:
                      item_id=str(done.get("id") or ""); revision=int(done.get("revision") or 0)
                      row=request_by_id_revision(requests,item_id,revision)
                      if row is None:
                          incidents.append({"name":name,"reason":"fresh_explanation_without_request","id":item_id,"revision":revision})
                          continue
                      via="concurrent_convergence"
                  else:
                      row=latest_active(requests,name)
                      if row:
                          item_id=str(row.get("id") or ""); revision=int(row.get("revision") or 0)
                          via="existing_active"
                      else:
                          prior_id=str(spec.get("prior_id") or name)
                          item_id=hashlib.sha256(("manual-rework|"+prior_id+"|"+RUN_ID).encode("utf-8")).hexdigest()[:12]
                          revision=0
                          row=request_by_id_revision(requests,item_id,revision)
                          if row is None:
                              row={
                                  "id":item_id,"name":name,"rank":rank,"revision":revision,
                                  "status":"preparing","created_at":fixed_now,"requested_at":fixed_now,"updated_at":fixed_now,
                                  "task":"explain","auto_queued":False,"request_source":"chat_fast_api_rework",
                                  "with_image":True,"disable_ai_image":False,"rewrite_with_image":True,
                                  "image_strategy":"ai_plus_fallback","fallback_image_status":"pending",
                                  "ai_image_status":"pending","requested_together":[name],
                                  "originated_from_prior_id":prior_id,
                                  "rewrite_instruction":"Investigación desde cero del episodio ACTUAL; no reutilizar texto, remate ni imágenes de episodios cerrados."
                              }
                              requests.setdefault("requests",[]).append(row)
                          via="reopened_distinct_episode"

                  live=request_by_id_revision(requests,item_id,revision)
                  if live is None: raise SystemExit(f"Request desaparecida antes de persistir {name}")
                  state=str(live.get("status") or "").lower()
                  if state=="explained" and str(live.get("explanation") or "").strip()==text:
                      via="concurrent_convergence"
                  elif state not in {"preparing","update","problematic"}:
                      raise SystemExit(f"Estado JIT no persistible {name}: {state}")

                  sources=source_rows(spec); group_id="grp-"+item_id
                  category=str(spec.get("category") or "Actualidad")
                  common={
                      "name":name,"rank":rank,"status":"explained","updated_at":fixed_now,
                      "explained_at":fixed_now,"last_attempt_at":fixed_now,"reexplain":False,
                      "rewrite_pending":False,"explanation":text,"closer_text":closer,
                      "rank_at_explanation":rank,"category":category,
                      "source":"editorial_chat_fast_api","editorial_engine":"chat-direct",
                      "verification_sources":sources,
                      "news_note":"Episodio actual verificado en esta pasada; identidad distinta para no reutilizar un cierre histórico.",
                      "group_id":group_id,"explanation_group_id":group_id,"group_title":name,
                      "group_leader_id":item_id,"trend_names":[name],
                      "grouped_member_revisions":[{"id":item_id,"revision":revision}],
                      "with_image":True,"image_strategy":"ai_plus_fallback",
                      "ai_image_status":"pending","fallback_image_status":"pending",
                      "image_status":"pending","image_choice":"none","image_pending":True,
                      "telegram_package_status":"pending"
                  }
                  live.update(common)
                  for fld in ("deleted_at","dismissed_at","published_at","removed_at","problem_reason","problematic_at","inactive_at","inactive_reason"):
                      live.pop(fld,None)

                  manual["items"]=[x for x in (manual.get("items",[]) or [])
                      if not (str(x.get("id") or "")==item_id and int(x.get("revision") or 0)==revision)]
                  manual.setdefault("items",[]).append({"id":item_id,"revision":revision,**common})

                  prepared["items"]=[x for x in (prepared.get("items",[]) or [])
                      if str(x.get("id") or "")!=item_id and norm(x.get("trend_name") or x.get("name"))!=nkey]
                  prepared.setdefault("items",[]).append({
                      "id":item_id,"revision":revision,"trend_name":name,"rank":rank,"category":category,
                      "generated_at":fixed_now,"explanation":text,"closer_text":closer,
                      "primary":{"text":text},
                      "alternatives":[{"tweet_text":text},{"tweet_text":text},{"tweet_text":text}],
                      "verification_sources":sources,"related_trends":[name],"trend_names":[name],
                      "group_id":group_id,"explanation_group_id":group_id,"group_title":name,
                      "group_leader_id":item_id,
                      "grouped_member_revisions":[{"id":item_id,"revision":revision}],
                      "with_image":True,"image_strategy":"ai_plus_fallback",
                      "ai_image_status":"pending","fallback_image_status":"pending",
                      "image_status":"pending","image_choice":"none","image_pending":True
                  })

                  queue["items"]=[x for x in (queue.get("items",[]) or [])
                      if str(x.get("id") or "")!=item_id and norm(x.get("name"))!=nkey]

                  site_rows=site.get("items") or site.get("top30") or []
                  srow=next((x for x in site_rows if norm(x.get("name"))==nkey),None)
                  if srow is not None:
                      srow.update({
                          "status":"EXPLICADA","explanation":text,"explained_at":fixed_now,
                          "editorial_id":item_id,"revision":revision,"group_title":name,
                          "category":category,"closer_text":closer,
                          "verification_sources":[x["url"] for x in sources],"image":None
                      })
                  outcomes.append({"id":item_id,"revision":revision,"name":name,"rank":rank,"outcome":"explained","via":via})

              requests["updated_at"]=fixed_now
              manual["updated_at"]=fixed_now; manual["count"]=len(manual.get("items",[]) or [])
              prepared["updated_at"]=fixed_now; prepared["count"]=len(prepared.get("items",[]) or [])
              queue["updated_at"]=fixed_now
              queue["count"]=sum(str(x.get("status") or "").lower() in {"preparing","update","problematic"} for x in (queue.get("items",[]) or []))

              closed=len(outcomes); incident_count=len(incidents)
              total=len(cmd.get("items",[]) or [])
              status="DONE" if incident_count==0 and closed==total else "DONE_WITH_INCIDENTS"
              summary={
                  "attempted":total,"observed":closed+incident_count,"closed":closed,"explained":closed,
                  "problematic":0,"updates":0,"continuity_updates":0,
                  "distinct_updates":sum(1 for x in outcomes if x["via"]=="reopened_distinct_episode"),
                  "unchanged_reviews":0,"stale_reviews":0,"unverified_reviews":incident_count,
                  "queue_remaining":queue["count"],"rewrite_pending_remaining":0,
                  "imagegen_calls":0,"image_outbox_created":0,"publications":0,
                  "incidents":incident_count,
                  "concurrent_convergence":sum(1 for x in outcomes if x["via"]=="concurrent_convergence")
              }
              msg=f"Pasada {RUN_ID} cerrada {closed}/{total}. Episodios actuales verificados sin reutilizar cierres históricos. ImageGen=0; publicaciones=0."
              runtime.update({
                  "project":"TTendencias","canonical":True,"run_id":RUN_ID,"command_id":RUN_ID,
                  "source":"chat","status":status,"phase":"closing","started_at":STARTED_AT,
                  "updated_at":fixed_now,"finished_at":fixed_now,"current":closed,"total":total,
                  "trend_id":None,"title":"Pasada editorial TTendencias",
                  "queue_complete":queue["count"]==0,"processed_ids":[x["id"] for x in outcomes],
                  "converged_ids":[x["id"] for x in outcomes if x["via"]=="concurrent_convergence"],
                  "remaining_ids":[],"remaining_active_ids":[],"remaining_problematic_ids":[],
                  "summary":summary,"outcomes":outcomes,"incident_count":incident_count,
                  "incidents":incidents,"error":None,"message":msg,
                  "last_run":{"run_id":RUN_ID,"command_id":RUN_ID,"status":status,
                              "started_at":STARTED_AT,"finished_at":fixed_now,
                              "summary":summary,"message":msg}
              })

              changed={
                  "trends/requests.json":requests,
                  "trends/telegram-manual-explained.json":manual,
                  "trends/editorial-queue.json":queue,
                  "trends/prepared.json":prepared,
                  "trends/editorial-runtime.json":runtime,
                  "trends/site-top30-current.json":site
              }
              blobs={p:make_blob(obj) for p,obj in changed.items()}

              if get_ref()!=head:
                  print("TTENDENCIAS_FAST_API_HEAD_MOVED_RETRY",outer,flush=True)
                  time.sleep(1); continue

              tree=api("POST",f"/repos/{REPO}/git/trees",{
                  "base_tree":base_tree,
                  "tree":[{"path":p,"mode":"100644","type":"blob","sha":sha} for p,sha in blobs.items()]
              })
              commit=api("POST",f"/repos/{REPO}/git/commits",{
                  "message":f"TTendencias: cerrar lote editorial {RUN_ID}",
                  "tree":tree["sha"],"parents":[head]
              })
              try:
                  api("PATCH",f"/repos/{REPO}/git/refs/heads/main",{"sha":commit["sha"],"force":False},attempts=1)
              except Exception:
                  print("TTENDENCIAS_FAST_API_REF_RACE_RETRY",outer,flush=True)
                  time.sleep(1); continue

              final_commit=commit["sha"]; final_incidents=incidents
              print("TTENDENCIAS_FAST_API_COMMIT",final_commit,flush=True)
              print("TTENDENCIAS_FAST_API_OUTCOMES",json.dumps(outcomes,ensure_ascii=False),flush=True)
              print("TTENDENCIAS_FAST_API_INCIDENTS",json.dumps(incidents,ensure_ascii=False),flush=True)
              break

          if not final_commit:
              raise SystemExit("No se pudo persistir el lote tras relecturas JIT")
          if final_incidents:
              raise SystemExit("Lote persistido con incidencias editoriales: "+json.dumps(final_incidents,ensure_ascii=False))
          PY

      - name: Wake visual repair after editorial closure
        if: success()
        shell: bash
        run: |
          gh api --method POST "repos/$REPO/actions/workflows/repair-ttendencias-explicadas.yml/dispatches" -f ref=main >/dev/null
          echo "TTENDENCIAS_VISUAL_REPAIR_DISPATCHED"
