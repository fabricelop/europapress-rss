name: "TTActualidad - retirar tres Listas solicitadas 12N"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ttactualidad-remove-three-listas-20261112.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: "ttactualidad-20261112-three-listas-removal"
  cancel-in-progress: false
jobs:
  remove-three:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply three authorized terminal deletions with revision guards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ttactualidad-actions[bot]"
          git config user.email "ttactualidad-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6 7; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            # The existing official applicator validates editorial proof, exact
            # revision, terminal conflicts and all mirrored sources.
            for entry in 'Cobarde|6519e0bfa504|tt-20261112-cobarde-r0'                          'Cantante|52a0d9fe7897|tt-20261112-cantante-r0'                          'Samantha Hudson|e617da285349|tt-20261112-samantha-hudson-r0'; do
              IFS='|' read -r title editorial_id request_id <<< "$entry"
              export TT_ACTUALIDAD_EVENT_JSON="$(python3 - "$title" "$editorial_id" "$request_id" <<'PY'
          import json,sys
          print(json.dumps({"project":"ttendencias","event_id":sys.argv[2],
                            "revision":0,"decision":"deleted","trend_name":sys.argv[1],
                            "request_id":sys.argv[3]}))
          PY
              )"
              python3 pilot/apply-ttactualidad-action.py
            done
            python3 - <<'PY'
          import json
          p='pilot/ttactualidad-action-receipts.json'
          d=json.load(open(p,encoding='utf-8'))
          ids={'tt-20261112-cobarde-r0','tt-20261112-cantante-r0','tt-20261112-samantha-hudson-r0'}
          hits={x.get('request_id'):x for x in d.get('items',[]) if x.get('request_id') in ids}
          assert set(hits)==ids, 'THREE_RECEIPTS_MISSING'
          print('THREE_LISTAS_RECEIPTS', {k:v['status'] for k,v in hits.items()})
          PY
            git add -- trends/requests.json trends/telegram-manual-explained.json trends/mobile-decisions.json trends/telegram-image-deliveries.json pilot/ttactualidad-action-receipts.json
            if git diff --cached --quiet; then
              echo "TT_LISTAS_THREE_ALREADY_APPLIED"
              exit 0
            fi
            git commit -m "TTActualidad: registrar retiro de Cobarde Cantante y Samantha Hudson de Listas"
            if git push origin HEAD:main; then
              echo "TT_LISTAS_THREE_COMMITTED"
              exit 0
            fi
            echo "Concurrent main update, attempt $attempt"
            sleep "$((attempt * 3))"
          done
          echo "TT_LISTAS_THREE_GITHUB_CONFLICT" >&2
          exit 1
