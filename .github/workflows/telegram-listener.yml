name: TT Control Telegram continuo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [main]
    paths:
      - "telegram/listener-trigger.txt"
      - ".github/workflows/telegram-listener.yml"
      - "telegram/telegram_listener.py"

concurrency:
  group: tt-control-telegram-continuo
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  listener:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detectar modo de control
        id: control_mode
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          try:
              mode=str(json.loads(Path("ttittulares/control-mode.json").read_text(encoding="utf-8")).get("mode") or "telegram").strip().lower()
          except Exception:
              mode="telegram"
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write(f"mode={mode}\n")
          print("Modo TTiTTulares:", mode)
          PY
      - name: Configurar Git
        if: steps.control_mode.outputs.mode != 'web'
        run: |
          git config user.name "tt-control-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
      - name: Escuchar Telegram
        if: steps.control_mode.outputs.mode != 'web'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 telegram/telegram_listener.py

