name: TT Control Telegram continuo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [main]
    paths:
      - "telegram/listener-trigger.txt"
      - ".github/workflows/telegram-listener.yml"
      - "telegram/telegram_listener.py"
      - "trends/telegram_bot.py"

concurrency:
  group: tt-control-telegram-continuo
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  listener:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Git
        run: |
          git config user.name "tt-control-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
      - name: Barrido inicial
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 telegram/radar_no_d1.py
          git add telegram/events.json telegram/processed-events.json telegram/editorial-processing.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar estado radar editorial"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Escuchar Telegram y ejecutar barridos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 telegram/telegram_listener.py

  ttendencias-listener:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Sincronizar panel TTendencias al arrancar
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
        run: |
          python3 trends/update_trends.py
          python3 trends/telegram_bot.py sync
          git config user.name "ttendencias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trends/recent.json trends/checkpoint.json trends/telegram-bot-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Sincronizar panel TTendencias"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Escuchar bot TTendencias y refrescar panel
        env:
          TTENDENCIAS_BOT_TOKEN: ${{ secrets.TTENDENCIAS_BOT_TOKEN }}
          TTENDENCIAS_LISTEN_SECONDS: "3300"
        run: python3 trends/telegram_bot.py listen

      - name: Guardar estado TTendencias
        if: always()
        run: |
          git config user.name "ttendencias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add             trends/recent.json             trends/checkpoint.json             trends/requests.json             trends/telegram-bot-state.json             trends/telegram-manual-explained.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Actualizar estado bot TTendencias"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
