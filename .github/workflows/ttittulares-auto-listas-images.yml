name: TTiTTulares - un Gag IA al entrar en Listas

on:
  push:
    branches: [main]
    paths:
      - "ttittulares/prepared.json"
      - "ttittulares/auto_listas_images.py"
      - "ttittulares/auto_listas_images_policy.json"
  schedule:
    - cron: "*/15 * * * *"
  pull_request:
    paths:
      - "ttittulares/auto_listas_images.py"
      - "ttittulares/auto_listas_images_policy.json"
      - "tests/test_auto_listas_images.py"
      - "tests/test_all_topics_image_eligibility.py"
      - "trends/editorial-config.json"
      - "trends/apply_editorial_outbox.py"
      - "vercel-webhook/lib/ttendencias-run-handler.js"
      - "vercel-webhook/lib/ttendencias-control-handler.js"
      - "vercel-webhook/lib/ttittulares-run-handler.js"
      - ".github/workflows/ttittulares-auto-listas-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ttittulares-auto-listas-image-enqueue
  cancel-in-progress: false

jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar decisiones, deduplicación y seguridad sin generar imágenes
        run: |
          python3 -m unittest discover -s tests -p 'test_auto_listas_images.py' -v
          python3 -m unittest discover -s tests -p 'test_all_topics_image_eligibility.py' -v
          node --check vercel-webhook/lib/ttendencias-run-handler.js
          node --check vercel-webhook/lib/ttendencias-control-handler.js
          node --check vercel-webhook/lib/ttittulares-run-handler.js
      - name: Simular contra las fichas y decisiones reales de main (sin escritura)
        run: python3 ttittulares/auto_listas_images.py
      - name: Encolar máximo 1 job real en el control branch existente
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ttittulares/auto_listas_images.py --apply