name: TTiTTulares V1 · generación de imágenes detenida

# Pausa solicitada el 15/11/2026. Sin horario ni activación por publicaciones.
# No crea trabajos de imagen; la redacción de noticias permanece activa.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stopped:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirmar la pausa de ImageGen V1
        run: echo 'V1_IMAGEGEN_DISABLED_PERSISTENT=YES'
