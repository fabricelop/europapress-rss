name: TTActualidad - autorreintento seguro de ordenes GitHub
on:
  workflow_run:
    workflows:
      - "TTActualidad +Noticia a En elaboración"
      - "TTActualidad - decisiones editoriales reales sin Telegram"
    types: [completed]
permissions:
  actions: write
  contents: read
  issues: write
jobs:
  recover:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'repository_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      NAME: ${{ github.event.workflow_run.name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Reintentar una sola vez usando el MISMO payload e idempotency key
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ATTEMPT" -lt 2 ]; then
            # This does not issue a new editorial command. GitHub reruns the
            # failed job with the original repository_dispatch/client_payload.
            # Both action scripts deduplicate by the original request_id.
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
            echo "TT_ACTUALIDAD_SAFE_AUTORETRY run=$RUN_ID attempt=$ATTEMPT"
          else
            # Never retry indefinitely or invent a success receipt. Preserve
            # a traceable incident so a systemic failure can be repaired.
            title="TTActualidad: fallo persistente en orden GitHub #$RUN_ID"
            if ! gh issue list --repo "$REPO" --state all --search "$title in:title" --json title --jq '.[].title' | grep -Fxq "$title"; then
              gh issue create --repo "$REPO" --title "$title" --body "$(printf 'Ejecución editorial fallida dos veces.\n\nWorkflow: %s\nRun: https://github.com/%s/actions/runs/%s\n\nNo se ha publicado, borrado ni reenviado ninguna noticia desde este watchdog. Se requiere reparar el componente, no repetir automáticamente sin límite.\n' "$NAME" "$REPO" "$RUN_ID")"
            fi
            echo "TT_ACTUALIDAD_RECOVERY_ESCALATED run=$RUN_ID attempts=$ATTEMPT"
          fi
