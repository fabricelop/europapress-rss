name: Leer órdenes de Telegram

on:
  # El polling automático queda desactivado: Telegram entra ahora por webhook en Vercel.
  # Se mantiene ejecución manual solo para diagnóstico de emergencia.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-input.yml"

permissions:
  contents: write

concurrency:
  group: ttittulares-repo-write
  cancel-in-progress: false

jobs:
  telegram-input:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leer botones y mensajes de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          allowed_chat = str(os.environ["TELEGRAM_CHAT_ID"])
          base = f"https://api.telegram.org/bot{token}"

          state_path = Path("telegram/telegram-state.json")
          requests_path = Path("telegram/requests.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          queue = json.loads(requests_path.read_text(encoding="utf-8"))
          queue.setdefault("requests", [])
          existing_ids = {r.get("update_id") for r in queue["requests"]}

          def api(method, payload=None):
              data = None
              headers = {}
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(f"{base}/{method}", data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  result = json.loads(r.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(result)
              return result.get("result")

          def safe_api(method, payload=None):
              try:
                  return api(method, payload)
              except Exception as e:
                  print(f"Aviso Telegram {method}: {e}")
                  return None

          offset = int(state.get("offset", 0) or 0)
          params = urllib.parse.urlencode({
              "offset": offset,
              "timeout": 0,
              "allowed_updates": json.dumps(["message", "callback_query"])
          })
          with urllib.request.urlopen(f"{base}/getUpdates?{params}", timeout=30) as r:
              updates_result = json.loads(r.read().decode("utf-8"))
          if not updates_result.get("ok"):
              raise RuntimeError(updates_result)
          updates = updates_result.get("result", [])

          now = dt.datetime.now(dt.timezone.utc).isoformat()
          added = 0

          def persist():
              state_path.write_text(json.dumps(state, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
              requests_path.write_text(json.dumps(queue, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")

          def add_request(kind, text, update_id, dedupe_text=False):
              global added
              if update_id in existing_ids:
                  return False
              if dedupe_text and any(r.get("type") == kind and r.get("text") == text for r in queue["requests"]):
                  existing_ids.add(update_id)
                  return False
              queue["requests"].append({
                  "update_id": update_id,
                  "created_at": now,
                  "type": kind,
                  "text": text
              })
              queue["requests"] = queue["requests"][-100:]
              existing_ids.add(update_id)
              added += 1
              return True

          def delete_message(msg):
              message_id = msg.get("message_id")
              if not message_id:
                  return
              result = safe_api("deleteMessage", {
                  "chat_id": allowed_chat,
                  "message_id": message_id
              })
              print(f"deleteMessage message_id={message_id}: {'OK' if result else 'SIN CONFIRMAR'}")

          for update in updates:
              update_id = update["update_id"]
              state["offset"] = max(int(state.get("offset", 0) or 0), update_id + 1)
              state["initialized"] = True

              if "callback_query" in update:
                  cq = update["callback_query"]
                  msg = cq.get("message") or {}
                  chat_id = str((msg.get("chat") or {}).get("id", ""))
                  if chat_id != allowed_chat:
                      persist()
                      continue

                  data = cq.get("data", "")
                  if data.startswith("prepare:"):
                      original = msg.get("text", "")
                      match = re.search(r"(?m)^N\d+\.\s*(.+)$", original)
                      headline = match.group(1).strip() if match else original.strip()
                      if headline:
                          request_text = f"Prepara la noticia: {headline}"
                          add_request("prepare", request_text, update_id, dedupe_text=True)
                          persist()
                          safe_api("answerCallbackQuery", {
                              "callback_query_id": cq["id"],
                              "text": "✅ Añadida para preparar."
                          })
                          delete_message(msg)
                      else:
                          persist()
                          safe_api("answerCallbackQuery", {
                              "callback_query_id": cq["id"],
                              "text": "No he podido recuperar el texto de la noticia."
                          })
                  elif data == "delete:message":
                      persist()
                      safe_api("answerCallbackQuery", {
                          "callback_query_id": cq["id"],
                          "text": "🗑️ Quitado."
                      })
                      delete_message(msg)
                  elif data == "run:bulletin":
                      add_request("run", "Ejecuta ahora un boletín manual de TTiTTulares.", update_id, dedupe_text=True)
                      persist()
                      safe_api("answerCallbackQuery", {
                          "callback_query_id": cq["id"],
                          "text": "✅ Solicitud de boletín registrada."
                      })
                  else:
                      persist()
                  continue

              message = update.get("message") or {}
              chat_id = str((message.get("chat") or {}).get("id", ""))
              if chat_id != allowed_chat:
                  persist()
                  continue
              text = (message.get("text") or "").strip()
              if not text:
                  persist()
                  continue

              reply = message.get("reply_to_message") or {}
              reply_text = (reply.get("text") or reply.get("caption") or "").strip()

              if text.split()[0].lower() == "/boletin":
                  if add_request("run", "Ejecuta ahora un boletín manual de TTiTTulares.", update_id, dedupe_text=True):
                      persist()
                      safe_api("sendMessage", {
                          "chat_id": allowed_chat,
                          "text": "▶️ Solicitud de boletín registrada."
                      })
              elif not text.startswith("/"):
                  stored_text = text
                  if reply_text:
                      stored_text = f"Instrucción: {text}\nMensaje al que responde:\n{reply_text}"
                  if add_request("instruction", stored_text, update_id):
                      persist()
                      safe_api("sendMessage", {
                          "chat_id": allowed_chat,
                          "text": "📝 Instrucción guardada para la próxima ejecución."
                      })
              else:
                  persist()

          persist()
          print(f"Updates recibidos: {len(updates)}; órdenes nuevas: {added}; nuevo offset: {state.get('offset', 0)}")
          PY

      - name: Guardar órdenes y estado sin pisar otros procesos
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram/requests.json telegram/telegram-state.json

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "Procesar órdenes de Telegram"

          for intento in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Órdenes guardadas correctamente (intento $intento)."
              exit 0
            fi
            echo "Push concurrente detectado; reintentando ($intento/4)..."
            sleep $((intento * 2))
          done

          echo "ERROR: no se pudieron guardar las órdenes tras 4 intentos."
          exit 1
