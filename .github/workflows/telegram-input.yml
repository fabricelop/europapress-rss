name: Leer órdenes de Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-input.yml"
      - "telegram/input-trigger.txt"

permissions:
  contents: write

concurrency:
  group: ttittulares-repo-write
  cancel-in-progress: false

jobs:
  telegram-input:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leer botones y mensajes de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 <<'PY'
          import datetime as dt, json, os, urllib.parse, urllib.request
          from pathlib import Path
          token=os.environ["TELEGRAM_BOT_TOKEN"]; allowed=str(os.environ["TELEGRAM_CHAT_ID"]); base=f"https://api.telegram.org/bot{token}"
          state_path=Path("telegram/telegram-state.json"); req_path=Path("telegram/emergency-requests.json"); events_path=Path("telegram/events.json"); proc_path=Path("telegram/editorial-processing.json")
          state=json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
          def load_json(path, default):
              if not path.exists(): return default
              raw=path.read_text(encoding="utf-8").strip()
              dec=json.JSONDecoder()
              try: return json.loads(raw)
              except json.JSONDecodeError:
                  obj,_=dec.raw_decode(raw)
                  print("Aviso: JSON con datos extra reparado:",path)
                  return obj
          q=load_json(req_path,{"requests":[]}); q.setdefault("requests",[])
          events_doc=load_json(events_path,{"events":[]})
          events=events_doc.get("events",[]) if isinstance(events_doc,dict) else events_doc
          proc=load_json(proc_path,{"items":[]})
          proc.setdefault("items",[])
          def api(method,payload=None):
              data=json.dumps(payload).encode() if payload is not None else None
              h={"Content-Type":"application/json"} if data else {}
              with urllib.request.urlopen(urllib.request.Request(f"{base}/{method}",data=data,headers=h),timeout=30) as r:
                  out=json.loads(r.read().decode())
              if not out.get("ok"): raise RuntimeError(out)
              return out.get("result")
          # Fallback probado: desactivar webhook, consumir updates y restaurarlo el pager.
          try: api("deleteWebhook",{"drop_pending_updates":False})
          except Exception as e: print("deleteWebhook:",e)
          off=int(state.get("offset",0) or 0)
          params=urllib.parse.urlencode({"offset":off,"timeout":0,"allowed_updates":json.dumps(["callback_query"])})
          with urllib.request.urlopen(f"{base}/getUpdates?{params}",timeout=30) as r: ups=json.loads(r.read().decode()).get("result",[])
          now=dt.datetime.now(dt.timezone.utc).isoformat()
          for u in ups:
              uid=u["update_id"]; state["offset"]=max(int(state.get("offset",0) or 0),uid+1)
              cq=u.get("callback_query") or {}; msg=cq.get("message") or {}; chat=str((msg.get("chat") or {}).get("id","")); data=str(cq.get("data") or "")
              if chat!=allowed: continue
              action=idv=""
              if data.startswith("emergency:"):
                  p=data.split(":"); action=p[1] if len(p)>1 else ""; idv=":".join(p[2:])
              elif data.startswith("prepare:"):
                  action="prepare"; idv=data.split(":",1)[1]
              if data.startswith("dg:"):
                  mids=[int(x) for x in data[3:].split(",") if x.isdigit()]
                  try: api("answerCallbackQuery",{"callback_query_id":cq["id"],"text":"🗑️ Borrado."})
                  except Exception as e: print("ack delete:",e)
                  for mid in mids:
                      try: api("deleteMessage",{"chat_id":allowed,"message_id":mid})
                      except Exception as e: print("delete",mid,e)
                  continue
              if action in ("prepare","dismiss") and idv:
                  mid=msg.get("message_id")
                  if not any(x.get("update_id")==uid for x in q["requests"]):
                      q["requests"].append({"update_id":uid,"action":action,"id":idv,"at":now,"chat":chat,"message_id":mid})
                      ev=next((e for e in events if str(e.get("id"))==idv),None)
                      if ev:
                          ev["status"]="PROCESSING" if action=="prepare" else "DISMISSED"
                          if action=="prepare" and not any(str(x.get("event_id"))==idv for x in proc["items"]):
                              proc["items"].append({"event_id":idv,"title":ev.get("title",""),"url":ev.get("url",""),"sources":ev.get("sources",[]),"source_count":ev.get("source_count",len(ev.get("sources",[]))),"selected_at":now,"status":"PROCESSING"})
                  try: api("answerCallbackQuery",{"callback_query_id":cq["id"],"text":"✅ Registrado." if action=="prepare" else "🗑️ Descartada."})
                  except Exception as e: print("ack:",e)
                  if mid:
                      try: api("deleteMessage",{"chat_id":allowed,"message_id":mid})
                      except Exception as e: print("delete:",e)
          q["requests"]=q["requests"][-200:]
          state_path.write_text(json.dumps(state,ensure_ascii=False,separators=(",",":"))+"\n",encoding="utf-8")
          req_path.write_text(json.dumps(q,ensure_ascii=False,separators=(",",":"))+"\\n",encoding="utf-8")
          events_path.write_text(json.dumps(events_doc,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")
          proc_path.write_text(json.dumps(proc,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")
          print("Callbacks:",len(ups),"offset:",state.get("offset",0))
          PY

      - name: Guardar órdenes y estado sin pisar otros procesos
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram/emergency-requests.json telegram/telegram-state.json telegram/events.json telegram/editorial-processing.json

          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi

          git commit -m "Procesar órdenes de Telegram"
          # Requests/state may be updated concurrently by other cloud workflows.
          # Prefer the just-collected Telegram batch and retry from current main.
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase --abort 2>/dev/null || true
            git reset --soft origin/main
            git add telegram/telegram-state.json telegram/emergency-requests.json telegram/events.json telegram/editorial-processing.json
            git commit -m "Procesar órdenes de Telegram" || true
            git push origin HEAD:main
          fi
