name: Refrescar botones TTiTTulares Telegram

on:
  push:
    branches: [main]
    paths:
      - "telegram/ttittulares-keyboard-refresh.json"
      - ".github/workflows/refresh-ttittulares-telegram-keyboard.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ttittulares-keyboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar teclados pendientes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_PILOT_ENABLED: ${{ vars.INSTAGRAM_PILOT_ENABLED || '1' }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, unicodedata, urllib.parse, urllib.request
          from datetime import datetime, timezone

          p=pathlib.Path("telegram/ttittulares-keyboard-refresh.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat=os.environ["TELEGRAM_CHAT_ID"].strip()
          endpoint=f"https://api.telegram.org/bot{token}/editMessageReplyMarkup"
          changed=False
          # Use only an existing trusted Telegram delivery to reconstruct the
          # Instagram button. Off by default until Meta and callbacks are ready.
          approved_messages=set()
          if os.environ.get("INSTAGRAM_PILOT_ENABLED","").strip()=="1":
              try:
                  deliveries=json.loads(pathlib.Path("telegram/ttittulares-deliveries.json").read_text(encoding="utf-8"))
                  for delivery in deliveries.get("items",[]):
                      if (str(delivery.get("status") or "").lower()=="sent"
                          and (delivery.get("instagram") or {}).get("image_url","").endswith(".jpg")):
                          approved_messages.add((str(delivery.get("event_id") or ""),int(delivery.get("telegram_message_id") or 0)))
              except Exception as error:
                  print("INSTAGRAM_REFRESH_SKIP_UNVERIFIED_DELIVERIES",str(type(error).__name__))

          def x_search_keywords(row):
              raw=str(row.get("title") or row.get("tweet") or "").replace("\n"," ")
              words=re.findall(r"[^\W_]+",raw,flags=re.UNICODE)
              stop=set("el la los las un una unos unas de del al en a ante por para con sin sobre entre que quien quienes como cual cuales su sus y e o u es son ha han fue ser se le les lo este esta estos estas ese esa esos esas tras desde hasta durante muy mas hoy ayer mañana ultima ultimas hora directo noticia noticias actualidad cuenta explica explican anuncia anunciaron nueva nuevo nuevas nuevos ahora segundo primera primero centenar personas persona hombres mujeres supera supero desvela reactiva aprueba confirma detiene investiga consigue gana pierde critica pide asegura publica celebran ocurrido denuncian".split())
              good=[];seen=set()
              for word in words:
                  key=unicodedata.normalize("NFD",word).encode("ascii","ignore").decode().lower()
                  if len(key)<3 or key in stop or key.isdigit() or key in seen:
                      continue
                  seen.add(key);good.append(word)
                  if len(good)==3:
                      break
              if len(good)<2:
                  for word in words:
                      key=unicodedata.normalize("NFD",word).encode("ascii","ignore").decode().lower()
                      if len(key)>=3 and not key.isdigit() and key not in seen:
                          seen.add(key);good.append(word)
                      if len(good)>=2:
                          break
              return " ".join(good[:3]) or "noticias"

          for row in d.get("items",[]):
              if row.get("status")!="pending":
                  continue
              eid=str(row["event_id"])
              mid=int(row["message_id"])
              tweet=str(row["tweet"])
              image_url=str(row["image_url"])
              copy_url="https://tt-control.fabricelop.workers.dev/copy-image?"+urllib.parse.urlencode({"src":image_url})
              x_url="https://tt-control.fabricelop.workers.dev/x-compose?"+urllib.parse.urlencode({"text":tweet})
              x_search="https://x.com/search?"+urllib.parse.urlencode({"q":x_search_keywords(row),"src":"typed_query","f":"live"})
              keyboard={
                  "inline_keyboard":[
                      [{"text":"🖼️ Copiar imagen","url":copy_url}],
                      [
                          {"text":"📋 Copiar tuit","copy_text":{"text":tweet}},
                          {"text":"✍️ Abrir en X","url":x_url}
                      ],
                      [
                          {"text":"🔎 Buscar en X","url":x_search}
                      ],
                      [
                          {"text":"🗑 Desestimar","callback_data":"tt:d:"+eid},
                          {"text":"✅ Publicado","callback_data":"tt:p:"+eid}
                      ]
                  ]
              }
              if (eid,mid) in approved_messages:
                  keyboard["inline_keyboard"].insert(-1,[{
                      "text":"📸 Publicar en Instagram",
                      "callback_data":"tt:i:"+eid
                  }])
              payload=json.dumps({
                  "chat_id":chat,
                  "message_id":mid,
                  "reply_markup":keyboard
              },ensure_ascii=False).encode("utf-8")
              req=urllib.request.Request(endpoint,data=payload,headers={"content-type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      out=json.loads(r.read().decode("utf-8"))
                  if not out.get("ok"):
                      raise RuntimeError(str(out))
                  row["status"]="done"
                  row["updated_at"]=datetime.now(timezone.utc).isoformat().replace("+00:00","Z")
                  changed=True
                  print("TTITTULARES_KEYBOARD_REFRESH_OK",mid)
              except Exception as e:
                  row["status"]="error"
                  row["error"]=str(e)
                  row["updated_at"]=datetime.now(timezone.utc).isoformat().replace("+00:00","Z")
                  changed=True
                  print("TTITTULARES_KEYBOARD_REFRESH_ERROR",mid,str(e))

          if changed:
              d["updated_at"]=datetime.now(timezone.utc).isoformat().replace("+00:00","Z")
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- telegram/ttittulares-keyboard-refresh.json; then exit 0; fi
          git add telegram/ttittulares-keyboard-refresh.json
          git commit -m "Registrar refresco botones Telegram"
          for n in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep $((n*2)); continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*2))
          done
          exit 1
