name: RainETA Official Forecast Sources Probe
on:
  push:
    paths:
      - 'ios/raineta/tests/official_forecast_probe.py'
      - 'ios/raineta/tests/dwd_wms_visual_probe.py'
      - '.github/workflows/raineta-official-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect AEMET high-resolution source and DWD WMS capabilities
        working-directory: ios/raineta
        run: python3 tests/official_forecast_probe.py
      - name: Render genuine forecast maps using DWD WMS
        working-directory: ios/raineta
        run: python3 tests/dwd_wms_visual_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raineta-official-model-map-previews
          path: ios/raineta/official-maps/
          retention-days: 7
