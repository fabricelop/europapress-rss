name: Validar TTendencias sin Telegram (piloto)
on:
  push:
    branches: ['pilot/ttendencias-no-telegram-final-20261016']
    paths:
      - '.github/workflows/ttendencias-*.yml'
      - '.github/workflows/fix-ttendencias-telegram-callbacks.yml'
      - 'trends/healthcheck.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python and archive-image selftests
        run: |
          python3 -m pip install --quiet Pillow requests beautifulsoup4
          python3 -m py_compile trends/healthcheck.py trends/enrich_explained_images.py trends/normalize_ai_flags.py pilot/apply-ttactualidad-action.py
          python3 trends/enrich_explained_images.py --selftest
      - name: Validate direct GitHub actions without Telegram
        run: python3 -m unittest discover -s pilot -p 'test_ttactualidad_direct_actions.py' -v
      - name: Validate workflow isolation and repair contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          wf=Path('.github/workflows')
          for name in ('ttendencias-listener.yml','ttendencias-listener-watchdog.yml','fix-ttendencias-telegram-callbacks.yml'):
              c=(wf/name).read_text(encoding='utf-8')
              assert 'workflow_dispatch:' in c, name
              assert 'schedule:' not in c and 'push:' not in c, name
              assert 'telegram_bot.py' not in c and 'gh workflow run' not in c, name
              assert 'getUpdates' not in c and 'TTENDENCIAS_BOT_TOKEN' not in c, name
          refresh=(wf/'ttendencias-refresh.yml').read_text(encoding='utf-8')
          assert 'trends/update_trends.py' in refresh and 'trends/auto_queue_new.py' in refresh
          assert 'python3 trends/healthcheck.py' in refresh
          assert 'telegram_bot.py' not in refresh
          assert 'send-ttendencias-explained-telegram.yml' not in refresh
          assert 'TTENDENCIAS_BOT_TOKEN' not in refresh
          repair=(wf/'repair-ttendencias-explicadas.yml').read_text(encoding='utf-8')
          assert 'if str(row.get("status") or "").lower()!="explained":' in repair
          assert '# TTActualidad: editorial "explained" is sufficient; no Telegram delivery required.' in repair
          assert 'leaders.append(row)' in repair
          assert 'trends/image-runs/jobs/' in repair
          health=Path('trends/healthcheck.py').read_text(encoding='utf-8')
          assert 'if not web_mode and isinstance(requests_doc, dict) and isinstance(deliveries_doc, dict):' in health
          assert 'if not web_mode and SEND_OUTCOME' in health
          assert 'if blocking and signature != previous.get("last_alert_signature") and not web_mode:' in health
          print('CUTOFF_CONTRACTS_OK')
          PY
      - name: Validate TTActualidad V7 Listas with nine browser-model cases
        run: |
          git fetch --depth=1 origin pilot/ttactualidad-direct-decisions-20261015
          git show FETCH_HEAD:docs/index.html > docs/index.html
          git show FETCH_HEAD:pilot/test-ttactualidad-trend-listas.mjs > pilot/test-ttactualidad-trend-listas.mjs
          node pilot/test-ttactualidad-trend-listas.mjs
