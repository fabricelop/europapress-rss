name: Instagram Publisher Checks
on:
  pull_request:
    paths:
      - 'instagram-publisher/**'
      - '.github/workflows/instagram-publisher-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        working-directory: instagram-publisher
        run: npm test
