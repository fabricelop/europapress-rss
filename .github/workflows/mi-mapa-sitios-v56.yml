name: "Mi Mapa Mis Sitios 1.0.56 - IPA iPhone"
on:
  push:
    branches:
      - feature/mis-sitios-v56
    paths:
      - 'gps-ios/native/Sources/**'
      - 'gps-ios/native/Tests/**'
      - 'gps-ios/native/project.yml'
      - '.github/workflows/mi-mapa-sitios-v56.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mi-mapa-sitios-v56
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 50
    defaults:
      run:
        working-directory: gps-ios/native
    steps:
      - uses: actions/checkout@v4
      - name: Swift sintaxis y proyecto
        run: |
          set -euo pipefail
          swiftc -frontend -parse Sources/*.swift Shared/*.swift Live/*.swift Tests/*.swift
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 tools/make_icon.py
          xcodegen generate --spec project.yml
      - name: Pruebas de regresión iPhone
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          all=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))["devices"]
          phones=[d for rt,ds in all.items() if "iOS" in rt for d in ds if "iPhone" in d["name"] and d["state"]!="Unavailable"]
          assert phones
          open("/tmp/sitios_simulator","w").write(phones[0]["udid"])
          PY
          xcodebuild test -project MiMapaDelTiempo.xcodeproj -scheme MiMapaDelTiempo \
            -configuration Debug -destination "platform=iOS Simulator,id=$(cat /tmp/sitios_simulator)" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Crear IPA sin firma
        run: |
          set -euo pipefail
          xcodebuild -project MiMapaDelTiempo.xcodeproj -scheme MiMapaDelTiempo \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/sitios_v56_build" CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/sitios_v56_build/Build/Products/Release-iphoneos/MiMapaDelTiempo.app"
          APP="$APP" python3 - <<'PY'
          from pathlib import Path
          import os,plistlib
          app=Path(os.environ["APP"])
          assert app.is_dir()
          m=plistlib.loads((app/"Info.plist").read_bytes())
          assert m["CFBundleIdentifier"]=="es.mimapadeltiempo.appprueba"
          assert m["CFBundleShortVersionString"]=="1.0.56"
          assert m["CFBundleVersion"]=="57"
          assert m["UISupportedInterfaceOrientations"]==["UIInterfaceOrientationPortrait"]
          assert (app/"PlugIns"/"MiMapaWidgets.appex").exists()
          PY
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -q -r MiMapaDelTiempo-MisSitios-1.0.56.ipa Payload
          unzip -t MiMapaDelTiempo-MisSitios-1.0.56.ipa >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MiMapaDelTiempo-MisSitios-1.0.56-build57-unsigned
          path: gps-ios/native/MiMapaDelTiempo-MisSitios-1.0.56.ipa
          retention-days: 14
          if-no-files-found: error
