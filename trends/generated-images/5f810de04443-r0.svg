<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title>El perro andaluz se adueña del late night</title>
<desc>Caricatura editorial de un perro presentador irrumpiendo en un plató nocturno, robando el foco y arrastrando un gran reloj marcado a las 23:20, como gag sobre la emisión de El perro andaluz.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11162d"/><stop offset="1" stop-color="#32134b"/></linearGradient>
  <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e94d7d"/><stop offset="1" stop-color="#8d204f"/></linearGradient>
  <radialGradient id="spot" cx="50%" cy="20%" r="70%"><stop offset="0" stop-color="#fff9d2" stop-opacity=".95"/><stop offset=".58" stop-color="#ffd866" stop-opacity=".35"/><stop offset="1" stop-color="#ffd866" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".38"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="930" cy="90" r="230" fill="url(#spot)"/>
<path d="M0 500 C230 455 440 475 620 510 C820 550 1020 535 1200 495 L1200 675 L0 675 Z" fill="#0b0d17"/>
<ellipse cx="595" cy="610" rx="520" ry="45" fill="#000" opacity=".32"/>

<!-- luces -->
<g opacity=".85">
  <circle cx="100" cy="90" r="18" fill="#f6cf56"/><circle cx="154" cy="90" r="18" fill="#e94d7d"/><circle cx="208" cy="90" r="18" fill="#70d4ff"/>
  <circle cx="1035" cy="90" r="18" fill="#f6cf56"/><circle cx="1089" cy="90" r="18" fill="#e94d7d"/><circle cx="1143" cy="90" r="18" fill="#70d4ff"/>
</g>

<!-- reloj gigante arrastrado -->
<g transform="translate(760 315) rotate(10)" filter="url(#shadow)">
  <circle cx="0" cy="0" r="145" fill="#f7f1e7" stroke="#111827" stroke-width="16"/>
  <circle cx="0" cy="0" r="119" fill="#fff" stroke="#e7ddd0" stroke-width="4"/>
  <g stroke="#222" stroke-width="7" stroke-linecap="round">
    <line x1="0" y1="-101" x2="0" y2="-116"/><line x1="101" y1="0" x2="116" y2="0"/><line x1="0" y1="101" x2="0" y2="116"/><line x1="-101" y1="0" x2="-116" y2="0"/>
  </g>
  <line x1="0" y1="0" x2="-55" y2="-58" stroke="#222" stroke-width="13" stroke-linecap="round"/>
  <line x1="0" y1="0" x2="70" y2="-28" stroke="#e94975" stroke-width="9" stroke-linecap="round"/>
  <circle cx="0" cy="0" r="12" fill="#222"/>
  <rect x="-61" y="42" width="122" height="39" rx="12" fill="#111827"/>
  <text x="0" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#fff">23:20</text>
</g>

<!-- cuerda -->
<path d="M715 420 C642 463 580 475 522 448 C486 431 470 405 449 380" fill="none" stroke="#d8b36a" stroke-width="13" stroke-linecap="round"/>
<path d="M715 420 C642 463 580 475 522 448 C486 431 470 405 449 380" fill="none" stroke="#fff3ba" stroke-width="3" stroke-linecap="round" opacity=".55"/>

<!-- perro presentador -->
<g transform="translate(405 310)" filter="url(#shadow)">
  <!-- cuerpo -->
  <path d="M-112 265 C-112 150 -92 94 -46 70 C2 44 85 48 122 93 C155 133 163 206 155 283 L-112 283 Z" fill="#2c334d" stroke="#111827" stroke-width="8"/>
  <path d="M13 83 L-14 157 L35 194 L82 132 L67 82 Z" fill="#fff7e8"/>
  <path d="M20 155 L42 183 L68 154 L55 246 L30 246 Z" fill="#e84c78"/>
  <!-- cuello -->
  <rect x="-8" y="22" width="66" height="78" rx="26" fill="#c88a4e"/>
  <!-- orejas -->
  <path d="M-46 -4 C-126 -76 -128 -147 -88 -151 C-50 -154 -22 -95 -12 -27 Z" fill="#9a5b36" stroke="#4b2c20" stroke-width="8"/>
  <path d="M77 -2 C145 -77 157 -143 117 -151 C80 -158 51 -95 45 -25 Z" fill="#9a5b36" stroke="#4b2c20" stroke-width="8"/>
  <path d="M-40 -21 C-88 -70 -93 -116 -69 -120 C-47 -124 -24 -77 -20 -38 Z" fill="#e8a58d" opacity=".75"/>
  <path d="M70 -21 C111 -70 123 -114 101 -120 C79 -126 58 -75 54 -38 Z" fill="#e8a58d" opacity=".75"/>
