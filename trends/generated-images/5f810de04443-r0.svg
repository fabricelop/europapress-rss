  <!-- hocico -->
  <ellipse cx="29" cy="25" rx="68" ry="50" fill="#d59a63"/>
  <ellipse cx="29" cy="5" rx="31" ry="23" fill="#2a2020"/>
  <ellipse cx="20" cy="-1" rx="8" ry="5" fill="#fff" opacity=".6"/>
  <path d="M10 47 C24 61 45 61 58 47" fill="none" stroke="#522d2a" stroke-width="6" stroke-linecap="round"/>
  <!-- ojos -->
  <ellipse cx="-23" cy="-37" rx="19" ry="22" fill="#fff"/>
  <ellipse cx="73" cy="-37" rx="19" ry="22" fill="#fff"/>
  <circle cx="-17" cy="-31" r="8" fill="#222"/>
  <circle cx="67" cy="-31" r="8" fill="#222"/>
  <path d="M-47 -64 Q-22 -78 1 -64" fill="none" stroke="#4b2c20" stroke-width="8" stroke-linecap="round"/>
  <path d="M51 -64 Q77 -77 98 -60" fill="none" stroke="#4b2c20" stroke-width="8" stroke-linecap="round"/>
  <!-- ceja cómica -->
  <path d="M54 -70 Q81 -92 107 -64" fill="none" stroke="#f3d07e" stroke-width="4" stroke-linecap="round"/>
  <!-- pata con micro -->
  <path d="M-77 132 C-129 102 -164 123 -166 158 C-167 198 -120 215 -78 205" fill="#b77343" stroke="#4b2c20" stroke-width="8"/>
  <rect x="-181" y="91" width="23" height="125" rx="11" fill="#222" transform="rotate(-19 -170 154)"/>
  <ellipse cx="-194" cy="83" rx="31" ry="27" fill="#191919" transform="rotate(-19 -194 83)"/>
  <g stroke="#777" stroke-width="3" opacity=".8"><path d="M-214 73 l38 13"/><path d="M-211 63 l38 13"/><path d="M-207 54 l36 12"/></g>
  <!-- pata con cuerda -->
  <path d="M113 135 C160 118 181 135 178 164 C174 199 137 209 102 191" fill="#b77343" stroke="#4b2c20" stroke-width="8"/>
  <circle cx="166" cy="167" r="24" fill="#b77343" stroke="#4b2c20" stroke-width="7"/>
  <!-- brillo traje -->
  <path d="M-87 123 C-35 94 61 89 127 121" fill="none" stroke="#5e688b" stroke-width="7" opacity=".6"/>
</g>

<!-- presentador humano desplazado por el perro, genérico -->
<g transform="translate(165 365)" opacity=".95">
  <ellipse cx="0" cy="165" rx="115" ry="30" fill="#000" opacity=".3"/>
  <path d="M-63 154 C-56 74 -36 40 5 31 C47 22 77 57 86 154 Z" fill="#38405c" stroke="#141827" stroke-width="7"/>
  <circle cx="8" cy="-7" r="49" fill="#d9a172" stroke="#5a3928" stroke-width="7"/>
  <path d="M-42 -23 C-21 -70 52 -72 65 -17 C32 -38 -3 -43 -42 -23 Z" fill="#2c1e1b"/>
  <ellipse cx="-10" cy="-5" rx="7" ry="9" fill="#222"/><ellipse cx="28" cy="-5" rx="7" ry="9" fill="#222"/>
  <path d="M-2 21 Q10 29 25 18" fill="none" stroke="#6e3b32" stroke-width="4"/>
  <path d="M70 47 C107 32 128 44 132 67 C137 95 104 109 78 98" fill="#d9a172" stroke="#5a3928" stroke-width="7"/>
  <path d="M128 66 Q159 45 186 54" fill="none" stroke="#d9a172" stroke-width="19" stroke-linecap="round"/>
  <path d="M130 66 Q160 48 188 54" fill="none" stroke="#5a3928" stroke-width="5" stroke-linecap="round"/>
</g>

<!-- desk sliding away -->
<g transform="translate(72 500) rotate(-5)">
  <rect x="0" y="0" width="365" height="90" rx="20" fill="url(#stage)" stroke="#6c173d" stroke-width="8"/>
  <rect x="38" y="22" width="215" height="16" rx="8" fill="#ffd66f" opacity=".8"/>
  <rect x="38" y="48" width="155" height="11" rx="5" fill="#fff" opacity=".45"/>
</g>

<!-- cámara que casi cae -->
<g transform="translate(1010 390) rotate(12)" filter="url(#shadow)">
  <rect x="-62" y="-42" width="118" height="80" rx="12" fill="#222a38" stroke="#080a0d" stroke-width="7"/>
  <circle cx="-13" cy="-2" r="29" fill="#0e1118" stroke="#596073" stroke-width="8"/>
  <circle cx="-13" cy="-2" r="12" fill="#71d4ff"/>
  <path d="M56 -25 L101 -47 L101 15 L56 10 Z" fill="#252d3a" stroke="#080a0d" stroke-width="7"/>
  <path d="M-20 39 L-44 126 M22 39 L56 126" stroke="#323b4d" stroke-width="13" stroke-linecap="round"/>
</g>

<!-- pequeñas estrellas de caos -->
<g fill="#ffd466">
  <path d="M575 119 l10 25 27 3-21 17 7 27-23-15-23 15 7-27-21-17 27-3z"/>
  <path d="M1090 222 l7 18 20 2-15 13 5 20-17-11-17 11 5-20-15-13 20-2z"/>
</g>
<g fill="none" stroke="#e94d7d" stroke-width="7" stroke-linecap="round">
  <path d="M624 210 q33 -30 65 -4"/><path d="M635 229 q39 -24 72 4"/>
  <path d="M945 505 q36 8 57 36"/><path d="M954 482 q45 1 73 31"/>
</g>

<!-- firma -->
<g transform="translate(1030 620)">
  <rect x="-145" y="-30" width="175" height="42" rx="15" fill="#ffffff" opacity=".12"/>
  <text x="-58" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" opacity=".85">TTendencias</text>
</g>
</svg>