name: MiMapaDelTiempo
options:
  bundleIdPrefix: es.mimapadeltiempo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  MiMapaDelTiempo:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - Resources.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mi Mapa del Tiempo
        CFBundleShortVersionString: "1.0.7"
        CFBundleVersion: "8"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - mimapadeltiempo
        UILaunchScreen: {}
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: "Mi Mapa del Tiempo necesita la ubicación para sumar tiempo a las cuadrículas geográficas."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Se necesita la ubicación siempre para registrar estancias y trayectos incluso con el iPhone bloqueado."
        NSFaceIDUsageDescription: "Face ID protege tu mapa de ubicaciones personales al abrir la aplicación."
        NSMotionUsageDescription: "La detección de caminar, conducir o estar parado permite ajustar automáticamente la precisión GPS y reducir el consumo de batería."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.mimapadeltiempo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-lsqlite3"]
    dependencies:
      - target: MiMapaWidgets
        embed: true
  MiMapaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets/TimeWidgets.swift
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Mi Mapa del Tiempo
        CFBundleShortVersionString: "1.0.7"
        CFBundleVersion: "8"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.mimapadeltiempo.app.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  MiMapaDelTiempoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: MiMapaDelTiempo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MiMapaDelTiempo:
    build:
      targets:
        MiMapaDelTiempo: all
    test:
      targets:
        - MiMapaDelTiempoTests
