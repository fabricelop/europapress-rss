name: MiMapaDelTiempo
options:
  bundleIdPrefix: es.mimapadeltiempo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  MiMapaDelTiempo:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mi Mapa del Tiempo
        UILaunchScreen: {}
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: "Mi Mapa del Tiempo necesita la ubicación para sumar tiempo a las cuadrículas geográficas."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Se necesita la ubicación siempre para registrar estancias y trayectos incluso con el iPhone bloqueado."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.mimapadeltiempo.app
  MiMapaDelTiempoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: MiMapaDelTiempo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MiMapaDelTiempo:
    build:
      targets:
        MiMapaDelTiempo: all
    test:
      targets:
        - MiMapaDelTiempoTests
