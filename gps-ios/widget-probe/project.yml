name: WidgetProbe
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  WidgetProbe:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Diagnóstico Widget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.mimapadeltiempo.widgetprobe
    dependencies:
      - target: WidgetProbeExtension
        embed: true
  WidgetProbeExtension:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Diagnóstico Widget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.mimapadeltiempo.widgetprobe.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  WidgetProbe:
    build:
      targets:
        WidgetProbe: all
