name: TTiTTulares
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9

targets:
  TTiTTulares:
    type: application
    platform: iOS
    sources:
      - path: TTiTTularesApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabricelop.ttittulares
        PRODUCT_NAME: TTiTTulares
        CODE_SIGN_STYLE: Automatic
    info:
      path: TTiTTularesApp/Info.plist
      properties:
        CFBundleDisplayName: TTiTTulares
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.fabricelop.ttittulares
            CFBundleURLSchemes:
              - ttittulares
    dependencies:
      - target: TTiTTularesWidget

  TTiTTularesWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TTiTTularesWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabricelop.ttittulares.widget
        PRODUCT_NAME: TTiTTularesWidget
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: TTiTTularesWidget/Info.plist
      properties:
        CFBundleDisplayName: TTiTTulares
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
