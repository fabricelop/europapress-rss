name: TTActualidad
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  TTActualidad:
    type: application
    platform: iOS
    sources:
      - path: TTActualidad
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabricelop.ttactualidad.native
        PRODUCT_NAME: TTActualidad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.4.28"
        CURRENT_PROJECT_VERSION: "34"
    info:
      path: TTActualidad/Info.plist
      properties:
        CFBundleDisplayName: TTActualidad
        CFBundleShortVersionString: "0.4.28"
        CFBundleVersion: "34"
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.fabricelop.ttactualidad
            CFBundleURLSchemes:
              - ttactualidad
    dependencies:
      - target: TTActualidadLive
  TTActualidadLive:
    type: app-extension
    platform: iOS
    sources:
      - path: TTActualidadLive
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabricelop.ttactualidad.native.live
        PRODUCT_NAME: TTActualidadLive
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.4.28"
        CURRENT_PROJECT_VERSION: "34"
    info:
      path: TTActualidadLive/Info.plist
      properties:
        CFBundleDisplayName: TTActualidad Live Activity
        CFBundleShortVersionString: "0.4.28"
        CFBundleVersion: "34"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  TTQuickActionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests/Native
      - path: TTActualidad/HomeQuickActions.swift
      - path: TTActualidad/EditorialProgressPolicy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabricelop.ttactualidad.quick-action-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TTQuickActions:
    build:
      targets:
        TTQuickActionTests: all
    test:
      targets:
        - TTQuickActionTests
  TTActualidad:
    build:
      targets:
        TTActualidad: all
        TTActualidadLive: all
    run:
      config: Debug
    archive:
      config: Release

