name: TTActualidad
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  TTActualidad:
    type: application
    platform: iOS
    sources:
      - path: TTActualidad
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabricelop.ttactualidad.native
        PRODUCT_NAME: TTActualidad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.4.59"
        CURRENT_PROJECT_VERSION: "71"
    info:
      path: TTActualidad/Info.plist
      properties:
        CFBundleDisplayName: TTActualidad
        CFBundleShortVersionString: "0.4.59"
        CFBundleVersion: "71"
        ITSAppUsesNonExemptEncryption: false
        # Set only to the approved private HTTPS Worker endpoint in a controlled iOS build.
        TTImageApprovalAPIBaseURL: "https://ttactualidad.rainyraven22.chatgpt.site/api/image-inbox"
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.fabricelop.ttactualidad
            CFBundleURLSchemes:
              - ttactualidad
    dependencies:
      - target: TTActualidadLive
  TTActualidadLive:
    type: app-extension
    platform: iOS
    sources:
      - path: TTActualidadLive
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabricelop.ttactualidad.native.live
        PRODUCT_NAME: TTActualidadLive
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.4.59"
        CURRENT_PROJECT_VERSION: "71"
    info:
      path: TTActualidadLive/Info.plist
      properties:
        CFBundleDisplayName: TTActualidad Live Activity
        CFBundleShortVersionString: "0.4.59"
        CFBundleVersion: "71"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  TTQuickActionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests/Native
      - path: TTActualidad/HomeQuickActions.swift
      - path: TTActualidad/EditorialProgressPolicy.swift
      - path: TTActualidad/ApprovedImageFeed.swift
      - path: TTActualidad/SiteAIImageCatalog.swift
      - path: TTActualidad/NewsAIImageCatalog.swift
      - path: TTActualidad/ImageApprovalInstructions.swift
      - path: TTActualidad/RankMovement.swift
      - path: TTActualidad/TrendImportance.swift
      - path: TTActualidad/EditorialRelations.swift
      - path: TTActualidad/EditorialReceiptPolicy.swift
      - path: TTActualidad/EditorialPendingPolicy.swift
      - path: TTActualidad/EditorialActionPolicy.swift
      - path: TTActualidad/TTActualidadXPost.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabricelop.ttactualidad.quick-action-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TTQuickActions:
    build:
      targets:
        TTQuickActionTests: all
    test:
      targets:
        - TTQuickActionTests
  TTActualidad:
    build:
      targets:
        TTActualidad: all
        TTActualidadLive: all
    run:
      config: Debug
    archive:
      config: Release

