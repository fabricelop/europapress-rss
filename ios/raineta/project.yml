name: RainETA
options:
  bundleIdPrefix: es.raineta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  RainETA:
    type: application
    platform: iOS
    sources:
      - path: RainETA
      - path: Shared
    dependencies:
      - target: RainETALive
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.raineta.iphone
        PRODUCT_NAME: RainETA
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.11.0"
        CURRENT_PROJECT_VERSION: "17"
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: "NO"
    info:
      path: RainETA/Info.plist
      properties:
        CFBundleDisplayName: RainETA
        CFBundleShortVersionString: "0.11.0"
        CFBundleVersion: "17"
        NSLocationWhenInUseUsageDescription: "RainETA utiliza tu ubicación para calcular cuándo llegará la lluvia."
        NSLocationAlwaysAndWhenInUseUsageDescription: "RainETA puede actualizar tu ubicación en segundo plano cuando te desplazas y adaptar la previsión y En Vivo."
        NSLocationAlwaysUsageDescription: "RainETA necesita ubicación en segundo plano para actualizar la previsión al cambiar de lugar."
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - location
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  RainETALive:
    type: app-extension
    platform: iOS
    sources:
      - path: RainETALive
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.raineta.iphone.live
        PRODUCT_NAME: RainETALive
        MARKETING_VERSION: "0.11.0"
        CURRENT_PROJECT_VERSION: "17"
    info:
      path: RainETALive/Info.plist
      properties:
        CFBundleDisplayName: RainETA En Vivo
        CFBundleShortVersionString: "0.11.0"
        CFBundleVersion: "17"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  RainETATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RainETATests
    dependencies:
      - target: RainETA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.raineta.iphone.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: RainETA
