<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TTendencias">
<link rel="manifest" href="/ttendencias/manifest.webmanifest">
<link rel="icon" href="/ttendencias/icon.svg?v=tt2" type="image/svg+xml">
<title>TTendencias Control</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0e14;color:#eef2f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0d1119,#090b10 55%)}button{font:inherit}
.top{position:sticky;top:0;z-index:20;background:#0b0e14ee;backdrop-filter:blur(14px);border-bottom:1px solid #252b36;padding:13px max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px}.brand{font-size:19px;font-weight:850}.sub{font-size:11px;color:#8f9bad}.spacer{flex:1}
.iconbtn{border:1px solid #303846;background:#141a24;color:#edf3ff;border-radius:11px;height:42px;padding:0 12px;font-weight:750}.iconbtn b{margin-left:3px}
main{max-width:820px;margin:auto;padding:15px 12px 36px}.summary{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:12px}.summary h1{font-size:23px;margin:0 0 5px}.meta{color:#8f9bad;font-size:12px;line-height:1.45}.badge{border:1px solid #343c4a;background:#131923;border-radius:999px;padding:7px 10px;font-size:11px;color:#c7d1df}
.timing{display:none;border:1px solid #334055;background:#101722;border-radius:11px;padding:9px 11px;margin:0 0 12px;font-size:12px;color:#c1ccda}.timing.ok,.timing.warn,.timing.late{display:block}.timing.warn{border-color:#725b2a;color:#f5c451}.timing.late{border-color:#743944;color:#ff8d99}
.list{display:grid;gap:9px}.card{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:11px;background:#11161e;border:1px solid #262e3a;border-radius:15px;padding:12px 13px;min-height:72px}.card.active,.card.problematic{background:#14243a;border-color:#31557f}.rank{font-weight:900;font-size:20px;color:#778399;text-align:center}.name{font-weight:790;font-size:16px;line-height:1.2;overflow-wrap:anywhere}.state{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:6px;color:#aab5c5}.dot{width:8px;height:8px;border-radius:50%}.dot.active{background:#4b91ff}.dot.explained{background:#42c879}.dot.dismissed{background:#778399}.dot.problematic{background:#ff8a50}.detail{font-size:11px;color:#7f8b9c;margin-top:4px}.action{border:1px solid #38465a;background:#18212f;color:#dce7f7;border-radius:10px;padding:8px 10px;font-weight:750;white-space:nowrap}.action.warn{color:#ffd18b}
.empty{padding:42px 10px;text-align:center;color:#9aa6b7}
.sheet{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:flex-end}.sheet.show{display:flex}.panel{width:100%;max-width:560px;margin:0 auto;background:#111720;border:1px solid #354052;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.panel h2{margin:0 0 8px}.panel p{font-size:13px;color:#9eabba;line-height:1.45}.panel input{width:100%;background:#0a0f16;border:1px solid #364153;color:#eef3fa;border-radius:11px;padding:12px;font:inherit;margin-bottom:11px}.row{display:flex;gap:8px}.row button{flex:1}.primary,.secondary{border:1px solid #34445b;background:#18212f;color:#dce7f7;border-radius:11px;padding:10px 11px;font-weight:760}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-15px);opacity:0;transition:.2s;background:#1a2330;border:1px solid #3b485b;border-radius:10px;padding:9px 12px;z-index:80;max-width:90vw;text-align:center;font-size:12px}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:560px){.top{padding-top:max(10px,env(safe-area-inset-top))}.brand{font-size:17px}main{padding:12px 9px 30px}.summary{grid-template-columns:1fr}.card{grid-template-columns:34px minmax(0,1fr) auto;padding:11px 9px}.rank{font-size:17px}.name{font-size:15px}.action{padding:7px 8px;font-size:12px}}
</style>
</head>
<body>
<header class="top">
  <div><div class="brand">TTendencias</div><div class="sub">Control editorial web</div></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="preparedBtn" title="Tuits listos">Tuits <b id="preparedCount">0</b></button>
  <button class="iconbtn" id="refreshBtn" title="Recargar datos">↻</button>
  <button class="iconbtn" id="settingsBtn" title="Acceso">⚙</button>
</header>
<main>
  <section class="summary">
    <div><h1>Top 10 España</h1><div class="meta" id="stamp">Cargando…</div><div class="meta" id="freshness"></div></div>
    <div class="badge" id="quality">—</div>
  </section>
  <div class="timing" id="editorialTiming"></div>
  <section class="list" id="list"><div class="empty">Cargando tendencias…</div></section>
</main>

<div class="sheet" id="sheet"><div class="panel">
  <h2>Acceso</h2>
  <p>Las acciones de control requieren el token privado. El contador del icono muestra únicamente los tuits listos pendientes de revisar.</p>
  <input id="tokenInput" type="password" autocomplete="off" placeholder="Token de control">
  <div class="row"><button class="secondary" id="cancelToken">Cancelar</button><button class="secondary" id="testToken">Probar</button><button class="primary" id="saveToken">Guardar</button></div>
  <div class="meta" id="accessStatus" style="margin-top:10px"></div>
  <button class="secondary" id="badgeBtn" type="button" style="width:100%;margin-top:14px">Activar contador en el icono</button>
  <div class="meta" id="badgeStatus" style="margin-top:8px"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const API="/api/ttendencias-control";
const RAW="https://raw.githubusercontent.com/fabricelop/europapress-rss/main/";
const $=id=>document.getElementById(id);
let model=null,busy=new Set();
const token=()=>localStorage.getItem("ttendencias-control-token")||"";
function nrm(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase("es-ES").replace(/\s+/g," ").trim()}
function showToast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove("show"),2500)}
function fmtDate(v){if(!v)return "Sin hora";const d=new Date(v);if(Number.isNaN(d.getTime()))return v;return new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Madrid",hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"}).format(d)}
function localState(){
 let m={};try{m=JSON.parse(localStorage.getItem("ttendencias-local-state")||"{}")}catch(_){}
 let old={};try{old=JSON.parse(localStorage.getItem("ttendencias-local-explained")||"{}")}catch(_){}
 for(const [k,v] of Object.entries(old))if(!m[k])m[k]={status:"explained",ts:Number(v)||Date.now()};
 const cutoff=Date.now()-2*60*60*1000;
 for(const [k,v] of Object.entries(m))if(Number(v?.ts||0)<cutoff)delete m[k];
 localStorage.setItem("ttendencias-local-state",JSON.stringify(m));return m
}
function clearLocal(names){const m=localState();for(const name of names||[])delete m[nrm(name)];localStorage.setItem("ttendencias-local-state",JSON.stringify(m))}
function freshnessText(v){
 if(!v)return "";const d=new Date(v);if(Number.isNaN(d.getTime()))return "";
 const mins=Math.max(0,Math.round((Date.now()-d.getTime())/60000));
 if(mins<=18)return "● Actualizado hace "+mins+" min";
 if(mins<=30)return "● Atención: "+mins+" min sin nueva captura";
 return "● Desactualizado: "+mins+" min";
}
function editorialTimingText(){
 const active=(model?.items||[]).filter(x=>x.status==="active"&&!x.ready&&x.requested_at);
 const box=$("editorialTiming");if(!active.length){box.className="timing";box.textContent="";return}
 const now=Date.now(),stamps=active.map(x=>new Date(x.requested_at).getTime()).filter(Number.isFinite);
 if(!stamps.length){box.className="timing";box.textContent="";return}
 const oldest=Math.min(...stamps),age=Math.max(0,Math.floor((now-oldest)/60000));
 const schedule=((model?.editorial_config?.editorial?.schedule_minutes)||[0,30]).map(Number).sort((a,b)=>a-b);
 const d=new Date(),minute=d.getMinutes(),previous=schedule.filter(x=>x<=minute);
 const lastMinute=previous.length?previous[previous.length-1]:(schedule[schedule.length-1]??30);
 const last=new Date(d);if(previous.length)last.setMinutes(lastMinute,0,0);else{last.setHours(d.getHours()-1);last.setMinutes(lastMinute,0,0)}
 const upcoming=schedule.find(x=>x>minute),next=new Date(d);if(upcoming!==undefined)next.setMinutes(upcoming,0,0);else{next.setHours(d.getHours()+1);next.setMinutes(schedule[0]??0,0,0)}
 const eligible=active.some(x=>new Date(x.requested_at).getTime()<=last.getTime());
 if(eligible){
   const late=Math.max(0,Math.floor((now-last.getTime())/60000));box.className="timing "+(age>=30?"late":"warn");
   box.textContent="⚠ "+active.length+" en elaboración · el pase de las "+last.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})+" pasó hace "+late+" min · la más antigua lleva "+age+" min";
 }else{
   const left=Math.max(0,Math.ceil((next.getTime()-now)/60000));box.className="timing "+(age>=25?"warn":"ok");
   box.textContent=active.length+" en elaboración · próximo pase "+next.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})+" · faltan "+left+" min";
 }
}
async function updateBadge(){
 const count=(model?.prepared||[]).length;
 try{if("setAppBadge" in navigator){if(count>0)await navigator.setAppBadge(count);else if("clearAppBadge" in navigator)await navigator.clearAppBadge()}}catch(_){}
 document.title=count?"("+count+") TTendencias Control":"TTendencias Control";
}
function buildModel(recent,requestDoc,explained,health,prepared,editorialConfig){
 const requests=Array.isArray(requestDoc.requests)?requestDoc.requests:[],local=localState();
 const explainedSet=new Set((explained.items||[]).map(x=>nrm(x.name)));
 const latestFor=name=>[...requests].reverse().find(x=>nrm(x.name)===nrm(name));
 const items=(recent.items||[]).slice(0,10).map(item=>{
   const req=latestFor(item.name),s=String(req?.status||""),reqTs=req?.requested_at?new Date(req.requested_at).getTime():0;
   const ls=local[nrm(item.name)],localValid=ls&&Number(ls.ts||0)>=reqTs;
   let status="active",label="En curso",detail="",ready=false;
   if(localValid&&ls.status==="explained"){status="explained";label="Explicada"}
   else if(localValid&&ls.status==="dismissed"){status="dismissed";label="Desestimada"}
   else if(s==="dismissed"){status="dismissed";label="Desestimada"}
   else if(s==="problematic"){status="problematic";label="Problemática";detail=req?.problem_reason||"No se pudo elaborar con suficiente fiabilidad"}
   else if(s==="explained"||(!req&&explainedSet.has(nrm(item.name)))){status="explained";label="Explicada"}
   else if(s==="ready"){status="active";label="Lista";detail="Tuit preparado";ready=true}
   else if(s==="preparing"||s==="update"){
     const age=req?.requested_at?Math.max(0,Math.floor((Date.now()-new Date(req.requested_at).getTime())/60000)):0;
     status="active";label="En curso";
     detail=age>=30?"Elaborando · retraso de "+age+" min":"Elaborando · "+age+" min";
   }else detail="Pendiente de cola automática";
   return {rank:Number(item.rank),name:String(item.name),status,label,detail,ready,requested_at:req?.requested_at||null,internal_status:s};
 });
 const requestByName={};for(const req of requests)requestByName[nrm(req.name)]=req;
 const preparedItems=(prepared.items||[]).filter(p=>{
   const rel=((p.related_trends||[]).length?p.related_trends:[p.trend_name]).map(nrm);
   return !rel.some(name=>{
     const ls=local[name];
     if(ls&&["explained","dismissed"].includes(String(ls.status||"")))return true;
     const req=requestByName[name];
     return req&&["explained","dismissed"].includes(String(req.status||""));
   });
 });
 return {captured_at:recent.captured_at||null,reliability:recent.reliability||null,source_count:recent.source_count||0,non_stale_source_count:recent.non_stale_source_count||0,items,prepared:preparedItems,health,editorial_config:editorialConfig||{}};
}
function render(){
 if(!model)return;
 $("stamp").textContent="Captura "+fmtDate(model.captured_at);
 const age=model.captured_at?Math.max(0,Math.round((Date.now()-new Date(model.captured_at).getTime())/60000)):999;
 $("freshness").textContent=freshnessText(model.captured_at);$("freshness").style.color=age<=18?"#63d99a":age<=30?"#f5c451":"#ff7f8b";
 const rel={high:"alta",medium:"media",fallback:"baja",none:"sin datos"}[model.reliability]||model.reliability||"—";
 $("quality").textContent=(model.source_count||0)+" válidas · "+(model.non_stale_source_count||0)+" actuales · fiabilidad "+rel;
 $("preparedCount").textContent=(model.prepared||[]).length;editorialTimingText();updateBadge();
 const list=$("list");list.innerHTML="";
 for(const item of model.items||[]){
   const card=document.createElement("div");card.className="card "+item.status;
   card.innerHTML='<div class="rank">T'+item.rank+'</div><div><div class="name"></div><div class="state"><i class="dot '+item.status+'"></i><span class="label"></span></div><div class="detail"></div></div><div class="slot"></div>';
   card.querySelector(".name").textContent=item.name;card.querySelector(".label").textContent=item.label;
   const detail=card.querySelector(".detail");detail.textContent=item.detail||"";detail.style.display=item.detail?"block":"none";
   const slot=card.querySelector(".slot");
   if(item.status==="dismissed"||item.status==="problematic"){
     const b=document.createElement("button");b.className="action"+(item.status==="problematic"?" warn":"");b.textContent=item.status==="dismissed"?"Explicar":"Reintentar";b.disabled=busy.has(item.name);
     b.onclick=()=>retry(item);slot.appendChild(b);
   }
   list.appendChild(card);
 }
 if(!(model.items||[]).length)list.innerHTML='<div class="empty">No hay tendencias disponibles.</div>';
}
async function api(action,names,extra={}){
 const t=token();if(!t){$("sheet").classList.add("show");throw new Error("Falta el token de control")}
 const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+t},body:JSON.stringify({action,names,...extra})});
 let d={};try{d=await r.json()}catch(_){}
 if(r.status===401){localStorage.removeItem("ttendencias-control-token");throw new Error("Token incorrecto")}
 if(!r.ok)throw new Error(d.error||"No se pudo aplicar la acción");return d
}
async function retry(item){
 if(!confirm((item.status==="dismissed"?"¿Volver a mandar ":"¿Reintentar ") + item.name+" a elaboración?"))return;
 busy.add(item.name);clearLocal([item.name]);item.status="active";item.label="En curso";item.detail="Elaborando";item.requested_at=new Date().toISOString();render();
 try{await api("retry",[item.name]);showToast("Enviada a elaboración");setTimeout(()=>load(true),1200)}catch(e){showToast(e.message);await load(true)}finally{busy.delete(item.name);render()}
}
async function load(silent=false){
 try{
  const stamp=Date.now(),paths=["trends/recent.json","trends/requests.json","trends/telegram-manual-explained.json","trends/health-status.json","trends/prepared.json","trends/editorial-config.json"];
  const rs=await Promise.all(paths.map(p=>fetch(RAW+p+"?t="+stamp,{cache:"no-store"})));
  if(rs.slice(0,3).some(r=>!r.ok))throw new Error("No se pudieron leer los datos");
  model=buildModel(await rs[0].json(),await rs[1].json(),await rs[2].json(),rs[3].ok?await rs[3].json():{},rs[4].ok?await rs[4].json():{items:[]},rs[5].ok?await rs[5].json():{});
  localStorage.setItem("ttendencias-last-model",JSON.stringify(model));render();
 }catch(e){if(!silent)showToast(e.message)}
}
$("preparedBtn").onclick=()=>location.href="/ttendencias/preparados/";
$("refreshBtn").onclick=()=>{showToast("Recargando datos");load()};
$("settingsBtn").onclick=()=>{$("tokenInput").value=token();$("accessStatus").textContent=token()?"Token guardado":"Sin token guardado";$("badgeStatus").textContent=("setAppBadge" in navigator)?(typeof Notification!=="undefined"&&Notification.permission==="granted"?"Contador del icono activo":"Contador del icono pendiente de activar"):"Instala TTendencias en la pantalla de inicio para usar el contador";$("sheet").classList.add("show")};
$("cancelToken").onclick=()=>$("sheet").classList.remove("show");
$("testToken").onclick=async()=>{const v=$("tokenInput").value.trim();if(!v)return;$("accessStatus").textContent="Comprobando…";try{const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+v},body:JSON.stringify({action:"ping"})});const d=await r.json();$("accessStatus").textContent=r.ok&&d?.backend?.ok?"✓ Acceso correcto · GitHub operativo":r.status===401?"✕ Token no válido":"⚠ Backend no disponible"}catch(_){$("accessStatus").textContent="✕ No se pudo comprobar"}};
$("saveToken").onclick=()=>{const v=$("tokenInput").value.trim();if(v)localStorage.setItem("ttendencias-control-token",v);else localStorage.removeItem("ttendencias-control-token");$("sheet").classList.remove("show");showToast(v?"Token guardado":"Token eliminado")};
$("badgeBtn").onclick=async()=>{const s=$("badgeStatus");if(!("setAppBadge" in navigator)){s.textContent="Instala TTendencias en la pantalla de inicio para usar el contador.";return}if(typeof Notification==="undefined"){s.textContent="Notificaciones no disponibles.";return}let p=Notification.permission;if(p==="default")try{p=await Notification.requestPermission()}catch(_){p="denied"}if(p==="granted"){await updateBadge();s.textContent="✓ Contador del icono activado"}else s.textContent="Permiso no concedido."};
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet"))$("sheet").classList.remove("show")});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load(true)});window.addEventListener("pageshow",()=>load(true));
if("serviceWorker" in navigator)navigator.serviceWorker.register("/ttendencias/sw.js").catch(()=>{});
load();setInterval(()=>{if(!document.hidden)load(true)},15000);setInterval(()=>{if(!document.hidden&&model)editorialTimingText()},15000);
</script>
</body></html>
