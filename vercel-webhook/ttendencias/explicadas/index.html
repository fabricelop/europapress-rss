<script>
const API="/api/ttendencias-control", $=id=>document.getElementById(id);
const ARCHIVED_LOCAL_KEY="ttendencias-explicadas-archived-v1";
function localArchived(){try{return new Set(JSON.parse(localStorage.getItem(ARCHIVED_LOCAL_KEY)||"[]"))}catch(_){return new Set()}}
function saveLocalArchived(set){try{localStorage.setItem(ARCHIVED_LOCAL_KEY,JSON.stringify([...set].slice(-300)))}catch(_){}}
let allItems=[];
async function updateUnreadBadge(){
 const unread=allItems.filter(x=>!x.copied).length;
 try{
   if(unread&&"setAppBadge" in navigator)await navigator.setAppBadge(unread);
   else if(!unread&&"clearAppBadge" in navigator)await navigator.clearAppBadge();
 }catch(_){}
 document.title=(unread?"("+unread+") ":"")+"TTendencias · Explicadas";
}
function nrm(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase("es-ES").replace(/\s+/g," ").trim()}
function fmt(v){if(!v)return "";const d=new Date(v);return Number.isNaN(d.getTime())?"":new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Madrid",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d)}
function displayName(x){
 if(String(x.group_title||"").trim())return String(x.group_title).trim();
 if(Array.isArray(x.trend_names)&&x.trend_names.length>1)return x.trend_names.join(" · ");
 return x.name||x.display_name||x.term_normalized||"Tendencia"
}
function groupRankLabel(x){
 const ctx=(Array.isArray(x.trend_context)?x.trend_context:[])
   .filter(t=>t&&t.name)
   .sort((a,b)=>Number(a.rank||99)-Number(b.rank||99));
 if(ctx.length>1){const leader=Number(x._rank)||Number(ctx[0].rank);return (leader>=1&&leader<=20?"TT#"+leader+" ":"")+(x.name||displayName(x))+" · "+ctx.length+" tendencias";}
 const rank=Number(x._rank),name=displayName(x);
 return (rank>=1&&rank<=20?"TT#"+rank+" ":"")+name
}
function routeLabel(x){
 const r=String(x.news_disposition||x.ttittulares_route||"");
 if(r==="processing")return "→ TTiTTulares · En elaboración";
 if(r==="candidate")return "→ TTiTTulares · Tendencias";
 if(r==="ignored")return "Sin noticia derivada";
 return "";
}
function rankFor(x,requests){
 const direct=Number(x.rank_at_explanation);
 if(Number.isFinite(direct)&&direct>=1&&direct<=20)return direct;
 const target=Date.parse(x.explained_at||"");
 const rows=(requests||[]).filter(r=>nrm(r.name)===nrm(displayName(x))&&Number.isFinite(Number(r.rank)));
 rows.sort((a,b)=>{
   const ad=Date.parse(a.explained_at||a.requested_at||""),bd=Date.parse(b.explained_at||b.requested_at||"");
   const da=Number.isFinite(target)&&Number.isFinite(ad)?Math.abs(ad-target):Number.MAX_SAFE_INTEGER;
   const db=Number.isFinite(target)&&Number.isFinite(bd)?Math.abs(bd-target):Number.MAX_SAFE_INTEGER;
   return da-db;
 });
 const fallback=Number(rows[0]?.rank);
 return Number.isFinite(fallback)&&fallback>=1&&fallback<=20?fallback:null;
}
function hasTweetReadyFormat(x){
 const content=String(x.explanation||"").trim();
 if(/^TT#(?:0|[1-9]|1[0-9]|20)\s+\S/u.test(content))return true; // Legacy TT#0: never duplicate header.
 return Boolean(x.tremending_origin && /^(?:TT 🗯️ )?.{2,65} es tendencia (?:por|porque)\b/iu.test(content));
}
function tweetBody(x){
 const full=String(x.explanation||"").trim();
 const closer=String(x.closer_text||"").trim();
 // Dar una guindilla también al histórico sin cambiar sus valoraciones guardadas.
 if(!closer||closer.startsWith("🌶️")||!full.endsWith(closer))return full;
 const candidate=full.slice(0,-closer.length)+"🌶️ "+closer;
 const heading=hasTweetReadyFormat(x)?"":groupRankLabel(x)+"\n\n";
 // Incluye el encabezado legado en el presupuesto total si sigue utilizándose.
 return [...(heading+candidate)].length<280?candidate:full;
}
function copyText(x){
 const value=tweetBody(x);
 return hasTweetReadyFormat(x)?value:groupRankLabel(x)+"\n\n"+value;
}
function displayedExplanation(x){
 // TT#N ya viene dentro del tuit nuevo: conservar la cadena completa.
 return tweetBody(x);
}
function splitExplainedText(x){
 const full=displayedExplanation(x),closer=String(x.closer_text||"").trim();
 if(!closer||!full.endsWith(closer))return {fact:full,closer:""};
 let fact=full.slice(0,-closer.length).trimEnd();
 if(fact.endsWith("🌶️"))fact=fact.slice(0,-"🌶️".length).trimEnd();
 if(!fact)return {fact:full,closer:""};
 return {fact,closer:closer.startsWith("🌶️")?closer:"🌶️ "+closer};
}
async function copyItem(x,button){
 try{
   await navigator.clipboard.writeText(copyText(x));
   const old=button.textContent;button.textContent="Copiado ✓";
   setTimeout(()=>button.textContent=old,1400);
 }catch(error){alert(error?.message||"No se pudo copiar el tuit.")}
}
async function markExplainedDone(x,button){
 const controlToken=localStorage.getItem("ttendencias-control-token")||"";
 if(!controlToken){alert("Guarda primero el token de control desde Ajustes en la pantalla principal.");return}
 const old=button.textContent;button.disabled=true;button.textContent="Guardando…";
 try{
   const response=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+controlToken},body:JSON.stringify({action:"archive-explained",copy_key:x.copy_key})});
   const result=await response.json();
   if(!response.ok||!result?.ok)throw new Error(result?.error||"No se pudo pasar la tendencia al histórico.");
   x.copied=true;x.copied_at=result.copied_at||new Date().toISOString();
   const archived=localArchived();archived.add(x.copy_key);saveLocalArchived(archived);
   updateUnreadBadge();render();
 }catch(error){button.textContent=old;button.disabled=false;alert(error?.message||"No se pudo pasar la tendencia al histórico.")}
}
async function copyImageUrl(url,button){
 const previous=button.textContent;button.disabled=true;button.textContent="Copiando…";
 try{
   if(!navigator.clipboard?.write||typeof ClipboardItem==="undefined")throw Error("El navegador no admite copiar imágenes.");
   const rr=await fetch(API+"?view=image-proxy&format=png&url="+encodeURIComponent(url),{cache:"no-store"});
   if(!rr.ok)throw Error("No se pudo recuperar la imagen.");
   await navigator.clipboard.write([new ClipboardItem({"image/png":await rr.blob()})]);
   button.textContent="Copiada ✓";setTimeout(()=>button.textContent=previous,1400);
 }catch(error){button.textContent=previous;alert(error.message||"No se pudo copiar la imagen.");}
 finally{button.disabled=false}
}
function openTweetUrl(x){return "https://twitter.com/intent/tweet?text="+encodeURIComponent(copyText(x))}

async function reworkExplained(x,button){
 const controlToken=localStorage.getItem("ttendencias-control-token")||"";
 if(!controlToken){alert("Guarda primero el token de control desde Ajustes en la pantalla principal.");return}
 const previous=button.textContent;button.disabled=true;button.textContent="Solicitando…";
 try{
   const response=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+controlToken},body:JSON.stringify({
     action:"rework",
     names:[x.name||displayName(x)],
     instruction:"Rehaz el remate manteniendo los hechos y el formato del tuit, con un giro más específico. Genera también una nueva imagen IA."
   })});
   const result=await response.json();
   if(!response.ok||!result?.ok)throw new Error(result?.error||"No se pudo solicitar la nueva revisión.");
   button.textContent="Rehacer solicitado ✓";
   setTimeout(()=>load().catch(e=>alert(e.message)),700);
 }catch(error){button.textContent=previous;button.disabled=false;alert(error?.message||"No se pudo solicitar la nueva revisión.")}
}
async function imageDecision(x,action,button){
 const controlToken=localStorage.getItem("ttendencias-control-token")||"";
 if(!controlToken){alert("Guarda primero el token de control desde Ajustes en la pantalla principal.");return}
 const old=button.textContent;button.disabled=true;button.textContent=action==="regenerate-image"?"Solicitando…":"Cambiando…";
 try{
  const response=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+controlToken},body:JSON.stringify({action,names:[x.name||displayName(x)]})});
  const result=await response.json();
  if(!response.ok||!result?.ok)throw new Error(result?.error||"No se pudo guardar la decisión de imagen.");
  button.textContent=action==="regenerate-image"?"Rehacer solicitado ✓":"Usando archivo ✓";
  if(action==="regenerate-image")x.ai_image_regenerate_requested=true;
  if(action==="use-fallback-image"&&x.fallback_image?.url){x.image={...x.fallback_image};x.image_choice="fallback";x.image_status="ready";}
  setTimeout(()=>load().catch(e=>alert(e.message)),500);
 }catch(error){button.textContent=old;button.disabled=false;alert(error?.message||"No se pudo guardar la decisión de imagen.");}
}
function isChatImageGen(image){
 const guard=image?.context_guard||{};
 return image?.generated===true&&image?.provider==="chat-imagegen"&&image?.origin==="executing_chat"&&Number(guard.version)===3&&guard.scope==="current_item_only";
}
function appendImagePreview(host,image,label,badge){
 const url=String(image?.url||"");if(!/^https:\/\//i.test(url))return false;
 const wrap=document.createElement("div");wrap.style.cssText="flex:1 1 260px;min-width:0;border:1px solid #29384a;border-radius:11px;padding:8px;background:#0d131c";
 const title=document.createElement("div");title.style.cssText="display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:800;color:#b9c9dd;margin-bottom:6px";
 title.textContent=label;
 if(badge){const b=document.createElement("span");b.textContent="EN USO";b.style.cssText="color:#ffce69";title.appendChild(b)}
 const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";
 const img=document.createElement("img");img.src=API+"?view=image-proxy&url="+encodeURIComponent(url);img.alt=String(image.alt||label);img.loading="lazy";img.decoding="async";img.style.cssText="display:block;width:100%;height:155px;object-fit:contain;border-radius:8px;background:#090d13";
 a.appendChild(img);wrap.append(title,a);
 const source=document.createElement("div");source.style.cssText="font-size:10px;color:#8090a4;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis";source.textContent=String(image.source||label);wrap.appendChild(source);
 host.appendChild(wrap);return true;
}

// Valoración remota, editable y compartida entre dispositivos; nunca en localStorage.
function renderRemateRating(host,x){
 if(!host || !x.rating_key)return;
 let saving=false;
 const draw=()=>{
  host.replaceChildren();
  const label=document.createElement("div");label.className="rating-title";label.textContent="Puntúa el remate";host.appendChild(label);
  // Remate mostrado justo encima: evitar duplicarlo dentro de las estrellas.
  const stars=document.createElement("div");stars.className="rating-stars";
  const current=Number(x.remate_rating)||0;
  for(let n=1;n<=5;n++){
   const star=document.createElement("button");star.type="button";
   star.className="rating-star"+(n<=current?" filled":"");
   star.textContent=n<=current?"★":"☆";
   star.setAttribute("aria-label","Puntuar "+n+" de 5 estrellas");
   star.setAttribute("aria-pressed",String(n===current));
   star.title=n+" de 5";
   star.disabled=saving;
   star.onclick=async()=>{
    if(saving)return;
    const controlToken=localStorage.getItem("ttendencias-control-token")||"";
    if(!controlToken){alert("Guarda primero el token de control desde Ajustes en la pantalla principal.");return}
    saving=true;draw();
    try{
     const response=await fetch(API,{
      method:"POST",
      headers:{"content-type":"application/json","authorization":"Bearer "+controlToken},
      body:JSON.stringify({action:"rate-remate",rating_key:x.rating_key,rating:n}),
     });
     const result=await response.json();
     if(!response.ok||!result?.ok)throw new Error(result?.error||"No se pudo guardar la valoración.");
     x.remate_rating=result.rating;x.remate_rated_at=result.rated_at;
    }catch(error){alert(error?.message||"No se pudo guardar la valoración.")}
    finally{saving=false;draw()}
   };
   stars.appendChild(star);
  }
  const hint=document.createElement("span");hint.className="rating-hint";
  hint.textContent=saving?"Guardando…":current?current+"/5 · Guardado · puedes cambiarlo":"1 = flojo · 5 = genial";
  stars.appendChild(hint);host.appendChild(stars);
 };
 draw();
}
function renderCard(x,pending){
 const card=document.createElement("article");card.className="card";
 const name=displayName(x),route=routeLabel(x),labelled=groupRankLabel(x);
 card.innerHTML='<div class="head"><div class="name"></div><div class="when"></div></div><div class="explanation"></div><div class="closer" hidden></div><div class="imagebox" hidden></div><div class="rating"></div><div class="meta"></div><div class="actions"></div>';
 const heading=card.querySelector(".name");heading.textContent=labelled;if(hasTweetReadyFormat(x))heading.hidden=true;
 card.querySelector(".when").textContent=fmt(x.explained_at);
 const parts=splitExplainedText(x);card.querySelector(".explanation").textContent=parts.fact;
 const closer=card.querySelector(".closer");if(parts.closer){closer.hidden=false;closer.textContent=parts.closer}
 const picture=card.querySelector(".imagebox");
 const rawAi=x.ai_image||{},ai=isChatImageGen(rawAi)?rawAi:{},fallback=x.fallback_image||{};
 const aiUrl=String(ai.url||""),fallbackUrl=String(fallback.url||"");
 let imageChoice=String(x.image_choice||"");if(imageChoice==="ai"&&!aiUrl)imageChoice=fallbackUrl?"fallback":"none";
 if(/^https:\/\//i.test(aiUrl)||/^https:\/\//i.test(fallbackUrl)||x.ai_image_status||x.fallback_image_status){
   picture.hidden=false;picture.style.cssText="margin:9px 0 5px;max-width:100%;overflow:hidden";
   const grid=document.createElement("div");grid.style.cssText="display:flex;gap:8px;flex-wrap:wrap";
   appendImagePreview(grid,ai,"Gag IA",imageChoice==="ai");appendImagePreview(grid,fallback,"Archivo / fallback",imageChoice==="fallback");
   if(!grid.children.length){const state=document.createElement("div");state.style.cssText="font-size:11px;color:#94a3b8;padding:8px;border:1px solid #29384a;border-radius:10px;width:100%";state.textContent=x.ai_image_regenerate_requested?"Rehacer solicitado · se intentará una imagen en la próxima pasada.":"Imagen IA/fallback todavía no disponible.";grid.appendChild(state)}
   picture.appendChild(grid);
 }
 const rating=card.querySelector(".rating");if(parts.closer)renderRemateRating(rating,x);else rating.hidden=true;
 const meta=card.querySelector(".meta");if(route){const routeEl=document.createElement("span");routeEl.className="route";routeEl.textContent=route;meta.appendChild(routeEl)}
 const actions=card.querySelector(".actions");
 const redo=document.createElement("button");redo.className="btn";redo.type="button";redo.textContent="🔁 Rehacer remate + IA";redo.onclick=()=>reworkExplained(x,redo);actions.appendChild(redo);
 const copy=document.createElement("button");copy.className="btn";copy.type="button";copy.textContent="📋 Copiar tuit";copy.onclick=()=>copyItem(x,copy);actions.appendChild(copy);
 if(/^https:\/\//i.test(aiUrl)){const b=document.createElement("button");b.className="btn";b.type="button";b.textContent="✨ Copiar imagen IA";b.onclick=()=>copyImageUrl(aiUrl,b);actions.appendChild(b)}
 if(/^https:\/\//i.test(fallbackUrl)){const b=document.createElement("button");b.className="btn";b.type="button";b.textContent="🖼️ Copiar imagen archivo";b.onclick=()=>copyImageUrl(fallbackUrl,b);actions.appendChild(b)}
 const open=document.createElement("a");open.className="btn";open.target="_blank";open.rel="noopener noreferrer";open.href=openTweetUrl(x);open.textContent="↗ Abrir en X";actions.appendChild(open);
 const search=document.createElement("a");search.className="btn";search.target="_blank";search.rel="noopener noreferrer";const searchNames=(Array.isArray(x.trend_names)&&x.trend_names.length?x.trend_names:[name]).join(" ");search.href="https://x.com/search?q="+encodeURIComponent(searchNames)+"&src=typed_query&f=live";search.textContent="🔎 Buscar en X";actions.appendChild(search);
 if(pending){const done=document.createElement("button");done.className="btn";done.type="button";done.textContent="✓ Ya explicado";done.onclick=()=>markExplainedDone(x,done);actions.appendChild(done)}
 return card
}
function render(){
 const q=nrm($("filter").value);
 const visible=q?allItems.filter(x=>nrm(displayName(x)).includes(q)||nrm((x.trend_names||[]).join(" ")).includes(q)||nrm(x.explanation).includes(q)):allItems;
 const pendingAll=allItems.filter(x=>!x.copied),pending=visible.filter(x=>!x.copied),history=visible.filter(x=>x.copied).slice(0,100);
 $("count").textContent=String(pendingAll.length);$("pendingCount").textContent=String(pending.length);$("historyCount").textContent=String(history.length);updateUnreadBadge();
 const pendingList=$("pendingList");pendingList.innerHTML="";
 if(!pending.length)pendingList.innerHTML='<div class="empty">'+(q?"No hay pendientes que coincidan.":"No tienes tendencias pendientes de publicar.")+'</div>';else for(const x of pending)pendingList.appendChild(renderCard(x,true));
 const historyList=$("historyList");historyList.innerHTML="";
 if(!history.length)historyList.innerHTML='<div class="empty">'+(q?"No hay históricas que coincidan.":"Todavía no hay tendencias en el histórico.")+'</div>';else for(const x of history)historyList.appendChild(renderCard(x,false));
}

function collapseVisibleExplained(rows){
 const seenIds=new Set(),textIndex=new Map(),out=[];
 for(const x of rows){
  const id=String(x.id||"").trim();
  const text=nrm(x.explanation);
  // Una revisión anterior del mismo item nunca debe crear otra tarjeta visible.
  if(id&&seenIds.has(id))continue;
  if(id)seenIds.add(id);
  // Si dos miembros de un grupo guardaron exactamente la misma explicación,
  // conserva una sola tarjeta y prefiere el líder real del grupo.
  if(text&&textIndex.has(text)){
   const idx=textIndex.get(text),prev=out[idx];
   const prevLeader=String(prev?.group_leader_id||"")&&String(prev?.id||"")===String(prev.group_leader_id);
   const curLeader=String(x.group_leader_id||"")&&String(x.id||"")===String(x.group_leader_id);
   if(curLeader&&!prevLeader)out[idx]=x;
   continue;
  }
  if(text)textIndex.set(text,out.length);
  out.push(x);
 }
 return out;
}
async function load(){
 const r=await fetch(API+"?view=state&t="+Date.now(),{cache:"no-store"});
 const d=await r.json();if(!r.ok||!d?.ok)throw new Error(d?.error||"No se pudo leer TTendencias");
 const requests=d.requests?.requests||[];
 const sorted=[...(d.explained?.items||[])]
   .map((x,_sourceOrder)=>({...x,_sourceOrder}))
   .filter(x=>x.status!=="grouped"&&String(x.explanation||"").trim())
   .sort((a,b)=>{
     const ta=Date.parse(a.explained_at||""),tb=Date.parse(b.explained_at||"");
     const va=Number.isFinite(ta),vb=Number.isFinite(tb);
     if(va&&vb&&ta!==tb)return tb-ta;
     if(va!==vb)return vb?1:-1;
     // Históricos sin explained_at válido: conservar un fallback determinista
     // basado en el orden de persistencia, mostrando primero los más recientes.
     return Number(b._sourceOrder||0)-Number(a._sourceOrder||0);
   });
 const archived=localArchived();
 allItems=collapseVisibleExplained(sorted)
   .map(x=>({...x,_rank:rankFor(x,requests)}))
   .map(x=>archived.has(x.copy_key)?({...x,copied:true,copy_source:x.copy_source||"local-archive-guard"}):x);
 // Cuando el servidor ya confirma el archivado, mantener solo claves todavía
 // útiles como protección frente a restauraciones/cachés móviles.
 const confirmed=new Set(allItems.filter(x=>x.copied&&x.copy_source!=="local-archive-guard").map(x=>x.copy_key));
 if(confirmed.size){const next=localArchived();for(const key of confirmed)next.delete(key);saveLocalArchived(next)}
 render();
}
$("filter").addEventListener("input",render);
$("refresh").onclick=()=>load().catch(e=>alert(e.message));
window.addEventListener("pageshow",event=>{if(event.persisted)load().catch(()=>{})});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load().catch(()=>{})});
load().catch(e=>{$("pendingList").innerHTML='<div class="empty">'+e.message+'</div>';$("historyList").innerHTML='';});
</script>
</body></html>
