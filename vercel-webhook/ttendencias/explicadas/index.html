rap}.rating-star{width:37px;height:37px;border:1px solid #455268;background:#1a2635;color:#97a9c1;font-size:24px;border-radius:9px;cursor:pointer;line-height:1}.rating-star.filled{color:#ffce69;border-color:#997441;background:#342918}.rating-star[aria-pressed="true"]{outline:2px solid #ffce69;outline-offset:1px}.rating-star:disabled{opacity:.55;cursor:wait}.rating-hint{color:#96a8bf;font-size:11px;margin-left:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #34445b;background:#18212f;color:#dce7f7;border-radius:10px;padding:8px 10px;font-weight:760;text-decoration:none}.empty{text-align:center;color:#9aa6b7;padding:50px 10px}.section{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#7f8b9c;margin:18px 2px 8px}.top{padding:8px max(8px,env(safe-area-inset-left));display:block}.nav3{width:100%;max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.navbtn{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:40px;padding:8px 5px;border:1px solid #303846;background:#141a24;color:#dce7f7;border-radius:10px;text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}.navbtn.active{border-color:#5e789d;background:#202a39;color:#fff}.navbtn.pending{border-color:#347fb9;background:#103150;color:#b9e1ff}.navbtn.pending.active{background:#174d79;border-color:#64b6f2;color:#fff}.navBadge{display:none;margin-left:5px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#ffcf5d;color:#17120a;align-items:center;justify-content:center;font-size:11px;font-weight:900}.navBadge.show{display:inline-flex}.collapsedCard{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 12px}.collapsedInfo{min-width:0}.collapsedName{font-size:15px;font-weight:820;line-height:1.25;overflow-wrap:anywhere}.collapsedImageStatus{margin-top:6px;font-size:12px;font-weight:720;line-height:1.3;color:#94a3b8}.collapsedImageStatus.ready{color:#9ee6b8}.collapsedImageStatus.pending{color:#9fd7ff}.collapsedImageStatus.failed{color:#ffadb5}.collapsedImageStatus.requested{color:#ff7f8b}.collapsedImageStatus.fallback{color:#ffd978}.openPending{min-width:82px;text-align:center;justify-self:end}.imageControl{display:flex;align-items:center;justify-content:space-between;gap:9px;border:1px solid #354255;background:#101721;border-radius:13px;padding:10px 11px;margin:0 0 12px}.imageControlMain{min-width:0}.imageControl strong{display:block;font-size:13px}.imageControlState{font-size:11px;color:#8f9bad;margin-top:3px;line-height:1.35}.imageControlState.running{color:#ffc178}.imageControlState.done{color:#8ee6a8}.imageControl .btn:disabled{opacity:.45}

<script>
const API="/api/ttendencias-control", RUN_API="/api/ttendencias-run";
const IMAGE_RUN_RAW="https://raw.githubusercontent.com/fabricelop/europapress-rss/control/ttendencias-run-trigger/trends/image-runs/jobs/";
const $=id=>document.getElementById(id);
const ARCHIVED_LOCAL_KEY="ttendencias-explicadas-archived-v1";
function localArchived(){try{return new Set(JSON.parse(localStorage.getItem(ARCHIVED_LOCAL_KEY)||"[]"))}catch(_){return new Set()}}
function saveLocalArchived(set){try{localStorage.setItem(ARCHIVED_LOCAL_KEY,JSON.stringify([...set].slice(-300)))}catch(_){}}
let allItems=[];let openPendingKey=null;let imageRuns=new Map(),imageRunPoll=null;let lastRenderFingerprint="";
async function updateUnreadBadge(){
 const unread=allItems.filter(x=>!x.copied).length;
 const badge=$("navPendingBadge");if(badge){badge.textContent=unread>99?"99+":String(unread);badge.classList.toggle("show",unread>0)}
 try{
   if(unread&&"setAppBadge" in navigator)await navigator.setAppBadge(unread);
   else if(!unread&&"clearAppBadge" in navigator)await navigator.clearAppBadge();
 }catch(_){}
 document.title=(unread?"("+unread+") ":"")+"TTendencias · Pendientes";
}
function nrm(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase("es-ES").replace(/\s+/g," ").trim()}
function fmt(v){if(!v)return "";const d=new Date(v);return Number.isNaN(d.getTime())?"":new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Madrid",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d)}
function displayName(x){
 if(String(x.group_title||"").trim())return String(x.group_title).trim();
 if(Array.isArray(x.trend_names)&&x.trend_names.length>1)return x.trend_names.join(" · ");
 return x.name||x.display_name||x.term_normalized||"Tendencia"
}
function groupRankLabel(x){
 const ctx=(Array.isArray(x.trend_context)?x.trend_context:[])
   .filter(t=>t&&t.name)
   .sort((a,b)=>Number(a.rank||99)-Number(b.rank||99));
 if(ctx.length>1){const leader=Number(x._rank)||Number(ctx[0].rank);return (leader>=1&&leader<=20?"TT#"+leader+" ":"")+(x.name||displayName(x))+" · "+ctx.length+" tendencias";}
 const rank=Number(x._rank),name=displayName(x);
 return (rank>=1&&rank<=20?"TT#"+rank+" ":"")+name
}
function routeLabel(x){
 const r=String(x.news_disposition||x.ttittulares_route||"");
 if(r==="processing")return "→ TTiTTulares · En elaboración";
 if(r==="candidate")return "→ TTiTTulares · Tendencias";
 if(r==="ignored")return "Sin noticia derivada";
 return "";
}
function rankFor(x,requests){
 const direct=Number(x.rank_at_explanation);
 if(Number.isFinite(direct)&&direct>=1&&direct<=20)return direct;
 const target=Date.parse(x.explained_at||"");
 const rows=(requests||[]).filter(r=>nrm(r.name)===nrm(displayName(x))&&Number.isFinite(Number(r.rank)));
 rows.sort((a,b)=>{
   const ad=Date.parse(a.explained_at||a.requested_at||""),bd=Date.parse(b.explained_at||b.requested_at||"");
   const da=Number.isFinite(target)&&Number.isFinite(ad)?Math.abs(ad-target):Number.MAX_SAFE_INTEGER;
   const db=Number.isFinite(target)&&Number.isFinite(bd)?Math.abs(bd-target):Number.MAX_SAFE_INTEGER;
   return da-db;
 });
 const fallback=Number(rows[0]?.rank);
 return Number.isFinite(fallback)&&fallback>=1&&fallback<=20?fallback:null;
}
function hasTweetReadyFormat(x){
 const content=String(x.explanation||"").trim();
 if(/^TT#(?:0|[1-9]|1[0-9]|20)\s+\S/u.test(content))return true; // Legacy TT#0: never duplicate header.
 return Boolean(x.tremending_origin && /^(?:TT 🗯️ )?.{2,65} es tendencia (?:por|porque)\b/iu.test(content));
}
function tweetBody(x){
 const full=String(x.explanation||"").trim();
 const closer=String(x.closer_text||"").trim();
 // Dar una guindilla también al histórico sin cambiar sus valoraciones guardadas.
 if(!closer||closer.startsWith("🌶️")||!full.endsWith(closer))return full;
 const candidate=full.slice(0,-closer.length)+"🌶️ "+closer;
 const heading=hasTweetReadyFormat(x)?"":groupRankLabel(x)+"\n\n";
 // Incluye el encabezado legado en el presupuesto total si sigue utilizándose.
 return [...(heading+candidate)].length<280?candidate:full;
}
function copyText(x){
 const value=tweetBody(x);
 return hasTweetReadyFormat(x)?value:groupRankLabel(x)+"\n\n"+value;
}
function displayedExplanation(x){
 // TT#N ya viene dentro del tuit nuevo: conservar la cadena completa.
 return tweetBody(x);
}
function splitExplainedText(x){
 const full=displayedExplanation(x),closer=String(x.closer_text||"").trim();
 if(!closer||!full.endsWith(closer))return {fact:full,closer:""};
 let fact=full.slice(0,-closer.length).trimEnd();
 if(fact.endsWith("🌶️"))fact=fact.slice(0,-"🌶️".length).trimEnd();
 if(!fact)return {fact:full,closer:""};
 return {fact,closer:closer.startsWith("🌶️")?closer:"🌶️ "+closer};
}
async function copyItem(x,button){
 try{
   await navigator.clipboard.writeText(copyText(x));
   const old=button.textContent;button.textContent="Copiado ✓";
   setTimeout(()=>button.textContent=old,1400);
 }catch(error){alert(error?.message||"No se pudo copiar el tuit.")}
}
async function markExplainedDone(x,button){
 const controlToken=localStorage.getItem("ttendencias-control-token")||"";
 if(!controlToken){alert("Guarda primero el token de control desde Ajustes en la pantalla principal.");return}
 const oldCopied=Boolean(x.copied),oldCopiedAt=x.copied_at||null;
 const archived=localArchived();archived.add(x.copy_key);saveLocalArchived(archived);
 x.copied=true;x.copied_at=new Date().toISOString();openPendingKey=null;
 updateUnreadBadge();render();
 try{
   const response=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+controlToken},body:JSON.stringify({action:"archive-explained",copy_key:x.copy_key})});
   const result=await response.json();
   if(!response.ok||!result?.ok)throw new Error(result?.error||"No se pudo pasar la tendencia al histórico.");
   x.copied_at=result.copied_at||x.copied_at;
 }catch(error){
   x.copied=oldCopied;x.copied_at=oldCopiedAt;
   const rollback=localArchived();rollback.delete(x.copy_key);saveLocalArchived(rollback);
   updateUnreadBadge();render();
   alert(error?.message||"No se pudo pasar la tendencia al histórico.");
 }
}
async function copyImageUrl(url,button){
 const previous=button.textContent;button.disabled=true;button.textContent="Copiando…";
 try{
   if(!navigator.clipboard?.write||typeof ClipboardItem==="undefined")throw Error("El navegador no admite copiar imágenes.");
   const rr=await fetch(API+"?view=image-proxy&format=png&url="+encodeURIComponent(url),{cache:"no-store"});
   if(!rr.ok)throw Error("No se pudo recuperar la imagen.");
   await navigator.clipboard.write([new ClipboardItem({"image/png":await rr.blob()})]);
   button.textContent="Copiada ✓";setTimeout(()=>button.textContent=previous,1400);
 }catch(error){button.textContent=previous;alert(error.message||"No se pudo copiar la imagen.");}
 finally{button.disabled=false}
}
function openTweetUrl(x){return "https://twitter.com/intent/tweet?text="+encodeURIComponent(copyText(x))}

let reexplainItem=null;
function openReexplain(x){
 const controlToken=localStorage.getItem("ttendencias-control-token")||"";
 if(!controlToken){alert("Guarda primero el token de control desde Ajustes en la pantalla principal.");return}
 reexplainItem=x;
 $("reexplainName").textContent=displayName(x);
 $("reexplainText").value="";
 $("reexplainDialog").showModal();
 setTimeout(()=>$("reexplainText").focus(),30);
}
async function sendReexplain(){
 const x=reexplainItem;if(!x)return;
 const instruction=$("reexplainText").value.trim();
 if(!instruction){alert("Escribe primero tu explicación o el contexto que quieres que se reevalúe.");return}
 const controlToken=localStorage.getItem("ttendencias-control-token")||"";
 const button=$("sendReexplain"),old=button.textContent;button.disabled=true;button.textContent="Reevaluando…";
 try{
   const response=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+controlToken},body:JSON.stringify({
     action:"rework",names:[x.name||displayName(x)],instruction,with_image:false,reexplain_only:true
   })});
   const result=await response.json();
   if(!response.ok||!result?.ok)throw new Error(result?.error||"No se pudo solicitar la reevaluación.");
   x.rewrite_pending=true;
   $("reexplainDialog").close();reexplainItem=null;render();
   setTimeout(()=>load().catch(()=>{}),700);
 }catch(error){alert(error?.message||"No se pudo solicitar la reevaluación.")}
 finally{button.disabled=false;button.textContent=old}
}
async function imageDecision(x,action,button){
 const controlToken=localStorage.getItem("ttendencias-control-token")||"";
 if(!controlToken){alert("Guarda primero el token de control desde Ajustes en la pantalla principal.");return}
 const old=button.textContent;button.disabled=true;button.textContent=action==="regenerate-image"?"Solicitando…":"Cambiando…";
 try{
  const response=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+controlToken},body:JSON.stringify({action,names:[x.name||displayName(x)]})});
  const result=await response.json();
  if(!response.ok||!result?.ok)throw new Error(result?.error||"No se pudo guardar la decisión de imagen.");
  button.textContent=action==="regenerate-image"?"Rehacer solicitado ✓":"Usando archivo ✓";
  if(action==="regenerate-image")x.ai_image_regenerate_requested=true;
  if(action==="use-fallback-image"&&x.fallback_image?.url){x.image={...x.fallback_image};x.image_choice="fallback";x.image_status="ready";}
  setTimeout(()=>load().catch(e=>alert(e.message)),500);
 }catch(error){button.textContent=old;button.disabled=false;alert(error?.message||"No se pudo guardar la decisión de imagen.");}
}

function explicitAiBlockReason(x){
 if(!x||x.tremending_origin)return "tremending";
 return String(x.ai_image_block_reason||x.image_block_reason||"").trim()
}
function normalAiEligible(x){
 if(!x||x.copied||x.tremending_origin||!Boolean(String(x.id||"")))return false;
 return !explicitAiBlockReason(x)
}
function imageHandoffTimedOut(run){
 const st=String(run?.status||"").toUpperCase(),phase=String(run?.phase||"").toLowerCase();
 if(st!=="RUNNING"||!["pc_pickup","pc_launch"].includes(phase))return false;
 const at=Date.parse(run?.updated_at||run?.pc_launched_at||run?.pc_picked_up_at||"");
 return Number.isFinite(at)&&Date.now()-at>=45000
}
function imageGenerationTimedOut(run){
 const st=String(run?.status||"").toUpperCase();
 if(!["RUNNING","GENERATING","PERSISTING"].includes(st)||imageHandoffTimedOut(run))return false;
 const at=Date.parse(run?.updated_at||"");
 return Number.isFinite(at)&&Date.now()-at>=150000
}
function imageRunActive(run){
 const st=String(run?.status||"").toUpperCase();
 if(st==="REQUESTED")return true;
 if(imageHandoffTimedOut(run)||imageGenerationTimedOut(run))return false;
 return ["RUNNING","GENERATING","PERSISTING"].includes(st)
}
function liveImageRunState(x){
 const run=imageRuns.get(String(x.id||"")),st=String(run?.status||"").toUpperCase(),phase=String(run?.phase||"");
 if(st==="REQUESTED")return {aiCls:"aiRework",collapsed:"requested",text:"◷ IA solicitada · esperando al PC"};
 if(imageHandoffTimedOut(run))return {aiCls:"aiFailed",collapsed:"failed",text:"✕ El chat IA no arrancó en 45 s · Rehacer"};
 if(imageGenerationTimedOut(run))return {aiCls:"aiFailed",collapsed:"failed",text:"✕ La generación superó 150 s · Rehacer"};
 if(st==="RUNNING")return {aiCls:"aiPending",collapsed:"pending",text:phase==="pc_pickup"?"● PC ha recogido la imagen":phase==="pc_launch"?"● Chat IA abierto · esperando respuesta":phase==="validating"?"● Chat IA abierto · validando":"● Chat IA abierto"};
 if(st==="GENERATING")return {aiCls:"aiPending",collapsed:"pending",text:"● Generando IA ahora en ChatGPT"};
 if(st==="PERSISTING")return {aiCls:"aiPending",collapsed:"pending",text:"● IA generada · guardando"};
 if(st==="ERROR")return {aiCls:"aiFailed",collapsed:"failed",text:"✕ Error en generación IA · pulsa Rehacer"};
 if(st==="CANCELLED")return {aiCls:"aiFailed",collapsed:"failed",text:"— Generación cancelada · entrada ya no vigente"};
 if(st==="DONE")return {aiCls:"aiReady",collapsed:"ready",text:"✓ Generación IA terminada"};
 return null
}
function pendingImageItems(){
 return allItems.filter(x=>{
   if(!normalAiEligible(x))return false;
   const ai=isChatImageGen(x.ai_image)?x.ai_image:{},hasAi=Boolean(String(ai.url||""));
   if(x.ai_image_regenerate_requested)return true;
   return !hasAi
 })
}
function updateImageControl(){
 const candidates=pendingImageItems();
 const active=candidates.filter(x=>imageRunActive(imageRuns.get(String(x.id||"")))).length;
 const pending=candidates.filter(x=>!imageRunActive(imageRuns.get(String(x.id||"")))).length;
 const btn=$("runImages"),head=$("imageHeadline"),state=$("imageState");
 if(!btn||!head||!state)return;
 btn.textContent="✨ Imágenes IA"+(pending?" ("+pending+")":"");
 btn.disabled=pending===0;
 head.textContent=active?("Imágenes IA · "+active+" en curso"):"Imágenes IA";
 state.textContent=active?(active+" generándose en paralelo · "+pending+" en cola · máximo 4 simultáneas"):(pending?pending+" pendiente"+(pending===1?"":"s")+" de generar":"Sin imágenes IA pendientes");
 state.className="imageControlState "+(active||pending?"running":"done")
}
async function markImageRegenerate(x){
 const controlToken=localStorage.getItem("ttendencias-control-token")||"";
 if(!controlToken)throw new Error("Guarda primero el token de control desde Ajustes.");
 const response=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+controlToken},body:JSON.stringify({action:"regenerate-image",names:[x.name||displayName(x)]})});
 const result=await response.json().catch(()=>({}));
 if(!response.ok||!result?.ok)throw new Error(result?.error||"No se pudo solicitar la regeneración.");
 x.ai_image_regenerate_requested=true
}
async function requestImageRun(x,{markRegenerate=false,silent=false}={}){
 const controlToken=localStorage.getItem("ttendencias-control-token")||"";
 if(!controlToken){if(!silent)alert("Guarda primero el token de control desde Ajustes en la pantalla principal.");throw new Error("Falta acceso")}
 const id=String(x.id||"");if(!id)throw new Error("La tendencia no tiene id");
 if(imageRunActive(imageRuns.get(id))){if(!silent)alert("Esa imagen ya se está generando.");return false}
 const hasAi=Boolean(String((isChatImageGen(x.ai_image)?x.ai_image:{}).url||""));
 if((markRegenerate||!hasAi)&&!x.ai_image_regenerate_requested)await markImageRegenerate(x);
 const response=await fetch(RUN_API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+controlToken},body:JSON.stringify({
   task:"images",target_id:id,id,target_name:x.name||displayName(x),revision:Number(x.revision||0)
 })});
 const result=await response.json().catch(()=>({}));
 if(response.status===409&&result.error==="image_run_in_progress"){if(!silent)alert("Esa imagen ya tiene un chat en curso.");return false}
 if(!response.ok||!result?.ok)throw new Error(result?.error||"No se pudo solicitar la imagen IA.");
 imageRuns.set(id,{...result,status:"REQUESTED",phase:"queued",updated_at:result.requested_at});
 render();updateImageControl();scheduleImageRunPoll(true);
 if(!silent)alert("Imagen IA enviada a un chat independiente.");
 return true
}
async function requestPendingImages(){
 const items=pendingImageItems().filter(x=>!imageRunActive(imageRuns.get(String(x.id||""))));
 if(!items.length){alert("No hay imágenes IA pendientes.");return}
 if(!confirm("¿Lanzar "+items.length+" imagen"+(items.length===1?"":"es")+" IA? Se abrirán chats independientes y hasta 4 generarán en paralelo."))return;
 $("runImages").disabled=true;let ok=0,errors=0;
 for(const x of items){try{if(await requestImageRun(x,{silent:true}))ok++}catch(_){errors++}}
 updateImageControl();
 alert(errors?(ok+" solicitadas · "+errors+" con error"):(ok+" imagen"+(ok===1?"":"es")+" solicitada"+(ok===1?"":"s")))
}
function scheduleImageRunPoll(fast){clearTimeout(imageRunPoll);imageRunPoll=setTimeout(refreshImageRuns,fast?4000:15000)}
async function refreshImageRuns(){
 const pendingSet=new Set(pendingImageItems().map(x=>String(x.id||"")));
 const items=allItems.filter(normalAiEligible).filter(x=>pendingSet.has(String(x.id||""))||imageRuns.has(String(x.id||"")));
 let changed=false,terminal=false;
 await Promise.all(items.map(async x=>{
   const id=String(x.id||""),before=imageRuns.get(id);
   try{
     const r=await fetch(IMAGE_RUN_RAW+encodeURIComponent(id)+".json?t="+Date.now(),{cache:"no-store"});
     if(!r.ok){if(r.status===404&&before){imageRuns.delete(id);changed=true}return}
     const d=await r.json();
     if(JSON.stringify(before||null)!==JSON.stringify(d)){
       imageRuns.set(id,d);changed=true;
       if(["DONE","ERROR","CANCELLED"].includes(String(d.status||"").toUpperCase()))terminal=true
     }
   }catch(_){}
 }));
 if(changed)render();else updateImageControl();
 scheduleImageRunPoll([...imageRuns.values()].some(imageRunActive));
 if(terminal)load().catch(()=>{})
}

function isChatImageGen(image){
 const guard=image?.context_guard||{};
 return image?.generated===true&&image?.provider==="chat-imagegen"&&image?.origin==="executing_chat"&&Number(guard.version)===3&&guard.scope==="current_item_only";
}
function collapsedImageState(x){
 const rawAi=x.ai_image||{},ai=isChatImageGen(rawAi)?rawAi:{},fallback=x.fallback_image||{},selected=x.image||{};
 const aiUrl=String(ai.url||""),fallbackUrl=String(fallback.url||""),selectedUrl=String(selected.url||"");
 const aiRaw=String(x.ai_image_status||"").toLowerCase();
 const aiRegenerating=Boolean(x.ai_image_regenerate_requested),aiRegenerationError=String(x.ai_image_regeneration_error||"");

 const live=liveImageRunState(x);
 if(x.tremending_origin){
   if(/^https:\/\//i.test(selectedUrl)||/^https:\/\//i.test(fallbackUrl))return {text:"✓ Imagen del tuit lista",cls:"ready"};
   return {text:"— Imagen del tuit no disponible",cls:"failed"};
 }
 if(live&&(imageRunActive(imageRuns.get(String(x.id||"")))||["ERROR","CANCELLED"].includes(String(imageRuns.get(String(x.id||""))?.status||"").toUpperCase())))return {text:live.text+(fallbackUrl?" · archivo disponible":""),cls:live.collapsed};
 if(aiRegenerating)return {text:"↻ Nueva IA solicitada"+(fallbackUrl?" · archivo disponible":""),cls:"requested"};
 if(aiRegenerationError)return {text:"◷ Pendiente IA · fallo anterior"+(fallbackUrl?" · archivo disponible":""),cls:"pending"};
 if(/^https:\/\//i.test(aiUrl))return {text:"✓ IA lista"+(fallbackUrl?" · archivo disponible":""),cls:"ready"};
 if(["pending","started","tool_called"].includes(aiRaw))return {text:"● IA pendiente/generándose"+(fallbackUrl?" · archivo disponible":""),cls:"pending"};
 if(["failed","none","error","disabled",""].includes(aiRaw))return {text:"◷ Pendiente IA"+(["failed","error"].includes(aiRaw)?" · fallo anterior":"")+(fallbackUrl?" · archivo disponible":""),cls:"pending"};
 if(/^https:\/\//i.test(fallbackUrl))return {text:"◷ Pendiente IA · archivo disponible",cls:"pending"};
 return {text:"◷ Pendiente IA",cls:"pending"};
}
function appendImagePreview(host,image,label,badge){
 const url=String(image?.url||"");if(!/^https:\/\//i.test(url))return false;
 const wrap=document.createElement("div");wrap.style.cssText="flex:1 1 260px;min-width:0;border:1px solid #29384a;border-radius:11px;padding:8px;background:#0d131c";
 const title=document.createElement("div");title.style.cssText="display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:800;color:#b9c9dd;margin-bottom:6px";
 title.textContent=label;
 if(badge){const b=document.createElement("span");b.textContent="EN USO";b.style.cssText="color:#ffce69";title.appendChild(b)}
 const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";
 const img=document.createElement("img");img.src=API+"?view=image-proxy&url="+encodeURIComponent(url);img.alt=String(image.alt||label);img.loading="lazy";img.decoding="async";img.referrerPolicy="no-referrer";img.style.cssText="display:block;width:100%;height:auto;max-height:320px;object-fit:contain;border-radius:8px;background:#090d13";
 a.appendChild(img);wrap.append(title,a);
 const source=document.createElement("div");source.style.cssText="font-size:10px;color:#8090a4;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis";source.textContent=String(image.source||label);wrap.appendChild(source);
 host.appendChild(wrap);return true;
}

// Valoración remota, editable y compartida entre dispositivos; nunca en localStorage.
function renderRemateRating(host,x){
 if(!host || !x.rating_key)return;
 let saving=false;
 const draw=()=>{
  host.replaceChildren();
  const label=document.createElement("div");label.className="rating-title";label.textContent="Puntúa el remate";host.appendChild(label);
  // Remate mostrado justo encima: evitar duplicarlo dentro de las estrellas.
  const stars=document.createElement("div");stars.className="rating-stars";
  const current=Number(x.remate_rating)||0;
  for(let n=1;n<=5;n++){
   const star=document.createElement("button");star.type="button";
   star.className="rating-star"+(n<=current?" filled":"");
   star.textContent=n<=current?"★":"☆";
   star.setAttribute("aria-label","Puntuar "+n+" de 5 estrellas");
   star.setAttribute("aria-pressed",String(n===current));
   star.title=n+" de 5";
   star.disabled=saving;
   star.onclick=async()=>{
    if(saving)return;
    const controlToken=localStorage.getItem("ttendencias-control-token")||"";
    if(!controlToken){alert("Guarda primero el token de control desde Ajustes en la pantalla principal.");return}
    saving=true;draw();
    try{
     const response=await fetch(API,{
      method:"POST",
      headers:{"content-type":"application/json","authorization":"Bearer "+controlToken},
      body:JSON.stringify({action:"rate-remate",rating_key:x.rating_key,rating:n}),
     });
     const result=await response.json();
     if(!response.ok||!result?.ok)throw new Error(result?.error||"No se pudo guardar la valoración.");
     x.remate_rating=result.rating;x.remate_rated_at=result.rated_at;
    }catch(error){alert(error?.message||"No se pudo guardar la valoración.")}
    finally{saving=false;draw()}
   };
   stars.appendChild(star);
  }
  const hint=document.createElement("span");hint.className="rating-hint";
  hint.textContent=saving?"Guardando…":current?current+"/5 · Guardado · puedes cambiarlo":"1 = flojo · 5 = genial";
  stars.appendChild(hint);host.appendChild(stars);
 };
 draw();
}
function renderCard(x,pending){
 const card=document.createElement("article");card.className="card";
 const name=displayName(x),route=routeLabel(x),labelled=groupRankLabel(x);
 card.innerHTML='<div class="head"><div class="name"></div><div class="when"></div></div><div class="explanation"></div><div class="closer" hidden></div><div class="aiStatusBadge"></div><div class="imagebox" hidden></div><div class="rating"></div><div class="meta"></div><div class="actions"></div>';
 const heading=card.querySelector(".name");heading.textContent=labelled;if(hasTweetReadyFormat(x))heading.hidden=true;
 card.querySelector(".when").textContent=fmt(x.explained_at);
 const parts=splitExplainedText(x);card.querySelector(".explanation").textContent=parts.fact;
 const closer=card.querySelector(".closer");if(parts.closer){closer.hidden=false;closer.textContent=parts.closer}
 const picture=card.querySelector(".imagebox");
 const rawAi=x.ai_image||{},ai=isChatImageGen(rawAi)?rawAi:{},fallback=x.fallback_image||{};
 const aiUrl=String(ai.url||""),fallbackUrl=String(fallback.url||"");
 const aiRaw=String(x.ai_image_status||"").toLowerCase(),aiRegenerating=Boolean(x.ai_image_regenerate_requested),aiRegenerationError=String(x.ai_image_regeneration_error||"");
 let aiClass="aiNone",aiText="— IA no solicitada";
 if(aiRegenerating){aiClass="aiRework";aiText="↻ Nueva IA solicitada · espera antes de publicar"}
 else if(aiRegenerationError){aiClass="aiPending";aiText="◷ Pendiente IA · fallo anterior"}
 else if(aiUrl){aiClass="aiReady";aiText="✓ IA lista"}
 else if(["failed","none","error","disabled",""].includes(aiRaw)){aiClass="aiPending";aiText="◷ Pendiente IA"+(["failed","error"].includes(aiRaw)?" · fallo anterior":"")}
 else if(["pending","started","tool_called"].includes(aiRaw)){aiClass="aiPending";aiText="● IA pendiente/generándose"}
 const liveRun=liveImageRunState(x);
 if(liveRun&&(imageRunActive(imageRuns.get(String(x.id||"")))||["ERROR","CANCELLED"].includes(String(imageRuns.get(String(x.id||""))?.status||"").toUpperCase()))){aiClass=liveRun.aiCls;aiText=liveRun.text}
 const aiStatus=card.querySelector(".aiStatusBadge");aiStatus.classList.add(aiClass);aiStatus.textContent=aiText+(fallbackUrl?" · archivo disponible":" · sin archivo");
 let imageChoice=String(x.image_choice||"");if(imageChoice==="ai"&&!aiUrl)imageChoice=fallbackUrl?"fallback":"none";
 if(/^https:\/\//i.test(aiUrl)||/^https:\/\//i.test(fallbackUrl)||x.ai_image_status||x.fallback_image_status){
   picture.hidden=false;picture.style.cssText="margin:9px 0 5px;max-width:100%;overflow:hidden";
   const grid=document.createElement("div");grid.style.cssText="display:flex;gap:8px;flex-wrap:wrap";
   appendImagePreview(grid,ai,"Gag IA",imageChoice==="ai");appendImagePreview(grid,fallback,"Archivo / fallback",imageChoice==="fallback");
   if(!grid.children.length){const state=document.createElement("div");state.style.cssText="font-size:11px;color:#94a3b8;padding:8px;border:1px solid #29384a;border-radius:10px;width:100%";state.textContent=x.ai_image_regenerate_requested?"Rehacer solicitado · se intentará una imagen en la próxima pasada.":"Imagen IA/fallback todavía no disponible.";grid.appendChild(state)}
   picture.appendChild(grid);
 }
 const rating=card.querySelector(".rating");if(parts.closer)renderRemateRating(rating,x);else rating.hidden=true;
 const meta=card.querySelector(".meta");if(route){const routeEl=document.createElement("span");routeEl.className="route";routeEl.textContent=route;meta.appendChild(routeEl)}
 const actions=card.querySelector(".actions");
 if(!x.tremending_origin){
   const generate=document.createElement("button");generate.className="btn";generate.type="button";
   const currentAi=isChatImageGen(x.ai_image)?x.ai_image:{},hasAi=Boolean(String(currentAi.url||""));
   generate.textContent="✨ Generar IA";
   generate.disabled=imageRunActive(imageRuns.get(String(x.id||"")));
   generate.onclick=async()=>{
     generate.disabled=true;
     try{await requestImageRun(x,{markRegenerate:hasAi||["failed","none","error"].includes(String(x.ai_image_status||"").toLowerCase())})}
     catch(error){alert(error?.message||"No se pudo solicitar la imagen IA.")}
     finally{generate.disabled=imageRunActive(imageRuns.get(String(x.id||"")))}
   };
   actions.appendChild(generate)
 }
 const reexplain=document.createElement("button");reexplain.className="btn";reexplain.type="button";reexplain.disabled=Boolean(x.rewrite_pending);reexplain.textContent=x.rewrite_pending?"Reevaluando…":"📝 Reexplicar";reexplain.onclick=()=>openReexplain(x);actions.appendChild(reexplain);
 const copy=document.createElement("button");copy.className="btn";copy.type="button";copy.textContent="📋 Copiar tuit";copy.onclick=()=>copyItem(x,copy);actions.appendChild(copy);
 if(/^https:\/\//i.test(aiUrl)){const b=document.createElement("button");b.className="btn";b.type="button";b.textContent="✨ Copiar imagen IA";b.onclick=()=>copyImageUrl(aiUrl,b);actions.appendChild(b)}
 if(/^https:\/\//i.test(fallbackUrl)){const b=document.createElement("button");b.className="btn";b.type="button";b.textContent="🖼️ Copiar imagen archivo";b.onclick=()=>copyImageUrl(fallbackUrl,b);actions.appendChild(b)}
 const open=document.createElement("a");open.className="btn";open.target="_blank";open.rel="noopener noreferrer";open.href=openTweetUrl(x);open.textContent="↗ Abrir en X";actions.appendChild(open);
 const search=document.createElement("a");search.className="btn";search.target="_blank";search.rel="noopener noreferrer";const searchNames=(Array.isArray(x.trend_names)&&x.trend_names.length?x.trend_names:[name]).join(" ");search.href="https://x.com/search?q="+encodeURIComponent(searchNames)+"&src=typed_query&f=live";search.textContent="🔎 Buscar en X";actions.appendChild(search);
 if(pending){const done=document.createElement("button");done.className="btn";done.type="button";done.textContent="✓ Ya explicado";done.onclick=()=>markExplainedDone(x,done);actions.appendChild(done)}
 return card
}
function pendingKey(x){return String(x.id||x.name||"")+":r"+String(x.revision||0)}
function renderCollapsedPending(x){
 const card=document.createElement("article");card.className="card collapsedCard";
 const info=document.createElement("div");info.className="collapsedInfo";
 const name=document.createElement("div");name.className="collapsedName";name.textContent=displayName(x);
 const imageState=collapsedImageState(x);
 const status=document.createElement("div");status.className="collapsedImageStatus "+imageState.cls;status.textContent=imageState.text;
 info.append(name,status);
 const open=document.createElement("button");open.className="btn openPending";open.type="button";open.textContent=x.rewrite_pending?"Reelaborando…":"Abrir";
 open.disabled=Boolean(x.rewrite_pending);
 open.onclick=()=>{if(x.rewrite_pending)return;openPendingKey=pendingKey(x);render()};
 card.append(info,open);return card;
}
function renderExpandedPending(x){
 const card=renderCard(x,true);
 const close=document.createElement("button");close.className="btn";close.type="button";close.textContent="Cerrar";
 close.onclick=()=>{openPendingKey=null;render()};
 const actions=card.querySelector(".actions");if(actions)actions.prepend(close);
 return card;
}
function render(){
 const q=nrm($("filter").value);
 const visible=q?allItems.filter(x=>nrm(displayName(x)).includes(q)||nrm((x.trend_names||[]).join(" ")).includes(q)||nrm(x.explanation).includes(q)):allItems;
 const pendingAll=allItems.filter(x=>!x.copied),pending=visible.filter(x=>!x.copied);
 $("pendingCount").textContent=String(pending.length);updateUnreadBadge();updateImageControl();
 if(openPendingKey&&!pending.some(x=>pendingKey(x)===openPendingKey))openPendingKey=null;
 const pendingList=$("pendingList");pendingList.innerHTML="";
 if(!pending.length)pendingList.innerHTML='<div class="empty">'+(q?"No hay pendientes que coincidan.":"No tienes tendencias pendientes de publicar.")+'</div>';
 else for(const x of pending)pendingList.appendChild(pendingKey(x)===openPendingKey?renderExpandedPending(x):renderCollapsedPending(x));
}
function collapseVisibleExplained(rows){
 const seenIds=new Set(),textIndex=new Map(),out=[];
 for(const x of rows){
  const id=String(x.id||"").trim();
  const text=nrm(x.explanation);
  // Una revisión anterior del mismo item nunca debe crear otra tarjeta visible.
  if(id&&seenIds.has(id))continue;
  if(id)seenIds.add(id);
  // Si dos miembros de un grupo guardaron exactamente la misma explicación,
  // conserva una sola tarjeta y prefiere el líder real del grupo.
  if(text&&textIndex.has(text)){
   const idx=textIndex.get(text),prev=out[idx];
   const prevLeader=String(prev?.group_leader_id||"")&&String(prev?.id||"")===String(prev.group_leader_id);
   const curLeader=String(x.group_leader_id||"")&&String(x.id||"")===String(x.group_leader_id);
   if(curLeader&&!prevLeader)out[idx]=x;
   continue;
  }
  if(text)textIndex.set(text,out.length);
  out.push(x);
 }
 return out;
}
async function load(){
 const r=await fetch(API+"?view=state&t="+Date.now(),{cache:"no-store"});
 const d=await r.json();if(!r.ok||!d?.ok)throw new Error(d?.error||"No se pudo leer TTendencias");
 const requests=d.requests?.requests||[];
 const sorted=[...(d.explained?.items||[])]
   .map((x,_sourceOrder)=>({...x,_sourceOrder}))
   .filter(x=>x.status!=="grouped"&&String(x.explanation||"").trim())
   .sort((a,b)=>{
     const ta=Date.parse(a.explained_at||""),tb=Date.parse(b.explained_at||"");
     const va=Number.isFinite(ta),vb=Number.isFinite(tb);
     if(va&&vb&&ta!==tb)return tb-ta;
     if(va!==vb)return vb?1:-1;
     // Históricos sin explained_at válido: conservar un fallback determinista
     // basado en el orden de persistencia, mostrando primero los más recientes.
     return Number(b._sourceOrder||0)-Number(a._sourceOrder||0);
   });
 const archived=localArchived();
 const nextItems=collapseVisibleExplained(sorted)
   .map(x=>({...x,_rank:rankFor(x,requests)}))
   .map(x=>archived.has(x.copy_key)?({...x,copied:true,copy_source:x.copy_source||"local-archive-guard"}):x);
 // Evitar reconstruir las tarjetas (y recargar las imágenes) cada 15 s si no cambió nada.
 const fingerprint=JSON.stringify(nextItems);
 const changed=fingerprint!==lastRenderFingerprint;
 allItems=nextItems;
 if(changed){lastRenderFingerprint=fingerprint;render()}
 else{updateUnreadBadge();updateImageControl()}
 // Cuando el servidor ya confirma el archivado, mantener solo claves todavía
 // útiles como protección frente a restauraciones/cachés móviles.
 const confirmed=new Set(allItems.filter(x=>x.copied&&x.copy_source!=="local-archive-guard").map(x=>x.copy_key));
 if(confirmed.size){const next=localArchived();for(const key of confirmed)next.delete(key);saveLocalArchived(next)}
 refreshImageRuns();
}
$("filter").addEventListener("input",render);
$("runImages").onclick=requestPendingImages;
$("cancelReexplain").onclick=()=>{$("reexplainDialog").close();reexplainItem=null};
$("sendReexplain").onclick=sendReexplain;
const refreshBtn=$("refresh");if(refreshBtn)refreshBtn.onclick=()=>load().catch(e=>alert(e.message));
window.addEventListener("pageshow",event=>{if(event.persisted)load().catch(()=>{})});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load().catch(()=>{})});
load().catch(e=>{$("pendingList").innerHTML='<div class="empty">'+e.message+'</div>';});
setInterval(()=>{if(!document.hidden)load().catch(()=>{})},15000);
</script>
