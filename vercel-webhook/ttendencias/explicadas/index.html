<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>TTendencias · Explicadas</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0e14;color:#eef2f8}
*{box-sizing:border-box}body{margin:0;background:#0b0e14;min-height:100vh}button,a{font:inherit}
.top{position:sticky;top:0;z-index:20;background:#0b0e14ee;backdrop-filter:blur(14px);border-bottom:1px solid #252b36;padding:13px max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px}.back{color:#89b8ff;text-decoration:none;font-weight:750}.title{font-weight:850;font-size:18px}.spacer{flex:1}.count{font-size:12px;color:#9ba7b8;border:1px solid #303846;border-radius:999px;padding:6px 9px}.iconbtn{border:1px solid #303846;background:#141a24;color:#edf3ff;border-radius:10px;padding:8px 10px;font-weight:750}
main{max-width:820px;margin:auto;padding:14px 10px 40px}.intro{color:#91a0b4;font-size:12px;line-height:1.5;margin:0 2px 14px}.list{display:grid;gap:9px}.card{background:#11161e;border:1px solid #29313d;border-radius:15px;padding:13px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-size:16px;font-weight:820}.when{font-size:11px;color:#7f8b9c;white-space:nowrap}.explanation{font-size:14px;line-height:1.48;color:#d7e0ec;margin:9px 0 10px}.meta{font-size:11px;color:#8795a8;margin-top:5px}.route{display:inline-block;border:1px solid #39526f;background:#152235;color:#bcd5f3;border-radius:999px;padding:4px 8px;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #34445b;background:#18212f;color:#dce7f7;border-radius:10px;padding:8px 10px;font-weight:760;text-decoration:none}.empty{text-align:center;color:#9aa6b7;padding:50px 10px}.section{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#7f8b9c;margin:18px 2px 8px}
</style>
</head>
<body>
<header class="top"><a class="back" href="/ttendencias/">‹ Top 10</a><div class="title">Explicadas</div><div class="spacer"></div><button class="iconbtn" id="refresh">↻</button><div class="count" id="count">0</div></header>
<main>
<p class="intro">Aquí se guarda por qué ha sido tendencia cada término. TTendencias ya no prepara tuits ni imágenes: las posibles noticias se derivan a TTiTTulares.</p>
<div class="section">Más recientes</div>
<section class="list" id="list"><div class="empty">Cargando explicaciones…</div></section>
</main>
<script>
const API="/api/ttendencias-control", $=id=>document.getElementById(id);
function nrm(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase("es-ES").trim()}
function fmt(v){if(!v)return "";const d=new Date(v);return Number.isNaN(d.getTime())?"":new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Madrid",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d)}
function displayName(x){return x.name||x.display_name||x.term_normalized||"Tendencia"}
function routeLabel(x){
 const r=String(x.news_disposition||x.ttittulares_route||"");
 if(r==="processing")return "→ TTiTTulares · En elaboración";
 if(r==="candidate")return "→ TTiTTulares · Tendencias";
 if(r==="ignored")return "Sin noticia derivada";
 return "";
}
async function load(){
 const r=await fetch(API+"?view=state&t="+Date.now(),{cache:"no-store"});
 const d=await r.json();if(!r.ok||!d?.ok)throw new Error(d?.error||"No se pudo leer TTendencias");
 const items=[...(d.explained?.items||[])].filter(x=>String(x.explanation||"").trim()).sort((a,b)=>String(b.explained_at||"").localeCompare(String(a.explained_at||""))).slice(0,150);
 $("count").textContent=String(items.length);
 const list=$("list");list.innerHTML="";
 if(!items.length){list.innerHTML='<div class="empty">Todavía no hay explicaciones guardadas.</div>';return}
 for(const x of items){
  const card=document.createElement("article");card.className="card";
  const name=displayName(x), route=routeLabel(x);
  card.innerHTML='<div class="head"><div class="name"></div><div class="when"></div></div><div class="explanation"></div><div class="meta"></div><div class="actions"></div>';
  card.querySelector(".name").textContent=name;
  card.querySelector(".when").textContent=fmt(x.explained_at);
  card.querySelector(".explanation").textContent=x.explanation;
  const meta=card.querySelector(".meta");
  if(route){const s=document.createElement("span");s.className="route";s.textContent=route;meta.appendChild(s)}
  const actions=card.querySelector(".actions");
  const a=document.createElement("a");a.className="btn";a.target="_blank";a.rel="noopener noreferrer";a.href="https://x.com/search?q="+encodeURIComponent(name)+"&src=typed_query&f=live";a.textContent="Buscar en X";actions.appendChild(a);
  card.dataset.key=nrm(name);
  list.appendChild(card);
 }
}
$("refresh").onclick=()=>load().catch(e=>alert(e.message));
load().catch(e=>{$("list").innerHTML='<div class="empty">'+e.message+'</div>'});
</script>
</body></html>
