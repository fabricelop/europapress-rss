<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>TTendencias · Explicadas</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0e14;color:#eef2f8}
*{box-sizing:border-box}body{margin:0;background:#0b0e14;min-height:100vh}button,a{font:inherit}
.top{position:sticky;top:0;z-index:20;background:#0b0e14ee;backdrop-filter:blur(14px);border-bottom:1px solid #252b36;padding:13px max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px}.back{color:#89b8ff;text-decoration:none;font-weight:750}.title{font-weight:850;font-size:18px}.spacer{flex:1}.count{font-size:12px;color:#9ba7b8;border:1px solid #303846;border-radius:999px;padding:6px 9px}.iconbtn{border:1px solid #303846;background:#141a24;color:#edf3ff;border-radius:10px;padding:8px 10px;font-weight:750}
main{max-width:820px;margin:auto;padding:14px 10px 40px}.filter{width:100%;background:#0d131c;color:#eef2f8;border:1px solid #303b4a;border-radius:12px;padding:11px 12px;font:inherit;margin:0 0 14px;outline:none}.filter:focus{border-color:#5d7da8}.list{display:grid;gap:9px}.card{background:#11161e;border:1px solid #29313d;border-radius:15px;padding:13px;transition:background .18s,border-color .18s}.card.copied{background:#32161a;border-color:#7d343d}.card.copied .name{color:#ffd6da}.card.copied .when{color:#d79aa1}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-size:16px;font-weight:820}.when{font-size:11px;color:#7f8b9c;white-space:nowrap}.explanation{font-size:14px;line-height:1.48;color:#d7e0ec;margin:9px 0 3px;white-space:pre-line}.closer{font-size:14px;line-height:1.48;color:#f0d9b1;margin:9px 0 5px;font-weight:650}.meta{font-size:11px;color:#8795a8;margin-top:5px}.route{display:inline-block;border:1px solid #39526f;background:#152235;color:#bcd5f3;border-radius:999px;padding:4px 8px;margin-top:4px}.rating{margin:10px 0 12px;padding:11px;background:#101a25;border:1px solid #334358;border-radius:11px}.rating-title{font-size:12px;font-weight:800;color:#c8d8ec}.rating-quote{font-size:12px;color:#a8b9ce;margin:5px 0 7px;line-height:1.4}.rating-stars{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.rating-star{width:37px;height:37px;border:1px solid #455268;background:#1a2635;color:#97a9c1;font-size:24px;border-radius:9px;cursor:pointer;line-height:1}.rating-star.filled{color:#ffce69;border-color:#997441;background:#342918}.rating-star[aria-pressed="true"]{outline:2px solid #ffce69;outline-offset:1px}.rating-star:disabled{opacity:.55;cursor:wait}.rating-hint{color:#96a8bf;font-size:11px;margin-left:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #34445b;background:#18212f;color:#dce7f7;border-radius:10px;padding:8px 10px;font-weight:760;text-decoration:none}.empty{text-align:center;color:#9aa6b7;padding:50px 10px}.section{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#7f8b9c;margin:18px 2px 8px}
</style>
</head>
<body>
<header class="top"><a class="back" href="/ttendencias/">‹ Top 10</a><div class="title">Explicadas</div><div class="spacer"></div><button class="iconbtn" id="refresh">↻</button><div class="count" id="count">0</div></header>
<main>
<input class="filter" id="filter" type="search" inputmode="search" autocomplete="off" placeholder="Buscar tendencia en las últimas 100 explicadas…">
<div class="section">Últimas 100 explicadas</div>
<section class="list" id="list"><div class="empty">Cargando explicaciones…</div></section>
</main>
<script>
const API="/api/ttendencias-control", $=id=>document.getElementById(id);
let allItems=[];
async function updateUnreadBadge(){
 const unread=allItems.filter(x=>!x.copied).length;
 try{
   if(unread&&"setAppBadge" in navigator)await navigator.setAppBadge(unread);
   else if(!unread&&"clearAppBadge" in navigator)await navigator.clearAppBadge();
 }catch(_){}
 document.title=(unread?"("+unread+") ":"")+"TTendencias · Explicadas";
}
function nrm(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase("es-ES").replace(/\s+/g," ").trim()}
function fmt(v){if(!v)return "";const d=new Date(v);return Number.isNaN(d.getTime())?"":new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Madrid",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d)}
function displayName(x){
 if(String(x.group_title||"").trim())return String(x.group_title).trim();
 if(Array.isArray(x.trend_names)&&x.trend_names.length>1)return x.trend_names.join(" · ");
 return x.name||x.display_name||x.term_normalized||"Tendencia"
}
function groupRankLabel(x){
 const ctx=(Array.isArray(x.trend_context)?x.trend_context:[])
   .filter(t=>t&&t.name)
   .sort((a,b)=>Number(a.rank||99)-Number(b.rank||99));
 if(ctx.length>1){const leader=Number(x._rank)||Number(ctx[0].rank);return (leader>=1&&leader<=20?"TT#"+leader+" ":"")+(x.name||displayName(x))+" · "+ctx.length+" tendencias";}
 const rank=Number(x._rank),name=displayName(x);
 return (rank>=1&&rank<=20?"TT#"+rank+" ":"")+name
}
function routeLabel(x){
 const r=String(x.news_disposition||x.ttittulares_route||"");
 if(r==="processing")return "→ TTiTTulares · En elaboración";
 if(r==="candidate")return "→ TTiTTulares · Tendencias";
 if(r==="ignored")return "Sin noticia derivada";
 return "";
}
function rankFor(x,requests){
 const direct=Number(x.rank_at_explanation);
 if(Number.isFinite(direct)&&direct>=1&&direct<=20)return direct;
 const target=Date.parse(x.explained_at||"");
 const rows=(requests||[]).filter(r=>nrm(r.name)===nrm(displayName(x))&&Number.isFinite(Number(r.rank)));
 rows.sort((a,b)=>{
   const ad=Date.parse(a.explained_at||a.requested_at||""),bd=Date.parse(b.explained_at||b.requested_at||"");
   const da=Number.isFinite(target)&&Number.isFinite(ad)?Math.abs(ad-target):Number.MAX_SAFE_INTEGER;
   const db=Number.isFinite(target)&&Number.isFinite(bd)?Math.abs(bd-target):Number.MAX_SAFE_INTEGER;
   return da-db;
 });
 const fallback=Number(rows[0]?.rank);
 return Number.isFinite(fallback)&&fallback>=1&&fallback<=20?fallback:null;
}
function hasTweetReadyFormat(x){return /^TT#(?:[1-9]|1[0-9]|20)\s+\S/u.test(String(x.explanation||"").trim())}
function tweetBody(x){
 const full=String(x.explanation||"").trim();
 const closer=String(x.closer_text||"").trim();
 // Dar una guindilla también al histórico sin cambiar sus valoraciones guardadas.
 if(!closer||closer.startsWith("🌶️")||!full.endsWith(closer))return full;
 const candidate=full.slice(0,-closer.length)+"🌶️ "+closer;
 const heading=hasTweetReadyFormat(x)?"":groupRankLabel(x)+"\n\n";
 // Incluye el encabezado legado en el presupuesto total si sigue utilizándose.
 return [...(heading+candidate)].length<280?candidate:full;
}
function copyText(x){
 const value=tweetBody(x);
 return hasTweetReadyFormat(x)?value:groupRankLabel(x)+"\n\n"+value;
}
function displayedExplanation(x){
 // TT#N ya viene dentro del tuit nuevo: conservar la cadena completa.
 return tweetBody(x);
}
function splitExplainedText(x){
 const full=displayedExplanation(x),closer=String(x.closer_text||"").trim();
 if(!closer||!full.endsWith(closer))return {fact:full,closer:""};
 let fact=full.slice(0,-closer.length).trimEnd();
 if(fact.endsWith("🌶️"))fact=fact.slice(0,-"🌶️".length).trimEnd();
 if(!fact)return {fact:full,closer:""};
 return {fact,closer:closer.startsWith("🌶️")?closer:"🌶️ "+closer};
}
async function copyItem(x,button){
 try{
   await navigator.clipboard.writeText(copyText(x));
   const controlToken=localStorage.getItem("ttendencias-control-token")||"";
   if(!controlToken)throw new Error("La explicación se copió, pero falta el token de control para guardar el estado.");
   const response=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+controlToken},body:JSON.stringify({action:"copy-explained",copy_key:x.copy_key})});
   const result=await response.json();
   if(!response.ok||!result?.ok)throw new Error(result?.error||"No se pudo guardar el estado de copiado.");
   x.copied=true;x.copied_at=result.copied_at||new Date().toISOString();
   updateUnreadBadge();
   const card=button.closest(".card");if(card)card.classList.add("copied");
   const old=button.textContent;button.textContent="Copiado ✓";
   setTimeout(()=>button.textContent=old,1400);
 }catch(error){alert(error?.message||"No se pudo copiar y guardar la explicación.")}
}
// Valoración remota, editable y compartida entre dispositivos; nunca en localStorage.
function renderRemateRating(host,x){
 if(!host || !x.rating_key)return;
 let saving=false;
 const draw=()=>{
  host.replaceChildren();
  const label=document.createElement("div");label.className="rating-title";label.textContent="Puntúa el remate";host.appendChild(label);
  // Remate mostrado justo encima: evitar duplicarlo dentro de las estrellas.
  const stars=document.createElement("div");stars.className="rating-stars";
  const current=Number(x.remate_rating)||0;
  for(let n=1;n<=5;n++){
   const star=document.createElement("button");star.type="button";
   star.className="rating-star"+(n<=current?" filled":"");
   star.textContent=n<=current?"★":"☆";
   star.setAttribute("aria-label","Puntuar "+n+" de 5 estrellas");
   star.setAttribute("aria-pressed",String(n===current));
   star.title=n+" de 5";
   star.disabled=saving;
   star.onclick=async()=>{
    if(saving)return;
    const controlToken=localStorage.getItem("ttendencias-control-token")||"";
    if(!controlToken){alert("Guarda primero el token de control desde Ajustes en la pantalla principal.");return}
    saving=true;draw();
    try{
     const response=await fetch(API,{
      method:"POST",
      headers:{"content-type":"application/json","authorization":"Bearer "+controlToken},
      body:JSON.stringify({action:"rate-remate",rating_key:x.rating_key,rating:n}),
     });
     const result=await response.json();
     if(!response.ok||!result?.ok)throw new Error(result?.error||"No se pudo guardar la valoración.");
     x.remate_rating=result.rating;x.remate_rated_at=result.rated_at;
    }catch(error){alert(error?.message||"No se pudo guardar la valoración.")}
    finally{saving=false;draw()}
   };
   stars.appendChild(star);
  }
  const hint=document.createElement("span");hint.className="rating-hint";
  hint.textContent=saving?"Guardando…":current?current+"/5 · Guardado · puedes cambiarlo":"1 = flojo · 5 = genial";
  stars.appendChild(hint);host.appendChild(stars);
 };
 draw();
}
function render(){
 const q=nrm($("filter").value);
 const items=q?allItems.filter(x=>nrm(displayName(x)).includes(q)||nrm((x.trend_names||[]).join(" ")).includes(q)||nrm(x.explanation).includes(q)):allItems;
 $("count").textContent=String(items.filter(x=>!x.copied).length);
 updateUnreadBadge();
 const list=$("list");list.innerHTML="";
 if(!items.length){list.innerHTML='<div class="empty">No hay coincidencias.</div>';return}
 for(const x of items){
  const card=document.createElement("article");card.className="card";
  if(x.copied)card.classList.add("copied");
  const name=displayName(x),route=routeLabel(x);
  const labelled=groupRankLabel(x);
  card.innerHTML='<div class="head"><div class="name"></div><div class="when"></div></div><div class="explanation"></div><div class="closer" hidden></div><div class="rating"></div><div class="meta"></div><div class="actions"></div>';
  const heading=card.querySelector(".name");
  heading.textContent=labelled;
  if(hasTweetReadyFormat(x))heading.hidden=true; // El tuit ya lleva TT#N Nombre.
  card.querySelector(".when").textContent=fmt(x.explained_at);
  const parts=splitExplainedText(x);
  card.querySelector(".explanation").textContent=parts.fact;
  const closer=card.querySelector(".closer");
  if(parts.closer){closer.hidden=false;closer.textContent=parts.closer;}
  const rating=card.querySelector(".rating");
  if(parts.closer)renderRemateRating(rating,x);else rating.hidden=true;
  const meta=card.querySelector(".meta");
  if(route){const s=document.createElement("span");s.className="route";s.textContent=route;meta.appendChild(s)}
  const actions=card.querySelector(".actions");
  const copy=document.createElement("button");copy.className="btn";copy.type="button";copy.textContent="Copiar";copy.onclick=()=>copyItem(x,copy);actions.appendChild(copy);
  const a=document.createElement("a");a.className="btn";a.target="_blank";a.rel="noopener noreferrer";const searchNames=(Array.isArray(x.trend_names)&&x.trend_names.length?x.trend_names:[name]).join(" ");a.href="https://x.com/search?q="+encodeURIComponent(searchNames)+"&src=typed_query&f=live";a.textContent="Buscar en X";actions.appendChild(a);
  list.appendChild(card);
 }
}
async function load(){
 const r=await fetch(API+"?view=state&t="+Date.now(),{cache:"no-store"});
 const d=await r.json();if(!r.ok||!d?.ok)throw new Error(d?.error||"No se pudo leer TTendencias");
 const requests=d.requests?.requests||[];
 allItems=[...(d.explained?.items||[])]
   .filter(x=>x.status!=="grouped"&&String(x.explanation||"").trim())
   .sort((a,b)=>String(b.explained_at||"").localeCompare(String(a.explained_at||"")))
   .slice(0,100)
   .map(x=>({...x,_rank:rankFor(x,requests)}));
 render();
}
$("filter").addEventListener("input",render);
$("refresh").onclick=()=>load().catch(e=>alert(e.message));
load().catch(e=>{$("list").innerHTML='<div class="empty">'+e.message+'</div>'});
</script>
</body></html>
