<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>TTendencias · Tuits listos</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0e14;color:#eef2f8}
*{box-sizing:border-box}body{margin:0;background:#0b0e14;min-height:100vh}button,a{font:inherit}
.top{position:sticky;top:0;z-index:20;background:#0b0e14ee;backdrop-filter:blur(14px);border-bottom:1px solid #252b36;padding:13px max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px}
.back{color:#89b8ff;text-decoration:none;font-weight:750}.title{font-weight:850;font-size:18px}.spacer{flex:1}.count{font-size:12px;color:#9ba7b8;border:1px solid #303846;border-radius:999px;padding:6px 9px}
main{max-width:820px;margin:auto;padding:14px 12px 40px}.empty{text-align:center;color:#9aa6b7;padding:50px 10px}
.card{background:#11161e;border:1px solid #29313d;border-radius:17px;padding:15px;margin-bottom:14px}.trend{font-size:19px;font-weight:850;margin:0 0 8px}.explain{font-size:14px;line-height:1.45;color:#c8d0dc;white-space:pre-wrap;margin-bottom:14px}
.variant{background:#0b1017;border:1px solid #293442;border-radius:13px;padding:12px;margin:9px 0}.variantHead{display:flex;gap:8px;align-items:center;margin-bottom:8px}.variantTitle{font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.04em;color:#9dadc2}.chars{margin-left:auto;font-size:11px;color:#7f8b9c}.tweet{white-space:pre-wrap;font-size:14px;line-height:1.4}.remate{white-space:pre-wrap;font-size:14px;line-height:1.4;color:#e7ecf4}
.actions,.variantActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #34445b;background:#18212f;color:#dce7f7;border-radius:11px;padding:9px 11px;font-weight:760;text-decoration:none;min-height:40px}.btn.primary{background:#18212f;color:#dce7f7;border-color:#34445b}.btn.danger{color:#ff9da6}.btn.rework{color:#c9b5ff}.warning{font-size:12px;color:#f5c451;margin:8px 0}
.sheet{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:flex-end}.sheet.show{display:flex}.panel{width:100%;max-width:600px;margin:0 auto;background:#111720;border:1px solid #354052;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.panel h2{margin:0 0 8px}.panel p{font-size:13px;color:#9eabba}textarea{width:100%;min-height:120px;background:#0a0f16;color:#eef3fa;border:1px solid #364153;border-radius:11px;padding:12px;font:inherit;resize:vertical}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-15px);opacity:0;transition:.2s;background:#1a2330;border:1px solid #3b485b;border-radius:10px;padding:9px 12px;z-index:80}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:560px){main{padding:10px 8px 30px}.card{padding:12px}.trend{font-size:17px}.variant{padding:10px}.actions .btn{flex:1;text-align:center}.variantActions .btn{flex:1;text-align:center}}
</style>
</head>
<body>
<header class="top"><a class="back" href="/ttendencias/">‹ Tendencias</a><div class="title">Tuits listos</div><div class="spacer"></div><div class="count" id="count">0</div></header>
<main id="list"><div class="empty">Cargando…</div></main>
<div class="sheet" id="sheet"><div class="panel"><h2>Rehacer redacción</h2><p id="reworkName"></p><textarea id="instruction" placeholder="Indica qué quieres cambiar: enfoque, explicación, remate, tono, datos a verificar…"></textarea><div class="actions"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="sendRework">Enviar a reelaborar</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const RAW="https://raw.githubusercontent.com/fabricelop/europapress-rss/main/";
const API="/api/ttendencias-control";
const $=id=>document.getElementById(id);let model={items:[]},reworkItem=null;const locallyClosed=new Set();
function token(){return localStorage.getItem("ttendencias-control-token")||""}
function rememberExplained(names){
 let m={};try{m=JSON.parse(localStorage.getItem("ttendencias-local-explained")||"{}")}catch(_){}
 const now=Date.now();for(const name of names||[])m[String(name||"").trim().toLowerCase()]=now;
 localStorage.setItem("ttendencias-local-explained",JSON.stringify(m));
}
function forgetExplained(names){
 let m={};try{m=JSON.parse(localStorage.getItem("ttendencias-local-explained")||"{}")}catch(_){}
 for(const name of names||[])delete m[String(name||"").trim().toLowerCase()];
 localStorage.setItem("ttendencias-local-explained",JSON.stringify(m));
}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2400)}
function compose(text){return "https://twitter.com/intent/tweet?"+new URLSearchParams({text:text||""}).toString()}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
async function api(action,names,extra={}){
 const t=token();if(!t){toast("Falta el token de control. Vuelve a la pantalla principal y guárdalo.");throw new Error("Sin token")}
 const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+t},body:JSON.stringify({action,names,...extra})});
 let d={};try{d=await r.json()}catch(_){}
 if(r.status===401){localStorage.removeItem("ttendencias-control-token");throw new Error("Token incorrecto")}
 if(!r.ok)throw new Error(d.error||"No se pudo aplicar la acción");
 return d;
}
function render(){
 const items=model.items||[];$("count").textContent=items.length;
 if(!items.length){$("list").innerHTML='<div class="empty">No hay tuits pendientes de revisar.</div>';return}
 $("list").innerHTML="";
 for(const item of items){
  const card=document.createElement("article");card.className="card";
  const rel=(item.related_trends||[]).length?item.related_trends:[item.trend_name];
  const p=item.primary||{},purl=p.url||compose(p.text);
  const alts=(item.alternatives||[]).slice(0,3);
  card.innerHTML='<h2 class="trend"></h2><div class="explain"></div><div class="variant principal"><div class="variantHead"><span class="variantTitle">Tuit principal</span><span class="chars"></span></div><div class="tweet"></div><div class="variantActions"><a class="btn primary pOpen" target="_blank" rel="noopener">Abrir en X</a><button class="btn pCopy">Copiar</button></div></div><div class="alts"></div><div class="actions"><button class="btn primary done">Ya explicado</button><button class="btn rework">Rehacer</button><button class="btn danger discard">Borrar</button></div>';
  card.querySelector(".trend").textContent=item.trend_name||rel.join(" / ");
  card.querySelector(".explain").textContent=item.explanation||"Sin explicación disponible.";
  card.querySelector(".tweet").textContent=p.text||"Sin texto principal.";
  card.querySelector(".chars").textContent=(p.text||"").length+" caracteres";
  card.querySelector(".pOpen").href=purl;card.querySelector(".pCopy").onclick=()=>navigator.clipboard.writeText(p.text||"").then(()=>toast("Tuit copiado"));
  const ah=card.querySelector(".alts");
  if(!alts.length)ah.innerHTML='<div class="warning">Sin remates alternativos disponibles. El objetivo editorial sigue siendo 3.</div>';
  alts.forEach((a,i)=>{
    const v=document.createElement("div");v.className="variant";
    const txt=a.remate||a.tweet_text||"";
    v.innerHTML='<div class="variantHead"><span class="variantTitle">Remate '+(i+1)+'</span></div><div class="remate"></div><div class="variantActions"><a class="btn open" target="_blank" rel="noopener">Abrir en X</a><button class="btn copy">Copiar tuit</button></div>';
    v.querySelector(".remate").textContent=txt;v.querySelector(".open").href=a.url||compose(a.tweet_text);
    v.querySelector(".copy").onclick=()=>navigator.clipboard.writeText(a.tweet_text||txt).then(()=>toast("Tuit copiado"));
    ah.appendChild(v);
  });
  card.querySelector(".done").onclick=async()=>{
    if(!confirm("¿Confirmas que ya has publicado/explicado "+rel.join(", ")+"? Se cerrará este bloque."))return;
    const originalItems=[...(model.items||[])];
    const keys=rel.map(x=>String(x||"").trim().toLowerCase());
    keys.forEach(x=>locallyClosed.add(x));
    model.items=(model.items||[]).filter(x=>{
      const rr=((x.related_trends||[]).length?x.related_trends:[x.trend_name]).map(v=>String(v||"").trim().toLowerCase());
      return !rr.some(v=>keys.includes(v));
    });
    render();toast("Cerrando como explicada…");
    try{
      await api("explained",rel);
      rememberExplained(rel);
      toast("Marcada como explicada");
    }catch(e){
      keys.forEach(x=>locallyClosed.delete(x));
      model.items=originalItems;render();toast(e.message);
    }
  };
  card.querySelector(".discard").onclick=async()=>{if(!confirm("¿Descartar este bloque sin publicarlo? Se quitará de la bandeja."))return;try{await api("discard",rel);rememberExplained(rel);toast("Bloque descartado");await load()}catch(e){toast(e.message)}};
  card.querySelector(".rework").onclick=()=>{reworkItem=item;$("reworkName").textContent=rel.join(" / ");$("instruction").value="";$("sheet").classList.add("show");$("instruction").focus()};
  $("list").appendChild(card);
 }
}
async function load(){
 try{
  const r=await fetch(RAW+"trends/prepared.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("No se pudo leer la bandeja");
  model=await r.json();
  model.items=(model.items||[]).filter(x=>{
    const rr=((x.related_trends||[]).length?x.related_trends:[x.trend_name]).map(v=>String(v||"").trim().toLowerCase());
    return !rr.some(v=>locallyClosed.has(v));
  });
  render()
 }catch(e){$("list").innerHTML='<div class="empty">'+escapeHtml(e.message)+'</div>'}
}
$("cancel").onclick=()=>{$("sheet").classList.remove("show");reworkItem=null};
$("sendRework").onclick=async()=>{if(!reworkItem)return;const instruction=$("instruction").value.trim();if(!instruction){toast("Escribe primero qué quieres cambiar");return}const rel=(reworkItem.related_trends||[]).length?reworkItem.related_trends:[reworkItem.trend_name];if(!confirm("¿Enviar "+rel.join(", ")+" a reelaborar con estas instrucciones?"))return;try{forgetExplained(rel);await api("rework",rel,{instruction});$("sheet").classList.remove("show");toast("Enviada a reelaborar");await load()}catch(e){toast(e.message)}};
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet"))$("sheet").classList.remove("show")});
load();document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
</body></html>
