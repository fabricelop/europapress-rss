<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0e14;color:#eef2f8}
*{box-sizing:border-box}body{margin:0;background:#0b0e14;min-height:100vh}button,a{font:inherit}
.top{position:sticky;top:0;z-index:20;background:#0b0e14ee;backdrop-filter:blur(14px);border-bottom:1px solid #252b36;padding:13px max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px}.back{color:#89b8ff;text-decoration:none;font-weight:750}.title{font-weight:850;font-size:18px}.spacer{flex:1}.count{font-size:12px;color:#9ba7b8;border:1px solid #303846;border-radius:999px;padding:6px 9px}.runbtn{border:1px solid #5576a6;background:#1b2d46;color:#dcecff;border-radius:10px;padding:8px 10px;font-weight:800}.runbtn:disabled{opacity:.5}.runstate{font-size:11px;color:#8f9bad;margin:0 0 10px}.runstate.running{color:#ffc178}.runstate.done{color:#8ee6a8}.runstate.error{color:#ff9ca5}
main{max-width:820px;margin:auto;padding:12px 10px 40px}.group{margin-bottom:25px}.groupHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 10px}.groupHead h2{font-size:19px;margin:0}.ratio{font-size:12px;font-weight:800;color:#a9bad0;border:1px solid #344256;border-radius:999px;padding:5px 8px}.subhead{font-size:13px;font-weight:850;color:#c5cfdd;margin:12px 2px 7px}.processingList{display:grid;gap:8px}.processingCard{background:#101720;border:1px solid #2d3b4d;border-radius:13px;padding:11px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.processingName{font-weight:790}.processingMeta{font-size:11px;color:#8fa0b5;margin-top:4px}.origin{font-size:11px;border:1px solid #3b4d64;border-radius:999px;padding:5px 8px;color:#b9cae0}
.list{display:grid;gap:9px}.rowcard{background:#11161e;border:1px solid #29313d;border-radius:15px;overflow:hidden}.summaryrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px}.trendLine{display:flex;align-items:center;gap:8px;min-width:0}.trend{font-size:16px;font-weight:820;overflow-wrap:anywhere}.infoBtn{width:24px;height:24px;min-width:24px;border-radius:50%;border:1px solid #4b5c72;background:#18212f;color:#b9c9dc;font-size:13px;font-weight:900;padding:0;display:inline-flex;align-items:center;justify-content:center}.infoPanel{display:none;margin:0 12px 10px;padding:9px 10px;border:1px solid #334155;border-radius:10px;background:#0d141d;color:#c8d0dc;font-size:13px;line-height:1.45;white-space:pre-wrap}.infoPanel.show{display:block}.small{font-size:11px;color:#8390a1;margin-top:4px}.rowactions{display:flex;flex-direction:column;align-items:stretch;gap:7px;min-width:116px}.rowactions .btn{width:100%;text-align:center}.btn{border:1px solid #34445b;background:#18212f;color:#dce7f7;border-radius:10px;padding:8px 10px;font-weight:760;text-decoration:none;min-height:38px}.btn.danger{color:#ff9da6}.btn.rework{color:#c9b5ff}.detail{display:none;border-top:1px solid #29313d;padding:12px}.rowcard.open .detail{display:block}.variant{background:#0b1017;border:1px solid #293442;border-radius:13px;padding:11px;margin:9px 0}.variantHead{display:flex;gap:8px;align-items:center;margin-bottom:7px}.variantTitle{font-size:11px;font-weight:850;text-transform:uppercase;color:#9dadc2}.chars{margin-left:auto;font-size:11px;color:#7f8b9c}.tweet,.remate{white-space:pre-wrap;font-size:14px;line-height:1.4}.variantActions,.finalActions{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin-top:9px}.variantActions .btn,.finalActions .btn{width:100%;text-align:center}.imagebox{background:#0d141d;border:1px solid #334155;border-radius:13px;padding:11px;margin:0 0 13px}.imageTitle{font-size:11px;font-weight:850;text-transform:uppercase;color:#9dadc2;margin-bottom:5px}.imageMeta{font-size:12px;color:#aeb9c9;line-height:1.4;overflow-wrap:anywhere}.imageActions{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin-top:9px}.imageActions .btn{width:100%;text-align:center}.empty{text-align:center;color:#9aa6b7;padding:50px 10px}.warning{font-size:12px;color:#f5c451;margin:8px 0}
.sheet{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:flex-end}.sheet.show{display:flex}.panel{width:100%;max-width:600px;margin:0 auto;background:#111720;border:1px solid #354052;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.panel h2{margin:0 0 8px}.panel p{font-size:13px;color:#9eabba}textarea{width:100%;min-height:120px;background:#0a0f16;color:#eef3fa;border:1px solid #364153;border-radius:11px;padding:12px;font:inherit;resize:vertical}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-15px);opacity:0;transition:.2s;background:#1a2330;border:1px solid #3b485b;border-radius:10px;padding:9px 12px;z-index:80;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:560px){.summaryrow{grid-template-columns:1fr}.rowactions{width:100%;min-width:0}.trend{font-size:15px}}
</style>

<body>
<header class="top"><a class="back" href="/ttendencias/">‹ Top 10</a><div class="title">Tuits listos</div><div class="spacer"></div><button class="runbtn" id="runNowPrepared" type="button">▶ Ejecutar</button><div class="count" id="count">0</div></header>
<main>
  <div class="runstate" id="runStatePrepared">Comprobando ejecución manual…</div>
  <section class="group" id="topGroup">
    <div class="groupHead"><h2>TOP 10</h2><div class="ratio" id="topRatio">0/0 listos</div></div>
    <div class="subhead">Listos</div>
    <section class="list" id="topReady"></section>
    <div class="subhead">Elaborando</div>
    <section class="processingList" id="topProcessing"></section>
  </section>
  <section class="group" id="radarGroup">
    <div class="groupHead"><h2>Próximas tendencias</h2><div class="ratio" id="radarRatio">0/0 listos</div></div>
    <div class="subhead">Listos</div>
    <section class="list" id="radarReady"></section>
    <div class="subhead">Elaborando</div>
    <section class="processingList" id="radarProcessing"></section>
  </section>
  <section class="group" id="exGroup">
    <div class="groupHead"><h2>EX TOP 10</h2><div class="ratio" id="exRatio">0/0 listos</div></div>
    <div class="subhead">Listos</div>
    <section class="list" id="exReady"></section>
    <div class="subhead">Elaborando</div>
    <section class="processingList" id="exProcessing"></section>
  </section>
</main>
<div class="sheet" id="sheet"><div class="panel"><h2>Rehacer redacción</h2><p id="reworkName"></p><textarea id="instruction" placeholder="Indica qué quieres cambiar: enfoque, explicación, remate, tono, datos a verificar…"></textarea><div class="finalActions"><button class="btn" id="cancel">Cancelar</button><button class="btn" id="sendRework">Enviar a reelaborar</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const RAW="https://raw.githubusercontent.com/fabricelop/europapress-rss/main/";
const API="/api/ttendencias-control";
const RUN_API="/api/ttendencias-run";
const RUN_STATUS_API="/api/ttendencias-run-status";
const SHELL_BUILD="ttendencias-preparados-x-search-v1-20260926";
const $=id=>document.getElementById(id);
let model={items:[],top:[],upcoming:[],requests:[]},reworkItem=null,openIds=new Set();
const token=()=>localStorage.getItem("ttendencias-control-token")||"";

function nrm(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase("es-ES").replace(/\s+/g," ").trim()}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").classList.remove("show"),2300)}
function compose(text){return "https://twitter.com/intent/tweet?text="+encodeURIComponent(text||"")}
function setLocal(names,status){let m={};try{m=JSON.parse(localStorage.getItem("ttendencias-local-state")||"{}")}catch(_){}const ts=Date.now();for(const name of names||[])m[nrm(name)]={status,ts};localStorage.setItem("ttendencias-local-state",JSON.stringify(m))}
function clearLocal(names){let m={};try{m=JSON.parse(localStorage.getItem("ttendencias-local-state")||"{}")}catch(_){}for(const name of names||[])delete m[nrm(name)];localStorage.setItem("ttendencias-local-state",JSON.stringify(m))}
async function updateBadge(){const count=(model.items||[]).length;try{if("setAppBadge" in navigator){if(count>0)await navigator.setAppBadge(count);else if("clearAppBadge" in navigator)await navigator.clearAppBadge()}}catch(_){}}
function runTime(v){if(!v)return "—";const d=new Date(v);return Number.isNaN(d.getTime())?"—":new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Madrid",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(d)}
async function loadPreparedRunStatus(){
 try{
  const headers={};if(token())headers.authorization="Bearer "+token();
  const r=await fetch(RUN_STATUS_API+"?t="+Date.now(),{cache:"no-store",headers});
  const d=await r.json().catch(()=>({}));
  const el=$("runStatePrepared"),btn=$("runNowPrepared");btn.disabled=false;el.className="runstate";
  if(r.status===401){el.textContent="Guarda el acceso desde Top 10 para ejecutar";btn.disabled=true;return}
  if(!r.ok)throw new Error(d.error||"No se pudo consultar la ejecución");
  if(d.status==="DISABLED"){el.textContent="Trigger Work no disponible";btn.disabled=true}
  else if(d.status==="REQUESTED"){el.textContent="Esperando a Work desde "+runTime(d.requested_at);el.classList.add("running");btn.disabled=true}
  else if(d.status==="RUNNING"){el.textContent="Ejecutándose desde "+runTime(d.started_at);el.classList.add("running");btn.disabled=true}
  else if(d.status==="DONE"){el.textContent="Última ejecución terminada "+runTime(d.finished_at);el.classList.add("done")}
  else if(d.status==="ERROR"){el.textContent="Última ejecución con error"+(d.message?" · "+d.message:"");el.classList.add("error")}
  else el.textContent="Listo para ejecutar";
 }catch(e){$("runStatePrepared").textContent=e.message||"No se pudo consultar la ejecución";$("runStatePrepared").className="runstate error"}
}
async function requestPreparedRun(){
 if(!token()){toast("Falta el token de control");return}
 if(!confirm("¿Ejecutar TTendencias ahora? Esta acción consumirá cuota de ChatGPT Work."))return;
 const btn=$("runNowPrepared");btn.disabled=true;$("runStatePrepared").textContent="Enviando solicitud…";$("runStatePrepared").className="runstate running";
 try{
  const r=await fetch(RUN_API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+token()},body:"{}"});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(r.status===409?"Ya hay una ejecución en curso":r.status===429?"Ya se solicitó una ejecución hace unos segundos":d.error||"No se pudo solicitar la ejecución");
  $("runStatePrepared").textContent="Esperando a Work desde "+runTime(d.requested_at);
  setTimeout(loadPreparedRunStatus,5000);
 }catch(e){$("runStatePrepared").textContent=e.message;$("runStatePrepared").className="runstate error";btn.disabled=false}
}

async function api(action,names,extra={}){
 const t=token();if(!t){toast("Falta el token de control");throw new Error("Sin token")}
 const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+t},body:JSON.stringify({action,names,...extra})});let d={};try{d=await r.json()}catch(_){}
 if(r.status===401){localStorage.removeItem("ttendencias-control-token");throw new Error("Token incorrecto")}if(!r.ok)throw new Error(d.error||"No se pudo aplicar la acción");return d
}
function related(item){return (item.related_trends||[]).length?item.related_trends:[item.trend_name]}
function isInTop(item){const set=new Set((model.top||[]).map(nrm));return related(item).some(x=>set.has(nrm(x)))}
function removeItem(item){const ids=new Set(related(item).map(nrm));model.items=(model.items||[]).filter(x=>!related(x).some(n=>ids.has(nrm(n))));render()}
async function imageBlobToPng(blob){
 if(blob.type==="image/png")return blob;
 try{
  const bmp=await createImageBitmap(blob),canvas=document.createElement("canvas");canvas.width=bmp.width;canvas.height=bmp.height;
  canvas.getContext("2d").drawImage(bmp,0,0);if(typeof bmp.close==="function")bmp.close();
  return await new Promise((resolve,reject)=>canvas.toBlob(x=>x?resolve(x):reject(new Error("png")),"image/png"));
 }catch(_){}
 const objectUrl=URL.createObjectURL(blob);
 try{
  const img=await new Promise((resolve,reject)=>{const x=new Image();x.onload=()=>resolve(x);x.onerror=()=>reject(new Error("image"));x.src=objectUrl});
  const canvas=document.createElement("canvas");canvas.width=img.naturalWidth||img.width;canvas.height=img.naturalHeight||img.height;
  canvas.getContext("2d").drawImage(img,0,0);
  return await new Promise((resolve,reject)=>canvas.toBlob(x=>x?resolve(x):reject(new Error("png")),"image/png"));
 }finally{URL.revokeObjectURL(objectUrl)}
}
async function copyImageToClipboard(url){
 try{
  if(!navigator.clipboard?.write||typeof ClipboardItem==="undefined")throw new Error("clipboard");
  let blob;
  if(String(url||"").startsWith("data:image/")){
    const r=await fetch(url); if(!r.ok)throw new Error("inline"); blob=await r.blob();
  }else{
    const r=await fetch(API+"?view=image-proxy&format=png&url="+encodeURIComponent(url),{cache:"no-store"});
    if(!r.ok)throw new Error("download"); blob=await r.blob();
  }
  blob=await imageBlobToPng(blob);
  await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
  toast("Imagen copiada");
 }catch(err){
  console.error("copy image",err);
  toast("No se pudo copiar la imagen");
 }
}

function detailHtml(){
 return '<div class="detail"><div class="imagebox" hidden><div class="imageTitle">Imagen sugerida</div><div class="imageMeta"></div><div class="imageActions"><a class="btn imgOpen" target="_blank" rel="noopener">Abrir imagen</a><button class="btn imgCopy">Copiar imagen</button></div></div><div class="variant principal"><div class="variantHead"><span class="variantTitle">Tuit principal</span><span class="chars"></span></div><div class="tweet"></div><div class="variantActions"><a class="btn pOpen" target="_blank" rel="noopener">Abrir en X</a><button class="btn pCopy">Copiar</button></div></div><div class="alts"></div><div class="finalActions"><button class="btn rework">Rehacer</button></div></div>'
}
function latestReq(name){return [...(model.requests||[])].reverse().find(x=>nrm(x.name)===nrm(name))}
function isTopName(name){return new Set((model.top||[]).map(nrm)).has(nrm(name))}
function isRadarName(name){return new Set((model.upcoming||[]).map(nrm)).has(nrm(name))}
function itemGroup(item){
 const rel=related(item),req=latestReq(item.trend_name||rel[0]);
 if(rel.some(isTopName))return "top";
 if(Boolean(item.anticipated)||Boolean(req?.anticipated)||rel.some(isRadarName))return "radar";
 return "ex";
}
function renderReadyCards(container,items,emptyText){
 container.innerHTML="";
 if(!items.length){container.innerHTML='<div class="empty">'+emptyText+'</div>';return}
 for(const item of items){
  const rel=related(item),id=String(item.id||item.trend_name||rel.join("|")),open=openIds.has(id),card=document.createElement("article");card.className="rowcard"+(open?" open":"");
  card.innerHTML='<div class="summaryrow"><div><div class="trendLine"><div class="trend"></div><button class="infoBtn" type="button" aria-label="Por qué es tendencia">i</button></div><div class="small">Tuit listo</div></div><div class="rowactions"><button class="btn explain">Abrir</button><button class="btn danger discard">Desestimar</button><a class="btn searchX" target="_blank" rel="noopener noreferrer">Buscar en X</a><button class="btn done">Ya explicado</button></div></div><div class="infoPanel"></div>'+detailHtml();
  card.querySelector(".trend").textContent=item.trend_name||rel.join(" / ");
  card.querySelector(".explain").onclick=()=>{openIds.has(id)?openIds.delete(id):openIds.add(id);render()};
  card.querySelector(".discard").onclick=()=>discard(item);
  const searchName=item.trend_name||rel[0]||"";card.querySelector(".searchX").href="https://x.com/search?q="+encodeURIComponent(searchName)+"&src=typed_query&f=live";
  card.querySelector(".done").onclick=()=>done(item);
  card.querySelector(".explain").textContent=open?"Cerrar":"Abrir";
  const infoPanel=card.querySelector(".infoPanel"),infoBtn=card.querySelector(".infoBtn"),infoText=String(item.explanation||"").trim();
  if(!infoText){infoBtn.style.display="none"}else{infoPanel.textContent=infoText;infoBtn.onclick=()=>infoPanel.classList.toggle("show")}
  const img=item.image||{},imgUrl=img.url||item.image_url||"",imgSource=img.source||item.image_source||"",imgRights=img.rights_status||item.image_rights_status||"";
  const imgBox=card.querySelector(".imagebox"),reqForImage=latestReq(item.trend_name||rel[0]),imgStatus=item.image_search_status||((reqForImage?.with_image&&!imgUrl)?"not_found":"");
  if(imgUrl){imgBox.hidden=false;card.querySelector(".imageMeta").textContent=[img.generated?"Generada por ChatGPT":imgSource,imgRights].filter(Boolean).join(" · ")||"Imagen sugerida";card.querySelector(".imgOpen").href=imgUrl;card.querySelector(".imgCopy").onclick=()=>copyImageToClipboard(imgUrl)}
  else if(imgStatus==="not_found"){imgBox.hidden=false;card.querySelector(".imageMeta").textContent=item.image_note||"Sin imagen adecuada encontrada tras la búsqueda.";card.querySelector(".imgOpen").style.display="none";card.querySelector(".imgCopy").style.display="none";}
  const p=item.primary||{},ptext=p.text||"",purl=p.url||compose(ptext);card.querySelector(".tweet").textContent=ptext||"Sin texto principal.";card.querySelector(".chars").textContent=ptext.length+" caracteres";card.querySelector(".pOpen").href=purl;card.querySelector(".pCopy").onclick=()=>navigator.clipboard.writeText(ptext).then(()=>toast("Tuit copiado"));
  const ah=card.querySelector(".alts"),alts=(item.alternatives||[]).slice(0,3);if(!alts.length)ah.innerHTML='<div class="warning">Sin remates alternativos disponibles.</div>';
  alts.forEach((a,i)=>{const v=document.createElement("div");v.className="variant";const txt=a.remate||a.tweet_text||"";v.innerHTML='<div class="variantHead"><span class="variantTitle">Remate '+(i+1)+'</span></div><div class="remate"></div><div class="variantActions"><a class="btn openX" target="_blank" rel="noopener">Abrir en X</a><button class="btn copy">Copiar tuit</button></div>';v.querySelector(".remate").textContent=txt;v.querySelector(".openX").href=a.url||compose(a.tweet_text||txt);v.querySelector(".copy").onclick=()=>navigator.clipboard.writeText(a.tweet_text||txt).then(()=>toast("Tuit copiado"));ah.appendChild(v)});
  card.querySelector(".rework").onclick=()=>{reworkItem=item;$("reworkName").textContent=rel.join(" / ");$("instruction").value="";$("sheet").classList.add("show");$("instruction").focus()};
  container.appendChild(card);
 }
}
function renderProcessingCards(container,items,emptyText){
 container.innerHTML="";
 if(!items.length){container.innerHTML='<div class="empty">'+emptyText+'</div>';return}
 for(const req of items){
  const card=document.createElement("div");card.className="processingCard";
  card.innerHTML='<div><div class="processingName"></div><div class="processingMeta"></div></div><div class="origin"></div>';
  card.querySelector(".processingName").textContent=req.name;
  const age=req.requested_at?Math.max(0,Math.floor((Date.now()-new Date(req.requested_at).getTime())/60000)):0;
  card.querySelector(".processingMeta").textContent=(String(req.status)==="update"?"Reelaborando":"Elaborando")+" · "+age+" min";
  card.querySelector(".origin").textContent=req.anticipated?"Radar":"Top 10";
  container.appendChild(card);
 }
}
function render(){
 const preparedVisible=model.items||[],processing=(model.requests||[]).filter(x=>["preparing","update"].includes(String(x.status||"")));
 const topReady=preparedVisible.filter(x=>itemGroup(x)==="top");
 const radarReady=preparedVisible.filter(x=>itemGroup(x)==="radar");
 const exReady=preparedVisible.filter(x=>itemGroup(x)==="ex");
 const readyNames={top:new Set(),radar:new Set(),ex:new Set()};
 for(const item of preparedVisible){
   const group=itemGroup(item);
   for(const name of related(item))readyNames[group].add(nrm(name));
 }
 const topProcessing=processing.filter(x=>isTopName(x.name)&&!readyNames.top.has(nrm(x.name)));
 const radarProcessing=processing.filter(x=>!isTopName(x.name)&&Boolean(x.anticipated)&&isRadarName(x.name)&&!readyNames.radar.has(nrm(x.name)));
 const exProcessing=processing.filter(x=>!isTopName(x.name)&&!(Boolean(x.anticipated)&&isRadarName(x.name))&&!readyNames.ex.has(nrm(x.name)));
 $("topRatio").textContent=topReady.length+"/"+(topReady.length+topProcessing.length)+" listos";
 $("radarRatio").textContent=radarReady.length+"/"+(radarReady.length+radarProcessing.length)+" listos";
 $("exRatio").textContent=exReady.length+"/"+(exReady.length+exProcessing.length)+" listos";
 $("count").textContent=topReady.length+radarReady.length+exReady.length;updateBadge();
 const showGroup=(groupId,readyId,processingId,readyItems,processingItems)=>{
   const group=$(groupId),readyEl=$(readyId),processingEl=$(processingId);
   const any=readyItems.length+processingItems.length>0;
   group.hidden=!any;
   if(!any)return;
   readyEl.hidden=!readyItems.length;
   processingEl.hidden=!processingItems.length;
   if(readyEl.previousElementSibling)readyEl.previousElementSibling.hidden=!readyItems.length;
   if(processingEl.previousElementSibling)processingEl.previousElementSibling.hidden=!processingItems.length;
 };
 showGroup("topGroup","topReady","topProcessing",topReady,topProcessing);
 showGroup("radarGroup","radarReady","radarProcessing",radarReady,radarProcessing);
 showGroup("exGroup","exReady","exProcessing",exReady,exProcessing);
 if(topReady.length)renderReadyCards($("topReady"),topReady,"");
 if(topProcessing.length)renderProcessingCards($("topProcessing"),topProcessing,"");
 if(radarReady.length)renderReadyCards($("radarReady"),radarReady,"");
 if(radarProcessing.length)renderProcessingCards($("radarProcessing"),radarProcessing,"");
 if(exReady.length)renderReadyCards($("exReady"),exReady,"");
 if(exProcessing.length)renderProcessingCards($("exProcessing"),exProcessing,"");
}
function done(item){const rel=related(item);if(!confirm("¿Confirmas que ya has publicado/explicado "+rel.join(", ")+"?"))return;const backup=[...(model.items||[])];setLocal(rel,"explained");removeItem(item);toast("Marcada como explicada");api("explained",rel).then(()=>{localStorage.setItem("ttendencias-last-action",String(Date.now()));setTimeout(()=>load(),250)}).catch(e=>{clearLocal(rel);model.items=backup;render();toast(e.message)})}
function discard(item){const rel=related(item);if(!confirm("¿Desestimar "+rel.join(", ")+" sin publicarla?"))return;const backup=[...(model.items||[])];setLocal(rel,"dismissed");removeItem(item);toast("Desestimada");api("discard",rel).then(()=>{localStorage.setItem("ttendencias-last-action",String(Date.now()));setTimeout(()=>load(),250)}).catch(e=>{clearLocal(rel);model.items=backup;render();toast(e.message)})}
async function load(){
 try{
  const r=await fetch(API+"?view=state&t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("No se pudo leer la bandeja");
  const d=await r.json();
  if(!d?.ok)throw new Error(d?.error||"Estado TTendencias no disponible");
  const pd=d.prepared||{items:[]},rd=d.recent||{items:[]},qd=d.requests||{requests:[]};
  let local={};try{local=JSON.parse(localStorage.getItem("ttendencias-local-state")||"{}")}catch(_){}
  const latest={};
  for(const req of qd.requests||[])latest[nrm(req.name)]=req;
  // Mantén el cierre optimista mientras GitHub termina sus escrituras.
  // Una lectura remota todavía antigua no debe resucitar la tarjeta.
  let localChanged=false;
  const now=Date.now(),optimisticTtl=2*60*1000;
  for(const [name,state] of Object.entries(local)){
    const req=latest[name],status=String(req?.status||""),age=now-Number(state?.ts||0);
    if(["explained","dismissed"].includes(status) || (age>optimisticTtl&&["ready","preparing","update"].includes(status))){
      delete local[name];localChanged=true;
    }
  }
  if(localChanged)localStorage.setItem("ttendencias-local-state",JSON.stringify(local));
  localStorage.removeItem("ttendencias-local-explained");
  const items=(pd.items||[]).filter(item=>{
   const rel=related(item).map(nrm);
   for(const name of rel){
    const state=local[name];
    if(state&&["explained","dismissed"].includes(String(state.status||""))&&now-Number(state.ts||0)<=optimisticTtl)return false;
    const req=latest[name];
    if(req&&["explained","dismissed"].includes(String(req.status||"")))return false;
   }
   return true;
  });
  model={items,top:(rd.items||[]).slice(0,10).map(x=>x.name),upcoming:(rd.upcoming||[]).map(x=>x.name),requests:qd.requests||[]};
  render()
 }catch(e){$("list").innerHTML='<div class="empty">'+String(e.message||e)+'</div>'}
}

async function refreshShellIfNeeded(){
 try{
  const r=await fetch("/ttendencias/preparados/index.html?shellcheck="+Date.now(),{cache:"no-store"});
  const html=await r.text();
  const m=html.match(/const SHELL_BUILD="([^"]+)"/);
  if(m&&m[1]!==SHELL_BUILD){location.reload();return true}
 }catch(_){}
 return false
}

 navigator.serviceWorker.register("/ttendencias/sw.js",{updateViaCache:"none"}).then(reg=>reg.update().catch(()=>{})).catch(()=>{});

   if(sessionStorage.getItem("ttendencias-prepared-sw-reloaded")==="1")return;
   sessionStorage.setItem("ttendencias-prepared-sw-reloaded","1");
   location.reload();
 });
}
