<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101522">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TTiTTulares">
<link rel="manifest" href="/ttittulares/manifest.webmanifest">
<link rel="icon" href="/ttittulares/icon.svg" type="image/svg+xml">
<title>TTiTTulares</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0e14;color:#eef2f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0d1119,#090b10 60%)}button,a{font:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:9px;padding:13px max(12px,env(safe-area-inset-left));background:#0b0e14ee;backdrop-filter:blur(14px);border-bottom:1px solid #252b36}.brand{font-size:19px;font-weight:850}.sub{font-size:11px;color:#8f9bad}.spacer{flex:1}.iconbtn,.btn{border:1px solid #34445b;background:#18212f;color:#dce7f7;border-radius:11px;padding:9px 11px;font-weight:760;text-decoration:none}.iconbtn{height:42px}
main{max-width:850px;margin:auto;padding:15px 12px 42px}.summary{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:12px}.summary h1{font-size:23px;margin:0 0 4px}.meta{font-size:12px;color:#909cad;line-height:1.45}.health{border:1px solid #354255;border-radius:999px;padding:7px 10px;font-size:12px;color:#cbd7e8;white-space:nowrap}.health.bad{border-color:#6e3439;color:#ff9ca5}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}.stat{border:1px solid #2e3744;background:#111720;border-radius:13px;padding:10px 12px;color:#aab5c5;text-align:left;cursor:pointer}.stat b{display:block;color:#eef3fa;font-size:21px}.stat.active{border-color:#607796;background:#18212f}
.list{display:grid;gap:10px}.card,.queuecard{background:#11161e;border:1px solid #29313d;border-radius:16px;padding:13px}.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}.title{font-size:16px;font-weight:800;line-height:1.28}.sources{font-size:12px;color:#8fa0b5;margin-top:6px}.count{border:1px solid #354255;border-radius:999px;padding:6px 9px;font-size:11px;color:#cbd7e8;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.actions .btn{min-height:40px}.btn.primary{background:#1c2737}.btn.danger{color:#ff9ca5}.btn.rework{color:#d2bdff}.details{display:none;border-top:1px solid #29313d;margin-top:12px;padding-top:12px}.details.open{display:block}.facts{font-size:14px;line-height:1.45;color:#cbd3df;white-space:pre-wrap;margin-bottom:12px}.variant{background:#0b1017;border:1px solid #2c3543;border-radius:13px;padding:11px;margin:9px 0}.vhead{display:flex;align-items:center;gap:8px;margin-bottom:7px}.vname{font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.04em;color:#9cacbf}.chars{margin-left:auto;font-size:11px;color:#77869a}.tweet{white-space:pre-wrap;line-height:1.4;font-size:14px}.queuecard .sources-list{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.chip{font-size:11px;background:#0b1017;border:1px solid #2c3543;border-radius:999px;padding:5px 8px;color:#9eabba}.empty{text-align:center;color:#98a4b5;padding:50px 10px}
.sheet{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:flex-end}.sheet.show{display:flex}.panel{width:100%;max-width:600px;margin:0 auto;background:#111720;border:1px solid #354052;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.panel h2{margin:0 0 8px}.panel p{font-size:13px;color:#9eabba}textarea,input{width:100%;background:#0a0f16;color:#eef3fa;border:1px solid #364153;border-radius:11px;padding:12px;font:inherit}textarea{min-height:120px;resize:vertical}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-15px);opacity:0;transition:.2s;background:#1a2330;border:1px solid #3b485b;border-radius:10px;padding:9px 12px;z-index:80;max-width:92vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:560px){main{padding:11px 8px 34px}.summary{grid-template-columns:1fr}.card,.queuecard{padding:11px}.title{font-size:15px}.actions .btn{flex:1;text-align:center}}
</style>
</head>
<body>
<header class="top">
 <div><div class="brand">TTiTTulares</div><div class="sub">Control editorial web</div></div>
 <div class="spacer"></div>
 <button class="iconbtn" id="refresh" title="Recargar">↻</button>
 <button class="iconbtn" id="settings" title="Acceso">⚙</button>
</header>
<main>
 <section class="summary"><div><h1 id="viewTitle">Noticias listas</h1><div class="meta" id="radar">Radar —</div></div><div class="health" id="health">—</div></section>
 <div class="stats">
  <button class="stat active" data-view="ready"><b id="readyCount">0</b>Listas</button>
  <button class="stat" data-view="processing"><b id="processingCount">0</b>En elaboración</button>
 </div>
 <section class="list" id="list"><div class="empty">Cargando…</div></section>
</main>

<div class="sheet" id="reworkSheet"><div class="panel">
 <h2>Rehacer noticia</h2><p id="reworkTitle"></p>
 <textarea id="reworkInstruction" placeholder="Indica qué quieres cambiar: enfoque, tono, remate, información que verificar…"></textarea>
 <div class="actions"><button class="btn" id="reworkCancel">Cancelar</button><button class="btn primary" id="reworkSend">Enviar a elaboración</button></div>
</div></div>

<div class="sheet" id="settingsSheet"><div class="panel">
 <h2>Acceso</h2><p>Las acciones que modifican estado requieren el token privado.</p>
 <input id="tokenInput" type="password" autocomplete="off" placeholder="Token de control">
 <div class="actions"><button class="btn" id="settingsCancel">Cancelar</button><button class="btn" id="testToken">Probar</button><button class="btn primary" id="saveToken">Guardar</button></div>
 <div class="meta" id="accessStatus" style="margin-top:9px"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const RAW="https://raw.githubusercontent.com/fabricelop/europapress-rss/main/";
const API="/api/ttittulares-control";
const $=id=>document.getElementById(id);
let model={prepared:[],status:{}},reworkItem=null,view="ready";
const token=()=>localStorage.getItem("ttittulares-control-token")||"";
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2400)}
function fmt(v){if(!v)return "—";const d=new Date(v);return Number.isNaN(d.getTime())?v:new Intl.DateTimeFormat("es-ES",{timeZone:"Europe/Madrid",hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"}).format(d)}
function intent(text){return "https://twitter.com/intent/tweet?text="+encodeURIComponent(text||"")}
async function api(action,extra={}){
 const t=token();if(!t){$("settingsSheet").classList.add("show");throw new Error("Falta el token de control")}
 const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+t},body:JSON.stringify({action,...extra})});
 let d={};try{d=await r.json()}catch(_){}
 if(r.status===401){localStorage.removeItem("ttittulares-control-token");throw new Error("Token incorrecto")}
 if(!r.ok)throw new Error(d.error||"No se pudo aplicar la acción");return d
}
async function badge(){const n=(model.prepared||[]).length;try{if("setAppBadge" in navigator){if(n)await navigator.setAppBadge(n);else if("clearAppBadge" in navigator)await navigator.clearAppBadge()}}catch(_){}}
function variants(item){
 if(Array.isArray(item.variants)&&item.variants.length)return item.variants;
 const out=[];if(item.primary?.text)out.push({label:"Principal",text:item.primary.text,url:item.primary.url,remate:""});
 for(const [i,a] of (item.alternatives||[]).entries())out.push({label:String.fromCharCode(65+i),text:a.tweet_text||a.text||"",url:a.url,remate:a.remate||""});
 return out
}
function setView(next){view=next;document.querySelectorAll(".stat").forEach(x=>x.classList.toggle("active",x.dataset.view===view));renderList()}
function render(){
 const s=model.status||{},healthy=Number(s.healthy_source_count),total=Number(s.configured_sources);
 $("readyCount").textContent=(model.prepared||[]).length;$("processingCount").textContent=Number(s.processing_count||0);
 $("radar").textContent="Último radar "+fmt(s.radar_at);
 $("health").textContent=(Number.isFinite(healthy)?healthy:"—")+"/"+(Number.isFinite(total)?total:"—")+" fuentes funcionando";
 $("health").classList.toggle("bad",Number.isFinite(healthy)&&Number.isFinite(total)&&healthy<total);
 renderList();badge()
}
function renderList(){
 const list=$("list");list.innerHTML="";
 if(view==="processing"){renderProcessing(list);return}
 renderReady(list)
}
function renderReady(list){
 $("viewTitle").textContent="Noticias listas";
 const status=model.status||{},events=status.events||{},prepared=[...(model.prepared||[])];
 prepared.sort((a,b)=>{
   const ac=Number(events[a.event_id]?.source_count||a.current_source_count||a.drafted_source_count||0);
   const bc=Number(events[b.event_id]?.source_count||b.current_source_count||b.drafted_source_count||0);
   return bc-ac||String(b.prepared_at||"").localeCompare(String(a.prepared_at||""))
 });
 if(!prepared.length){list.innerHTML='<div class="empty">No hay noticias pendientes de publicar.</div>';return}
 for(const item of prepared){
  const current=Number(events[item.event_id]?.source_count||item.current_source_count||item.drafted_source_count||0);
  const drafted=Number(item.drafted_source_count||item.source_count||0);
  const card=document.createElement("article");card.className="card";
  card.innerHTML='<div class="head"><div><div class="title"></div><div class="sources"></div></div><div class="count"></div></div><div class="actions"><button class="btn primary expand">Abrir</button><button class="btn danger dismiss">Desestimar</button></div><div class="details"><div class="facts"></div><div class="variants"></div><div class="actions"><button class="btn primary published">Ya publicada</button><button class="btn rework">Rehacer</button><button class="btn danger dismiss2">Desestimar</button></div></div>';
  card.querySelector(".title").textContent=item.title||"Noticia sin título";
  card.querySelector(".sources").textContent="Redactada con "+drafted+" ("+current+") · "+fmt(item.prepared_at);
  card.querySelector(".count").textContent=current+" fuentes";
  const det=card.querySelector(".details");card.querySelector(".facts").textContent=item.factual_summary||item.explanation||"";
  const vh=card.querySelector(".variants");
  for(const v of variants(item)){
    const box=document.createElement("div");box.className="variant";
    const text=String(v.text||"");
    const isPrincipal=String(v.label||"").toLowerCase()==="principal";
    const remate=String(v.remate||"");
    const shown=isPrincipal?text:("🌶️ "+remate);
    box.innerHTML='<div class="vhead"><span class="vname"></span><span class="chars"></span></div><div class="tweet"></div><div class="actions"><a class="btn primary openx" target="_blank" rel="noopener">Abrir en X</a><button class="btn copy">Copiar</button></div>';
    box.querySelector(".vname").textContent=v.label||"Versión";box.querySelector(".chars").textContent=[...text].length+" caracteres";box.querySelector(".tweet").textContent=shown;
    box.querySelector(".openx").href=v.url||intent(text);box.querySelector(".copy").onclick=()=>navigator.clipboard.writeText(text).then(()=>toast("Tuit completo copiado"));
    vh.appendChild(box)
  }
  card.querySelector(".expand").onclick=()=>{det.classList.toggle("open");card.querySelector(".expand").textContent=det.classList.contains("open")?"Cerrar":"Abrir"};
  async function close(action,label){if(!confirm(label+" esta noticia?"))return;const old=[...model.prepared];model.prepared=model.prepared.filter(x=>x.event_id!==item.event_id);render();try{await api(action,{event_id:item.event_id});toast(action==="published"?"Marcada como publicada":"Noticia desestimada");setTimeout(()=>load(true),700)}catch(e){model.prepared=old;render();toast(e.message)}}
  card.querySelector(".published").onclick=()=>close("published","¿Confirmas que ya has publicado");
  card.querySelector(".dismiss").onclick=card.querySelector(".dismiss2").onclick=()=>close("dismiss","¿Desestimar");
  card.querySelector(".rework").onclick=()=>{reworkItem=item;$("reworkTitle").textContent=item.title||"";$("reworkInstruction").value="";$("reworkSheet").classList.add("show");$("reworkInstruction").focus()};
  list.appendChild(card)
 }
}
function renderProcessing(list){
 $("viewTitle").textContent="En elaboración";
 const items=[...(model.status?.processing_items||[])];
 if(!items.length){list.innerHTML='<div class="empty">No hay noticias en elaboración.</div>';return}
 for(const item of items){
   const card=document.createElement("article");card.className="queuecard";
   const chips=(item.sources||[]).map(s=>'<span class="chip">'+String(typeof s==="string"?s:(s.name||s.source||"Fuente")).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))+'</span>').join("");
   card.innerHTML='<div class="head"><div><div class="title"></div><div class="sources"></div></div><div class="count"></div></div><div class="sources-list">'+chips+'</div>';
   card.querySelector(".title").textContent=item.title||"Noticia sin título";
   card.querySelector(".sources").textContent="Entrada "+fmt(item.selected_at)+(item.selection_mode==="REWRITE"?" · Rehacer":"");
   card.querySelector(".count").textContent=Number(item.source_count||0)+" fuentes";
   list.appendChild(card)
 }
}
async function load(silent=false){
 try{
  const stamp=Date.now(),rs=await Promise.all([
   fetch(RAW+"ttittulares/prepared.json?t="+stamp,{cache:"no-store"}),
   fetch(RAW+"ttittulares/status.json?t="+stamp,{cache:"no-store"})
  ]);
  if(!rs[0].ok||!rs[1].ok)throw new Error("No se pudieron leer los datos");
  const p=await rs[0].json(),s=await rs[1].json();model={prepared:p.items||[],status:s};render()
 }catch(e){if(!silent)toast(e.message)}
}
document.querySelectorAll(".stat").forEach(x=>x.onclick=()=>setView(x.dataset.view));
$("refresh").onclick=()=>{toast("Recargando");load()};
$("settings").onclick=()=>{$("tokenInput").value=token();$("accessStatus").textContent=token()?"Token guardado en este dispositivo":"Sin token guardado";$("settingsSheet").classList.add("show")};
$("settingsCancel").onclick=()=>$("settingsSheet").classList.remove("show");
$("saveToken").onclick=()=>{const v=$("tokenInput").value.trim();if(v)localStorage.setItem("ttittulares-control-token",v);else localStorage.removeItem("ttittulares-control-token");$("settingsSheet").classList.remove("show");toast(v?"Token guardado":"Token eliminado")};
$("testToken").onclick=async()=>{const v=$("tokenInput").value.trim();if(v)localStorage.setItem("ttittulares-control-token",v);try{const d=await api("ping");$("accessStatus").textContent=d.backend?.ok?"✓ Acceso correcto · GitHub operativo":"Backend no disponible"}catch(e){$("accessStatus").textContent=e.message}};
$("reworkCancel").onclick=()=>{$("reworkSheet").classList.remove("show");reworkItem=null};
$("reworkSend").onclick=async()=>{if(!reworkItem)return;const instruction=$("reworkInstruction").value.trim();if(!instruction){toast("Escribe qué quieres cambiar");return}if(!confirm("¿Mandar esta noticia de nuevo a elaboración con estas instrucciones?"))return;const old=[...model.prepared];model.prepared=model.prepared.filter(x=>x.event_id!==reworkItem.event_id);render();try{await api("rework",{event_id:reworkItem.event_id,instruction});$("reworkSheet").classList.remove("show");toast("Enviada a elaboración");reworkItem=null;setView("processing");setTimeout(()=>load(true),1000)}catch(e){model.prepared=old;render();toast(e.message)}};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load(true)});window.addEventListener("pageshow",()=>load(true));
if("serviceWorker" in navigator)navigator.serviceWorker.register("/ttittulares/sw.js").catch(()=>{});
load();setInterval(()=>{if(!document.hidden)load(true)},60000);
</script>
</body></html>
